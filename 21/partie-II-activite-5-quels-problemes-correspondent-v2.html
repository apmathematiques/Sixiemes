<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Quels problèmes correspondent ?</title>

<style>
:root{
  --blue:#1769aa;
  --blue-dark:#0d4778;
  --blue-soft:#eaf4fc;

  --green:#1f7a45;
  --green-soft:#e9f7ef;
  --green-line:#9dd3b2;

  --red:#a92e2e;
  --red-soft:#fff0f0;
  --red-line:#efbcbc;

  --orange:#7a460d;
  --orange-soft:#fff6e9;
  --orange-line:#e3ad6e;

  --ink:#17212b;
  --muted:#5f6d79;
  --line:#dce9f3;
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
}

.app{
  width:100%;
  max-width:1000px;
  height:100%;
  max-height:560px;
  min-height:430px;

  display:flex;
  flex-direction:column;
  overflow:hidden;

  background:#fff;
  border:1px solid rgba(23,105,170,.16);
  border-radius:20px;
  box-shadow:0 10px 28px rgba(17,63,103,.12);
}

/* ---------- En-tête ---------- */

.top{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:
    "track track"
    "counter score";
  gap:6px 10px;
  padding:8px 10px 4px;
}

.track{
  grid-area:track;
  height:9px;
  overflow:hidden;
  border-radius:999px;
  background:#dceaf5;
}

.bar{
  width:12.5%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--blue),#4f9ed8);
  transition:width .25s ease;
}

.pill{
  padding:5px 10px;
  border-radius:999px;
  background:var(--blue-soft);
  color:var(--blue-dark);
  font-size:clamp(.86rem,2.6vw,1.05rem);
  font-weight:850;
  white-space:nowrap;
}

#counter{grid-area:counter;justify-self:start}
#score{grid-area:score;justify-self:end}

/* ---------- Zone principale ---------- */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:2px 6px 7px;
}

.instruction{
  flex:0 0 auto;
  margin:0;
  padding:1px 8px;
  text-align:center;
  font-size:clamp(1.18rem,4vw,1.75rem);
  line-height:1.15;
  font-weight:900;
}

.card{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:8px 10px;
  overflow:hidden;

  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
}

.card.resolved{
  gap:5px;
}

.level-row{
  flex:0 0 auto;
  text-align:center;
}

.level{
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;
  background:var(--blue-soft);
  color:var(--blue-dark);
  font-size:clamp(.82rem,2.8vw,.98rem);
  font-weight:850;
}

.card.resolved .level-row{
  display:none;
}

/* ---------- Calcul ---------- */

.given{
  flex:0 0 auto;
  width:100%;
  min-height:54px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;

  padding:6px 10px;

  border:2px solid var(--line);
  border-radius:14px;
  background:#fff;

  color:var(--blue-dark);
  font-size:clamp(1.28rem,4.2vw,1.9rem);
  line-height:1.05;
  font-weight:900;
}

.frac{
  display:inline-flex;
  min-width:1.45em;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  vertical-align:middle;
  line-height:1.02;
  margin:0 .06em;
}

.frac .num{
  width:100%;
  padding:0 .12em .08em;
  border-bottom:.08em solid currentColor;
  text-align:center;
}

.frac .den{
  width:100%;
  padding:.08em .12em 0;
  text-align:center;
}

/* ---------- Propositions ---------- */

.options{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;

  overflow:auto;
  padding:1px;
}

.option{
  position:relative;
  min-height:0;

  display:flex;
  align-items:flex-start;
  gap:8px;

  padding:9px 10px;

  border:2px solid var(--line);
  border-radius:13px;
  background:#fff;

  cursor:pointer;
  user-select:none;
  transition:
    border-color .15s ease,
    background .15s ease,
    transform .08s ease;
}

.option:hover{
  border-color:#a9c8dd;
}

.option:active{
  transform:scale(.995);
}

.option.selected{
  border-color:#6da8d0;
  background:#f0f7fc;
}

.option.correct-choice{
  border-color:var(--green-line);
  background:var(--green-soft);
}

.option.wrong-choice{
  border-color:var(--red-line);
  background:var(--red-soft);
}

.option.missed-choice{
  border-color:var(--orange-line);
  background:var(--orange-soft);
}

.option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.letter{
  flex:0 0 auto;
  width:30px;
  height:30px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:var(--blue-soft);
  color:var(--blue-dark);

  font-size:.95rem;
  font-weight:900;
}

.option.selected .letter{
  background:var(--blue);
  color:#fff;
}

.option.correct-choice .letter{
  background:var(--green);
  color:#fff;
}

.option.wrong-choice .letter{
  background:var(--red);
  color:#fff;
}

.option.missed-choice .letter{
  background:#d78b32;
  color:#fff;
}

.option-text{
  flex:1;
  min-width:0;

  font-size:clamp(.9rem,2.65vw,1.08rem);
  line-height:1.28;
  font-weight:720;
}

.reason{
  display:none;
  margin-top:5px;

  color:var(--muted);
  font-size:clamp(.75rem,2.2vw,.9rem);
  line-height:1.2;
  font-weight:700;
}

.option.resolved .reason{
  display:block;
}

/* ---------- Tentatives ---------- */

.attempt{
  flex:0 0 auto;
  min-height:18px;
  margin:0;

  text-align:center;
  color:var(--muted);
  font-size:clamp(.86rem,2.6vw,.98rem);
  font-weight:750;
}

.feedback{
  flex:0 0 auto;
  width:100%;
  min-height:34px;

  display:none;
  align-items:center;
  justify-content:center;

  padding:5px 8px;
  border-radius:11px;

  text-align:center;
  font-size:clamp(.82rem,2.55vw,.94rem);
  line-height:1.18;
  font-weight:750;
}

.feedback.show{
  display:flex;
}

.feedback.error{
  color:#8f2727;
  background:var(--red-soft);
  border:1px solid var(--red-line);
}

/* ---------- Correction synthétique ---------- */

.correction{
  flex:0 0 auto;
  width:100%;

  display:none;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:5px;

  padding:5px 8px;

  border:2px solid var(--orange-line);
  border-radius:12px;
  background:var(--orange-soft);
  color:var(--orange);

  text-align:center;
  font-size:clamp(.82rem,2.5vw,.98rem);
  line-height:1.15;
  font-weight:800;
}

.correction.show{
  display:flex;
}

.correction.success{
  border-color:var(--green-line);
  background:var(--green-soft);
  color:#165e36;
}

/* ---------- Boutons ---------- */

.controls{
  flex:0 0 auto;
  min-height:36px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

button{
  min-height:36px;
  padding:0 16px;

  border:0;
  border-radius:11px;

  font-size:clamp(.92rem,2.8vw,1rem);
  font-weight:850;
  cursor:pointer;
}

.primary{
  color:#fff;
  background:var(--blue);
}

.secondary{
  color:var(--blue-dark);
  background:var(--blue-soft);
}

button:disabled{
  opacity:.45;
  cursor:default;
}

/* ---------- Fin ---------- */

.final{
  flex:1;
  display:none;
  place-items:center;
  padding:20px;
  text-align:center;
}

.final.show{
  display:grid;
}

.final-card{
  width:min(620px,100%);
  padding:24px;

  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  box-shadow:0 10px 25px rgba(17,63,103,.1);
}

.final-card h2{
  margin:0 0 8px;
  color:var(--blue-dark);
  font-size:clamp(1.45rem,5vw,1.9rem);
}

.final-score{
  margin:8px 0;
  font-size:1.3rem;
  font-weight:900;
}

.final-message{
  margin:8px 0 18px;
  color:var(--muted);
  font-size:1.05rem;
  line-height:1.4;
}

/* ---------- Petits écrans ---------- */

@media(max-width:620px){

  body{padding:3px}

  .app{
    min-height:390px;
    border-radius:14px;
  }

  .top{
    padding:5px 6px 2px;
    gap:4px 6px;
  }

  .track{height:7px}

  .pill{
    padding:4px 8px;
    font-size:.82rem;
  }

  .main{
    gap:4px;
    padding:1px 3px 5px;
  }

  .instruction{
    font-size:1.08rem;
    padding:1px 5px;
  }

  .card{
    gap:5px;
    padding:6px;
    border-radius:14px;
  }

  .level{
    font-size:.78rem;
    padding:4px 7px;
  }

  .given{
    min-height:46px;
    padding:5px 7px;
    font-size:1.16rem;
  }

  .options{
    grid-template-columns:1fr;
    gap:5px;
  }

  .option{
    padding:7px 8px;
    gap:7px;
  }

  .letter{
    width:27px;
    height:27px;
    font-size:.86rem;
  }

  .option-text{
    font-size:.88rem;
    line-height:1.22;
  }

  .reason{
    font-size:.74rem;
  }

  .attempt{
    min-height:15px;
    font-size:.8rem;
  }

  .feedback{
    min-height:31px;
    padding:4px 6px;
    font-size:.78rem;
  }

  .correction{
    padding:4px 6px;
    font-size:.78rem;
  }

  .controls{
    min-height:33px;
  }

  button{
    min-height:33px;
    height:33px;
    padding:0 13px;
    font-size:.9rem;
  }
}

@media(max-height:470px){

  .top{padding-top:4px}

  .instruction{font-size:1.02rem}

  .card{
    gap:4px;
    padding-top:5px;
    padding-bottom:5px;
  }

  .given{
    min-height:42px;
    padding-top:4px;
    padding-bottom:4px;
  }

  .option{
    padding-top:5px;
    padding-bottom:5px;
  }

  .attempt{
    min-height:14px;
  }

  .controls{
    min-height:31px;
  }

  button{
    min-height:31px;
    height:31px;
  }
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>

<body>

<main class="app" aria-live="polite">

  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">

    <p class="instruction">Sélectionne tous les problèmes qui correspondent à ce calcul.</p>

    <div class="card" id="card">

      <div class="level-row">
        <span class="level" id="level"></span>
      </div>

      <div class="given" id="given"></div>

      <div class="options" id="options"></div>

      <p class="attempt" id="attempt">Tu as 2 essais.</p>

      <div class="feedback" id="feedback"></div>

      <div class="correction" id="correction"></div>

    </div>

    <div class="controls">
      <button class="primary" id="validate" disabled>Valider</button>
      <button class="secondary" id="next" hidden>Question suivante</button>
    </div>

  </section>

  <section class="final" id="final">
    <div class="final-card">
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="primary" id="restart">
        Rejouer avec de nouveaux problèmes
      </button>
    </div>
  </section>

</main>

<script>
(()=>{
'use strict';

const TOTAL=8;
const MAX_ATTEMPTS=2;

const $=id=>document.getElementById(id);

const card=$('card');
const given=$('given');
const optionsBox=$('options');
const attempt=$('attempt');
const feedback=$('feedback');
const correction=$('correction');

const validateBtn=$('validate');
const nextBtn=$('next');

const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const level=$('level');

const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let attempts=0;
let resolved=false;

/* ---------- Outils ---------- */

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[randInt(0,arr.length-1)];
}

function shuffle(arr){
  const a=arr.slice();

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function fracHTML(n,d){
  return `
    <span class="frac">
      <span class="num">${n}</span>
      <span class="den">${d}</span>
    </span>
  `;
}

function fmt(n){
  const r=Math.round((n+Number.EPSILON)*100)/100;

  return Number.isInteger(r)
    ? String(r)
    : String(r).replace('.',',');
}

/* ---------- Génération numérique ---------- */

function makeBase(){

  const d=randInt(3,10);
  const n=randInt(1,d-1);
  const k=randInt(2,9);

  return {
    q:d*k,
    n,
    d,
    result:n*k
  };
}

function otherFraction(n,d){

  let n2=n;
  let d2=d;
  let guard=0;

  do{
    d2=randInt(3,10);
    n2=randInt(1,d2-1);
    guard++;
  }while(n2*d===n*d2 && guard<100);

  return {n:n2,d:d2};
}

function wrongQuantity(q,d,n){

  const values=[
    q+d,
    q+n,
    Math.max(2,q-d),
    Math.max(2,q-n),
    q+5,
    q+10
  ].filter(v=>v!==q && v>1);

  return pick(values);
}

/* ---------- Problèmes corrects ---------- */

const correctFactories=[

  b=>({
    correct:true,
    text:`Lina possède <strong>${b.q} €</strong>.
    Elle dépense ${fracHTML(b.n,b.d)} de cette somme.
    Combien dépense-t-elle ?`,
    reason:`On cherche ${fracHTML(b.n,b.d)} de ${b.q}, donc ${b.q} × ${fracHTML(b.n,b.d)}.`
  }),

  b=>({
    correct:true,
    text:`Une boîte contient <strong>${b.q} cartes</strong>.
    ${fracHTML(b.n,b.d)} des cartes sont rouges.
    Combien de cartes sont rouges ?`,
    reason:`La fraction ${fracHTML(b.n,b.d)} s'applique aux ${b.q} cartes.`
  }),

  b=>({
    correct:true,
    text:`Un club compte <strong>${b.q} élèves</strong>.
    ${fracHTML(b.n,b.d)} participent à une sortie.
    Combien d'élèves participent à la sortie ?`,
    reason:`Il faut calculer ${fracHTML(b.n,b.d)} de ${b.q}.`
  }),

  b=>({
    correct:true,
    text:`Une bibliothèque possède <strong>${b.q} livres</strong>.
    ${fracHTML(b.n,b.d)} sont des bandes dessinées.
    Combien y a-t-il de bandes dessinées ?`,
    reason:`Le calcul correspondant est bien ${b.q} × ${fracHTML(b.n,b.d)}.`
  }),

  b=>({
    correct:true,
    text:`Noé possède <strong>${b.q} billes</strong>.
    Il donne ${fracHTML(b.n,b.d)} de ses billes.
    Combien de billes donne-t-il ?`,
    reason:`On prend ${fracHTML(b.n,b.d)} des ${b.q} billes.`
  }),

  b=>({
    correct:true,
    text:`Un ruban mesure <strong>${b.q} m</strong>.
    On utilise ${fracHTML(b.n,b.d)} de sa longueur.
    Quelle longueur est utilisée ?`,
    reason:`Il faut prendre ${fracHTML(b.n,b.d)} de ${b.q} m.`
  }),

  b=>({
    correct:true,
    text:`Une réserve contient <strong>${b.q} L</strong> d'eau.
    On utilise ${fracHTML(b.n,b.d)} de cette quantité.
    Quel volume est utilisé ?`,
    reason:`La quantité utilisée vaut ${b.q} × ${fracHTML(b.n,b.d)}.`
  }),

  b=>({
    correct:true,
    text:`Une collection contient <strong>${b.q} images</strong>.
    ${fracHTML(b.n,b.d)} représentent des animaux.
    Combien d'images représentent des animaux ?`,
    reason:`La fraction s'applique à toute la collection de ${b.q} images.`
  })

];

/* ---------- Problèmes faux ---------- */

function wrongAddition(b){

  return {
    correct:false,
    text:`Hugo possède <strong>${b.q} cartes</strong>.
    Il en gagne <strong>${b.d}</strong>.
    Combien de cartes possède-t-il maintenant ?`,
    reason:`Ici, il faut additionner ${b.q} et ${b.d} : ce n'est pas le calcul proposé.`
  };
}

function wrongDivision(b){

  return {
    correct:false,
    text:`On partage <strong>${b.q} bonbons</strong>
    équitablement entre <strong>${b.d} enfants</strong>.
    Combien chaque enfant reçoit-il ?`,
    reason:`Ce problème correspond à ${b.q} ÷ ${b.d}, pas à une fraction de ${b.q}.`
  };
}

function wrongFraction(b){

  const f=otherFraction(b.n,b.d);

  return {
    correct:false,
    text:`Une boîte contient <strong>${b.q} perles</strong>.
    ${fracHTML(f.n,f.d)} des perles sont bleues.
    Combien de perles sont bleues ?`,
    reason:`La fraction de l'énoncé est ${fracHTML(f.n,f.d)}, pas ${fracHTML(b.n,b.d)}.`
  };
}

function wrongQuantityProblem(b){

  const q2=wrongQuantity(b.q,b.d,b.n);

  return {
    correct:false,
    text:`Un magasin possède <strong>${q2} cahiers</strong>.
    Il vend ${fracHTML(b.n,b.d)} des cahiers.
    Combien de cahiers vend-il ?`,
    reason:`La quantité de départ est ${q2}, pas ${b.q}.`
  };
}

function wrongResultGiven(b){

  const wrongResult=b.result+pick([1,2,3,4]);

  return {
    correct:false,
    text:`Une boîte contient <strong>${b.q} jetons</strong>.
    ${fracHTML(b.n,b.d)} sont verts.
    On affirme qu'il y a <strong>${wrongResult} jetons verts</strong>.
    Cette affirmation correspond-elle au calcul donné ?`,
    reason:`Le calcul donné vaut ${b.result}, pas ${wrongResult}.`
  };
}

function wrongComplement(b){

  return {
    correct:false,
    text:`Une classe compte <strong>${b.q} élèves</strong>.
    ${fracHTML(b.n,b.d)} participent au club théâtre.
    Combien d'élèves ne participent pas au club théâtre ?`,
    reason:`Ici, on cherche le complément, pas directement ${fracHTML(b.n,b.d)} de ${b.q}.`
  };
}

const wrongFactories=[
  wrongAddition,
  wrongDivision,
  wrongFraction,
  wrongQuantityProblem,
  wrongResultGiven,
  wrongComplement
];

/* ---------- Construction d'une question ---------- */

function makeQuestion(position){

  const b=makeBase();

  /* Nombre de bonnes réponses variable :
     1, 2 ou 3. */
  let goodCount;

  if(position<=1){
    goodCount=1;
  }else if(position<=4){
    goodCount=pick([1,2]);
  }else{
    goodCount=pick([2,3]);
  }

  const correctPool=shuffle(correctFactories);
  const wrongPool=shuffle(wrongFactories);

  const options=[];

  for(let i=0;i<goodCount;i++){
    options.push(correctPool[i](b));
  }

  while(options.length<4){
    const factory=wrongPool[(options.length-goodCount)%wrongPool.length];
    options.push(factory(b));
  }

  return {
    ...b,
    goodCount,
    options:shuffle(options)
  };
}

function signature(q){
  return `${q.q}|${q.n}|${q.d}|${q.goodCount}`;
}

function buildQuestions(){

  const arr=[];
  const seen=new Set();

  for(let i=0;i<TOTAL;i++){

    let q;
    let guard=0;

    do{
      q=makeQuestion(i);
      guard++;
    }while(seen.has(signature(q)) && guard<100);

    seen.add(signature(q));
    arr.push(q);
  }

  return arr;
}

/* ---------- Affichage ---------- */

function levelText(i){

  if(i<2){
    return 'Niveau 1 — Une seule bonne réponse possible';
  }

  if(i<5){
    return 'Niveau 2 — Plusieurs réponses peuvent convenir';
  }

  return 'Niveau 3 — À toi de toutes les repérer';
}

function hideFeedback(){
  feedback.className='feedback';
  feedback.textContent='';
}

function hideCorrection(){
  correction.className='correction';
  correction.innerHTML='';
}

function selectedIndexes(){

  return [...optionsBox.querySelectorAll('.option.selected')]
    .map(el=>Number(el.dataset.index));
}

function updateValidate(){
  validateBtn.disabled=
    resolved ||
    selectedIndexes().length===0;
}

function renderGiven(q){

  given.innerHTML=`
    <span>${q.q}</span>
    <span>×</span>
    ${fracHTML(q.n,q.d)}
    <span>=</span>
    <span>${q.result}</span>
  `;
}

function renderOptions(q){

  optionsBox.innerHTML='';

  q.options.forEach((opt,i)=>{

    const label=document.createElement('label');
    label.className='option';
    label.dataset.index=i;

    label.innerHTML=`
      <input type="checkbox" tabindex="-1">
      <span class="letter">${String.fromCharCode(65+i)}</span>
      <span class="option-text">
        <span class="statement">${opt.text}</span>
        <span class="reason">${opt.reason}</span>
      </span>
    `;

    label.addEventListener('click',e=>{

      e.preventDefault();

      if(resolved){
        return;
      }

      label.classList.toggle('selected');

      updateValidate();
    });

    optionsBox.appendChild(label);
  });
}

function renderQuestion(){

  const q=questions[index];

  attempts=0;
  resolved=false;

  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${fmt(score)} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
  level.textContent=levelText(index);

  renderGiven(q);
  renderOptions(q);

  attempt.textContent='Tu as 2 essais.';

  hideFeedback();
  hideCorrection();

  card.classList.remove('resolved');

  validateBtn.hidden=false;
  validateBtn.disabled=true;

  nextBtn.hidden=true;
  nextBtn.textContent=
    index===TOTAL-1
      ? 'Voir le résultat'
      : 'Question suivante';
}

/* ---------- Validation ---------- */

function correctSet(q){

  return new Set(
    q.options
      .map((opt,i)=>opt.correct ? i : null)
      .filter(i=>i!==null)
  );
}

function selectionIsCorrect(q){

  const chosen=new Set(selectedIndexes());
  const expected=correctSet(q);

  if(chosen.size!==expected.size){
    return false;
  }

  for(const i of chosen){
    if(!expected.has(i)){
      return false;
    }
  }

  return true;
}

function markFirstError(q){

  const chosen=new Set(selectedIndexes());
  const expected=correctSet(q);

  [...optionsBox.children].forEach((el,i)=>{

    el.classList.remove(
      'correct-choice',
      'wrong-choice',
      'missed-choice',
      'resolved'
    );

    if(chosen.has(i) && !expected.has(i)){
      el.classList.add('wrong-choice');
    }
  });
}

function clearTemporaryMarks(){

  [...optionsBox.children].forEach(el=>{
    el.classList.remove('wrong-choice');
  });
}

function revealCorrection(q){

  const chosen=new Set(selectedIndexes());
  const expected=correctSet(q);

  [...optionsBox.children].forEach((el,i)=>{

    el.classList.remove(
      'correct-choice',
      'wrong-choice',
      'missed-choice'
    );

    el.classList.add('resolved');

    if(expected.has(i)){
      el.classList.add('correct-choice');
    }else if(chosen.has(i)){
      el.classList.add('wrong-choice');
    }
  });
}

function showSummary(q,wasCorrect){

  const count=q.goodCount;

  correction.className=
    wasCorrect
      ? 'correction show success'
      : 'correction show';

  correction.innerHTML=
    wasCorrect
      ? `Très bien : tu as repéré ${count===1 ? 'le seul problème correct' : `les ${count} problèmes corrects`}.`
      : `Il fallait sélectionner ${count===1 ? '1 problème' : `${count} problèmes`} correspondant exactement à ${q.q} × ${fracHTML(q.n,q.d)}.`;
}

function resolveQuestion(wasCorrect){

  const q=questions[index];

  resolved=true;

  card.classList.add('resolved');

  hideFeedback();

  revealCorrection(q);
  showSummary(q,wasCorrect);

  attempt.textContent=
    wasCorrect
      ? 'Réponse validée.'
      : 'Les 2 essais sont terminés.';

  validateBtn.hidden=true;
  nextBtn.hidden=false;
}

function validate(){

  if(resolved){
    return;
  }

  const q=questions[index];

  attempts++;

  if(selectionIsCorrect(q)){

    score += attempts===1 ? 1 : 0.5;

    scoreBox.textContent=
      `Score : ${fmt(score)} / ${TOTAL}`;

    resolveQuestion(true);
    return;
  }

  if(attempts<MAX_ATTEMPTS){

    markFirstError(q);

    feedback.textContent=
      'Au moins une sélection n’est pas correcte. Vérifie que chaque problème utilise bien la même quantité de départ et la même fraction.';

    feedback.className='feedback show error';

    attempt.textContent='Il te reste 1 essai.';

    setTimeout(clearTemporaryMarks,700);

    return;
  }

  resolveQuestion(false);
}

/* ---------- Navigation ---------- */

function next(){

  if(!resolved){
    return;
  }

  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function showFinal(){

  exercise.style.display='none';
  final.classList.add('show');

  finalScore.textContent=
    `Score : ${fmt(score)} / ${TOTAL}`;

  if(score===TOTAL){
    finalMessage.textContent=
      'Excellent : tu reconnais les différents problèmes qui peuvent correspondre à un même calcul.';
  }else if(score>=6){
    finalMessage.textContent=
      'Très bon travail. Tu peux rejouer pour rencontrer de nouveaux contextes.';
  }else if(score>=4){
    finalMessage.textContent=
      'Tu progresses. Rejoue pour mieux repérer la quantité de départ et la fraction utilisée.';
  }else{
    finalMessage.textContent=
      'Reprends les corrections puis rejoue avec une nouvelle série.';
  }
}

function restart(){

  questions=buildQuestions();

  index=0;
  score=0;

  exercise.style.display='flex';
  final.classList.remove('show');

  renderQuestion();
}

/* ---------- Événements ---------- */

validateBtn.addEventListener('click',validate);
nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);

/* ---------- Démarrage ---------- */

questions=buildQuestions();
renderQuestion();

})();
</script>
