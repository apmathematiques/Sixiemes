<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Même situation, plusieurs représentations</title>
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:10px}
.app{
  width:min(100%,1000px);aspect-ratio:16/9;min-height:500px;
  max-height:calc(100vh - 20px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:12px;padding:14px 22px 8px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:20%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:8px 13px;color:var(--bd);
  font-weight:800;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:3px 16px 15px;
  display:flex;flex-direction:column;gap:8px
}
.instruction{
  min-height:50px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.25rem,2.35vw,1.7rem);
  font-weight:800;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:330px;padding:12px 16px;
  display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.situation{
  width:100%;min-height:70px;padding:10px 18px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.18rem,2.2vw,1.55rem);
  font-weight:750;line-height:1.3;text-align:center;
  background:#fff;border:2px solid #dce9f3;border-radius:15px
}
.situation-text{width:100%;text-align:center}
.value{color:var(--bd);font-weight:900;white-space:nowrap}
.cards{
  flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.card{
  position:relative;min-height:120px;padding:12px 14px;
  display:flex;align-items:center;justify-content:center;
  color:var(--i);background:#fff;
  border:3px solid #cbdce9;border-radius:15px;
  cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,border-color .15s ease,background .15s ease
}
.card:hover:not(:disabled){border-color:#75a8cd}
.card:active:not(:disabled){transform:scale(.988)}
.card.selected{border-color:var(--b);background:var(--bs)}
.card.correct{border-color:#79c798;background:var(--gs)}
.card.wrong{border-color:#df8585;background:var(--rs)}
.card.missed{border-color:#79c798;background:linear-gradient(135deg,#fff 0 50%,var(--gs) 50% 100%)}
.card:disabled{cursor:default}
.badge{
  position:absolute;top:7px;left:9px;
  width:28px;height:28px;display:grid;place-items:center;
  color:var(--bd);background:var(--bs);border-radius:50%;
  font-weight:900;font-size:.95rem
}
.rep{
  width:100%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:clamp(1rem,1.9vw,1.3rem);font-weight:750
}
.arrows{display:flex;flex-direction:column;gap:10px;line-height:1.25}
.arrow-line{white-space:nowrap}
.math-arrow{color:var(--bd);font-weight:900;padding:0 8px}
.mini-table{
  border-collapse:collapse;width:min(94%,390px);
  table-layout:fixed;font-size:clamp(.86rem,1.55vw,1.08rem)
}
.mini-table th,.mini-table td{
  border:2px solid #8da8bb;padding:7px 5px;text-align:center
}
.mini-table th{
  width:48%;background:#f3f7fa;font-weight:850
}
.feedback{
  min-height:62px;padding:8px 14px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:700;
  font-size:clamp(.9rem,1.65vw,1.05rem);
  line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:13px;
  visibility:hidden
}
.feedback.show{visibility:visible}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:45px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:43px;padding:0 20px;font-size:1rem;
  font-weight:850;cursor:pointer;border:0;border-radius:12px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.primary:disabled{opacity:.45;cursor:default}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:850}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:720px),(max-height:650px){
  body{padding:5px}
  .app{min-height:0;max-height:calc(100vh - 10px);border-radius:15px}
  .top{grid-template-columns:1fr auto;padding:8px 11px 5px;gap:7px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:6px 9px;font-size:.87rem}
  .main{padding:1px 8px 8px;gap:5px}
  .instruction{min-height:38px;font-size:1.02rem}
  .question-zone{min-height:250px;padding:7px;gap:7px}
  .situation{min-height:54px;padding:7px 10px;font-size:1.03rem}
  .cards{gap:6px}
  .card{min-height:92px;padding:7px 8px}
  .badge{width:22px;height:22px;top:4px;left:5px;font-size:.76rem}
  .rep{font-size:.86rem}
  .arrows{gap:5px}
  .math-arrow{padding:0 4px}
  .mini-table{font-size:.72rem}
  .mini-table th,.mini-table td{padding:4px 2px;border-width:1.5px}
  .feedback{min-height:49px;padding:6px 8px;font-size:.78rem}
  .controls{min-height:37px}
  button.action{min-height:35px;height:35px;padding:0 13px;font-size:.88rem}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 5</div>
    <div class="pill" id="score">Score : 0 / 5</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Sélectionne toutes les représentations qui correspondent à la situation.</p>

    <div class="question-zone">
      <div class="situation" id="situation"></div>
      <div class="cards" id="cards"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="action primary" id="validate" disabled>Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouvelles situations</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=5;
const $=id=>document.getElementById(id);
const situation=$('situation');
const cardsBox=$('cards');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let resolved=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[randInt(0,arr.length-1)];
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fr(n){
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.',',').replace(/0$/,'');
}
function euro(n){ return `${fr(n)} €`; }

const contexts=[
  {
    id:'pommes',
    make(){
      const q1=pick([2,3,4,5]);
      const q2=pick([6,7,8,9]);
      const unit=pick([2,2.5,3,3.5,4]);
      return {
        text:`Au marché, <span class="value">${q1} kg</span> de pommes coûtent <span class="value">${euro(q1*unit)}</span> et <span class="value">${q2} kg</span> coûtent <span class="value">${euro(q2*unit)}</span>.`,
        g1:'Masse (en kg)',g2:'Prix (en €)',
        a:`${q1} kg`,b:`${q2} kg`,c:euro(q1*unit),d:euro(q2*unit)
      };
    }
  },
  {
    id:'bouteilles',
    make(){
      const q1=pick([2,3,4]);
      const q2=pick([5,6,7,8]);
      const unit=pick([1.5,2,2.5,3]);
      return {
        text:`Dans un magasin, <span class="value">${q1} bouteilles</span> coûtent <span class="value">${euro(q1*unit)}</span> et <span class="value">${q2} bouteilles</span> coûtent <span class="value">${euro(q2*unit)}</span>.`,
        g1:'Nombre de bouteilles',g2:'Prix (en €)',
        a:String(q1),b:String(q2),c:euro(q1*unit),d:euro(q2*unit)
      };
    }
  },
  {
    id:'recette',
    make(){
      const p1=pick([2,3,4]);
      const p2=pick([5,6,8]);
      const per=pick([50,75,100,125]);
      return {
        text:`Pour une recette, il faut <span class="value">${p1*per} g</span> de farine pour <span class="value">${p1} personnes</span> et <span class="value">${p2*per} g</span> pour <span class="value">${p2} personnes</span>.`,
        g1:'Nombre de personnes',g2:'Farine (en g)',
        a:String(p1),b:String(p2),c:`${p1*per} g`,d:`${p2*per} g`
      };
    }
  },
  {
    id:'distance',
    make(){
      const t1=pick([2,3,4]);
      const t2=pick([5,6,7]);
      const speed=pick([4,5,6]);
      return {
        text:`À vitesse constante, un marcheur parcourt <span class="value">${t1*speed} km</span> en <span class="value">${t1} h</span> et <span class="value">${t2*speed} km</span> en <span class="value">${t2} h</span>.`,
        g1:'Durée (en h)',g2:'Distance (en km)',
        a:`${t1} h`,b:`${t2} h`,c:`${t1*speed} km`,d:`${t2*speed} km`
      };
    }
  },
  {
    id:'cahiers',
    make(){
      const q1=pick([2,3,4,5]);
      const q2=pick([6,7,8,9]);
      const unit=pick([1.2,1.5,1.8,2]);
      return {
        text:`À la papeterie, <span class="value">${q1} cahiers</span> coûtent <span class="value">${euro(q1*unit)}</span> et <span class="value">${q2} cahiers</span> coûtent <span class="value">${euro(q2*unit)}</span>.`,
        g1:'Nombre de cahiers',g2:'Prix (en €)',
        a:String(q1),b:String(q2),c:euro(q1*unit),d:euro(q2*unit)
      };
    }
  },
  {
    id:'jus',
    make(){
      const n1=pick([2,3,4]);
      const n2=pick([5,6,8]);
      const per=pick([20,25,30,40]);
      return {
        text:`Pour préparer une boisson, on utilise <span class="value">${n1*per} cL</span> de jus pour <span class="value">${n1} verres</span> et <span class="value">${n2*per} cL</span> pour <span class="value">${n2} verres</span>.`,
        g1:'Nombre de verres',g2:'Jus (en cL)',
        a:String(n1),b:String(n2),c:`${n1*per} cL`,d:`${n2*per} cL`
      };
    }
  }
];

function arrows(a,c,b,d,reverse=false){
  if(!reverse){
    return `<div class="rep arrows">
      <div class="arrow-line">${a}<span class="math-arrow">⟶</span>${c}</div>
      <div class="arrow-line">${b}<span class="math-arrow">⟶</span>${d}</div>
    </div>`;
  }
  return `<div class="rep arrows">
    <div class="arrow-line">${c}<span class="math-arrow">⟶</span>${a}</div>
    <div class="arrow-line">${d}<span class="math-arrow">⟶</span>${b}</div>
  </div>`;
}
function table(gTop,gBottom,x1,x2,y1,y2){
  return `<div class="rep"><table class="mini-table">
    <tr><th>${gTop}</th><td>${x1}</td><td>${x2}</td></tr>
    <tr><th>${gBottom}</th><td>${y1}</td><td>${y2}</td></tr>
  </table></div>`;
}

function buildOptions(q){
  const correctPool=[
    {correct:true,html:arrows(q.a,q.c,q.b,q.d,false)},
    {correct:true,html:arrows(q.a,q.c,q.b,q.d,true)},
    {correct:true,html:table(q.g1,q.g2,q.a,q.b,q.c,q.d)},
    {correct:true,html:table(q.g2,q.g1,q.c,q.d,q.a,q.b)}
  ];
  const wrongPool=[
    {correct:false,html:arrows(q.a,q.d,q.b,q.c,false)},
    {correct:false,html:arrows(q.c,q.b,q.d,q.a,false)},
    {correct:false,html:table(q.g1,q.g2,q.a,q.b,q.d,q.c)},
    {correct:false,html:table(q.g2,q.g1,q.c,q.d,q.b,q.a)},
    {correct:false,html:table(q.g1,q.g2,q.b,q.a,q.c,q.d)}
  ];

  // 2 ou 3 bonnes réponses : impossible d'apprendre un nombre fixe de cases à cocher.
  const nbCorrect=Math.random()<0.5 ? 2 : 3;
  const options=[
    ...shuffle(correctPool).slice(0,nbCorrect),
    ...shuffle(wrongPool).slice(0,4-nbCorrect)
  ];
  return shuffle(options);
}

function buildQuestions(){
  const chosen=shuffle(contexts).slice(0,TOTAL);
  return chosen.map(ctx=>{
    const q=ctx.make();
    q.options=buildOptions(q);
    return q;
  });
}

function setFeedback(text,type){
  feedback.textContent=text;
  feedback.className=`feedback show ${type}`;
}
function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}
function renderQuestion(){
  resolved=false;
  const q=questions[index];
  situation.innerHTML=`<div class="situation-text">${q.text}</div>`;
  cardsBox.innerHTML='';
  feedback.textContent='';
  feedback.className='feedback';
  validateBtn.disabled=true;
  validateBtn.hidden=false;
  nextBtn.hidden=true;

  const labels=['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='card';
    btn.dataset.index=String(i);
    btn.setAttribute('aria-pressed','false');
    btn.innerHTML=`<span class="badge">${labels[i]}</span>${opt.html}`;
    btn.addEventListener('click',()=>{
      if(resolved) return;
      btn.classList.toggle('selected');
      btn.setAttribute('aria-pressed',btn.classList.contains('selected')?'true':'false');
      validateBtn.disabled=!cardsBox.querySelector('.card.selected');
    });
    cardsBox.appendChild(btn);
  });
  updateTop();
}

function validate(){
  if(resolved) return;
  const selected=[...cardsBox.querySelectorAll('.card.selected')];
  if(selected.length===0) return;

  resolved=true;
  const q=questions[index];
  let allGood=true;

  [...cardsBox.querySelectorAll('.card')].forEach((btn,i)=>{
    btn.disabled=true;
    const chosen=btn.classList.contains('selected');
    const isCorrect=q.options[i].correct;

    if(chosen && isCorrect) btn.classList.add('correct');
    if(chosen && !isCorrect){ btn.classList.add('wrong'); allGood=false; }
    if(!chosen && isCorrect){ btn.classList.add('missed'); allGood=false; }
  });

  if(allGood){
    score++;
    setFeedback(
      "Bravo ! L’ordre des lignes ou le sens des flèches peut changer : ce sont les correspondances entre les valeurs qui comptent.",
      "success"
    );
  }else{
    setFeedback(
      "Regarde les correspondances : dans un tableau, deux valeurs d’une même colonne doivent décrire la même situation. Avec des flèches, chaque valeur doit être reliée à celle qui lui correspond.",
      "error"
    );
  }

  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  validateBtn.hidden=true;
  nextBtn.hidden=false;
  nextBtn.textContent=index===TOTAL-1 ? 'Voir le résultat' : 'Question suivante';
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;
  if(score===TOTAL){
    finalMessage.textContent="Excellent ! Tu sais reconnaître plusieurs représentations d’une même situation de proportionnalité.";
  }else if(score>=3){
    finalMessage.textContent="Bien joué ! Vérifie surtout que les valeurs placées ensemble se correspondent réellement.";
  }else{
    finalMessage.textContent="À revoir : dans un tableau, lis les colonnes ; avec des flèches, suis chaque correspondance.";
  }
}
function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

validateBtn.addEventListener('click',validate);
nextBtn.addEventListener('click',()=>{
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
});
restartBtn.addEventListener('click',restart);

questions=buildQuestions();
renderQuestion();
})();
</script>
</body>
</html>
