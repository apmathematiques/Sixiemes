<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Du plan à la réalité</title>
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --o:#b96b16;--os:#fff6ea;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:500px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:118px;padding:9px 14px;color:var(--bd);
  font-weight:800;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:4px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:56px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.45rem,2.8vw,1.9rem);
  font-weight:800;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:285px;padding:18px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.situation{
  width:min(850px,100%);padding:20px 24px;
  background:#fff;border:2px solid #dce9f3;border-radius:17px;
  font-size:clamp(1.45rem,3vw,2rem);
  font-weight:800;line-height:1.38;text-align:center
}
.value{color:var(--bd);font-weight:900;white-space:nowrap}
.answer-row{
  display:flex;align-items:center;justify-content:center;
  gap:12px;flex-wrap:wrap
}
.answer-row label{
  font-size:clamp(1.25rem,2.5vw,1.65rem);
  font-weight:800
}
.answer-input{
  width:240px;max-width:45vw;height:70px;padding:0 16px;
  border:3px solid #9fc4df;border-radius:16px;
  background:#fff;color:var(--i);
  font:900 clamp(1.55rem,3vw,2rem)/1 Arial,Helvetica,sans-serif;
  text-align:center;outline:none
}
.answer-input:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(23,105,170,.12)}
.answer-input.correct{border-color:#79c798;background:var(--gs);color:#165e36}
.answer-input.wrong{border-color:#df8585;background:var(--rs);color:#8f2727}
.answer-input.revealed{border-color:#e6a34e;background:var(--os);color:#7a450d}
.unit{
  font-size:clamp(1.35rem,2.7vw,1.8rem);
  font-weight:900;color:var(--bd)
}
.attempt{
  min-height:28px;color:var(--m);font-weight:750;
  font-size:1rem;text-align:center
}
.feedback{
  min-height:72px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:750;
  font-size:clamp(1rem,1.9vw,1.18rem);
  line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px;
  visibility:hidden
}
.feedback.show{visibility:visible}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.feedback.correction{color:#7a450d;background:var(--os);border:1px solid #efc68f}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 24px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.5rem,3vw,2rem)}
.final-score{margin:8px 0;font-size:1.35rem;font-weight:900}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:650px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:9px 12px 5px;gap:7px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:6px 9px}
  .main{padding:1px 9px 9px;gap:6px}
  .instruction{min-height:40px;font-size:1.16rem}
  .question-zone{min-height:210px;padding:10px;gap:12px}
  .situation{padding:12px 14px;font-size:1.25rem}
  .answer-row{gap:8px}
  .answer-row label{font-size:1.08rem}
  .answer-input{width:180px;height:56px;font-size:1.4rem}
  .unit{font-size:1.2rem}
  .attempt{min-height:22px;font-size:.88rem}
  .feedback{min-height:54px;padding:7px 9px;font-size:.9rem}
  .controls{min-height:38px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Calcule la longueur réelle.</p>

    <div class="question-zone">
      <div class="situation" id="situation"></div>

      <div class="answer-row">
        <label for="answer">Longueur réelle :</label>
        <input class="answer-input" id="answer" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
        <span class="unit" id="unit">cm</span>
      </div>

      <div class="attempt" id="attempt">Tu as 2 essais.</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="action primary" id="validate" disabled>Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouvelles situations</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=8;
const MAX_ATTEMPTS=2;
const $=id=>document.getElementById(id);

const situation=$('situation');
const answer=$('answer');
const unit=$('unit');
const attempt=$('attempt');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let attempts=0;
let resolved=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[randInt(0,arr.length-1)];
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fr(n){
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}
function parseAnswer(raw){
  const cleaned=String(raw).trim().replace(/\s/g,'').replace(',','.');
  if(!cleaned || !/^[-+]?\d+(?:\.\d+)?$/.test(cleaned)) return NaN;
  return Number(cleaned);
}
function sameNumber(a,b){
  return Number.isFinite(a) && Math.abs(a-b)<1e-9;
}

const contexts=[
  {
    name:'carte',
    scales:[10000,25000,50000,100000],
    lengths:[2,3,4,5,6,7,8,9,10,12],
    text:(n,l)=>`Une carte est à l’échelle <span class="value">1 : ${fr(n)}</span>.<br>Deux lieux sont distants de <span class="value">${l} cm</span> sur la carte.`
  },
  {
    name:'plan',
    scales:[50,100,200,500],
    lengths:[2,3,4,5,6,8,10,12],
    text:(n,l)=>`Un plan est à l’échelle <span class="value">1 : ${fr(n)}</span>.<br>Une longueur mesure <span class="value">${l} cm</span> sur le plan.`
  },
  {
    name:'maquette',
    scales:[20,25,50,100],
    lengths:[2,3,4,5,6,8,10],
    text:(n,l)=>`Une maquette est à l’échelle <span class="value">1 : ${fr(n)}</span>.<br>Une longueur mesure <span class="value">${l} cm</span> sur la maquette.`
  }
];

function buildQuestion(ctx){
  const n=pick(ctx.scales);
  const l=pick(ctx.lengths);
  return{
    html:ctx.text(n,l),
    scale:n,
    drawing:l,
    answer:l*n,
    unit:'cm'
  };
}

function buildQuestions(){
  const qs=[];
  const used=new Set();

  while(qs.length<TOTAL){
    const ctx=pick(contexts);
    const q=buildQuestion(ctx);
    const key=`${ctx.name}-${q.scale}-${q.drawing}`;
    if(used.has(key)) continue;
    used.add(key);
    qs.push(q);
  }
  return shuffle(qs);
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function setFeedback(text,type){
  feedback.textContent=text;
  feedback.className=`feedback show ${type}`;
}

function renderQuestion(){
  attempts=0;
  resolved=false;

  const q=questions[index];
  situation.innerHTML=q.html;
  unit.textContent=q.unit;

  answer.value='';
  answer.disabled=false;
  answer.className='answer-input';

  attempt.textContent='Tu as 2 essais.';
  feedback.textContent='';
  feedback.className='feedback';

  validateBtn.hidden=false;
  validateBtn.disabled=true;
  nextBtn.hidden=true;

  updateTop();
  setTimeout(()=>answer.focus(),50);
}

function finishQuestion(){
  validateBtn.hidden=true;
  nextBtn.hidden=false;
  nextBtn.textContent=index===TOTAL-1?'Voir le résultat':'Question suivante';
  attempt.textContent='Question terminée.';
}

function validate(){
  if(resolved)return;

  const q=questions[index];
  const value=parseAnswer(answer.value);
  if(!Number.isFinite(value))return;

  attempts++;

  if(sameNumber(value,q.answer)){
    resolved=true;
    score++;
    answer.disabled=true;
    answer.classList.remove('wrong');
    answer.classList.add('correct');
    setFeedback(`${q.drawing} × ${fr(q.scale)} = ${fr(q.answer)}. La longueur réelle est ${fr(q.answer)} cm.`,'success');
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    finishQuestion();
    return;
  }

  answer.classList.add('wrong');

  if(attempts<MAX_ATTEMPTS){
    attempt.textContent='Il te reste 1 essai.';
    setFeedback("Ce n’est pas la bonne longueur. Réessaie.",'error');
    answer.select();
    return;
  }

  resolved=true;
  answer.disabled=true;
  answer.value=fr(q.answer);
  answer.classList.remove('wrong');
  answer.classList.add('revealed');
  setFeedback(`La réponse était ${fr(q.answer)} cm. ${q.drawing} × ${fr(q.scale)} = ${fr(q.answer)}.`,'correction');
  finishQuestion();
}

function next(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;
  finalMessage.textContent=
    score===TOTAL
      ? 'Parfait ! Tu sais passer d’une longueur sur une représentation à la longueur réelle.'
      : score>=6
        ? 'Très bien ! Le calcul avec une échelle est presque acquis.'
        : score>=4
          ? 'Bon début. Pense à multiplier la longueur sur la représentation par le nombre de l’échelle.'
          : 'Rejoue pour t’entraîner au passage de la représentation à la réalité.';
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  attempts=0;
  resolved=false;
  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

answer.addEventListener('input',()=>{
  answer.classList.remove('wrong');
  validateBtn.disabled=!Number.isFinite(parseAnswer(answer.value));
});
answer.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !validateBtn.disabled && !resolved) validate();
});
validateBtn.addEventListener('click',validate);
nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);

questions=buildQuestions();
renderQuestion();

})();
</script>
</body>
</html>
