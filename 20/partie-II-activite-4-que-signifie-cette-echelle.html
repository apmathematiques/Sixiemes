<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Que signifie cette échelle ?</title>
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --o:#b96b16;--os:#fff6ea;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:500px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:118px;padding:9px 14px;color:var(--bd);
  font-weight:800;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:4px 18px 16px;
  display:flex;flex-direction:column;gap:12px
}
.instruction{
  flex:0 0 auto;min-height:52px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:4px 10px 2px;
  font-size:clamp(1.35rem,2.5vw,1.75rem);
  font-weight:800;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:0;padding:14px 18px 16px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;gap:14px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.scale-card{
  flex:0 0 auto;width:min(840px,100%);padding:15px 20px;
  display:block;
  font-size:clamp(1.32rem,2.55vw,1.75rem);
  font-weight:800;line-height:1.3;text-align:center;
  background:#fff;border:2px solid #dce9f3;border-radius:17px
}
.scale{
  color:var(--bd);font-weight:900;white-space:nowrap
}
.question-line{display:inline-block;margin-top:4px}
.choices{
  width:min(880px,100%);flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(86px,1fr) minmax(86px,1fr);gap:12px
}
.choice{
  min-height:86px;padding:10px 15px;
  display:flex;align-items:center;justify-content:center;
  color:var(--i);background:#fff;
  border:3px solid #bfd7e9;border-radius:16px;
  font:800 clamp(1.06rem,1.95vw,1.34rem)/1.28 Arial,Helvetica,sans-serif;
  text-align:center;cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,border-color .15s ease,background .15s ease
}
.choice:hover:not(:disabled){border-color:#74a9cf}
.choice:active:not(:disabled){transform:scale(.985)}
.choice.selected{color:var(--bd);background:var(--bs);border-color:var(--b)}
.choice.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.choice.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.choice:disabled{cursor:default}
.feedback{
  min-height:76px;padding:11px 16px;
  display:none;align-items:center;justify-content:center;
  color:var(--m);font-weight:750;
  font-size:clamp(1.02rem,1.9vw,1.2rem);
  line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px;
  visibility:hidden
}
.feedback.show{display:flex;visibility:visible}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 24px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.5rem,3vw,2rem)}
.final-score{margin:8px 0;font-size:1.35rem;font-weight:900}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:650px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:9px 12px 5px;gap:7px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:6px 9px}
  .main{padding:1px 9px 9px;gap:6px}
  .instruction{min-height:38px;padding:2px 8px;font-size:1.1rem}
  .question-zone{min-height:0;padding:8px 9px 9px;gap:8px}
  .scale-card{padding:9px 11px;font-size:1.16rem}
  .choices{gap:7px;grid-template-rows:minmax(78px,1fr) minmax(78px,1fr)}
  .choice{min-height:78px;padding:7px 9px;font-size:1rem;line-height:1.22;border-width:2px}
  .feedback{min-height:54px;padding:7px 9px;font-size:.9rem}
  .controls{min-height:38px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Choisis la bonne interprétation de l’échelle.</p>

    <div class="question-zone">
      <div class="scale-card" id="question"></div>
      <div class="choices" id="choices"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="action primary" id="validate" disabled>Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouvelles échelles</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=8;
const $=id=>document.getElementById(id);

const questionBox=$('question');
const choicesBox=$('choices');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let selected=null;
let resolved=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[randInt(0,arr.length-1)];
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function frInt(n){
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

const scales=[100,200,250,500,1000,2000,5000,10000,25000,50000,100000];

function directQuestion(n){
  const correct=`1 cm sur la représentation = ${frInt(n)} cm dans la réalité`;
  const distractors=[
    `${frInt(n)} cm sur la représentation = 1 cm dans la réalité`,
    `1 cm sur la représentation = ${frInt(n)} m dans la réalité`,
    `1 cm dans la réalité = ${frInt(n)} cm sur la représentation`,
    `${frInt(n)} cm dans la réalité = ${frInt(n)} cm sur la représentation`
  ];
  return{
    type:'direct',
    n,
    prompt:`Une représentation est à l’échelle <span class="scale">1 : ${frInt(n)}</span>.<br><span class="question-line">Que signifie cette écriture ?</span>`,
    correct,
    options:shuffle([correct,...shuffle(distractors).slice(0,3)]),
    correction:`À l’échelle 1 : ${frInt(n)}, 1 cm sur la représentation correspond à ${frInt(n)} cm dans la réalité.`
  };
}

function multipleQuestion(n){
  const cm=pick([2,3,4,5]);
  const real=cm*n;
  const correct=`${frInt(real)} cm dans la réalité`;
  const wrongValues=[
    `${frInt(n)} cm dans la réalité`,
    `${frInt(real)} m dans la réalité`,
    `${frInt(Math.max(1,Math.round(n/cm)))} cm dans la réalité`,
    `${frInt(cm*n*10)} cm dans la réalité`
  ];
  return{
    type:'multiple',
    n,
    prompt:`À l’échelle <span class="scale">1 : ${frInt(n)}</span>, <span class="scale">${cm} cm</span> sur la représentation correspondent à…`,
    correct,
    options:shuffle([correct,...shuffle(wrongValues.filter(v=>v!==correct)).slice(0,3)]),
    correction:`À l’échelle 1 : ${frInt(n)}, ${cm} cm sur la représentation correspondent à ${frInt(real)} cm dans la réalité.`
  };
}

function buildQuestions(){
  const chosenScales=shuffle(scales).slice(0,TOTAL);
  const qs=[];
  chosenScales.forEach((n,i)=>{
    qs.push(i<4 ? directQuestion(n) : multipleQuestion(n));
  });
  return shuffle(qs);
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function setFeedback(text,type){
  feedback.textContent=text;
  feedback.className=`feedback show ${type}`;
}

function renderQuestion(){
  resolved=false;
  selected=null;
  validateBtn.disabled=true;
  validateBtn.hidden=false;
  nextBtn.hidden=true;
  feedback.textContent='';
  feedback.className='feedback';

  const q=questions[index];
  questionBox.innerHTML=q.prompt;
  choicesBox.innerHTML='';

  q.options.forEach(option=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='choice';
    btn.textContent=option;
    btn.dataset.option=option;
    btn.addEventListener('click',()=>{
      if(resolved)return;
      [...choicesBox.children].forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selected=option;
      validateBtn.disabled=false;
    });
    choicesBox.appendChild(btn);
  });

  updateTop();
}

function validate(){
  if(resolved || selected===null)return;
  resolved=true;

  const q=questions[index];
  const buttons=[...choicesBox.children];
  buttons.forEach(btn=>{
    btn.disabled=true;
    if(btn.dataset.option===q.correct) btn.classList.add('correct');
  });

  const chosen=buttons.find(btn=>btn.dataset.option===selected);

  if(selected===q.correct){
    score++;
    chosen.classList.add('correct');
    setFeedback(`Bravo ! ${q.correction}`,'success');
  }else{
    chosen.classList.add('wrong');
    setFeedback(`Ce n’est pas la bonne interprétation. ${q.correction}`,'error');
  }

  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  validateBtn.hidden=true;
  nextBtn.hidden=false;
  nextBtn.textContent=index===TOTAL-1?'Voir le résultat':'Question suivante';
}

function next(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;
  finalMessage.textContent=
    score===TOTAL
      ? 'Parfait ! Tu sais interpréter une échelle.'
      : score>=6
        ? 'Très bien ! Le sens d’une échelle est presque acquis.'
        : score>=4
          ? 'Bon début. Relis attentivement ce que signifie 1 : n.'
          : 'Rejoue pour t’entraîner à lire correctement les échelles.';
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  selected=null;
  resolved=false;
  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

validateBtn.addEventListener('click',validate);
nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);

questions=buildQuestions();
renderQuestion();

})();
</script>
</body>
</html>
