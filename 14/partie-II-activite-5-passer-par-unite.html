<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;
  padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;
  text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;display:flex;flex-direction:column;gap:12px
}
.instruction{
  min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.22rem,2.25vw,1.55rem);font-weight:600;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:230px;padding:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.context{
  margin:0;text-align:center;color:var(--m);
  font-size:clamp(.95rem,1.8vw,1.08rem);line-height:1.35
}
.cards{
  width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);
  align-items:stretch;gap:14px
}
.card{
  min-height:120px;padding:13px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  background:#fff;border:2px solid #d8e7f2;border-radius:15px
}
.card.unit{border-color:#8ab9dc;background:#f7fbfe}
.card.target{border-color:#b7c9d7;background:#fbfcfd}
.xval,.yval{font-size:clamp(1.15rem,2.5vw,1.55rem);font-weight:800;text-align:center}
.arrow{color:var(--m);font-size:1.2rem;font-weight:800}
.unknown{color:var(--b);font-size:1.5rem;font-weight:900}
.card-label{
  margin-bottom:2px;color:var(--bd);font-size:.8rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em
}

.step{
  width:min(680px,100%);display:flex;flex-direction:column;align-items:center;gap:8px
}
.step-title{
  margin:0;font-size:clamp(.98rem,2vw,1.14rem);font-weight:800;color:var(--bd);text-align:center
}
.answer-row{
  width:min(430px,100%);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center
}
.answer-input{
  width:100%;height:50px;padding:0 14px;border:3px solid #b9d4e8;border-radius:14px;
  background:#fff;color:var(--i);font:800 1.12rem Arial,Helvetica,sans-serif;
  text-align:center;outline:none
}
.answer-input:focus{border-color:var(--b)}
.answer-input.correct{border-color:#79c798;background:var(--gs);color:#165e36}
.answer-input.wrong{border-color:#df8585;background:var(--rs);color:#8f2727}
.validate{
  min-height:50px;padding:0 18px;border:0;border-radius:13px;
  color:#fff;background:var(--b);font:800 1rem Arial,Helvetica,sans-serif;cursor:pointer
}
.validate:disabled{cursor:default;opacity:.65}

.feedback{
  min-height:66px;padding:9px 14px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
button.action{
  min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;
  border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}

.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;
  border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}

[hidden]{display:none!important}

@media(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{
    grid-template-columns:1fr auto auto;
    padding:8px 14px 5px;gap:8px
  }
  .track{grid-column:auto}
  .pill{min-width:0;padding:6px 10px}
  .main{padding:0 10px 8px;gap:5px}
  .instruction{min-height:34px;font-size:1rem}
  .question-zone{
    min-height:0;padding:7px;gap:6px;justify-content:flex-start;overflow-y:auto
  }
  .context{font-size:.8rem}
  .cards{gap:6px}
  .card{min-height:72px;padding:5px 4px;gap:2px}
  .card-label{font-size:.65rem}
  .xval,.yval{font-size:.92rem}
  .arrow{font-size:.92rem}
  .unknown{font-size:1.08rem}
  .step{gap:4px}
  .step-title{font-size:.86rem}
  .answer-input,.validate{height:38px;min-height:38px}
  .answer-input{font-size:.96rem}
  .feedback{min-height:46px;padding:5px 8px;font-size:.78rem}
  .controls{min-height:36px}
  button.action{min-height:36px;height:36px;padding:0 12px}
}

@media(max-width:700px){
  .top{grid-template-columns:1fr auto;padding:8px 12px 5px}
  .track{grid-column:1/-1}
  .pill{padding:6px 9px}
  .cards{gap:5px}
  .xval,.yval{font-size:.86rem}
  .answer-row{grid-template-columns:1fr auto}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Passe par l'unité pour trouver la valeur manquante.</p>

    <div class="question-zone">
      <p class="context" id="context"></p>

      <div class="cards" id="cards"></div>

      <div class="step" id="stepUnit">
        <p class="step-title" id="unitPrompt">1. Quelle valeur correspond à 1 unité ?</p>
        <div class="answer-row">
          <input id="unitInput" class="answer-input" inputmode="decimal" autocomplete="off"
                 aria-label="Valeur pour une unité">
          <button id="validateUnit" class="validate">Valider</button>
        </div>
      </div>

      <div class="step" id="stepTarget" hidden>
        <p class="step-title" id="targetPrompt">2. Quelle est la valeur cherchée ?</p>
        <div class="answer-row">
          <input id="targetInput" class="answer-input" inputmode="decimal" autocomplete="off"
                 aria-label="Valeur cherchée">
          <button id="validateTarget" class="validate">Valider</button>
        </div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      Commence par calculer la valeur correspondant à 1 unité.
    </div>

    <div class="controls">
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Recommencer avec de nouvelles valeurs</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=10;
const $=id=>document.getElementById(id);
const counter=$('counter'),scoreBox=$('score'),bar=$('bar'),
      context=$('context'),cards=$('cards'),
      stepUnit=$('stepUnit'),stepTarget=$('stepTarget'),
      unitPrompt=$('unitPrompt'),targetPrompt=$('targetPrompt'),
      unitInput=$('unitInput'),targetInput=$('targetInput'),
      validateUnit=$('validateUnit'),validateTarget=$('validateTarget'),
      feedback=$('feedback'),nextBtn=$('next'),
      exercise=$('exercise'),final=$('final'),
      finalScore=$('finalScore'),finalMessage=$('finalMessage'),
      restartBtn=$('restart');

let questions=[],index=0,score=0,unitAttempt=0,targetAttempt=0,unitLocked=false,targetLocked=false;

function choice(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){
  const c=a.slice();
  for(let i=c.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [c[i],c[j]]=[c[j],c[i]];
  }
  return c;
}
function round2(n){return Math.round((n+Number.EPSILON)*100)/100}
function fmt(n){
  n=round2(n);
  return Number.isInteger(n)?String(n):String(n).replace('.',',');
}
function parseNumber(s){
  if(typeof s!=='string')return NaN;
  const cleaned=s.trim().replace(/\s+/g,'').replace(',','.');
  if(!/^-?\d+(?:\.\d+)?$/.test(cleaned))return NaN;
  return Number(cleaned);
}
function nearlyEqual(a,b){return Math.abs(a-b)<1e-9}

const contexts=[
  {
    label:'Masse de fruits et prix payé',
    xUnit:'kg', yUnit:'€',
    unitValues:[1.5,2,2.5,3,3.5,4,4.5,5,6]
  },
  {
    label:'Longueur de tissu et prix payé',
    xUnit:'m', yUnit:'€',
    unitValues:[2,2.5,3,3.5,4,4.5,5,6]
  },
  {
    label:'Nombre de personnes et quantité de farine',
    xUnit:'pers.', yUnit:'g',
    unitValues:[50,75,100,125,150]
  },
  {
    label:'Nombre de bouteilles et volume total',
    xUnit:'bouteilles', yUnit:'L',
    unitValues:[0.5,0.75,1,1.25,1.5]
  },
  {
    label:'Nombre de cahiers et prix payé',
    xUnit:'cahiers', yUnit:'€',
    unitValues:[1.5,2,2.5,3,3.5,4]
  },
  {
    label:'Durée de déplacement et distance parcourue',
    xUnit:'h', yUnit:'km',
    unitValues:[20,25,30,40,50,60]
  }
];

const integerQuantities=[2,3,4,5,6,7,8,9,10];

function hasSimpleDirectFactor(a,b){
  if(a===b)return true;
  const r1=b/a, r2=a/b;
  const simple=[2,3,4,5];
  return simple.some(k=>nearlyEqual(r1,k)||nearlyEqual(r2,k));
}

function makeQuestion(){
  const ctx=choice(contexts);
  const unitValue=choice(ctx.unitValues);

  let known,target;
  for(let tries=0;tries<200;tries++){
    known=choice(integerQuantities);
    target=choice(integerQuantities);
    if(known!==target && !hasSimpleDirectFactor(known,target))break;
  }

  const knownY=round2(known*unitValue);
  const targetY=round2(target*unitValue);

  return {ctx,known,target,unitValue,knownY,targetY};
}

function signature(q){
  return [q.ctx.label,q.known,q.target,q.unitValue].join('|');
}

function generate(){
  const result=[],used=new Set();
  while(result.length<TOTAL){
    const q=makeQuestion(),sig=signature(q);
    if(!used.has(sig)){
      used.add(sig);result.push(q);
    }
  }
  return shuffle(result);
}

function cardHtml(label,x,y,ctx,type){
  const cls=type==='unit'?' unit':type==='target'?' target':'';
  const valueClass=(type==='known')?'yval':'unknown';
  return `<div class="card${cls}">
    <div class="card-label">${label}</div>
    <div class="xval">${fmt(x)} ${ctx.xUnit}</div>
    <div class="arrow">↓</div>
    <div class="${valueClass}">${type==='known'?fmt(y)+' '+ctx.yUnit:'?'}</div>
  </div>`;
}

function render(){
  const q=questions[index];

  unitAttempt=0;targetAttempt=0;unitLocked=false;targetLocked=false;

  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${fmt(score)} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;

  context.textContent=q.ctx.label;
  cards.innerHTML=
    cardHtml('Donnée',q.known,q.knownY,q.ctx,'known')+
    cardHtml('Étape 1',1,null,q.ctx,'unit')+
    cardHtml('À trouver',q.target,null,q.ctx,'target');

  unitPrompt.textContent=`1. Quelle valeur correspond à 1 ${q.ctx.xUnit} ?`;
  targetPrompt.textContent=`2. Quelle valeur correspond à ${fmt(q.target)} ${q.ctx.xUnit} ?`;

  stepUnit.hidden=false;
  stepTarget.hidden=true;

  unitInput.value='';
  targetInput.value='';
  unitInput.disabled=false;
  targetInput.disabled=false;
  unitInput.className='answer-input';
  targetInput.className='answer-input';
  validateUnit.disabled=false;
  validateTarget.disabled=false;

  feedback.className='feedback';
  feedback.textContent=`Commence par calculer la valeur correspondant à 1 ${q.ctx.xUnit}.`;
  nextBtn.hidden=true;
}

function addScore(points){
  score=round2(score+points);
  scoreBox.textContent=`Score : ${fmt(score)} / ${TOTAL}`;
}

function validateUnitAnswer(){
  if(unitLocked)return;
  const q=questions[index];
  const value=parseNumber(unitInput.value);

  if(Number.isNaN(value)){
    feedback.className='feedback error';
    feedback.textContent='Entre un nombre. Tu peux utiliser une virgule ou un point pour les décimaux.';
    return;
  }

  unitAttempt++;

  if(nearlyEqual(value,q.unitValue)){
    unitLocked=true;
    addScore(unitAttempt===1?0.5:0.25);

    unitInput.disabled=true;
    unitInput.classList.remove('wrong');
    unitInput.classList.add('correct');
    validateUnit.disabled=true;

    feedback.className='feedback success';
    feedback.textContent=`Bravo ! ${fmt(q.knownY)} ÷ ${fmt(q.known)} = ${fmt(q.unitValue)} ${q.ctx.yUnit}.`;

    stepTarget.hidden=false;
    setTimeout(()=>targetInput.focus(),50);
    return;
  }

  unitInput.classList.add('wrong');

  if(unitAttempt===1){
    feedback.className='feedback error';
    feedback.textContent=`Pas encore. Pour passer à 1 unité, regarde par combien la première grandeur a été divisée, puis fais la même chose sur l'autre grandeur.`;
    unitInput.select();
    return;
  }

  unitLocked=true;
  unitInput.disabled=true;
  validateUnit.disabled=true;
  unitInput.value=fmt(q.unitValue);
  unitInput.classList.remove('wrong');
  unitInput.classList.add('correct');

  feedback.className='feedback error';
  feedback.textContent=`La valeur pour 1 ${q.ctx.xUnit} est ${fmt(q.unitValue)} ${q.ctx.yUnit}, car ${fmt(q.knownY)} ÷ ${fmt(q.known)} = ${fmt(q.unitValue)}.`;

  stepTarget.hidden=false;
  setTimeout(()=>targetInput.focus(),50);
}

function validateTargetAnswer(){
  if(targetLocked || stepTarget.hidden)return;
  const q=questions[index];
  const value=parseNumber(targetInput.value);

  if(Number.isNaN(value)){
    feedback.className='feedback error';
    feedback.textContent='Entre un nombre. Tu peux utiliser une virgule ou un point pour les décimaux.';
    return;
  }

  targetAttempt++;

  if(nearlyEqual(value,q.targetY)){
    targetLocked=true;
    addScore(targetAttempt===1?0.5:0.25);

    targetInput.disabled=true;
    targetInput.classList.remove('wrong');
    targetInput.classList.add('correct');
    validateTarget.disabled=true;

    feedback.className='feedback success';
    feedback.textContent=`Bravo ! ${fmt(q.unitValue)} × ${fmt(q.target)} = ${fmt(q.targetY)} ${q.ctx.yUnit}.`;

    nextBtn.hidden=false;
    nextBtn.textContent=index===TOTAL-1?'Voir mon résultat':'Question suivante';
    return;
  }

  targetInput.classList.add('wrong');

  if(targetAttempt===1){
    feedback.className='feedback error';
    feedback.textContent=`Pas encore. Tu connais maintenant la valeur pour 1 unité. Regarde comment passer de 1 à la quantité demandée, puis fais la même chose sur l'autre grandeur.`;
    targetInput.select();
    return;
  }

  targetLocked=true;
  targetInput.disabled=true;
  validateTarget.disabled=true;
  targetInput.value=fmt(q.targetY);
  targetInput.classList.remove('wrong');
  targetInput.classList.add('correct');

  feedback.className='feedback error';
  feedback.textContent=`La bonne réponse est ${fmt(q.targetY)} ${q.ctx.yUnit}, car ${fmt(q.unitValue)} × ${fmt(q.target)} = ${fmt(q.targetY)}.`;

  nextBtn.hidden=false;
  nextBtn.textContent=index===TOTAL-1?'Voir mon résultat':'Question suivante';
}

function next(){
  if(index<TOTAL-1){
    index++;
    render();
  }else{
    showFinal();
  }
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${fmt(score)} / ${TOTAL}`;

  if(score>=9){
    finalMessage.textContent="Excellent ! Tu maîtrises très bien le retour à l'unité.";
  }else if(score>=7){
    finalMessage.textContent="Très bien ! Pense à trouver d'abord la valeur pour 1, puis à repartir de cette valeur.";
  }else if(score>=5){
    finalMessage.textContent="C'est en bonne voie. Le retour à l'unité se fait toujours en deux étapes : passer à 1, puis atteindre la quantité cherchée.";
  }else{
    finalMessage.textContent="Reprends tranquillement : calcule d'abord la valeur correspondant à 1 unité, puis utilise-la pour trouver la valeur demandée.";
  }
}

function restart(){
  questions=generate();
  index=0;score=0;
  final.classList.remove('show');
  exercise.style.display='';
  render();
}

validateUnit.addEventListener('click',validateUnitAnswer);
validateTarget.addEventListener('click',validateTargetAnswer);
unitInput.addEventListener('keydown',e=>{if(e.key==='Enter')validateUnitAnswer()});
targetInput.addEventListener('keydown',e=>{if(e.key==='Enter')validateTargetAnswer()});
nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);

questions=generate();
render();
})();
</script>
</body>
</html>
