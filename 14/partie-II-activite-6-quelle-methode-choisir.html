<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;
  padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;
  text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;display:flex;flex-direction:column;gap:12px
}
.instruction{
  min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.2rem,2.2vw,1.5rem);font-weight:600;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:230px;padding:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.context{
  margin:0;text-align:center;color:var(--m);
  font-size:clamp(.94rem,1.8vw,1.06rem);line-height:1.35
}
.cards{
  width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px
}
.card{
  min-height:108px;padding:11px 8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  background:#fff;border:2px solid #d8e7f2;border-radius:15px
}
.card.target{border-color:#8ab9dc;background:#f7fbfe}
.card.empty{visibility:hidden}
.xval,.yval{
  font-size:clamp(1.12rem,2.35vw,1.48rem);font-weight:800;text-align:center
}
.arrow{color:var(--m);font-size:1.15rem;font-weight:800}
.unknown{color:var(--b);font-size:1.5rem;font-weight:900}

.step{
  width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:8px
}
.step-title{
  margin:0;font-size:clamp(.97rem,1.9vw,1.12rem);font-weight:800;color:var(--bd);text-align:center
}
.strategy-buttons{
  width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.strategy-button{
  min-height:58px;padding:8px 10px;color:var(--bd);background:var(--bs);
  border:3px solid #b9d4e8;border-radius:14px;
  font:800 .94rem/1.2 Arial,Helvetica,sans-serif;
  cursor:pointer;touch-action:manipulation
}
.strategy-button.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.strategy-button.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.strategy-button:disabled{cursor:default}

.answer-row{
  width:min(430px,100%);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center
}
.answer-input{
  width:100%;height:50px;padding:0 14px;border:3px solid #b9d4e8;border-radius:14px;
  background:#fff;color:var(--i);font:800 1.12rem Arial,Helvetica,sans-serif;
  text-align:center;outline:none
}
.answer-input:focus{border-color:var(--b)}
.answer-input.correct{border-color:#79c798;background:var(--gs);color:#165e36}
.answer-input.wrong{border-color:#df8585;background:var(--rs);color:#8f2727}
.validate{
  min-height:50px;padding:0 18px;border:0;border-radius:13px;
  color:#fff;background:var(--b);font:800 1rem Arial,Helvetica,sans-serif;cursor:pointer
}
.validate:disabled{cursor:default;opacity:.65}

.feedback{
  min-height:66px;padding:9px 14px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px}
button.action{
  min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;
  border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}

.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;
  border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
[hidden]{display:none!important}

@media(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto auto;padding:8px 14px 5px;gap:8px}
  .track{grid-column:auto}
  .pill{min-width:0;padding:6px 10px}
  .main{padding:0 10px 8px;gap:5px}
  .instruction{min-height:34px;font-size:.98rem}
  .question-zone{
    min-height:0;padding:7px;gap:5px;justify-content:flex-start;overflow-y:auto
  }
  .context{font-size:.78rem}
  .cards{gap:6px}
  .card{min-height:68px;padding:4px;gap:2px}
  .xval,.yval{font-size:.88rem}
  .arrow{font-size:.9rem}
  .unknown{font-size:1.05rem}
  .step{gap:4px}
  .step-title{font-size:.84rem}
  .strategy-buttons{gap:5px}
  .strategy-button{min-height:38px;padding:4px;font-size:.76rem}
  .answer-input,.validate{height:38px;min-height:38px}
  .answer-input{font-size:.96rem}
  .feedback{min-height:46px;padding:5px 8px;font-size:.76rem}
  .controls{min-height:36px}
  button.action{min-height:36px;height:36px;padding:0 12px}
}
@media(max-width:700px){
  .top{grid-template-columns:1fr auto;padding:8px 12px 5px}
  .track{grid-column:1/-1}
  .pill{padding:6px 9px}
  .strategy-buttons{grid-template-columns:1fr;gap:5px}
  .strategy-button{min-height:38px}
  .answer-row{grid-template-columns:1fr auto}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Choisis une méthode pertinente, puis calcule la valeur manquante.</p>

    <div class="question-zone">
      <p class="context" id="context"></p>

      <div class="cards" id="cards"></div>

      <div class="step" id="stepStrategy">
        <p class="step-title">1. Quelle méthode peux-tu utiliser ?</p>
        <div class="strategy-buttons">
          <button class="strategy-button" data-strategy="add">Addition / soustraction</button>
          <button class="strategy-button" data-strategy="mul">Multiplication / division</button>
          <button class="strategy-button" data-strategy="unit">Retour à l'unité</button>
        </div>
      </div>

      <div class="step" id="stepResult" hidden>
        <p class="step-title" id="resultPrompt">2. Quelle est la valeur manquante ?</p>
        <div class="answer-row">
          <input id="answerInput" class="answer-input" inputmode="decimal" autocomplete="off"
                 aria-label="Valeur manquante">
          <button id="validate" class="validate">Valider</button>
        </div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      Observe les quantités connues et la quantité demandée avant de choisir.
    </div>

    <div class="controls">
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Recommencer avec de nouvelles valeurs</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=10;
const $=id=>document.getElementById(id);
const counter=$('counter'),scoreBox=$('score'),bar=$('bar'),
      context=$('context'),cards=$('cards'),
      stepResult=$('stepResult'),resultPrompt=$('resultPrompt'),
      answerInput=$('answerInput'),validateBtn=$('validate'),
      feedback=$('feedback'),nextBtn=$('next'),
      exercise=$('exercise'),final=$('final'),
      finalScore=$('finalScore'),finalMessage=$('finalMessage'),
      restartBtn=$('restart'),
      strategyButtons=[...document.querySelectorAll('.strategy-button')];

let questions=[],index=0,score=0,resultAttempt=0,strategyLocked=false,resultLocked=false;

function choice(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){
  const c=a.slice();
  for(let i=c.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [c[i],c[j]]=[c[j],c[i]];
  }
  return c;
}
function round2(n){return Math.round((n+Number.EPSILON)*100)/100}
function fmt(n){
  n=round2(n);
  return Number.isInteger(n)?String(n):String(n).replace('.',',');
}
function parseNumber(s){
  if(typeof s!=='string')return NaN;
  const cleaned=s.trim().replace(/\s+/g,'').replace(',','.');
  if(!/^-?\d+(?:\.\d+)?$/.test(cleaned))return NaN;
  return Number(cleaned);
}
function nearlyEqual(a,b){return Math.abs(a-b)<1e-9}

const contexts=[
  {label:'Masse de fruits et prix payé',xUnit:'kg',yUnit:'€',unitVals:[2,2.5,3,3.5,4,5]},
  {label:'Longueur de tissu et prix payé',xUnit:'m',yUnit:'€',unitVals:[2,2.5,3,4,5,6]},
  {label:'Nombre de personnes et quantité de farine',xUnit:'pers.',yUnit:'g',unitVals:[50,75,100,125]},
  {label:'Nombre de bouteilles et volume total',xUnit:'bouteilles',yUnit:'L',unitVals:[0.5,0.75,1,1.5]},
  {label:'Nombre de cahiers et prix payé',xUnit:'cahiers',yUnit:'€',unitVals:[1.5,2,2.5,3,4]}
];

function cardHtml(x,y,ctx,target=false,empty=false){
  if(empty)return '<div class="card empty"></div>';
  return `<div class="card${target?' target':''}">
    <div class="xval">${fmt(x)} ${ctx.xUnit}</div>
    <div class="arrow">↓</div>
    <div class="${target?'unknown':'yval'}">${target?'?':fmt(y)+' '+ctx.yUnit}</div>
  </div>`;
}

function makeAdd(){
  const ctx=choice(contexts),u=choice(ctx.unitVals);
  let a,b,t;
  for(let tries=0;tries<100;tries++){
    a=choice([2,3,4,5,6,7]);
    b=choice([1,2,3,4,5]);
    if(a!==b && a+b<=11 && ![2,3,4,5].some(k=>nearlyEqual((a+b)/a,k)||nearlyEqual((a+b)/b,k))){
      t=a+b;break;
    }
  }
  return {
    ctx,kind:'add',accepted:['add','mul','unit'],preferred:'add',
    known:[{x:a,y:round2(a*u)},{x:b,y:round2(b*u)}],
    target:t,answer:round2(t*u),
    strategyText:`${fmt(a)} + ${fmt(b)} = ${fmt(t)} : on peut additionner les valeurs correspondantes.`,
    calcText:`${fmt(a*u)} + ${fmt(b*u)} = ${fmt(t*u)}`
  };
}

function makeSub(){
  const ctx=choice(contexts),u=choice(ctx.unitVals);
  let a,b,t;
  for(let tries=0;tries<100;tries++){
    a=choice([6,7,8,9,10,11]);
    b=choice([1,2,3,4,5]);
    if(a>b){
      t=a-b;
      if(t>0 && ![2,3,4,5].some(k=>nearlyEqual(a/t,k)||nearlyEqual(b/t,k)))break;
    }
  }
  return {
    ctx,kind:'add',accepted:['add','mul','unit'],preferred:'add',
    known:[{x:a,y:round2(a*u)},{x:b,y:round2(b*u)}],
    target:t,answer:round2(t*u),
    strategyText:`${fmt(a)} − ${fmt(b)} = ${fmt(t)} : on peut soustraire les valeurs correspondantes.`,
    calcText:`${fmt(a*u)} − ${fmt(b*u)} = ${fmt(t*u)}`
  };
}

function makeMul(multiAccept=false){
  const ctx=choice(contexts),u=choice(ctx.unitVals),factor=choice([2,3,4,5]);
  const a=choice([1,2,3,4,5]);
  const t=a*factor;
  const accepted=['add','mul','unit'];
  return {
    ctx,kind:'mul',accepted,preferred:'mul',
    known:[{x:a,y:round2(a*u)}],
    target:t,answer:round2(t*u),
    strategyText:multiAccept
      ? `${fmt(t)} = ${fmt(a)} × ${factor}. La multiplication est directe ; le retour à l'unité fonctionne aussi simplement ici.`
      : `${fmt(t)} = ${fmt(a)} × ${factor} : la multiplication est la méthode la plus directe.`,
    calcText:`${fmt(a*u)} × ${factor} = ${fmt(t*u)}`
  };
}

function makeDiv(multiAccept=false){
  const ctx=choice(contexts),u=choice(ctx.unitVals),factor=choice([2,3,4,5]);
  const t=choice([1,2,3,4,5]);
  const a=t*factor;
  const accepted=['mul','unit'];
  return {
    ctx,kind:'mul',accepted,preferred:'mul',
    known:[{x:a,y:round2(a*u)}],
    target:t,answer:round2(t*u),
    strategyText:multiAccept
      ? `${fmt(t)} = ${fmt(a)} ÷ ${factor}. La division est directe ; le retour à l'unité fonctionne aussi simplement ici.`
      : `${fmt(t)} = ${fmt(a)} ÷ ${factor} : la division est la méthode la plus directe.`,
    calcText:`${fmt(a*u)} ÷ ${factor} = ${fmt(t*u)}`
  };
}

function makeUnit(){
  const ctx=choice(contexts),u=choice(ctx.unitVals);
  let a,t;
  const pairs=[[3,5],[4,7],[5,8],[6,5],[6,7],[7,4],[8,5],[9,7]];
  [a,t]=choice(pairs);
  return {
    ctx,kind:'unit',accepted:['mul','unit'],preferred:'unit',
    known:[{x:a,y:round2(a*u)}],
    target:t,answer:round2(t*u),
    strategyText:`Il n'y a pas de facteur entier simple entre ${fmt(a)} et ${fmt(t)}. Passer par 1 est ici une méthode efficace.`,
    calcText:`${fmt(a*u)} ÷ ${fmt(a)} = ${fmt(u)}, puis ${fmt(u)} × ${fmt(t)} = ${fmt(t*u)}`
  };
}

function makeAddMul(){
  const ctx=choice(contexts),u=choice(ctx.unitVals);
  const a=choice([2,3,4]);
  const b=a*2;
  const t=a+b; // = 3a, donc addition OU ×3 depuis a
  return {
    ctx,kind:'mixed',accepted:['add','mul','unit'],preferred:'mul',
    known:[{x:a,y:round2(a*u)},{x:b,y:round2(b*u)}],
    target:t,answer:round2(t*u),
    strategyText:`Deux méthodes sont pertinentes : ${fmt(a)} + ${fmt(b)} = ${fmt(t)}, ou ${fmt(t)} = ${fmt(a)} × 3.`,
    calcText:`On obtient ${fmt(t*u)} ${ctx.yUnit} par l'une ou l'autre méthode.`
  };
}

function signature(q){
  return [
    q.kind,q.ctx.label,q.target,q.answer,
    q.known.map(k=>`${k.x}:${k.y}`).join('|'),
    q.accepted.join(',')
  ].join('#');
}

function generate(){
  const makers=shuffle([
    makeAdd,makeSub,
    ()=>makeMul(false),()=>makeDiv(false),
    makeUnit,makeUnit,
    ()=>makeMul(true),()=>makeDiv(true),
    makeAddMul,makeAddMul
  ]);
  const result=[],used=new Set();

  for(const maker of makers){
    for(let tries=0;tries<200;tries++){
      const q=maker(),sig=signature(q);
      if(!used.has(sig)){
        used.add(sig);result.push(q);break;
      }
    }
  }
  return shuffle(result);
}

function strategyLabel(s){
  if(s==='add')return 'addition / soustraction';
  if(s==='mul')return 'multiplication / division';
  return "retour à l'unité";
}

function render(){
  const q=questions[index];
  resultAttempt=0;strategyLocked=false;resultLocked=false;

  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${fmt(score)} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;

  context.textContent=q.ctx.label;

  if(q.known.length===2){
    cards.innerHTML=
      cardHtml(q.known[0].x,q.known[0].y,q.ctx)+
      cardHtml(q.known[1].x,q.known[1].y,q.ctx)+
      cardHtml(q.target,null,q.ctx,true);
  }else{
    cards.innerHTML=
      cardHtml(q.known[0].x,q.known[0].y,q.ctx)+
      cardHtml(q.target,null,q.ctx,true)+
      cardHtml(0,0,q.ctx,false,true);
  }

  stepResult.hidden=true;
  resultPrompt.textContent=`2. Quelle valeur correspond à ${fmt(q.target)} ${q.ctx.xUnit} ?`;

  answerInput.value='';
  answerInput.disabled=false;
  answerInput.className='answer-input';
  validateBtn.disabled=false;

  feedback.className='feedback';
  feedback.textContent='Observe les quantités connues et la quantité demandée avant de choisir.';
  nextBtn.hidden=true;

  strategyButtons.forEach(b=>{
    b.disabled=false;
    b.classList.remove('correct','wrong');
  });
}

function addScore(points){
  score=round2(score+points);
  scoreBox.textContent=`Score : ${fmt(score)} / ${TOTAL}`;
}

function chooseStrategy(strategy,button){
  if(strategyLocked)return;
  const q=questions[index];
  strategyLocked=true;
  strategyButtons.forEach(b=>b.disabled=true);

  const good=q.accepted.includes(strategy);

  const preferredLabel=strategyLabel(q.preferred);

  if(good){
    addScore(0.5);
    button.classList.add('correct');
    feedback.className='feedback success';

    if(strategy===q.preferred){
      feedback.textContent=`Oui, cette méthode fonctionne et c'est la plus pertinente ici. À toi maintenant de calculer la valeur manquante.`;
    }else{
      feedback.textContent=`Oui, cette méthode fonctionne. La méthode la plus pertinente ici est ${preferredLabel}. À toi maintenant de calculer la valeur manquante.`;
    }
  }else{
    button.classList.add('wrong');
    strategyButtons.forEach(b=>{
      if(q.accepted.includes(b.dataset.strategy))b.classList.add('correct');
    });
    feedback.className='feedback error';
    feedback.textContent=`Cette méthode ne convient pas ici. La méthode la plus pertinente est ${preferredLabel}. À toi maintenant de calculer la valeur manquante.`;
  }

  stepResult.hidden=false;
  setTimeout(()=>answerInput.focus(),50);
}

function validateResult(){
  if(resultLocked || stepResult.hidden)return;
  const q=questions[index];
  const value=parseNumber(answerInput.value);

  if(Number.isNaN(value)){
    feedback.className='feedback error';
    feedback.textContent='Entre un nombre. Tu peux utiliser une virgule ou un point pour les décimaux.';
    return;
  }

  resultAttempt++;

  if(nearlyEqual(value,q.answer)){
    resultLocked=true;
    addScore(resultAttempt===1?0.5:0.25);

    answerInput.disabled=true;
    answerInput.classList.remove('wrong');
    answerInput.classList.add('correct');
    validateBtn.disabled=true;

    feedback.className='feedback success';
    feedback.textContent=`Bravo ! ${q.calcText}.`;

    nextBtn.hidden=false;
    nextBtn.textContent=index===TOTAL-1?'Voir mon résultat':'Question suivante';
    return;
  }

  answerInput.classList.add('wrong');

  if(resultAttempt===1){
    feedback.className='feedback error';
    feedback.textContent='Pas encore. Reprends la méthode que tu viens d’identifier et applique-la aux valeurs correspondantes.';
    answerInput.select();
    return;
  }

  resultLocked=true;
  answerInput.disabled=true;
  validateBtn.disabled=true;
  answerInput.value=fmt(q.answer);
  answerInput.classList.remove('wrong');
  answerInput.classList.add('correct');

  feedback.className='feedback error';
  feedback.textContent=`La bonne réponse est ${fmt(q.answer)} ${q.ctx.yUnit}. ${q.calcText}.`;

  nextBtn.hidden=false;
  nextBtn.textContent=index===TOTAL-1?'Voir mon résultat':'Question suivante';
}

function next(){
  if(index<TOTAL-1){
    index++;render();
  }else showFinal();
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${fmt(score)} / ${TOTAL}`;

  if(score>=9){
    finalMessage.textContent='Excellent ! Tu sais choisir une méthode adaptée aux nombres proposés.';
  }else if(score>=7){
    finalMessage.textContent='Très bien ! Tu sais généralement repérer une méthode efficace dans une situation de proportionnalité.';
  }else if(score>=5){
    finalMessage.textContent='C’est en bonne voie. Avant de calculer, prends le temps d’observer les relations entre les quantités.';
  }else{
    finalMessage.textContent='Reprends les trois méthodes du cours et cherche d’abord celle qui exploite le mieux les nombres proposés.';
  }
}

function restart(){
  questions=generate();
  index=0;score=0;
  final.classList.remove('show');
  exercise.style.display='';
  render();
}

strategyButtons.forEach(b=>b.addEventListener('click',()=>chooseStrategy(b.dataset.strategy,b)));
validateBtn.addEventListener('click',validateResult);
answerInput.addEventListener('keydown',e=>{if(e.key==='Enter')validateResult()});
nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);

questions=generate();
render();
})();
</script>
</body>
</html>
