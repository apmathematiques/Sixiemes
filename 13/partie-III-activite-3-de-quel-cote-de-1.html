<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">

<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);
  border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;
  gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;
  text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:12px
}
.instruction{
  min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.25rem,2.35vw,1.6rem);font-weight:600;
  line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:205px;padding:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.fractions-row{
  display:flex;align-items:center;justify-content:center;gap:36px;flex-wrap:wrap
}
.fraction-button{
  min-width:180px;min-height:150px;padding:18px 24px;
  display:grid;place-items:center;
  color:var(--i);background:#fff;
  border:3px solid #c9ddeb;border-radius:18px;
  cursor:pointer;touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease,border-color .15s ease,background .15s ease,color .15s ease;
  box-shadow:0 8px 18px rgba(17,63,103,.07)
}
.fraction-button:hover:not(:disabled){
  border-color:var(--b);filter:brightness(1.01)
}
.fraction-button:active:not(:disabled){transform:scale(.98)}
.fraction-button.correct{
  color:#165e36;background:var(--gs);border-color:#79c798
}
.fraction-button.wrong{
  color:#8f2727;background:var(--rs);border-color:#df8585
}
.fraction-button:disabled{cursor:default}
.fraction{
  display:inline-grid;grid-template-rows:auto 4px auto;
  align-items:center;justify-items:center;min-width:116px;
  font-size:clamp(2.3rem,6vw,4rem);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums
}
.fraction-line{
  width:100%;min-width:105px;height:4px;background:currentColor;border-radius:99px
}
.fraction-value{
  min-width:98px;padding:5px 10px;text-align:center
}
.feedback{
  min-height:60px;padding:9px 14px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{
  color:#165e36;background:var(--gs);border:1px solid #a9ddbd
}
.feedback.error{
  color:#8f2727;background:var(--rs);border:1px solid #efbcbc
}
.controls{
  min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap
}
button.action{
  min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;
  border:0;border-radius:13px;touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease
}
button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid;animation:reveal 280ms ease both}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;
  border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
@keyframes reveal{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}
}
@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}
  .pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:44px;font-size:1.08rem}
  .question-zone{min-height:150px;padding:10px;gap:16px}
  .fractions-row{gap:12px}
  .fraction-button{min-width:125px;min-height:105px;padding:10px 14px}
  .fraction{min-width:78px;font-size:2.15rem}
  .fraction-line{min-width:72px}
  .fraction-value{min-width:70px;padding:3px 6px}
  .feedback{min-height:49px;padding:7px 10px;font-size:.86rem}
  .controls{min-height:43px}
  button.action{min-height:42px;height:42px}
}
</style>
</head>

<body>

<main class="app" id="app" aria-live="polite">

  <header class="top">
    <div class="track" aria-label="Progression"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">

    <p class="instruction">
      Clique sur la plus grande fraction.
    </p>

    <div class="question-zone">
      <div class="fractions-row" id="fractionsRow"></div>
    </div>

    <div class="feedback" id="feedback" role="status">
      Compare chaque fraction à 1.
    </div>

    <div class="controls">
      <button class="action secondary" type="button" id="next" hidden>
        Question suivante
      </button>
    </div>

  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon" aria-hidden="true">🎯</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" type="button" id="restart">
        Recommencer avec de nouvelles fractions
      </button>
    </div>
  </section>

</main>

<script>
(() => {
  'use strict';

  const TOTAL=10;
  const $=id=>document.getElementById(id);

  const counter=$('counter');
  const scoreBox=$('score');
  const bar=$('bar');
  const fractionsRow=$('fractionsRow');
  const feedback=$('feedback');
  const nextBtn=$('next');
  const exercise=$('exercise');
  const final=$('final');
  const finalScore=$('finalScore');
  const finalMessage=$('finalMessage');
  const restartBtn=$('restart');

  let questions=[];
  let index=0;
  let score=0;
  let locked=false;

  function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function shuffle(array){
    const copy=array.slice();
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function fractionHTML(n,d){
    return `
      <span class="fraction">
        <span class="fraction-value">${n}</span>
        <span class="fraction-line"></span>
        <span class="fraction-value">${d}</span>
      </span>
    `;
  }

  function makeBelowOne(close=false){

    const d=randInt(close ? 8 : 5,40);

    let gap;

    if(close){
      gap=randInt(1,2);
    }else{
      gap=randInt(1,Math.max(2,Math.min(10,d-1)));
    }

    const n=d-gap;

    return {n,d};
  }

  function makeAboveOne(close=false){

    const d=randInt(close ? 8 : 5,40);

    let gap;

    if(close){
      gap=randInt(1,2);
    }else{
      gap=randInt(1,10);
    }

    const n=d+gap;

    return {n,d};
  }

  function signature(q){
    return `${q.left.n}/${q.left.d}|${q.right.n}/${q.right.d}`;
  }

  function makeQuestion(close){

    let below=makeBelowOne(close);
    let above=makeAboveOne(close);

    while(below.d===above.d){
      above=makeAboveOne(close);
    }

    const greaterOnLeft=Math.random()<0.5;

    return greaterOnLeft
      ? {
          left:above,
          right:below,
          answer:'left'
        }
      : {
          left:below,
          right:above,
          answer:'right'
        };
  }

  function generateQuestions(){

    const result=[];
    const used=new Set();

    /*
      10 questions :
      - 5 avec numérateur et dénominateur très proches
      - 5 plus variées

      Dans tous les cas :
      - dénominateurs différents
      - une fraction < 1
      - une fraction > 1
      - position de la plus grande aléatoire
    */
    const modes=shuffle([
      true,true,true,true,true,
      false,false,false,false,false
    ]);

    for(const close of modes){

      for(let tries=0;tries<500;tries++){

        const q=makeQuestion(close);

        if(!used.has(signature(q))){
          used.add(signature(q));
          result.push(q);
          break;
        }
      }
    }

    return result;
  }

  function renderQuestion(){

    const q=questions[index];

    locked=false;

    counter.textContent=`Question ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    bar.style.width=`${((index+1)/TOTAL)*100}%`;

    fractionsRow.innerHTML=`
      <button class="fraction-button" type="button" data-side="left" aria-label="Fraction de gauche">
        ${fractionHTML(q.left.n,q.left.d)}
      </button>

      <button class="fraction-button" type="button" data-side="right" aria-label="Fraction de droite">
        ${fractionHTML(q.right.n,q.right.d)}
      </button>
    `;

    feedback.className='feedback';
    feedback.textContent='Compare chaque fraction à 1.';

    nextBtn.hidden=true;

    document.querySelectorAll('.fraction-button').forEach(button=>{
      button.addEventListener('click',()=>{
        chooseFraction(button.dataset.side,button);
      });
    });
  }

  function relationToOne(frac){
    return frac.n<frac.d ? '<' : '>';
  }

  function correctionText(q){

    const leftRelation=relationToOne(q.left);
    const rightRelation=relationToOne(q.right);

    if(q.answer==='left'){
      return `${q.left.n}/${q.left.d} ${leftRelation} 1 et ${q.right.n}/${q.right.d} ${rightRelation} 1, donc ${q.left.n}/${q.left.d} est la plus grande.`;
    }

    return `${q.left.n}/${q.left.d} ${leftRelation} 1 et ${q.right.n}/${q.right.d} ${rightRelation} 1, donc ${q.right.n}/${q.right.d} est la plus grande.`;
  }

  function chooseFraction(side,button){

    if(locked) return;

    locked=true;

    const q=questions[index];
    const buttons=[...document.querySelectorAll('.fraction-button')];

    buttons.forEach(btn=>btn.disabled=true);

    const correctButton=buttons.find(
      btn=>btn.dataset.side===q.answer
    );

    correctButton.classList.add('correct');

    if(side===q.answer){

      score++;
      scoreBox.textContent=`Score : ${score} / ${TOTAL}`;

      feedback.className='feedback success';
      feedback.textContent=`Bravo ! ${correctionText(q)}`;

    }else{

      button.classList.add('wrong');

      feedback.className='feedback error';
      feedback.textContent=`Ce n'est pas la plus grande. ${correctionText(q)}`;
    }

    nextBtn.hidden=false;
    nextBtn.textContent=
      index===TOTAL-1 ? 'Voir mon résultat' : 'Question suivante';
  }

  function nextQuestion(){

    if(index<TOTAL-1){
      index++;
      renderQuestion();
    }else{
      showFinal();
    }
  }

  function showFinal(){

    exercise.style.display='none';
    final.classList.add('show');

    finalScore.textContent=`Score : ${score} / ${TOTAL}`;

    if(score===10){

      finalMessage.textContent='Excellent !';

    }else if(score>=8){

      finalMessage.textContent='Très bien !';

    }else if(score>=6){

      finalMessage.textContent='C’est bien. Encore un peu d’entraînement.';

    }else{

      finalMessage.textContent='Reprends tranquillement la comparaison à 1.';
    }
  }

  function restart(){

    questions=generateQuestions();
    index=0;
    score=0;
    locked=false;

    final.classList.remove('show');
    exercise.style.display='';

    renderQuestion();
  }

  nextBtn.addEventListener('click',nextQuestion);
  restartBtn.addEventListener('click',restart);

  questions=generateQuestions();
  renderQuestion();

})();
</script>

</body>
</html>
