<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{--b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;--g:#20864b;--gs:#e9f7ef;--r:#c63d3d;--rs:#fff0f0;--i:#17212b;--m:#5f6d79}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--i);font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;padding:12px}
.app{width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)}
.top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:16px 24px 10px}.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}.bar{width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);border-radius:inherit;transition:width 260ms ease}.pill{min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px}
.main{flex:1;min-height:0;padding:5px 18px 18px;display:flex;flex-direction:column;gap:12px}.instruction{min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.22rem,2.25vw,1.55rem);font-weight:600;line-height:1.25;text-align:center}.question-zone{flex:1;min-height:230px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,#fff,#f8fbfe);border:1px solid #dce9f3;border-radius:18px}
.fractions-row{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;font-size:clamp(1.5rem,3vw,2rem);font-weight:700}.fraction{display:inline-grid;grid-template-rows:auto 4px auto;align-items:center;justify-items:center;min-width:112px;vertical-align:middle;font-size:clamp(2.15rem,5.5vw,3.8rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.fraction-line{width:100%;min-width:100px;height:4px;background:currentColor;border-radius:99px}.fraction-value{min-width:92px;padding:5px 10px;text-align:center}
.strategy-buttons{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.strategy-button{min-height:76px;padding:10px 14px;color:var(--bd);background:var(--bs);border:3px solid #b9d4e8;border-radius:15px;font:800 1rem/1.25 Arial,Helvetica,sans-serif;cursor:pointer;touch-action:manipulation}.strategy-button.correct{color:#165e36;background:var(--gs);border-color:#79c798}.strategy-button.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}.strategy-button:disabled{cursor:default}
.feedback{min-height:66px;padding:9px 14px;display:flex;align-items:center;justify-content:center;color:var(--m);font-weight:650;line-height:1.35;text-align:center;background:#f4f7fb;border-radius:14px}.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}.controls{min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}button.action{min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;border:0;border-radius:13px}.primary{color:#fff;background:var(--b)}.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}.final.show{display:grid}.final-card{width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)}.final-icon{margin-bottom:5px;font-size:3rem}.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
@media(max-width:700px),(max-height:620px){body{padding:6px}.app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}.top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}.track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}.main{padding:2px 10px 10px;gap:7px}.instruction{min-height:42px;font-size:1.02rem}.question-zone{min-height:160px;padding:9px;gap:12px}.fractions-row{gap:14px}.fraction{min-width:76px;font-size:2rem}.fraction-line{min-width:70px;height:3px}.fraction-value{min-width:66px;padding:3px 5px}.strategy-buttons{grid-template-columns:1fr;gap:7px}.strategy-button{min-height:45px;padding:7px 10px;font-size:.9rem}.feedback{min-height:52px;padding:7px 10px;font-size:.83rem}.controls{min-height:42px}button.action{min-height:40px;height:40px;padding:0 14px}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite">
<header class="top"><div class="track"><div class="bar" id="bar"></div></div><div class="pill" id="counter">Question 1 / 10</div><div class="pill" id="score">Score : 0 / 10</div></header>
<section class="main" id="exercise">
<p class="instruction">Quelle méthode te permet de comparer ces fractions ?</p>
<div class="question-zone"><div class="fractions-row" id="fractionsRow"></div><div class="strategy-buttons"><button class="strategy-button" data-strategy="same">Comparer les numérateurs</button><button class="strategy-button" data-strategy="one">Comparer à 1</button><button class="strategy-button" data-strategy="common">Mettre au même dénominateur</button></div></div>
<div class="feedback" id="feedback">Observe les dénominateurs et la position des fractions par rapport à 1.</div>
<div class="controls"><button class="action secondary" id="next" hidden>Question suivante</button></div>
</section>
<section class="final" id="final"><div class="final-card"><div class="final-icon">🎯</div><h2>Activité terminée !</h2><p class="final-score" id="finalScore"></p><p class="final-message" id="finalMessage"></p><button class="action primary" id="restart">Recommencer avec de nouvelles fractions</button></div></section>
</main>
<script>
(()=>{'use strict';const TOTAL=10,$=id=>document.getElementById(id),counter=$('counter'),scoreBox=$('score'),bar=$('bar'),fractionsRow=$('fractionsRow'),feedback=$('feedback'),nextBtn=$('next'),exercise=$('exercise'),final=$('final'),finalScore=$('finalScore'),finalMessage=$('finalMessage'),restartBtn=$('restart'),strategyButtons=[...document.querySelectorAll('.strategy-button')];let questions=[],index=0,score=0,locked=false;
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}function shuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}function frac(n,d){return `<span class="fraction"><span class="fraction-value">${n}</span><span class="fraction-line"></span><span class="fraction-value">${d}</span></span>`}function sig(q){return `${q.left.n}/${q.left.d}|${q.right.n}/${q.right.d}|${q.strategy}`}
function makeSame(){const d=randInt(7,50),below=Math.random()<.7;let a,b;if(below){a=randInt(1,d-1);b=randInt(1,d-1);while(a===b)b=randInt(1,d-1)}else{a=randInt(d+1,d+20);b=randInt(d+1,d+20);while(a===b)b=randInt(d+1,d+20)}return{left:{n:a,d},right:{n:b,d},strategy:'same'}}
function makeOne(){let d1=randInt(5,40),d2=randInt(5,40);while(d1===d2)d2=randInt(5,40);const close=Math.random()<.6,nBelow=close?d1-randInt(1,2):randInt(1,d1-1),nAbove=close?d2+randInt(1,2):d2+randInt(1,10),leftBelow=Math.random()<.5;return leftBelow?{left:{n:nBelow,d:d1},right:{n:nAbove,d:d2},strategy:'one'}:{left:{n:nAbove,d:d2},right:{n:nBelow,d:d1},strategy:'one'}}
function makeCommon(){const k=randInt(2,5),smallD=randInt(2,Math.min(18,Math.floor(60/k))),largeD=smallD*k,below=Math.random()<.75;let nSmall,nLarge;if(below){nSmall=randInt(1,smallD-1);nLarge=randInt(1,largeD-1);while(nLarge===nSmall*k)nLarge=randInt(1,largeD-1)}else{nSmall=randInt(smallD+1,smallD+10);nLarge=randInt(largeD+1,largeD+16);while(nLarge===nSmall*k)nLarge=randInt(largeD+1,largeD+16)}const smallOnLeft=Math.random()<.5;return smallOnLeft?{left:{n:nSmall,d:smallD},right:{n:nLarge,d:largeD},strategy:'common'}:{left:{n:nLarge,d:largeD},right:{n:nSmall,d:smallD},strategy:'common'}}
function generate(){const result=[],used=new Set(),modes=shuffle(['same','same','same','one','one','one','common','common','common','common']);for(const mode of modes){for(let tries=0;tries<500;tries++){const q=mode==='same'?makeSame():mode==='one'?makeOne():makeCommon();if(!used.has(sig(q))){used.add(sig(q));result.push(q);break}}}return result}
function render(){const q=questions[index];locked=false;counter.textContent=`Question ${index+1} / ${TOTAL}`;scoreBox.textContent=`Score : ${score} / ${TOTAL}`;bar.style.width=`${((index+1)/TOTAL)*100}%`;fractionsRow.innerHTML=`${frac(q.left.n,q.left.d)}<span>et</span>${frac(q.right.n,q.right.d)}`;feedback.className='feedback';feedback.textContent='Observe les dénominateurs et la position des fractions par rapport à 1.';nextBtn.hidden=true;strategyButtons.forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong')})}
function explanation(q){if(q.strategy==='same')return 'Les deux fractions ont le même dénominateur et sont du même côté de 1 : il suffit de comparer les numérateurs.';if(q.strategy==='one'){const l=q.left.n<q.left.d?'inférieure à 1':'supérieure à 1',r=q.right.n<q.right.d?'inférieure à 1':'supérieure à 1';return `La première fraction est ${l} et la seconde est ${r} : la comparaison à 1 permet de conclure directement.`}return 'Les dénominateurs sont différents et les deux fractions sont du même côté de 1 : on les met au même dénominateur pour les comparer.'}
function choose(strategy,button){if(locked)return;locked=true;const q=questions[index];strategyButtons.forEach(b=>b.disabled=true);const good=strategyButtons.find(b=>b.dataset.strategy===q.strategy);good.classList.add('correct');if(strategy===q.strategy){score++;scoreBox.textContent=`Score : ${score} / ${TOTAL}`;feedback.className='feedback success';feedback.textContent=`Bravo ! ${explanation(q)}`}else{button.classList.add('wrong');feedback.className='feedback error';feedback.textContent=`Ce n'est pas la méthode attendue ici. ${explanation(q)}`}nextBtn.hidden=false;nextBtn.textContent=index===TOTAL-1?'Voir mon résultat':'Question suivante'}
function next(){if(index<TOTAL-1){index++;render()}else showFinal()}function showFinal(){exercise.style.display='none';final.classList.add('show');finalScore.textContent=`Score : ${score} / ${TOTAL}`;finalMessage.textContent=score===10?'Excellent !':score>=8?'Très bien !':score>=6?'C’est bien. Continue à observer la situation avant de choisir une méthode.':'Reprends tranquillement les trois cas du cours.'}function restart(){questions=generate();index=0;score=0;locked=false;final.classList.remove('show');exercise.style.display='';render()}
strategyButtons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.strategy,b)));nextBtn.addEventListener('click',next);restartBtn.addEventListener('click',restart);questions=generate();render()})();
</script>
</body>
</html>
