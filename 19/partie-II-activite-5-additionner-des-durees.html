<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Additionner des durées</title>
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:118px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:56px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.42rem,2.7vw,1.85rem);
  font-weight:700;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:280px;padding:26px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;gap:20px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.level{
  color:var(--m);font-size:clamp(1.12rem,2.1vw,1.38rem);
  font-weight:700;line-height:1.3;text-align:center
}
.calculation{
  width:100%;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;
  gap:.28em;
  font-size:clamp(2rem,4.8vw,3.35rem);
  font-weight:800;line-height:1.2;text-align:center
}
.duration,.equals,.plus{white-space:nowrap}
.answer-line{
  width:100%;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;
  gap:.24em;
  font-size:clamp(1.9rem,4.6vw,3.15rem);
  font-weight:800;line-height:1.15
}
.answer-group{
  display:inline-flex;align-items:center;justify-content:center;
  gap:.15em;white-space:nowrap
}
.answer{
  width:clamp(92px,12vw,130px);height:1.42em;
  padding:0 .14em;border:3px solid #b9d4e8;border-radius:14px;
  color:var(--bd);background:#fff;text-align:center;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(1.65rem,3.5vw,2.35rem);
  font-weight:800;line-height:1;
  outline:none
}
.answer:focus{border-color:#74a9cf;box-shadow:0 0 0 4px rgba(23,105,170,.08)}
.answer.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.answer.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.unit{white-space:nowrap}
.feedback{
  min-height:76px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(1rem,1.9vw,1.15rem);
  line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px;
  visibility:hidden
}
.feedback.show{visibility:visible}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:42px;font-size:1.13rem}
  .question-zone{min-height:200px;padding:12px 8px;gap:10px}
  .level{font-size:.98rem}
  .calculation{font-size:1.62rem}
  .answer-line{font-size:1.55rem}
  .answer{width:72px;font-size:1.35rem}
  .feedback{min-height:58px;padding:8px 10px;font-size:.86rem}
  .controls{min-height:40px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Effectue l’addition et donne une durée correctement écrite.</p>

    <div class="question-zone">
      <div class="level" id="level"></div>
      <div class="calculation" id="calculation"></div>
      <div class="answer-line" id="answerLine"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="action primary" id="validate">Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouveaux calculs</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=10;
const $=id=>document.getElementById(id);

const levelBox=$('level');
const calculation=$('calculation');
const answerLine=$('answerLine');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let resolved=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[randInt(0,arr.length-1)];
}

function formatDuration(d){
  const parts=[];
  if(d.h!==undefined) parts.push(`${d.h} h`);
  if(d.m!==undefined) parts.push(`${d.m} min`);
  if(d.s!==undefined) parts.push(`${d.s} s`);
  return parts.join(' ');
}

function normalizeHMS(h,m,s){
  let total=h*3600+m*60+s;
  return{
    h:Math.floor(total/3600),
    m:Math.floor((total%3600)/60),
    s:total%60
  };
}

function q1(){
  const a={h:randInt(1,4),m:randInt(5,24)};
  const b={h:randInt(1,4),m:randInt(5,24)};
  if(a.m+b.m>=60) b.m=randInt(5,59-a.m);
  const r={h:a.h+b.h,m:a.m+b.m};
  return makeQuestion(1,'Heures et minutes, sans échange',a,b,r,['h','m'],
    `${a.m} + ${b.m} = ${r.m} min : aucun échange n’est nécessaire.`);
}

function q2(){
  const a={h:randInt(3,9),m:randInt(20,39)};
  const maxB=Math.max(10,58-a.m);
  const b={h:randInt(2,8),m:randInt(10,maxB)};
  const r={h:a.h+b.h,m:a.m+b.m};
  return makeQuestion(2,'Heures et minutes, sans échange',a,b,r,['h','m'],
    `${a.m} + ${b.m} = ${r.m} min : on garde ${r.m} min.`);
}

function q3(){
  const a={h:randInt(1,6),m:randInt(32,52)};
  const b={h:randInt(1,6),m:randInt(Math.max(12,60-a.m),48)};
  const sumM=a.m+b.m;
  const r={h:a.h+b.h+1,m:sumM-60};
  return makeQuestion(3,'Heures et minutes, avec échange',a,b,r,['h','m'],
    `${a.m} + ${b.m} = ${sumM} min, soit 1 h ${sumM-60} min.`);
}

function q4(){
  const a={h:randInt(4,12),m:randInt(35,58)};
  const b={h:randInt(3,11),m:randInt(Math.max(5,60-a.m),55)};
  const sumM=a.m+b.m;
  const r={h:a.h+b.h+1,m:sumM-60};
  return makeQuestion(4,'Heures et minutes, avec échange',a,b,r,['h','m'],
    `${a.m} + ${b.m} = ${sumM} min, soit 1 h ${sumM-60} min.`);
}

function q5(){
  const a={m:randInt(5,35),s:randInt(5,24)};
  const b={m:randInt(5,35),s:randInt(5,Math.max(5,58-a.s))};
  const r={m:a.m+b.m,s:a.s+b.s};
  return makeQuestion(5,'Minutes et secondes, sans échange',a,b,r,['m','s'],
    `${a.s} + ${b.s} = ${r.s} s : aucun échange n’est nécessaire.`);
}

function q6(){
  const a={m:randInt(5,40),s:randInt(32,55)};
  const b={m:randInt(5,40),s:randInt(Math.max(8,60-a.s),55)};
  const sumS=a.s+b.s;
  const r={m:a.m+b.m+1,s:sumS-60};
  return makeQuestion(6,'Minutes et secondes, avec échange',a,b,r,['m','s'],
    `${a.s} + ${b.s} = ${sumS} s, soit 1 min ${sumS-60} s.`);
}

function q7(){
  let a,b,sumS,sumM;
  do{
    a={h:randInt(1,5),m:randInt(8,28),s:randInt(32,55)};
    b={h:randInt(1,5),m:randInt(8,28),s:randInt(Math.max(8,60-a.s),55)};
    sumS=a.s+b.s;
    sumM=a.m+b.m+1;
  }while(sumM>=60);
  const r={h:a.h+b.h,m:sumM,s:sumS-60};
  return makeQuestion(7,'Heures, minutes et secondes : échange des secondes',a,b,r,['h','m','s'],
    `${a.s} + ${b.s} = ${sumS} s, soit 1 min ${sumS-60} s. Les minutes deviennent ${sumM}.`);
}

function q8(){
  let a,b,sumS,sumM;
  do{
    a={h:randInt(1,5),m:randInt(32,55),s:randInt(5,25)};
    b={h:randInt(1,5),m:randInt(Math.max(8,60-a.m),52),s:randInt(5,25)};
    sumS=a.s+b.s;
    sumM=a.m+b.m;
  }while(sumS>=60 || sumM<60);
  const r={h:a.h+b.h+1,m:sumM-60,s:sumS};
  return makeQuestion(8,'Heures, minutes et secondes : échange des minutes',a,b,r,['h','m','s'],
    `${a.m} + ${b.m} = ${sumM} min, soit 1 h ${sumM-60} min.`);
}

function q9(){
  let a,b,sumS,sumM;
  do{
    a={h:randInt(1,6),m:randInt(30,55),s:randInt(32,55)};
    b={h:randInt(1,6),m:randInt(20,52),s:randInt(Math.max(8,60-a.s),55)};
    sumS=a.s+b.s;
    sumM=a.m+b.m+1;
  }while(sumM<60);
  const r={h:a.h+b.h+1,m:sumM-60,s:sumS-60};
  return makeQuestion(9,'Deux échanges : secondes puis minutes',a,b,r,['h','m','s'],
    `${a.s} + ${b.s} = ${sumS} s, soit 1 min ${sumS-60} s. Puis ${a.m} + ${b.m} + 1 = ${sumM} min, soit 1 h ${sumM-60} min.`);
}

function q10(){
  let a,b,sumS,sumM;
  do{
    a={h:randInt(5,15),m:randInt(38,58),s:randInt(38,58)};
    b={h:randInt(4,14),m:randInt(28,57),s:randInt(Math.max(5,60-a.s),58)};
    sumS=a.s+b.s;
    sumM=a.m+b.m+1;
  }while(sumM<60);
  const r={h:a.h+b.h+1,m:sumM-60,s:sumS-60};
  return makeQuestion(10,'Bilan : deux échanges',a,b,r,['h','m','s'],
    `${a.s} + ${b.s} = ${sumS} s, soit 1 min ${sumS-60} s. Puis ${a.m} + ${b.m} + 1 = ${sumM} min, soit 1 h ${sumM-60} min.`);
}

function makeQuestion(n,label,a,b,result,units,explanation){
  return{n,label,a,b,result,units,explanation};
}

function buildQuestions(){
  // L’ordre est volontairement fixe : la difficulté augmente.
  // Seuls les nombres changent à chaque nouvelle partie.
  return [q1(),q2(),q3(),q4(),q5(),q6(),q7(),q8(),q9(),q10()];
}

function setFeedback(text,type){
  feedback.textContent=text;
  feedback.className=`feedback show ${type}`;
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function renderQuestion(){
  const q=questions[index];
  resolved=false;

  levelBox.textContent=q.label;

  calculation.innerHTML=`
    <span class="duration">${formatDuration(q.a)}</span>
    <span class="plus">+</span>
    <span class="duration">${formatDuration(q.b)}</span>
  `;

  answerLine.innerHTML=`
    <span class="equals">=</span>
    ${q.units.map((u,i)=>`
      <span class="answer-group">
        <input class="answer" id="answer${i}" type="text" inputmode="numeric"
          autocomplete="off" aria-label="${u}">
        <span class="unit">${u}</span>
      </span>
    `).join('')}
  `;

  feedback.textContent='';
  feedback.className='feedback';
  validateBtn.hidden=false;
  nextBtn.hidden=true;
  updateTop();

  const inputs=getInputs();
  setTimeout(()=>inputs[0]?.focus(),0);

  inputs.forEach((input,i)=>{
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(i<inputs.length-1 && input.value.trim()!==''){
          inputs[i+1].focus();
        }else{
          validateAnswer();
        }
      }
    });
  });
}

function getInputs(){
  return [...answerLine.querySelectorAll('.answer')];
}

function readNumber(input){
  const raw=input.value.trim().replace(/\s+/g,'');
  if(raw==='') return null;
  const value=Number(raw);
  return Number.isFinite(value) ? value : null;
}

function expectedFor(q,unit){
  return q.result[unit];
}

function validateAnswer(){
  if(resolved) return;

  const q=questions[index];
  const inputs=getInputs();
  const values=inputs.map(readNumber);

  if(values.some(v=>v===null)){
    setFeedback('Complète toutes les cases avant de valider.','error');
    return;
  }

  resolved=true;
  const allCorrect=values.every((v,i)=>v===expectedFor(q,q.units[i]));

  inputs.forEach((input,i)=>{
    input.disabled=true;
    input.classList.add(values[i]===expectedFor(q,q.units[i])?'correct':'wrong');
  });

  validateBtn.hidden=true;
  nextBtn.hidden=false;

  const resultText=q.units.map(u=>`${q.result[u]} ${u}`).join(' ');

  if(allCorrect){
    score++;
    setFeedback(`Bravo ! ${formatDuration(q.a)} + ${formatDuration(q.b)} = ${resultText}.`,'success');
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  }else{
    setFeedback(`La bonne réponse est ${resultText}. ${q.explanation}`,'error');
  }
}

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  bar.style.width='100%';
  counter.textContent=`Question ${TOTAL} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;

  if(score===TOTAL){
    finalMessage.textContent='Excellent ! Tu maîtrises les additions de durées, y compris avec plusieurs échanges.';
  }else if(score>=8){
    finalMessage.textContent='Très bien ! Les additions de durées sont bien maîtrisées.';
  }else if(score>=6){
    finalMessage.textContent='Bien ! Rejoue pour consolider les échanges entre secondes, minutes et heures.';
  }else{
    finalMessage.textContent='Rejoue avec de nouveaux nombres pour t’entraîner progressivement.';
  }
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  resolved=false;

  final.classList.remove('show');
  exercise.style.display='';
  renderQuestion();
}

validateBtn.addEventListener('click',validateAnswer);
nextBtn.addEventListener('click',nextQuestion);
restartBtn.addEventListener('click',restart);

questions=buildQuestions();
renderQuestion();

})();
</script>
</body>
</html>
