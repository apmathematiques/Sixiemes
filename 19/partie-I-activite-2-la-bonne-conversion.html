<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>La bonne conversion</title>
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:118px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:56px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.42rem,2.7vw,1.85rem);
  font-weight:700;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:280px;padding:28px 28px 32px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;gap:22px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.prompt{
  color:var(--m);font-size:clamp(1.25rem,2.5vw,1.55rem);
  font-weight:700;line-height:1.3;text-align:center
}
.conversion{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:.32em;font-size:clamp(2.65rem,6.2vw,4.25rem);
  font-weight:800;line-height:1.15;text-align:center
}
.answer-wrap{
  display:inline-flex;align-items:center;justify-content:center;gap:.25em
}
.answer{
  width:clamp(155px,22vw,230px);height:1.42em;
  padding:0 .25em;border:3px solid #b9d4e8;border-radius:14px;
  color:var(--bd);background:#fff;text-align:center;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(1.8rem,4vw,2.7rem);
  font-weight:800;line-height:1;
  outline:none
}
.answer:focus{border-color:#74a9cf;box-shadow:0 0 0 4px rgba(23,105,170,.08)}
.answer.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.answer.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.unit{white-space:nowrap}
.feedback{
  min-height:72px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.98rem,1.8vw,1.13rem);
  line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px;
  visibility:hidden
}
.feedback.show{visibility:visible}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
button.action:disabled{opacity:.55;cursor:default}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:42px;font-size:1.13rem}
  .question-zone{min-height:200px;padding:14px 10px;gap:12px}
  .prompt{font-size:1.05rem}
  .conversion{font-size:2.15rem}
  .answer{width:130px;font-size:1.7rem}
  .feedback{min-height:58px;padding:8px 10px;font-size:.86rem}
  .controls{min-height:40px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Convertis la durée dans l’unité demandée.</p>

    <div class="question-zone">
      <div class="prompt" id="prompt"></div>
      <div class="conversion" id="conversion"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="action primary" id="validate">Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouvelles conversions</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=10;
const $=id=>document.getElementById(id);

const promptBox=$('prompt');
const conversion=$('conversion');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let resolved=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[randInt(0,arr.length-1)];
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function qHoursToMinutes(){
  const h=randInt(2,9);
  return{
    text:`${h} h`,
    target:'min',
    answer:h*60,
    explanation:`${h} h = ${h} × 60 min = ${h*60} min.`
  };
}

function qMinutesToSeconds(){
  const m=randInt(2,20);
  return{
    text:`${m} min`,
    target:'s',
    answer:m*60,
    explanation:`${m} min = ${m} × 60 s = ${m*60} s.`
  };
}

function qHoursMinutesToMinutes(){
  const h=randInt(1,8);
  const m=pick([5,8,12,15,17,20,23,25,27,30,32,35,38,40,42,45,48,50,53,55]);
  const ans=h*60+m;
  return{
    text:`${h} h ${m} min`,
    target:'min',
    answer:ans,
    explanation:`${h} h = ${h*60} min, donc ${h} h ${m} min = ${h*60} + ${m} = ${ans} min.`
  };
}

function qMinutesSecondsToSeconds(){
  const m=randInt(1,18);
  const s=pick([5,8,12,15,18,20,24,27,30,32,35,38,40,42,45,48,50,55]);
  const ans=m*60+s;
  return{
    text:`${m} min ${s} s`,
    target:'s',
    answer:ans,
    explanation:`${m} min = ${m*60} s, donc ${m} min ${s} s = ${m*60} + ${s} = ${ans} s.`
  };
}

function qDaysToHours(){
  const d=randInt(2,6);
  return{
    text:`${d} j`,
    target:'h',
    answer:d*24,
    explanation:`${d} j = ${d} × 24 h = ${d*24} h.`
  };
}

function qDaysHoursToHours(){
  const d=randInt(1,4);
  const h=randInt(1,23);
  const ans=d*24+h;
  return{
    text:`${d} j ${h} h`,
    target:'h',
    answer:ans,
    explanation:`${d} j = ${d*24} h, donc ${d} j ${h} h = ${d*24} + ${h} = ${ans} h.`
  };
}

function buildQuestions(){
  return shuffle([
    qHoursToMinutes(),
    qHoursToMinutes(),
    qMinutesToSeconds(),
    qMinutesToSeconds(),
    qHoursMinutesToMinutes(),
    qHoursMinutesToMinutes(),
    qHoursMinutesToMinutes(),
    qMinutesSecondsToSeconds(),
    qDaysToHours(),
    qDaysHoursToHours()
  ]);
}

function setFeedback(text,type){
  feedback.textContent=text;
  feedback.className=`feedback show ${type}`;
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function renderQuestion(){
  const q=questions[index];
  resolved=false;

  promptBox.textContent=`Écris seulement le nombre manquant.`;
  conversion.innerHTML=`
    <span>${q.text}</span>
    <span>=</span>
    <span class="answer-wrap">
      <input class="answer" id="answer" type="text" inputmode="numeric"
        autocomplete="off" aria-label="Réponse">
      <span class="unit">${q.target}</span>
    </span>
  `;

  feedback.textContent='';
  feedback.className='feedback';
  validateBtn.hidden=false;
  validateBtn.disabled=false;
  nextBtn.hidden=true;
  updateTop();

  const input=$('answer');
  setTimeout(()=>input.focus(),0);
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter') validateAnswer();
  });
}

function normalizeAnswer(value){
  return value.trim().replace(/\s+/g,'');
}

function validateAnswer(){
  if(resolved) return;

  const q=questions[index];
  const input=$('answer');
  const raw=normalizeAnswer(input.value);

  if(raw===''){
    setFeedback('Écris une réponse avant de valider.','error');
    return;
  }

  const value=Number(raw.replace(',','.'));
  resolved=true;
  input.disabled=true;
  validateBtn.hidden=true;
  nextBtn.hidden=false;

  if(Number.isFinite(value) && value===q.answer){
    score++;
    input.classList.add('correct');
    setFeedback(`Bravo ! ${q.text} = ${q.answer} ${q.target}.`,'success');
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  }else{
    input.classList.add('wrong');
    setFeedback(`La bonne réponse est ${q.answer} ${q.target}. ${q.explanation}`,'error');
  }
}

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  bar.style.width='100%';
  counter.textContent=`Question ${TOTAL} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;

  if(score===TOTAL){
    finalMessage.textContent='Excellent ! Tu maîtrises les conversions vers une unité plus petite.';
  }else if(score>=8){
    finalMessage.textContent='Très bien ! Les conversions sont bien maîtrisées.';
  }else if(score>=6){
    finalMessage.textContent='Bien ! Rejoue pour consolider les conversions.';
  }else{
    finalMessage.textContent='Rejoue avec de nouvelles durées pour t’entraîner à convertir.';
  }
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  resolved=false;

  final.classList.remove('show');
  exercise.style.display='';
  renderQuestion();
}

validateBtn.addEventListener('click',validateAnswer);
nextBtn.addEventListener('click',nextQuestion);
restartBtn.addEventListener('click',restart);

questions=buildQuestions();
renderQuestion();

})();
</script>
</body>
</html>
