<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;
  --g:#20864b;
  --gs:#e9f7ef;
  --r:#c63d3d;
  --rs:#fff0f0;
  --i:#17212b;
  --m:#5f6d79;
}

*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:12px;
}

.app{
  width:min(100%,980px);
  aspect-ratio:16/9;
  min-height:480px;
  max-height:calc(100vh - 24px);
  overflow:hidden;
  display:flex;
  flex-direction:column;

  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

/* ---------- Haut ---------- */

.top{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:16px 24px 10px;
}

.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.bar{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease;
}

.pill{
  min-width:116px;
  padding:9px 14px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px;
}

/* ---------- Activité ---------- */

.main{
  flex:1;
  min-height:0;
  padding:5px 18px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.instruction{
  min-height:54px;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(1.25rem,2.35vw,1.6rem);
  font-weight:600;
  line-height:1.25;
  text-align:center;
}

.question-zone{
  flex:1;
  min-height:200px;
  padding:22px;

  display:grid;
  place-items:center;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;
  border-radius:18px;
}

.equality{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:26px;

  font-size:clamp(2.2rem,6vw,4.4rem);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.division{
  display:flex;
  align-items:center;
  gap:14px;
}

.equals{
  color:var(--i);
}

/* ---------- Fraction ---------- */

.fraction{
  display:inline-grid;
  grid-template-rows:auto 3px auto;
  align-items:center;
  justify-items:center;
  min-width:90px;
  vertical-align:middle;
}

.fraction-line{
  width:100%;
  min-width:82px;
  height:3px;
  background:currentColor;
  border-radius:99px;
}

.fraction-value{
  min-width:74px;
  padding:3px 8px;
  text-align:center;
}

/* ---------- Champs ---------- */

.answer-input{
  width:92px;
  height:68px;
  padding:4px 8px;

  color:var(--bd);
  font:700 2rem Arial,Helvetica,sans-serif;
  text-align:center;

  background:#fff;
  border:3px solid #b9d4e8;
  border-radius:14px;
  outline:none;

  transition:
    border-color .15s ease,
    background .15s ease,
    color .15s ease;
}

.answer-input:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.12);
}

.answer-input.correct{
  color:#165e36;
  background:var(--gs);
  border-color:#79c798;
}

.answer-input.wrong{
  color:#8f2727;
  background:var(--rs);
  border-color:#df8585;
}

.fraction .answer-input{
  width:96px;
  height:58px;
}

/* ---------- Feedback ---------- */

.feedback{
  min-height:58px;
  padding:9px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--m);
  font-weight:650;
  line-height:1.4;
  text-align:center;

  background:#f4f7fb;
  border-radius:14px;
}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid #a9ddbd;
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid #efbcbc;
}

.feedback .mini-fraction{
  display:inline-grid;
  grid-template-rows:auto 1.5px auto;
  justify-items:center;
  align-items:center;
  min-width:25px;
  margin:0 5px;
  vertical-align:middle;
  line-height:1;
}

.feedback .mini-line{
  width:100%;
  height:1.5px;
  background:currentColor;
}

.feedback .mini-value{
  padding:1px 3px;
}

/* ---------- Boutons ---------- */

.controls{
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button.action{
  min-height:46px;
  padding:0 20px;

  font-size:1rem;
  font-weight:800;

  cursor:pointer;
  border:0;
  border-radius:13px;
  touch-action:manipulation;

  transition:
    transform 120ms ease,
    filter 120ms ease;
}

button.action:hover:not(:disabled){
  filter:brightness(1.03);
}

button.action:active:not(:disabled){
  transform:scale(.98);
}

button.action:disabled{
  opacity:.48;
  cursor:default;
}

.primary{
  color:#fff;
  background:var(--b);
}

.secondary{
  color:var(--bd);
  background:var(--bs);
}

/* ---------- Fin ---------- */

.final{
  flex:1;
  padding:22px;
  display:none;
  place-items:center;
  text-align:center;
}

.final.show{
  display:grid;
  animation:reveal 280ms ease both;
}

.final-card{
  width:min(650px,100%);
  padding:28px;

  background:#fff;
  border:1px solid #dce9f3;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1);
}

.final-icon{
  margin-bottom:5px;
  font-size:3rem;
}

.final h2{
  margin:0 0 8px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.9rem);
}

.final-score{
  margin:8px 0;
  font-size:1.25rem;
  font-weight:800;
}

.final-message{
  margin:8px 0 20px;
  color:var(--m);
  font-size:1.05rem;
  line-height:1.45;
}

@keyframes reveal{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
  }
}

@media(max-width:700px),(max-height:620px){

  body{
    padding:6px;
  }

  .app{
    min-height:0;
    max-height:calc(100vh - 12px);
    border-radius:16px;
  }

  .top{
    grid-template-columns:1fr auto;
    padding:10px 14px 6px;
    gap:8px;
  }

  .track{
    grid-column:1/-1;
  }

  .pill{
    min-width:0;
    padding:7px 10px;
  }

  .main{
    padding:2px 10px 10px;
    gap:7px;
  }

  .instruction{
    min-height:46px;
    font-size:1.08rem;
  }

  .question-zone{
    min-height:155px;
    padding:10px;
  }

  .equality{
    gap:12px;
    font-size:2.1rem;
  }

  .division{
    gap:7px;
  }

  .answer-input{
    width:68px;
    height:54px;
    font-size:1.55rem;
  }

  .fraction .answer-input{
    width:72px;
    height:46px;
  }

  .fraction{
    min-width:72px;
  }

  .fraction-line{
    min-width:65px;
  }

  .feedback{
    min-height:48px;
    padding:7px 10px;
    font-size:.88rem;
  }

  .controls{
    min-height:43px;
  }

  button.action{
    min-height:42px;
    height:42px;
  }
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>

<body>

<main class="app" id="app" aria-live="polite">

  <header class="top">

    <div class="track" aria-label="Progression">
      <div class="bar" id="bar"></div>
    </div>

    <div class="pill" id="counter">
      Question 1 / 10
    </div>

    <div class="pill" id="score">
      Score : 0 / 10
    </div>

  </header>


  <section class="main" id="exercise">

    <p class="instruction">
      Complète l'égalité en écrivant les nombres manquants.
    </p>

    <div
      class="question-zone"
      id="questionZone"
      aria-label="Égalité à compléter">
    </div>

    <div
      class="feedback"
      id="feedback"
      role="status">
      Écris les deux nombres puis valide ta réponse.
    </div>

    <div class="controls">

      <button
        class="action primary"
        type="button"
        id="validate"
        disabled>
        Valider
      </button>

      <button
        class="action secondary"
        type="button"
        id="next"
        hidden>
        Question suivante
      </button>

    </div>

  </section>


  <section class="final" id="final">

    <div class="final-card">

      <div
        class="final-icon"
        aria-hidden="true">
        🎯
      </div>

      <h2>Activité terminée !</h2>

      <p
        class="final-score"
        id="finalScore">
      </p>

      <p
        class="final-message"
        id="finalMessage">
      </p>

      <button
        class="action primary"
        type="button"
        id="restart">
        Recommencer avec de nouveaux nombres
      </button>

    </div>

  </section>

</main>


<script>
(() => {

  'use strict';

  const TOTAL = 10;

  const $ = id => document.getElementById(id);

  const counter = $('counter');
  const scoreBox = $('score');
  const bar = $('bar');

  const questionZone = $('questionZone');
  const feedback = $('feedback');

  const validateBtn = $('validate');
  const nextBtn = $('next');

  const exercise = $('exercise');
  const final = $('final');

  const finalScore = $('finalScore');
  const finalMessage = $('finalMessage');
  const restartBtn = $('restart');


  let questions = [];
  let index = 0;
  let score = 0;
  let locked = false;


  /* -------------------------
     Outils
  ------------------------- */

  function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }


  function shuffle(array){

    const copy = array.slice();

    for(let i=copy.length-1;i>0;i--){

      const j = Math.floor(Math.random()*(i+1));

      [copy[i],copy[j]] = [copy[j],copy[i]];

    }

    return copy;
  }


  function fractionHTML(a,b){

    return `
      <span class="mini-fraction">
        <span class="mini-value">${a}</span>
        <span class="mini-line"></span>
        <span class="mini-value">${b}</span>
      </span>
    `;
  }


  /* -------------------------
     Génération
  ------------------------- */

  function generatePair(used){

    let a;
    let b;
    let key;

    do{

      a = randInt(2,20);
      b = randInt(2,20);

      key = `${a}-${b}`;

    }while(used.has(key));

    used.add(key);

    return {a,b};
  }


  function generateQuestions(){

    const used = new Set();

    const types = shuffle([
      'divisionToFraction',
      'divisionToFraction',
      'divisionToFraction',
      'divisionToFraction',
      'divisionToFraction',

      'fractionToDivision',
      'fractionToDivision',
      'fractionToDivision',
      'fractionToDivision',
      'fractionToDivision'
    ]);

    return types.map(type => {

      const {a,b} = generatePair(used);

      return {
        type,
        a,
        b
      };

    });
  }


  /* -------------------------
     Construction visuelle
  ------------------------- */

  function fractionInputHTML(){

    return `
      <div class="fraction">

        <input
          class="answer-input"
          id="answer1"
          inputmode="numeric"
          autocomplete="off"
          maxlength="2"
          aria-label="Numérateur">

        <div class="fraction-line"></div>

        <input
          class="answer-input"
          id="answer2"
          inputmode="numeric"
          autocomplete="off"
          maxlength="2"
          aria-label="Dénominateur">

      </div>
    `;
  }


  function fixedFractionHTML(a,b){

    return `
      <div class="fraction">

        <div class="fraction-value">
          ${a}
        </div>

        <div class="fraction-line"></div>

        <div class="fraction-value">
          ${b}
        </div>

      </div>
    `;
  }


  function divisionInputHTML(){

    return `
      <div class="division">

        <input
          class="answer-input"
          id="answer1"
          inputmode="numeric"
          autocomplete="off"
          maxlength="2"
          aria-label="Premier nombre">

        <span>÷</span>

        <input
          class="answer-input"
          id="answer2"
          inputmode="numeric"
          autocomplete="off"
          maxlength="2"
          aria-label="Deuxième nombre">

      </div>
    `;
  }


  function fixedDivisionHTML(a,b){

    return `
      <div class="division">
        <span>${a}</span>
        <span>÷</span>
        <span>${b}</span>
      </div>
    `;
  }


  /* -------------------------
     Affichage d'une question
  ------------------------- */

  function renderQuestion(){

    locked = false;

    const q = questions[index];

    counter.textContent =
      `Question ${index+1} / ${TOTAL}`;

    scoreBox.textContent =
      `Score : ${score} / ${TOTAL}`;

    bar.style.width =
      `${((index+1)/TOTAL)*100}%`;

    feedback.className = 'feedback';

    feedback.textContent =
      'Écris les deux nombres puis valide ta réponse.';

    validateBtn.hidden = false;
    validateBtn.disabled = true;

    nextBtn.hidden = true;


    if(q.type === 'divisionToFraction'){

      questionZone.innerHTML = `
        <div class="equality">

          ${fixedDivisionHTML(q.a,q.b)}

          <span class="equals">=</span>

          ${fractionInputHTML()}

        </div>
      `;

    }else{

      questionZone.innerHTML = `
        <div class="equality">

          ${fixedFractionHTML(q.a,q.b)}

          <span class="equals">=</span>

          ${divisionInputHTML()}

        </div>
      `;

    }


    const input1 = $('answer1');
    const input2 = $('answer2');


    [input1,input2].forEach(input => {

      input.addEventListener('input', () => {

        input.value =
          input.value.replace(/[^0-9]/g,'');

        validateBtn.disabled =
          !input1.value || !input2.value;

      });


      input.addEventListener('keydown', event => {

        if(
          event.key === 'Enter' &&
          !validateBtn.disabled &&
          !locked
        ){
          validateAnswer();
        }

      });

    });


    input1.focus();
  }


  /* -------------------------
     Validation
     UN SEUL ESSAI
  ------------------------- */

  function validateAnswer(){

    if(locked) return;

    locked = true;

    const q = questions[index];

    const input1 = $('answer1');
    const input2 = $('answer2');

    const answer1 =
      Number(input1.value);

    const answer2 =
      Number(input2.value);


    const firstCorrect =
      answer1 === q.a;

    const secondCorrect =
      answer2 === q.b;

    const correct =
      firstCorrect && secondCorrect;


    input1.disabled = true;
    input2.disabled = true;

    input1.classList.add(
      firstCorrect ? 'correct' : 'wrong'
    );

    input2.classList.add(
      secondCorrect ? 'correct' : 'wrong'
    );


    if(correct){

      score++;

      scoreBox.textContent =
        `Score : ${score} / ${TOTAL}`;

      feedback.className =
        'feedback success';


      if(q.type === 'divisionToFraction'){

        feedback.innerHTML =
          `Bravo ! ${q.a} ÷ ${q.b} = ${fractionHTML(q.a,q.b)}.`;

      }else{

        feedback.innerHTML =
          `Bravo ! ${fractionHTML(q.a,q.b)} = ${q.a} ÷ ${q.b}.`;

      }

    }else{

      feedback.className =
        'feedback error';


      if(q.type === 'divisionToFraction'){

        feedback.innerHTML =
          `La bonne réponse était : ${q.a} ÷ ${q.b} = ${fractionHTML(q.a,q.b)}.`;

      }else{

        feedback.innerHTML =
          `La bonne réponse était : ${fractionHTML(q.a,q.b)} = ${q.a} ÷ ${q.b}.`;

      }

    }


    validateBtn.hidden = true;
    nextBtn.hidden = false;


    if(index === TOTAL-1){

      nextBtn.textContent =
        'Voir mon résultat';

    }else{

      nextBtn.textContent =
        'Question suivante';

    }

  }


  /* -------------------------
     Question suivante
  ------------------------- */

  function nextQuestion(){

    if(index < TOTAL-1){

      index++;

      renderQuestion();

    }else{

      showFinal();

    }

  }


  /* -------------------------
     Écran final
  ------------------------- */

  function showFinal(){

    exercise.style.display = 'none';

    final.classList.add('show');

    finalScore.textContent =
      `Score : ${score} / ${TOTAL}`;


    if(score === TOTAL){

      finalMessage.textContent =
        'Excellent ! Tu sais parfaitement passer d’une division à une fraction et inversement.';

    }else if(score >= 8){

      finalMessage.textContent =
        'Très bien ! Le lien entre fraction et division est bien compris.';

    }else if(score >= 6){

      finalMessage.textContent =
        'C’est bien. Vérifie encore l’ordre du numérateur et du dénominateur.';

    }else{

      finalMessage.textContent =
        'Revois la règle : a ÷ b s’écrit a sur b. Puis recommence avec de nouveaux nombres.';

    }

  }


  /* -------------------------
     Recommencer
  ------------------------- */

  function restart(){

    questions = generateQuestions();

    index = 0;
    score = 0;
    locked = false;

    final.classList.remove('show');
    exercise.style.display = '';

    renderQuestion();

  }


  /* -------------------------
     Événements
  ------------------------- */

  validateBtn.addEventListener(
    'click',
    validateAnswer
  );

  nextBtn.addEventListener(
    'click',
    nextQuestion
  );

  restartBtn.addEventListener(
    'click',
    restart
  );


  /* -------------------------
     Démarrage
  ------------------------- */

  questions = generateQuestions();

  renderQuestion();

})();
</script>

</body>
</html>
