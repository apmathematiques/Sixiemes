<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">

<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);
  border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;
  gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;
  text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:12px
}
.instruction{
  min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.25rem,2.35vw,1.6rem);font-weight:600;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:205px;padding:20px;display:grid;place-items:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.equality{
  display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;
  font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums
}
.equals{padding:0 2px}
.fraction{
  display:inline-grid;grid-template-rows:auto 3px auto;
  align-items:center;justify-items:center;min-width:96px;vertical-align:middle
}
.fraction-line{
  width:100%;min-width:88px;height:3px;background:currentColor;border-radius:99px
}
.fraction-value{
  min-width:82px;padding:4px 8px;text-align:center
}
.answer-input{
  width:150px;height:68px;padding:4px 10px;color:var(--bd);
  font:700 2rem Arial,Helvetica,sans-serif;text-align:center;
  background:#fff;border:3px solid #b9d4e8;border-radius:14px;outline:none;
  transition:border-color .15s ease,background .15s ease,color .15s ease
}
.answer-input:focus{
  border-color:var(--b);box-shadow:0 0 0 4px rgba(23,105,170,.12)
}
.answer-input.correct{
  color:#165e36;background:var(--gs);border-color:#79c798
}
.answer-input.wrong{
  color:#8f2727;background:var(--rs);border-color:#df8585
}
.fraction .answer-input{
  width:96px;height:58px
}
.feedback{
  min-height:58px;padding:9px 14px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{
  color:#165e36;background:var(--gs);border:1px solid #a9ddbd
}
.feedback.error{
  color:#8f2727;background:var(--rs);border:1px solid #efbcbc
}
.mini-fraction{
  display:inline-grid;grid-template-rows:auto 1.5px auto;justify-items:center;align-items:center;
  min-width:28px;margin:0 5px;vertical-align:middle;line-height:1
}
.mini-line{width:100%;height:1.5px;background:currentColor}
.mini-value{padding:1px 3px}
.controls{
  min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap
}
button.action{
  min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;
  border:0;border-radius:13px;touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease
}
button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
button.action:disabled{opacity:.48;cursor:default}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid;animation:reveal 280ms ease both}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;
  border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
@keyframes reveal{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}
}
@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}
  .pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:44px;font-size:1.08rem}
  .question-zone{min-height:150px;padding:10px}
  .equality{gap:12px;font-size:2.15rem}
  .answer-input{width:112px;height:54px;font-size:1.55rem}
  .fraction .answer-input{width:72px;height:46px}
  .fraction{min-width:72px}
  .fraction-line{min-width:65px}
  .fraction-value{min-width:65px;padding:3px 5px}
  .feedback{min-height:48px;padding:7px 10px;font-size:.88rem}
  .controls{min-height:43px}
  button.action{min-height:42px;height:42px}
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>

<body>

<main class="app" id="app" aria-live="polite">

  <header class="top">
    <div class="track" aria-label="Progression"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">

    <p class="instruction" id="instruction"></p>

    <div class="question-zone" id="questionZone"></div>

    <div class="feedback" id="feedback" role="status">
      Complète l'égalité puis valide ta réponse.
    </div>

    <div class="controls">
      <button class="action primary" type="button" id="validate" disabled>
        Valider
      </button>

      <button class="action secondary" type="button" id="next" hidden>
        Question suivante
      </button>
    </div>

  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon" aria-hidden="true">🎯</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" type="button" id="restart">
        Recommencer avec une nouvelle série
      </button>
    </div>
  </section>

</main>

<script>
(() => {
  'use strict';

  const TOTAL=10;
  const $=id=>document.getElementById(id);

  const instruction=$('instruction');
  const counter=$('counter');
  const scoreBox=$('score');
  const bar=$('bar');
  const questionZone=$('questionZone');
  const feedback=$('feedback');
  const validateBtn=$('validate');
  const nextBtn=$('next');
  const exercise=$('exercise');
  const final=$('final');
  const finalScore=$('finalScore');
  const finalMessage=$('finalMessage');
  const restartBtn=$('restart');

  const REFERENCES=[
    {n:1,d:2, decimal:'0,5'},
    {n:1,d:4, decimal:'0,25'},
    {n:3,d:4, decimal:'0,75'},
    {n:1,d:5, decimal:'0,2'},
    {n:1,d:8, decimal:'0,125'},
    {n:1,d:10,decimal:'0,1'},
    {n:1,d:20,decimal:'0,05'},
    {n:1,d:100,decimal:'0,01'},
    {n:1,d:1000,decimal:'0,001'}
  ];

  let questions=[];
  let index=0;
  let score=0;
  let locked=false;

  function shuffle(array){
    const copy=array.slice();
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function choice(array){
    return array[Math.floor(Math.random()*array.length)];
  }

  function gcd(a,b){
    a=Math.abs(a); b=Math.abs(b);
    while(b!==0){
      [a,b]=[b,a%b];
    }
    return a;
  }

  function fractionHTML(n,d){
    return `
      <span class="mini-fraction">
        <span class="mini-value">${n}</span>
        <span class="mini-line"></span>
        <span class="mini-value">${d}</span>
      </span>
    `;
  }

  function fixedFractionHTML(n,d){
    return `
      <span class="fraction">
        <span class="fraction-value">${n}</span>
        <span class="fraction-line"></span>
        <span class="fraction-value">${d}</span>
      </span>
    `;
  }

  function fractionInputHTML(){
    return `
      <span class="fraction">
        <input
          class="answer-input"
          id="answer1"
          inputmode="numeric"
          autocomplete="off"
          maxlength="4"
          aria-label="Numérateur">

        <span class="fraction-line"></span>

        <input
          class="answer-input"
          id="answer2"
          inputmode="numeric"
          autocomplete="off"
          maxlength="4"
          aria-label="Dénominateur">
      </span>
    `;
  }

  function decimalInputHTML(){
    return `
      <input
        class="answer-input"
        id="answer1"
        inputmode="decimal"
        autocomplete="off"
        maxlength="7"
        aria-label="Écriture décimale">
    `;
  }

  function generateQuestions(){

    /*
      Les 9 fractions repères apparaissent au moins une fois.
      Une dixième est tirée au hasard.
    */
    const values=shuffle([
      ...REFERENCES.map(x=>({...x})),
      {...choice(REFERENCES)}
    ]);

    /*
      5 questions dans chaque sens.
    */
    const types=shuffle([
      'fractionToDecimal','fractionToDecimal','fractionToDecimal',
      'fractionToDecimal','fractionToDecimal',
      'decimalToFraction','decimalToFraction','decimalToFraction',
      'decimalToFraction','decimalToFraction'
    ]);

    return values.map((value,i)=>({
      ...value,
      type:types[i]
    }));
  }

  function parseDecimal(text){
    const normalized=text.trim().replace(',','.');
    if(!/^\d+(?:\.\d+)?$/.test(normalized)){
      return NaN;
    }
    return Number(normalized);
  }

  function decimalExpected(q){
    return Number(q.decimal.replace(',','.'));
  }

  function renderQuestion(){

    locked=false;

    const q=questions[index];

    counter.textContent=`Question ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    bar.style.width=`${((index+1)/TOTAL)*100}%`;

    feedback.className='feedback';
    feedback.textContent='Complète l’égalité puis valide ta réponse.';

    validateBtn.hidden=false;
    validateBtn.disabled=true;
    nextBtn.hidden=true;

    if(q.type==='fractionToDecimal'){

      instruction.textContent=
        'Écris l’écriture décimale de cette fraction.';

      questionZone.innerHTML=`
        <div class="equality">
          ${fixedFractionHTML(q.n,q.d)}
          <span class="equals">=</span>
          ${decimalInputHTML()}
        </div>
      `;

    }else{

      instruction.textContent=
        'Écris une fraction égale à ce nombre décimal.';

      questionZone.innerHTML=`
        <div class="equality">
          <span>${q.decimal}</span>
          <span class="equals">=</span>
          ${fractionInputHTML()}
        </div>
      `;
    }

    const inputs=[...questionZone.querySelectorAll('.answer-input')];

    inputs.forEach(input=>{

      input.addEventListener('input',()=>{

        if(q.type==='fractionToDecimal'){
          /*
            Le point est automatiquement transformé en virgule.
          */
          input.value=input.value
            .replace('.',',')
            .replace(/[^0-9,]/g,'')
            .replace(/(,.*),/g,'$1');
        }else{
          input.value=input.value.replace(/[^0-9]/g,'');
        }

        input.classList.remove('correct','wrong');

        validateBtn.disabled=
          inputs.some(el=>!el.value.trim());
      });

      input.addEventListener('keydown',event=>{
        if(event.key==='Enter' && !validateBtn.disabled && !locked){
          validateAnswer();
        }
      });
    });

    inputs[0]?.focus();
  }

  function validateAnswer(){

    if(locked || validateBtn.disabled) return;

    locked=true;

    const q=questions[index];
    const inputs=[...questionZone.querySelectorAll('.answer-input')];

    let correct=false;

    if(q.type==='fractionToDecimal'){

      const value=parseDecimal(inputs[0].value);
      correct=
        Number.isFinite(value) &&
        Math.abs(value-decimalExpected(q))<1e-12;

    }else{

      const n=Number(inputs[0].value);
      const d=Number(inputs[1].value);

      /*
        Toute fraction équivalente est mathématiquement correcte.
        On vérifie n/d = q.n/q.d par produit en croix.
      */
      correct=
        Number.isInteger(n) &&
        Number.isInteger(d) &&
        d!==0 &&
        n*q.d===q.n*d;
    }

    inputs.forEach(input=>{
      input.disabled=true;
      input.classList.add(correct ? 'correct' : 'wrong');
    });

    if(correct){

      score++;
      scoreBox.textContent=`Score : ${score} / ${TOTAL}`;

      feedback.className='feedback success';

      if(q.type==='fractionToDecimal'){
        feedback.innerHTML=
          `Bravo ! ${fractionHTML(q.n,q.d)} = <strong>${q.decimal}</strong>.`;
      }else{
        const n=Number(inputs[0].value);
        const d=Number(inputs[1].value);
        feedback.innerHTML=
          `Bravo ! ${fractionHTML(n,d)} est bien égal à <strong>${q.decimal}</strong>.`;
      }

    }else{

      feedback.className='feedback error';
      feedback.innerHTML=
        `La fraction repère à retenir est ${fractionHTML(q.n,q.d)} = <strong>${q.decimal}</strong>.`;
    }

    validateBtn.hidden=true;
    nextBtn.hidden=false;
    nextBtn.textContent=
      index===TOTAL-1 ? 'Voir mon résultat' : 'Question suivante';
  }

  function nextQuestion(){

    if(index<TOTAL-1){
      index++;
      renderQuestion();
    }else{
      showFinal();
    }
  }

  function showFinal(){

    exercise.style.display='none';
    final.classList.add('show');

    finalScore.textContent=`Score : ${score} / ${TOTAL}`;

    if(score===TOTAL){

      finalMessage.textContent=
        'Excellent ! Les fractions repères sont parfaitement connues.';

    }else if(score>=8){

      finalMessage.textContent=
        'Très bien ! Tu connais presque toutes les fractions repères.';

    }else if(score>=6){

      finalMessage.textContent=
        'C’est bien. Revois encore les quelques égalités que tu hésites à reconnaître.';

    }else{

      finalMessage.textContent=
        'Ces égalités doivent devenir automatiques. Relis la liste du cours puis recommence.';
    }
  }

  function restart(){

    questions=generateQuestions();
    index=0;
    score=0;
    locked=false;

    final.classList.remove('show');
    exercise.style.display='';

    renderQuestion();
  }

  validateBtn.addEventListener('click',validateAnswer);
  nextBtn.addEventListener('click',nextQuestion);
  restartBtn.addEventListener('click',restart);

  questions=generateQuestions();
  renderQuestion();

})();
</script>

</body>
</html>
