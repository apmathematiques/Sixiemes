<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79;--axis:#d14d4d
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:4px 18px 18px;
  display:flex;flex-direction:column;gap:9px
}
.instruction{
  min-height:52px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.35rem,2.5vw,1.76rem);
  font-weight:700;line-height:1.25;text-align:center
}
.figure-zone{
  flex:1;min-height:245px;padding:8px 14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
#figure{
  width:100%;height:100%;min-height:235px;display:block
}
.shape{
  fill:rgba(23,105,170,.14);
  stroke:#1769aa;stroke-width:4;stroke-linejoin:round
}
.axis{
  stroke:var(--axis);stroke-width:3.2;
  stroke-dasharray:10 8;stroke-linecap:round
}
.inf-note{
  fill:#9c3434;font:700 19px Arial,Helvetica,sans-serif
}
.answer-grid{
  width:min(780px,100%);margin:0 auto;
  display:grid;grid-template-columns:repeat(6,1fr);gap:9px
}
.choice{
  min-height:54px;padding:7px 8px;
  color:var(--bd);background:var(--bs);
  border:3px solid #b9d4e8;border-radius:14px;
  font:800 clamp(.98rem,1.7vw,1.14rem)/1.15 Arial,Helvetica,sans-serif;
  cursor:pointer;touch-action:manipulation
}
.choice.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.choice.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.choice:disabled{cursor:default}
.feedback{
  min-height:62px;padding:9px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.96rem,1.75vw,1.08rem);
  line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{min-height:44px;display:flex;align-items:center;justify-content:center}
button.action{
  min-height:42px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:760px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:9px 14px 5px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:1px 10px 10px;gap:6px}
  .instruction{min-height:38px;font-size:1.08rem}
  .figure-zone{min-height:170px;padding:5px 8px}
  #figure{min-height:165px}
  .answer-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .choice{min-height:40px;padding:5px 6px;font-size:.9rem}
  .feedback{min-height:48px;padding:6px 10px;font-size:.82rem}
  .controls{min-height:35px}
  button.action{min-height:34px;height:34px;padding:0 14px}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Combien cette figure possède-t-elle d’axes de symétrie ?</p>

    <div class="figure-zone">
      <svg id="figure" viewBox="0 0 860 300" role="img" aria-label="Figure à étudier"></svg>
    </div>

    <div class="answer-grid" id="answers"></div>

    <div class="feedback" id="feedback">
      Imagine les différents pliages qui pourraient superposer la figure à elle-même.
    </div>

    <div class="controls">
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouvelles figures</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const NS='http://www.w3.org/2000/svg';
const TOTAL=8;
const CX=430,CY=150;
const CHOICES=['0','1','2','3','4','∞'];

const $=id=>document.getElementById(id);
const svg=$('figure');
const answers=$('answers');
const feedback=$('feedback');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let locked=false;

function el(tag,attrs={}){
  const node=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs)) node.setAttribute(k,v);
  return node;
}
function rand(min,max){return Math.random()*(max-min)+min}
function randInt(min,max){return Math.floor(rand(min,max+1))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pts(points){return points.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ')}
function group(angle){return el('g',{transform:`translate(${CX} ${CY}) rotate(${angle})`})}
function addPoly(g,points){g.appendChild(el('polygon',{points:pts(points),class:'shape'}))}

function radialPolygon({n=48,base=103,terms=[]}={}){
  const points=[];
  for(let i=0;i<n;i++){
    const t=2*Math.PI*i/n;
    let r=base;
    for(const [amp,k] of terms) r+=amp*Math.cos(k*t);
    points.push([r*Math.cos(t),r*Math.sin(t)]);
  }
  return points;
}

function makeZero(angle){
  const n=randInt(8,11);
  const radii=Array.from({length:n},()=>rand(72,125));
  // On force une forte irrégularité pour éviter toute symétrie accidentelle.
  radii[0]=rand(118,132);
  radii[1]=rand(72,86);
  radii[2]=rand(95,110);

  const points=[];
  for(let i=0;i<n;i++){
    const t=2*Math.PI*i/n + rand(-0.09,0.09);
    points.push([radii[i]*Math.cos(t),radii[i]*Math.sin(t)]);
  }
  return {answer:'0',angle,axes:[],points,label:'figure irrégulière'};
}

function makeOne(angle){
  // Profil d'un côté généré aléatoirement puis réfléchi :
  // exactement un axe vertical, sauf cas accidentel rendu très improbable
  // par l'asymétrie volontaire entre le haut et le bas.
  const ys=[-118,-82,-38,8,55,104];
  const xs=[
    rand(28,55),
    rand(70,112),
    rand(45,92),
    rand(82,125),
    rand(50,98),
    rand(35,68)
  ];
  if(Math.abs(xs[0]-xs[5])<18) xs[5]+=25;
  if(Math.abs(xs[1]-xs[4])<18) xs[4]-=20;

  const right=ys.map((y,i)=>[xs[i],y]);
  const left=right.slice().reverse().map(([x,y])=>[-x,y]);
  return {
    answer:'1',angle,axes:[90],
    points:right.concat(left),
    label:'figure à un axe'
  };
}

function makeTwo(angle){
  // r(theta)=a+b cos(2 theta)+c cos(4 theta)
  // avec b non nul : axes horizontal et vertical, sans symétrie diagonale.
  const base=rand(92,106);
  const a=pick([-1,1])*rand(22,34);
  const b=rand(6,13);
  return {
    answer:'2',angle,axes:[0,90],
    points:radialPolygon({base,terms:[[a,2],[b,4]]}),
    label:'figure à deux axes'
  };
}

function makeThree(angle){
  // Symétrie diédrique d'ordre 3 : 3 axes.
  const base=rand(93,105);
  const a=rand(18,30);
  const b=rand(4,10);
  return {
    answer:'3',angle,axes:[0,60,120],
    points:radialPolygon({base,terms:[[a,3],[b,6]]}),
    label:'figure à trois axes'
  };
}

function makeFour(angle){
  // Symétrie diédrique d'ordre 4 : 4 axes.
  const base=rand(92,104);
  const a=rand(15,27);
  const b=rand(4,9);
  return {
    answer:'4',angle,axes:[0,45,90,135],
    points:radialPolygon({base,terms:[[a,4],[b,8]]}),
    label:'figure à quatre axes'
  };
}

function makeInfinity(angle){
  return {
    answer:'∞',angle,axes:'infinite',
    circle:true,r:rand(88,112),
    label:'cercle'
  };
}

const makers={
  '0':makeZero,'1':makeOne,'2':makeTwo,
  '3':makeThree,'4':makeFour,'∞':makeInfinity
};

function makeQuestion(answer){
  const angle=pick([-55,-42,-31,-19,-8,0,11,23,36,49,61]);
  return makers[answer](angle);
}

function buildQuestions(){
  // Les six cas sont toujours présents.
  // Deux cas supplémentaires sont générés parmi 0,1,2,3,4.
  const categories=['0','1','2','3','4','∞'];
  const extras=shuffle(['0','1','2','3','4']).slice(0,2);
  return shuffle(categories.concat(extras)).map(makeQuestion);
}

function clearSvg(){svg.innerHTML=''}

function drawAxis(g,angle,len=345){
  const r=angle*Math.PI/180;
  const dx=Math.cos(r)*len/2;
  const dy=Math.sin(r)*len/2;
  g.appendChild(el('line',{x1:-dx,y1:-dy,x2:dx,y2:dy,class:'axis'}));
}

function drawFigure(q){
  const g=group(q.angle);
  if(q.circle){
    g.appendChild(el('circle',{cx:0,cy:0,r:q.r,class:'shape'}));
  }else{
    addPoly(g,q.points);
  }
  svg.appendChild(g);
}

function drawAxes(q){
  const g=group(q.angle);
  if(q.axes==='infinite'){
    [0,30,60,90,120,150].forEach(a=>drawAxis(g,a,330));
    const t=el('text',{x:0,y:137,'text-anchor':'middle',class:'inf-note'});
    t.textContent='Une infinité d’axes';
    g.appendChild(t);
  }else{
    q.axes.forEach(a=>drawAxis(g,a,340));
  }
  svg.appendChild(g);
}

function renderFigure(showCorrection=false){
  clearSvg();
  const q=questions[index];
  drawFigure(q);
  if(showCorrection) drawAxes(q);
  svg.setAttribute(
    'aria-label',
    `${q.label}${showCorrection?', avec ses axes de symétrie affichés':''}`
  );
}

function setFeedback(text,type=''){
  feedback.textContent=text;
  feedback.className='feedback'+(type?` ${type}`:'');
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function renderAnswers(){
  answers.innerHTML='';
  CHOICES.forEach(value=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='choice';
    btn.dataset.value=value;
    btn.textContent=value==='∞'?'Une infinité':value;
    btn.addEventListener('click',()=>answer(value,btn));
    answers.appendChild(btn);
  });
}

function resetQuestion(){
  locked=false;
  nextBtn.hidden=true;
  setFeedback('Imagine les différents pliages qui pourraient superposer la figure à elle-même.');
  renderAnswers();
  renderFigure(false);
  updateTop();
}

function numeric(v){
  if(v==='∞') return Infinity;
  return Number(v);
}

function wrongHint(chosen,correct){
  const c=numeric(chosen), r=numeric(correct);
  if(c<r){
    return "Tu en as oublié. Cherche si un autre pliage peut encore superposer toute la figure.";
  }
  return "Tu en as compté trop. Chaque axe doit permettre de superposer toute la figure à elle-même.";
}

function explanation(q){
  if(q.answer==='0') return "Cette figure ne possède aucun axe de symétrie.";
  if(q.answer==='1') return "Cette figure possède un seul axe de symétrie.";
  if(q.answer==='∞') return "Un cercle possède une infinité d’axes de symétrie : tous ses diamètres.";
  return `Cette figure possède ${q.answer} axes de symétrie. Ils sont affichés sur la figure.`;
}

function answer(value,btn){
  if(locked)return;
  locked=true;
  const q=questions[index];
  const correct=value===q.answer;

  [...answers.children].forEach(b=>b.disabled=true);
  const correctBtn=[...answers.children].find(b=>b.dataset.value===q.answer);

  if(correct){
    score++;
    btn.classList.add('correct');
    setFeedback(explanation(q),'success');
  }else{
    btn.classList.add('wrong');
    if(correctBtn)correctBtn.classList.add('correct');
    setFeedback(`${wrongHint(value,q.answer)} ${explanation(q)}`,'error');
  }

  renderFigure(true);
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  nextBtn.textContent=index===TOTAL-1?'Voir le bilan':'Question suivante';
  nextBtn.hidden=false;
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  bar.style.width='100%';
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;

  let msg;
  if(score===8){
    msg="Excellent : tu sais chercher tous les axes, même sur des figures inhabituelles.";
  }else if(score>=6){
    msg="Très bien. Pense à tester plusieurs directions de pliage avant de répondre.";
  }else if(score>=4){
    msg="C’est en bonne voie. Vérifie toujours que toute la figure se superpose.";
  }else{
    msg="Rejoue : les figures seront différentes et tu pourras tester de nouveaux cas.";
  }
  finalMessage.textContent=msg;
}

function next(){
  if(index===TOTAL-1){showFinal();return}
  index++;
  resetQuestion();
}

function restart(){
  questions=buildQuestions();
  index=0;score=0;
  exercise.style.display='';
  final.classList.remove('show');
  resetQuestion();
}

nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);
restart();
})();
</script>
</body>
</html>
