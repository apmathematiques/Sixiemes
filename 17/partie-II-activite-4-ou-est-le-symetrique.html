<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79;--line:#263442;
  --cand:#7b4db3;--candBg:#f4effb
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:4px 18px 18px;
  display:flex;flex-direction:column;gap:9px
}
.instruction{
  min-height:50px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.28rem,2.45vw,1.7rem);
  font-weight:700;line-height:1.25;text-align:center
}
.figure-zone{
  flex:1;min-height:260px;padding:8px 12px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
#scene{
  width:100%;height:100%;min-height:245px;display:block;
  touch-action:manipulation
}
.axis{stroke:#263442;stroke-width:4;stroke-linecap:round}
.axis-label{fill:#17212b;font:700 22px Arial,Helvetica,sans-serif}
.point-cross{
  stroke:#1769aa;stroke-width:4.5;stroke-linecap:round;
  pointer-events:none
}
.point-label{
  fill:#17212b;font:800 21px Arial,Helvetica,sans-serif;
  pointer-events:none
}
.candidate{
  cursor:pointer;touch-action:manipulation
}
.candidate .hit{
  fill:transparent;stroke:none
}
.candidate .cross{
  stroke:var(--cand);stroke-width:4.5;stroke-linecap:round
}
.candidate .label{
  fill:var(--cand);font:800 22px Arial,Helvetica,sans-serif
}
.candidate:hover .cross{stroke:#5b358e}
.candidate:hover .label{fill:#5b358e}
.candidate.wrong .cross{stroke:var(--r)}
.candidate.wrong .label{fill:var(--r)}
.candidate.correct .cross{stroke:var(--g)}
.candidate.correct .label{fill:var(--g)}
.correction-line{
  stroke:var(--g);stroke-width:3.2;stroke-dasharray:9 7
}
.midmark{
  stroke:var(--g);stroke-width:3;stroke-linecap:round
}
.right-angle{
  fill:none;stroke:var(--g);stroke-width:3
}
.feedback{
  min-height:66px;padding:9px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.96rem,1.75vw,1.08rem);
  line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.feedback.hint{color:#7a5a18;background:#fff8df;border:1px solid #ead79a}
.controls{min-height:44px;display:flex;align-items:center;justify-content:center}
button.action{
  min-height:42px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:9px 14px 5px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:1px 10px 10px;gap:6px}
  .instruction{min-height:38px;font-size:1.06rem}
  .figure-zone{min-height:180px;padding:4px 7px}
  #scene{min-height:175px}
  .feedback{min-height:48px;padding:6px 10px;font-size:.81rem}
  .controls{min-height:35px}
  button.action{min-height:34px;height:34px;padding:0 14px}
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">
      Quel point est le symétrique de&nbsp;<em>M</em>&nbsp;par rapport à la droite&nbsp;<em>(d)</em>&nbsp;?
    </p>

    <div class="figure-zone">
      <svg id="scene" viewBox="0 0 860 310" role="img" aria-label="Droite d, point M et quatre points candidats"></svg>
    </div>

    <div class="feedback" id="feedback">
      Clique sur le point que tu penses être le symétrique de M.
    </div>

    <div class="controls">
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouvelles figures</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const NS='http://www.w3.org/2000/svg';
const TOTAL=8;
const W=860,H=310;
const NAMES=['A','B','C','D'];

const $=id=>document.getElementById(id);
const svg=$('scene');
const feedback=$('feedback');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let attempts=0;
let locked=false;

function el(tag,attrs={}){
  const node=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);
  return node;
}
function rand(min,max){return Math.random()*(max-min)+min}
function randInt(min,max){return Math.floor(rand(min,max+1))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function rad(deg){return deg*Math.PI/180}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function add(a,b){return{x:a.x+b.x,y:a.y+b.y}}
function sub(a,b){return{x:a.x-b.x,y:a.y-b.y}}
function mul(v,k){return{x:v.x*k,y:v.y*k}}

function axisBasis(angle){
  const r=rad(angle);
  const d={x:Math.cos(r),y:Math.sin(r)};
  const n={x:-d.y,y:d.x};
  return {d,n};
}
function fromLocal(center,angle,u,v){
  const {d,n}=axisBasis(angle);
  return {
    x:center.x+d.x*u+n.x*v,
    y:center.y+d.y*u+n.y*v
  };
}
function toLocal(center,angle,p){
  const {d,n}=axisBasis(angle);
  const q=sub(p,center);
  return {
    u:q.x*d.x+q.y*d.y,
    v:q.x*n.x+q.y*n.y
  };
}
function inside(p,margin=35){
  return p.x>=margin&&p.x<=W-margin&&p.y>=margin&&p.y<=H-margin;
}
function spaced(points,min=58){
  for(let i=0;i<points.length;i++){
    for(let j=i+1;j<points.length;j++){
      if(dist(points[i],points[j])<min)return false;
    }
  }
  return true;
}

function generateOffAxis(){
  let q=null;

  for(let tries=0;tries<400&&!q;tries++){
    const angle=pick([0,90,25,-25,40,-40,55,-55]);
    const center={
      x:rand(370,490),
      y:rand(138,172)
    };

    const u=rand(-48,48);
    const side=pick([-1,1]);
    const v=side*rand(68,90);

    const M=fromLocal(center,angle,u,v);
    const correct=fromLocal(center,angle,u,-v);

    // Erreur 1 : bonne perpendiculaire, mais mauvaise distance.
    // Le point reste volontairement assez éloigné du bon point
    // pour que les zones cliquables ne se chevauchent pas.
    const wrongV=-Math.sign(v)*Math.max(8,Math.abs(v)-68);
    const wrongDistance=fromLocal(center,angle,u,wrongV);

    // Erreur 2 : bonne distance à l'axe, mais mauvais pied sur l'axe.
    const shift=pick([-1,1])*rand(68,86);
    const wrongDirection=fromLocal(center,angle,u+shift,-v);

    // Erreur 3 : point resté du même côté que M.
    const shiftSame=pick([-1,1])*rand(68,86);
    const sameSide=fromLocal(center,angle,u+shiftSame,v*.72);

    const candidates=[correct,wrongDistance,wrongDirection,sameSide];

    if(
      inside(M,42)&&candidates.every(p=>inside(p,42))&&
      spaced([M,...candidates],60)
    ){
      q={angle,center,M,correct,candidates,onAxis:false};
    }
  }

  // Sécurité : le générateur ne doit jamais laisser une question vide.
  if(!q){
    const angle=0;
    const center={x:430,y:155};
    const M=fromLocal(center,angle,-50,80);
    const correct=fromLocal(center,angle,-50,-80);
    const wrongDistance=fromLocal(center,angle,-50,-12);
    const wrongDirection=fromLocal(center,angle,22,-80);
    const sameSide=fromLocal(center,angle,22,58);
    q={
      angle,center,M,correct,
      candidates:[correct,wrongDistance,wrongDirection,sameSide],
      onAxis:false
    };
  }

  return q;
}

function generateOnAxis(){
  let q=null;

  for(let tries=0;tries<400&&!q;tries++){
    const angle=pick([0,90,30,-30,45,-45,60,-60]);
    const center={x:rand(370,490),y:rand(138,172)};
    const u=rand(-50,50);
    const M=fromLocal(center,angle,u,0);

    // M est lui-même le bon point.
    const correct=M;

    // Trois faux points nettement séparés mais plausibles.
    const d1=fromLocal(center,angle,u,rand(66,84));
    const d2=fromLocal(center,angle,u,-rand(66,84));
    const d3=fromLocal(center,angle,u+pick([-1,1])*rand(72,90),0);

    const candidates=[correct,d1,d2,d3];

    if(
      inside(M,42)&&candidates.every(p=>inside(p,42))&&
      spaced([d1,d2,d3],62)
    ){
      q={angle,center,M,correct,candidates,onAxis:true};
    }
  }

  // Sécurité : aucune question ne doit pouvoir être vide.
  if(!q){
    const angle=0;
    const center={x:430,y:155};
    const M=fromLocal(center,angle,-45,0);
    const correct=M;
    const d1=fromLocal(center,angle,-45,72);
    const d2=fromLocal(center,angle,-45,-72);
    const d3=fromLocal(center,angle,35,0);
    q={
      angle,center,M,correct,
      candidates:[correct,d1,d2,d3],
      onAxis:true
    };
  }

  return q;
}

function buildQuestions(){
  const kinds=shuffle([
    'off','off','off','off','off','off',
    'on','on'
  ]);
  return kinds.map(k=>k==='on'?generateOnAxis():generateOffAxis());
}

function lineEndpoints(center,angle){
  const {d}=axisBasis(angle);
  const L=1000;
  return {
    a:{x:center.x-d.x*L,y:center.y-d.y*L},
    b:{x:center.x+d.x*L,y:center.y+d.y*L}
  };
}

function addAxis(q){
  const {a,b}=lineEndpoints(q.center,q.angle);
  svg.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'axis'}));

  // Label placé sur un point visible de l'axe.
  const candidates=[
    fromLocal(q.center,q.angle,150,0),
    fromLocal(q.center,q.angle,-150,0)
  ];
  const pos=candidates.find(p=>inside(p,22))||q.center;
  const t=el('text',{x:pos.x+9,y:pos.y-9,class:'axis-label'});
  t.textContent='(d)';
  svg.appendChild(t);
}

function addCross(point,label,classes,labelOffset={x:11,y:-12},clickable=false){
  const g=el('g',{class:classes});
  if(clickable)g.classList.add('candidate');

  if(clickable){
    g.appendChild(el('circle',{cx:point.x,cy:point.y,r:29,class:'hit'}));
  }

  const s=8;
  const lineClass=clickable?'cross':'point-cross';
  g.appendChild(el('line',{
    x1:point.x-s,y1:point.y-s,x2:point.x+s,y2:point.y+s,class:lineClass
  }));
  g.appendChild(el('line',{
    x1:point.x-s,y1:point.y+s,x2:point.x+s,y2:point.y-s,class:lineClass
  }));

  const text=el('text',{
    x:point.x+labelOffset.x,
    y:point.y+labelOffset.y,
    class:clickable?'label':'point-label'
  });
  text.textContent=label;
  g.appendChild(text);

  svg.appendChild(g);
  return g;
}

function correctionGraphic(q){
  if(q.onAxis){
    // Petit cercle vert autour de M pour mettre en évidence le point fixe.
    svg.appendChild(el('circle',{
      cx:q.M.x,cy:q.M.y,r:18,
      fill:'none',stroke:'#20864b','stroke-width':3
    }));
    return;
  }

  const local=toLocal(q.center,q.angle,q.M);
  const foot=fromLocal(q.center,q.angle,local.u,0);

  svg.appendChild(el('line',{
    x1:q.M.x,y1:q.M.y,x2:q.correct.x,y2:q.correct.y,class:'correction-line'
  }));

  // Deux petits traits indiquant les deux longueurs égales.
  const {n,d}=axisBasis(q.angle);
  const mid1={
    x:(q.M.x+foot.x)/2,
    y:(q.M.y+foot.y)/2
  };
  const mid2={
    x:(q.correct.x+foot.x)/2,
    y:(q.correct.y+foot.y)/2
  };
  for(const p of [mid1,mid2]){
    svg.appendChild(el('line',{
      x1:p.x-d.x*8,y1:p.y-d.y*8,
      x2:p.x+d.x*8,y2:p.y+d.y*8,
      class:'midmark'
    }));
  }

  // Petit carré d'angle droit au pied.
  const s=15;
  const p1=add(foot,mul(d,s));
  const p2=add(p1,mul(n,Math.sign(local.v)*s));
  const p3=add(foot,mul(n,Math.sign(local.v)*s));
  const path=el('path',{
    d:`M ${foot.x} ${foot.y} L ${p1.x} ${p1.y} L ${p2.x} ${p2.y} L ${p3.x} ${p3.y}`,
    class:'right-angle'
  });
  svg.appendChild(path);
}

function renderQuestion(showCorrection=false){
  svg.innerHTML='';
  const q=questions[index];
  addAxis(q);

  // Le point M est toujours affiché en bleu.
  addCross(q.M,'M','');

  const names=shuffle(NAMES);
  q.namedCandidates=q.candidates.map((p,i)=>({
    point:p,
    name:names[i],
    isCorrect:dist(p,q.correct)<0.1
  }));

  // Si M est sur l'axe, M lui-même doit être cliquable.
  // On évite d'ajouter une seconde croix au même endroit :
  // un halo transparent + étiquette de candidat entourent M.
  q.groups=[];

  q.namedCandidates.forEach(c=>{
    let g;
    if(q.onAxis && c.isCorrect){
      g=el('g',{class:'candidate'});
      g.appendChild(el('circle',{cx:q.M.x,cy:q.M.y,r:30,class:'hit'}));
      const badge=el('text',{
        x:q.M.x+13,y:q.M.y+22,class:'label'
      });
      badge.textContent=`(${c.name})`;
      g.appendChild(badge);
      svg.appendChild(g);
    }else{
      g=addCross(c.point,c.name,'',undefined,true);
    }

    g.addEventListener('click',()=>chooseCandidate(c,g));
    q.groups.push({candidate:c,group:g});
  });

  if(showCorrection)correctionGraphic(q);

  svg.setAttribute(
    'aria-label',
    q.onAxis
      ? 'Le point M est sur la droite d et plusieurs points sont proposés.'
      : 'Le point M est hors de la droite d et plusieurs points sont proposés.'
  );
}

function setFeedback(text,type=''){
  feedback.textContent=text;
  feedback.className='feedback'+(type?` ${type}`:'');
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  const s=Number.isInteger(score)?score:score.toFixed(1).replace('.',',');
  scoreBox.textContent=`Score : ${s} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function resetQuestion(){
  attempts=0;
  locked=false;
  nextBtn.hidden=true;
  setFeedback('Clique sur le point que tu penses être le symétrique de M.');
  updateTop();
  renderQuestion(false);
}

function lockAll(q){
  q.groups.forEach(({group})=>{
    group.style.pointerEvents='none';
  });
}

function markCorrect(q){
  q.groups.forEach(({candidate,group})=>{
    if(candidate.isCorrect)group.classList.add('correct');
  });
}

function finish(q,success,chosenGroup=null){
  locked=true;
  lockAll(q);
  markCorrect(q);

  if(!success&&chosenGroup)chosenGroup.classList.add('wrong');

  if(success){
    score+=attempts===0?1:0.5;
  }

  renderQuestion(true);
  // Re-marquer visuellement le bon candidat après le rerender.
  markCorrect(q);
  lockAll(q);

  if(q.onAxis){
    if(success){
      setFeedback(
        'Exact. Comme M appartient à l’axe (d), son symétrique est M lui-même.',
        'success'
      );
    }else{
      setFeedback(
        'M appartient à l’axe (d) : un point situé sur l’axe est son propre symétrique.',
        'error'
      );
    }
  }else{
    if(success){
      setFeedback(
        'Exact. Le segment reliant M à son symétrique est perpendiculaire à (d), et les deux points sont à la même distance de l’axe.',
        'success'
      );
    }else{
      setFeedback(
        'Le bon point est sur la perpendiculaire à (d) passant par M et à la même distance de l’axe que M.',
        'error'
      );
    }
  }

  updateTop();
  nextBtn.textContent=index===TOTAL-1?'Voir le bilan':'Question suivante';
  nextBtn.hidden=false;
}

function chooseCandidate(candidate,group){
  if(locked)return;
  const q=questions[index];

  if(candidate.isCorrect){
    finish(q,true,group);
    return;
  }

  if(attempts===0){
    attempts=1;
    group.classList.add('wrong');
    group.style.pointerEvents='none';

    if(q.onAxis){
      setFeedback(
        'Observe bien où se trouve M par rapport à l’axe. Un point situé sur l’axe a un comportement particulier.',
        'hint'
      );
    }else{
      setFeedback(
        'Observe à la fois la direction du segment reliant M à son image et les distances à l’axe.',
        'hint'
      );
    }
  }else{
    finish(q,false,group);
  }
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  bar.style.width='100%';

  const s=Number.isInteger(score)?score:score.toFixed(1).replace('.',',');
  finalScore.textContent=`Score : ${s} / ${TOTAL}`;

  let msg;
  if(score>=7.5){
    msg="Excellent : tu repères correctement le symétrique d’un point, même avec un axe oblique.";
  }else if(score>=6){
    msg="Très bien. Pense toujours à vérifier la perpendicularité et l’égalité des distances à l’axe.";
  }else if(score>=4){
    msg="C’est en bonne voie. Rejoue avec de nouvelles positions pour consolider la définition.";
  }else{
    msg="Rejoue : regarde d’abord la perpendiculaire à l’axe, puis compare les distances de part et d’autre.";
  }
  finalMessage.textContent=msg;
}

function next(){
  if(index===TOTAL-1){showFinal();return}
  index++;
  resetQuestion();
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  exercise.style.display='';
  final.classList.remove('show');
  resetQuestion();
}

nextBtn.addEventListener('click',next);
restartBtn.addEventListener('click',restart);

restart();
})();
</script>
</body>
</html>
