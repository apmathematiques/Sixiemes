<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Le bon raccourci</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --o:#9a5a11;
  --os:#fff6e9;
  --oline:#e3ad6e;

  --i:#17212b;
  --m:#5f6d79;
  --line:#24364a;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
  overscroll-behavior:none;
}

button,input{font:inherit}

.app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

/* ---------- En-tête ---------- */

.top{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:12px 20px 7px;
}

.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.bar{
  width:12.5%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease;
}

.pill{
  min-width:120px;
  padding:7px 12px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px;
}

/* ---------- Contenu ---------- */

.main{
  flex:1;
  min-height:0;
  padding:0 12px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.instruction{
  min-height:46px;
  margin:0;
  padding:0 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(1.08rem,2vw,1.32rem);
  font-weight:750;
  line-height:1.25;
  text-align:center;
}

.instruction strong{
  color:var(--bd);
  font-weight:850;
}

/* ---------- Figure ---------- */

.figure{
  flex:1;
  min-height:285px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

#scene{
  width:100%;
  height:100%;
  min-height:285px;
  display:block;
}

.triangle{
  fill:rgba(23,105,170,.045);
  stroke:var(--line);
  stroke-width:5;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

.angle-arc{
  fill:none;
  stroke:var(--b);
  stroke-width:5;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}

.angle-arc.unknown{
  stroke:var(--o);
  stroke-width:6;
}

.angle-label rect{
  fill:#fff;
  stroke:#a9cbe3;
  stroke-width:2;
  rx:10;
  ry:10;
}

.angle-label text{
  fill:var(--bd);
  font:850 24px Arial,Helvetica,sans-serif;
  text-anchor:middle;
  dominant-baseline:middle;
}

.angle-label.unknown rect{
  fill:var(--os);
  stroke:var(--oline);
  stroke-width:2.5;
}

.angle-label.unknown text{
  fill:var(--o);
  font-size:30px;
}

.vertex text{
  fill:var(--line);
  font:850 23px Arial,Helvetica,sans-serif;
  text-anchor:middle;
  dominant-baseline:middle;
}

.right-mark{
  fill:none;
  stroke:var(--bd);
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

.side-mark{
  stroke:var(--bd);
  stroke-width:4;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}

.note{
  position:absolute;
  right:13px;
  bottom:8px;
  color:#81909c;
  font-size:.78rem;
  font-weight:700;
}

/* ---------- Réponse ---------- */

.answer-row{
  flex:0 0 auto;
  min-height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.answer-label{
  color:var(--bd);
  font-size:1.08rem;
  font-weight:800;
}

.answer-input{
  width:130px;
  height:46px;
  padding:0 10px;
  border:3px solid #b9d4e8;
  border-radius:13px;
  outline:0;
  color:var(--i);
  background:#fff;
  text-align:center;
  font-size:1.22rem;
  font-weight:850;
}

.answer-input:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.13);
}

.answer-input.correct{
  border-color:#79c798;
  background:var(--gs);
  color:#165e36;
}

.answer-input.wrong{
  border-color:#df8585;
  background:var(--rs);
  color:#8f2727;
}

.answer-input.correction{
  border-color:#d8a25e;
  background:var(--os);
  color:var(--o);
}

.unit{
  color:var(--bd);
  font-size:1.15rem;
  font-weight:850;
}

/* ---------- Feedback ---------- */

.attempt{
  min-height:18px;
  margin:0;
  color:var(--m);
  font-size:.88rem;
  font-weight:700;
  text-align:center;
}

.feedback{
  min-height:46px;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--m);
  font-weight:650;
  line-height:1.3;
  text-align:center;
  background:#f4f7fb;
  border-radius:14px;
}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.feedback.correction{
  color:var(--o);
  background:var(--os);
  border:1px solid var(--oline);
}

/* ---------- Boutons ---------- */

.controls{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

button.action{
  min-height:46px;
  min-width:120px;
  padding:0 16px;
  border:0;
  border-radius:13px;
  font-size:.95rem;
  font-weight:800;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease;
}

button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
button.action:disabled{opacity:.46;cursor:default}
button:focus-visible{outline:4px solid rgba(23,105,170,.22)}

.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}

/* ---------- Fin ---------- */

.final{
  flex:1;
  padding:18px;
  display:none;
  place-items:center;
  text-align:center;
}

.final.show{
  display:grid;
  animation:reveal 220ms ease both;
}

.final-card{
  width:min(570px,92%);
  padding:24px 22px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

.final h2{
  margin:0 0 18px;
  color:var(--bd);
  font-size:clamp(1.35rem,3vw,1.75rem);
}

.final-score-badge{
  display:inline-block;
  margin:0 0 13px;
  padding:10px 18px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:1.35rem;
  font-weight:850;
}

.final-hint{
  margin:0 0 20px;
  color:var(--m);
  font-size:1.04rem;
  font-weight:650;
  line-height:1.45;
}

@keyframes reveal{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@media(max-width:760px),(max-height:700px){
  body{padding:4px}

  .app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  .top{
    grid-template-columns:1fr auto;
    padding:6px 8px 3px;
    gap:5px;
  }

  .track{grid-column:1/-1}

  .pill{
    min-width:0;
    padding:5px 8px;
    font-size:.82rem;
  }

  .main{
    padding:0 6px 6px;
    gap:3px;
  }

  .instruction{
    min-height:36px;
    font-size:.93rem;
  }

  .figure,#scene{min-height:230px}

  .angle-label text{font-size:19px}
  .angle-label.unknown text{font-size:24px}
  .vertex text{font-size:18px}

  .answer-row{min-height:46px}

  .answer-label,.unit{font-size:.92rem}

  .answer-input{
    width:105px;
    height:39px;
    font-size:1rem;
  }

  .attempt{font-size:.75rem}

  .feedback{
    min-height:39px;
    padding:4px 7px;
    font-size:.78rem;
  }

  .controls{min-height:42px}

  button.action{
    min-height:42px;
    min-width:104px;
    padding:0 10px;
    font-size:.84rem;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
  }
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>

<body>
<main class="app" aria-live="polite">

  <header class="top">
    <div class="track" aria-label="Progression">
      <div class="bar" id="bar"></div>
    </div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">

    <p class="instruction">
      Calcule la mesure de l’angle marqué&nbsp;<strong>?</strong>
    </p>

    <div class="figure">
      <svg
        id="scene"
        viewBox="0 0 920 380"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Triangle codé avec un angle à calculer">
      </svg>

      <div class="note">Figure non à l’échelle</div>
    </div>

    <div class="answer-row">
      <span class="answer-label">Angle&nbsp;? =</span>
      <input
        class="answer-input"
        id="answer"
        inputmode="numeric"
        autocomplete="off"
        aria-label="Mesure de l'angle manquant">
      <span class="unit">°</span>
    </div>

    <p class="attempt" id="attempt">Tu as 2 essais.</p>

    <div class="feedback" id="feedback" role="status">
      À toi de choisir la propriété utile.
    </div>

    <div class="controls">
      <button class="action primary" id="validate" type="button" disabled>
        Valider
      </button>
      <button class="action secondary" id="next" type="button" hidden>
        Question suivante
      </button>
    </div>

  </section>

  <section class="final" id="final">
    <div class="final-card">
      <h2>Activité terminée</h2>
      <div class="final-score-badge" id="finalScore"></div>
      <p class="final-hint" id="finalHint"></p>
      <button class="action primary" id="restart" type="button">Rejouer</button>
    </div>
  </section>

</main>

<script>
(()=>{
'use strict';

const TOTAL = 8;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

const scene      = $('scene');
const answer     = $('answer');
const attempt    = $('attempt');
const feedback   = $('feedback');
const validate   = $('validate');
const next       = $('next');
const counter    = $('counter');
const scoreBox   = $('score');
const bar        = $('bar');
const exercise   = $('exercise');
const final      = $('final');
const finalScore = $('finalScore');
const finalHint  = $('finalHint');
const restart    = $('restart');

let questions = [];
let index = 0;
let score = 0;
let attempts = 0;
let locked = false;

/* ---------- Outils ---------- */

function ri(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(array){
  return array[Math.floor(Math.random()*array.length)];
}

function shuffle(array){
  const copy = [...array];

  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }

  return copy;
}

function formatScore(value){
  return Number.isInteger(value)
    ? String(value)
    : String(value).replace('.',',');
}

function svg(name,attrs={}){
  const el = document.createElementNS(NS,name);

  for(const [key,value] of Object.entries(attrs)){
    el.setAttribute(key,value);
  }

  return el;
}

/* ---------- Génération des questions ---------- */

function generateGeneral(){
  for(let tries=0;tries<2000;tries++){
    const a = ri(24,120);
    const b = ri(24,120);
    const c = 180-a-b;

    if(c < 20 || c > 130) continue;

    const values = [a,b,c];

    /*
     * On évite les triangles particuliers dans
     * les questions de type "quelconque".
     */
    if(values.includes(60) || values.includes(90)) continue;
    if(a===b || a===c || b===c) continue;

    const unknown = ri(0,2);

    return {
      type:'general',
      angles:values,
      unknown
    };
  }

  return {
    type:'general',
    angles:[47,68,65],
    unknown:2
  };
}

function generateRight(){
  for(let tries=0;tries<1000;tries++){
    const a = ri(24,66);
    const b = 90-a;

    if(a===45 || b===45) continue;

    /*
     * Indices :
     * 0 = angle droit
     * 1 et 2 = angles aigus
     */
    const unknown = pick([1,2]);
    const angles = [90,a,b];

    return {
      type:'right',
      angles,
      unknown
    };
  }

  return {
    type:'right',
    angles:[90,34,56],
    unknown:2
  };
}

function generateEquilateral(){
  return {
    type:'equilateral',
    angles:[60,60,60],
    unknown:ri(0,2)
  };
}

function makeQuestions(){
  const qs = [
    generateGeneral(),
    generateGeneral(),
    generateGeneral(),
    generateRight(),
    generateRight(),
    generateRight(),
    generateEquilateral(),
    generateEquilateral()
  ];

  return shuffle(qs);
}

/* ---------- Gabarits de figures ---------- */

const templates = [
  [
    {x:160,y:302},
    {x:760,y:296},
    {x:480,y:60}
  ],
  [
    {x:190,y:310},
    {x:755,y:250},
    {x:365,y:58}
  ],
  [
    {x:165,y:255},
    {x:735,y:315},
    {x:610,y:65}
  ],
  [
    {x:240,y:315},
    {x:770,y:278},
    {x:515,y:52}
  ]
];

/* ---------- Géométrie SVG ---------- */

function unitVector(from,to){
  const dx = to.x-from.x;
  const dy = to.y-from.y;
  const length = Math.hypot(dx,dy);

  return {
    x:dx/length,
    y:dy/length
  };
}

function anglePath(vertex,p1,p2,radius){
  const v1 = unitVector(vertex,p1);
  const v2 = unitVector(vertex,p2);

  const start = {
    x:vertex.x + v1.x*radius,
    y:vertex.y + v1.y*radius
  };

  const end = {
    x:vertex.x + v2.x*radius,
    y:vertex.y + v2.y*radius
  };

  const a1 = Math.atan2(v1.y,v1.x);
  const a2 = Math.atan2(v2.y,v2.x);

  let delta = a2-a1;

  while(delta<=-Math.PI) delta += Math.PI*2;
  while(delta>Math.PI) delta -= Math.PI*2;

  const sweep = delta>0 ? 1 : 0;

  return `M ${start.x} ${start.y}
          A ${radius} ${radius}
          0 0 ${sweep}
          ${end.x} ${end.y}`;
}

function labelPosition(vertex,p1,p2,distance){
  const v1 = unitVector(vertex,p1);
  const v2 = unitVector(vertex,p2);

  let bx = v1.x+v2.x;
  let by = v1.y+v2.y;

  const length = Math.hypot(bx,by);

  bx /= length;
  by /= length;

  return {
    x:vertex.x + bx*distance,
    y:vertex.y + by*distance
  };
}

function addAngleLabel(position,text,isUnknown){
  const group = svg('g',{
    class:'angle-label' + (isUnknown?' unknown':'')
  });

  const width = isUnknown ? 52 : 78;
  const height = isUnknown ? 48 : 43;

  const rect = svg('rect',{
    x:position.x-width/2,
    y:position.y-height/2,
    width,
    height,
    rx:10,
    ry:10
  });

  const txt = svg('text',{
    x:position.x,
    y:position.y+1
  });

  txt.textContent = text;

  group.append(rect,txt);
  scene.appendChild(group);
}

function addVertexLabel(point,centroid,letter){
  let dx = point.x-centroid.x;
  let dy = point.y-centroid.y;

  const length = Math.hypot(dx,dy);

  dx /= length;
  dy /= length;

  const text = svg('text',{
    x:point.x+dx*31,
    y:point.y+dy*31+1,
    class:'vertex'
  });

  text.textContent = letter;
  scene.appendChild(text);
}

function addRightAngleMark(vertex,p1,p2){
  const u1 = unitVector(vertex,p1);
  const u2 = unitVector(vertex,p2);
  const d = 34;

  const a = {
    x:vertex.x + u1.x*d,
    y:vertex.y + u1.y*d
  };

  const b = {
    x:a.x + u2.x*d,
    y:a.y + u2.y*d
  };

  const c = {
    x:vertex.x + u2.x*d,
    y:vertex.y + u2.y*d
  };

  const path = svg('path',{
    class:'right-mark',
    d:`M ${a.x} ${a.y} L ${b.x} ${b.y} L ${c.x} ${c.y}`
  });

  scene.appendChild(path);
}

function addSideMark(p1,p2){
  const mx = (p1.x+p2.x)/2;
  const my = (p1.y+p2.y)/2;

  const dx = p2.x-p1.x;
  const dy = p2.y-p1.y;
  const length = Math.hypot(dx,dy);

  const nx = -dy/length;
  const ny = dx/length;

  const half = 10;

  const mark = svg('line',{
    class:'side-mark',
    x1:mx-nx*half,
    y1:my-ny*half,
    x2:mx+nx*half,
    y2:my+ny*half
  });

  scene.appendChild(mark);
}

/* ---------- Dessin ---------- */

function drawQuestion(){
  const q = questions[index];

  /*
   * Pour un triangle rectangle, on utilise
   * un gabarit qui rend le codage de l'angle droit
   * particulièrement lisible.
   */
  let points;

  if(q.type==='right'){
    const variants = [
      [
        {x:225,y:305},
        {x:750,y:305},
        {x:225,y:72}
      ],
      [
        {x:170,y:295},
        {x:710,y:295},
        {x:170,y:62}
      ]
    ];

    points = pick(variants);
  }
  else if(q.type==='equilateral'){
    /*
     * Figure volontairement assez régulière :
     * le codage des trois côtés est l'information
     * mathématique à lire.
     */
    points = [
      {x:210,y:305},
      {x:710,y:305},
      {x:460,y:72}
    ];
  }
  else{
    points = pick(templates);
  }

  scene.innerHTML='';

  const polygon = svg('polygon',{
    class:'triangle',
    points:points.map(p=>`${p.x},${p.y}`).join(' ')
  });

  scene.appendChild(polygon);

  const centroid = {
    x:(points[0].x+points[1].x+points[2].x)/3,
    y:(points[0].y+points[1].y+points[2].y)/3
  };

  /*
   * Codage des côtés pour l'équilatéral.
   */
  if(q.type==='equilateral'){
    addSideMark(points[0],points[1]);
    addSideMark(points[1],points[2]);
    addSideMark(points[2],points[0]);
  }

  /*
   * Codage de l'angle droit.
   */
  if(q.type==='right'){
    addRightAngleMark(
      points[0],
      points[1],
      points[2]
    );
  }

  /*
   * Arcs et mesures.
   */
  for(let i=0;i<3;i++){
    const vertex = points[i];
    const p1 = points[(i+1)%3];
    const p2 = points[(i+2)%3];

    const isUnknown = i===q.unknown;

    /*
     * Dans l'équilatéral, on n'affiche aucune
     * mesure connue : seulement le codage des côtés
     * et le ?.
     */
    if(q.type==='equilateral' && !isUnknown){
      continue;
    }

    /*
     * Dans le rectangle, l'angle droit est montré
     * par son carré et non par "90°".
     */
    if(q.type==='right' && i===0){
      continue;
    }

    const arc = svg('path',{
      class:'angle-arc' + (isUnknown?' unknown':''),
      d:anglePath(vertex,p1,p2,isUnknown ? 52 : 48)
    });

    scene.appendChild(arc);

    const pos = labelPosition(
      vertex,
      p1,
      p2,
      isUnknown ? 95 : 88
    );

    addAngleLabel(
      pos,
      isUnknown ? '?' : `${q.angles[i]}°`,
      isUnknown
    );
  }

  ['A','B','C'].forEach((letter,i)=>{
    addVertexLabel(points[i],centroid,letter);
  });
}

/* ---------- Interface ---------- */

function updateHeader(){
  counter.textContent = `Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent = `Score : ${formatScore(score)} / ${TOTAL}`;
  bar.style.width = `${((index+1)/TOTAL)*100}%`;
}

function render(){
  locked = false;
  attempts = 0;

  exercise.hidden = false;
  final.classList.remove('show');

  answer.disabled = false;
  answer.value = '';
  answer.className = 'answer-input';

  validate.hidden = false;
  validate.disabled = true;

  next.hidden = true;
  next.textContent =
    index===TOTAL-1
      ? 'Voir le résultat'
      : 'Question suivante';

  attempt.textContent = 'Tu as 2 essais.';

  feedback.className = 'feedback';
  feedback.textContent = 'À toi de choisir la propriété utile.';

  updateHeader();
  drawQuestion();

  setTimeout(()=>answer.focus(),50);
}

function parseAnswer(value){
  const cleaned = value
    .trim()
    .replace(/\s/g,'')
    .replace('°','')
    .replace(',','.');

  if(cleaned==='') return NaN;

  return Number(cleaned);
}

/* ---------- Feedbacks ---------- */

function firstErrorMessage(type){
  if(type==='right'){
    return 'Observe le codage de la figure et repense à la propriété du triangle rectangle.';
  }

  if(type==='equilateral'){
    return 'Observe le codage des côtés et repense aux angles d’un triangle équilatéral.';
  }

  return 'Dans un triangle, repense à la somme des mesures des trois angles.';
}

function successMessage(q){
  const expected = q.angles[q.unknown];

  if(q.type==='right'){
    const knownAcute = q.angles.find((v,i)=>i!==0 && i!==q.unknown);

    return `Bravo&nbsp;! Dans un triangle rectangle, les deux angles aigus ont une somme de 90°.&nbsp;<strong>90° − ${knownAcute}° = ${expected}°</strong>.`;
  }

  if(q.type==='equilateral'){
    return `Bravo&nbsp;! Les trois côtés sont codés de même longueur&nbsp;: le triangle est équilatéral.&nbsp;<strong>Chaque angle mesure 60°</strong>.`;
  }

  const known = q.angles.filter((_,i)=>i!==q.unknown);

  return `Bravo&nbsp;! La somme des angles vaut 180°.&nbsp;<strong>180° − ${known[0]}° − ${known[1]}° = ${expected}°</strong>.`;
}

function correctionMessage(q){
  const expected = q.angles[q.unknown];

  if(q.type==='right'){
    const knownAcute = q.angles.find((v,i)=>i!==0 && i!==q.unknown);

    return `Dans un triangle rectangle, les deux angles aigus ont une somme de 90°.&nbsp;Donc&nbsp;<strong>90° − ${knownAcute}° = ${expected}°</strong>.`;
  }

  if(q.type==='equilateral'){
    return `Les trois côtés sont codés de même longueur&nbsp;: le triangle est équilatéral.&nbsp;Donc&nbsp;<strong>l’angle mesure 60°</strong>.`;
  }

  const known = q.angles.filter((_,i)=>i!==q.unknown);

  return `La somme des angles vaut 180°.&nbsp;Donc&nbsp;<strong>180° − ${known[0]}° − ${known[1]}° = ${expected}°</strong>.`;
}

/* ---------- Validation ---------- */

function check(){
  if(locked) return;

  const student = parseAnswer(answer.value);

  if(!Number.isFinite(student)) return;

  const q = questions[index];
  const expected = q.angles[q.unknown];

  attempts++;

  if(Math.abs(student-expected)<0.0001){
    locked = true;

    const gain = attempts===1 ? 1 : 0.5;
    score += gain;

    answer.disabled = true;
    answer.className = 'answer-input correct';

    attempt.textContent =
      attempts===1
        ? 'Réussi au 1er essai : +1 point.'
        : 'Réussi au 2e essai : +0,5 point.';

    feedback.className = 'feedback success';
    feedback.innerHTML = successMessage(q);

    validate.hidden = true;
    next.hidden = false;

    updateHeader();
    return;
  }

  if(attempts===1){
    answer.className = 'answer-input wrong';

    attempt.textContent = 'Il te reste 1 essai.';

    feedback.className = 'feedback error';
    feedback.textContent = firstErrorMessage(q.type);

    setTimeout(()=>{
      answer.className = 'answer-input';
      answer.focus();
      answer.select();
    },260);

    return;
  }

  locked = true;

  answer.value = String(expected);
  answer.disabled = true;
  answer.className = 'answer-input correction';

  attempt.textContent = 'Correction affichée.';

  feedback.className = 'feedback correction';
  feedback.innerHTML = correctionMessage(q);

  validate.hidden = true;
  next.hidden = false;
}

/* ---------- Navigation ---------- */

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    render();
  }else{
    showFinal();
  }
}

/* ---------- Fin ---------- */

function showFinal(){
  exercise.hidden = true;
  final.classList.add('show');

  bar.style.width = '100%';

  scoreBox.textContent =
    `Score : ${formatScore(score)} / ${TOTAL}`;

  finalScore.textContent =
    `${formatScore(score)} / ${TOTAL}`;

  if(score===8){
    finalHint.textContent =
      'Bravo ! Tu sais choisir la bonne propriété selon les informations de la figure.';
  }
  else if(score>=6.5){
    finalHint.textContent =
      'Très bon travail ! Rejoue une fois pour essayer d’obtenir le sans-faute.';
  }
  else if(score>=4){
    finalHint.textContent =
      'Tu progresses bien. Entraîne-toi encore à reconnaître les codages avant de calculer.';
  }
  else{
    finalHint.textContent =
      'Rejoue l’activité : commence toujours par observer les codages et les données avant de choisir ton calcul.';
  }
}

/* ---------- Rejouer ---------- */

function restartGame(){
  questions = makeQuestions();
  index = 0;
  score = 0;
  attempts = 0;
  locked = false;

  render();
}

/* ---------- Événements ---------- */

answer.addEventListener('input',()=>{
  validate.disabled = answer.value.trim()==='';
});

answer.addEventListener('keydown',event=>{
  if(
    event.key==='Enter' &&
    !validate.disabled &&
    !validate.hidden
  ){
    check();
  }
});

validate.addEventListener('click',check);
next.addEventListener('click',nextQuestion);
restart.addEventListener('click',restartGame);

/* ---------- Démarrage ---------- */

restartGame();

})();
</script>
