<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Lecture des fractions décimales</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
}

button{font:inherit}

.app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;

  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#quizSection{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:11px 20px 7px;
}

.progress-wrap{display:contents}

.progress-track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.progress-fill{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width .2s ease;
}

.progress-label,.score{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:.98rem;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
}

.content{
  min-height:0;
  margin:0 12px 10px;
  padding:10px 18px;

  display:grid;
  grid-template-rows:auto 100px 1fr auto 46px;
  gap:8px;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.instruction{
  min-height:48px;
  margin:0;
  padding:4px 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  font-size:clamp(1.45rem,2.7vw,1.95rem);
  font-weight:900;
  line-height:1.2;
  text-align:center;
}

.prompt{
  min-height:0;
  margin:0;
  padding:10px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  color:var(--bd);
  text-align:center;

  box-shadow:0 7px 18px rgba(17,63,103,.06);
}

.prompt.words{
  font-size:clamp(1.8rem,3.5vw,2.55rem);
  font-weight:900;
  line-height:1.15;
}

.options{
  min-height:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:10px;
}

.option{
  min-height:0;
  padding:11px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #cfe1ef;
  border-radius:14px;
  background:#fff;
  color:var(--i);

  font-size:clamp(1.12rem,2vw,1.38rem);
  font-weight:800;
  line-height:1.35;
  text-align:center;

  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:transform .1s ease,border-color .1s ease,background .1s ease,box-shadow .1s ease;
}

.option:hover:not(.locked){
  transform:translateY(-1px);
  border-color:#9fc8e5;
  box-shadow:0 5px 12px rgba(17,63,103,.07);
}

.option.selected{
  color:var(--bd);
  border-color:var(--b);
  background:var(--bs);
  box-shadow:0 0 0 3px rgba(23,105,170,.10);
}

.option.correct{
  color:#165e36;
  border-color:var(--g);
  background:var(--gs);
}

.option.wrong{
  color:#8f2727;
  border-color:var(--r);
  background:var(--rs);
}

.option.locked{cursor:default}

.fraction{
  color:inherit;
  display:inline-grid;
  grid-template-rows:auto 4px auto;
  align-items:center;
  justify-items:center;
  min-width:92px;
  font-size:clamp(1.85rem,3.5vw,2.6rem);
  line-height:1;
  font-weight:900;
  vertical-align:middle;
}

.fraction .bar{
  width:100%;
  min-width:84px;
  height:4px;
  margin:6px 0;
  background:currentColor;
  border-radius:3px;
}

.feedback{
  width:min(920px,100%);
  min-height:60px;
  margin:0 auto;
  padding:8px 14px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;

  border-radius:14px;

  font-size:clamp(.98rem,1.55vw,1.12rem);
  font-weight:650;
  line-height:1.35;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
}

.feedback:empty{visibility:hidden}
.feedback.show{visibility:visible}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.feedback strong{
  display:block;
  margin:0;
}

.feedback .fraction{
  font-size:1.05rem!important;
  min-width:40px;
  grid-template-rows:auto 2px auto;
}

.feedback .fraction .bar{
  min-width:36px;
  height:2px;
  margin:2px 0;
}

.actions{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  min-width:170px;
  min-height:46px;
  padding:0 18px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  background:var(--b);
  color:#fff;

  font-size:1.02rem;
  font-weight:850;
  line-height:1.1;

  cursor:pointer;
  transition:background .1s ease,transform .1s ease,opacity .1s ease;
}

button:hover:not(:disabled){
  background:var(--bd);
  transform:translateY(-1px);
}

button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

button:focus-visible,.option:focus-visible{
  outline:4px solid rgba(23,105,170,.22);
}

.final{
  display:none;
  height:100%;
  padding:18px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.final.show{display:flex}

.final-card{
  width:min(540px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

.final-title{
  margin:0 0 14px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
  font-weight:900;
}

.final-score{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

.final-text{
  max-width:680px;
  margin:0 auto 20px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

@media(max-width:760px),(max-height:700px){
  body{padding:4px}

  .app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  #quizSection{grid-template-rows:48px 1fr}

  .topbar{
    grid-template-columns:1fr auto;
    gap:5px;
    padding:6px 8px 3px;
  }

  .progress-track{grid-column:1/-1}

  .progress-label,.score{
    min-width:0;
    padding:5px 8px;
    font-size:.84rem;
  }

  .content{
    margin:0 6px 6px;
    padding:5px 7px;
    grid-template-rows:auto 68px 1fr 44px 40px;
    gap:5px;
  }

  .instruction{
    min-height:36px;
    padding:2px 5px;
    font-size:1.05rem;
  }

  .prompt{
    padding:5px 8px;
    border-radius:11px;
  }

  .prompt.words{
    font-size:1.3rem;
  }

  .options{gap:6px}

  .option{
    padding:6px 8px;
    border-radius:10px;
    font-size:.84rem;
    line-height:1.25;
  }

  .fraction{
    min-width:66px;
    font-size:1.45rem;
    grid-template-rows:auto 3px auto;
  }

  .fraction .bar{
    min-width:60px;
    height:3px;
    margin:4px 0;
  }

  .feedback{
    min-height:44px;
    padding:5px 8px;
    font-size:.74rem;
  }

  .actions{min-height:40px}

  button{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.86rem;
  }
}
</style>
</head>

<body>
<main class="app" aria-live="polite">
  <section id="quizSection">
    <div class="topbar">
      <div class="progress-wrap">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">Question 1 / 10</div>
      </div>
      <div class="score" id="scoreLabel">Score : 0 / 10</div>
    </div>

    <div class="content">
      <p class="instruction" id="instruction"></p>
      <div class="prompt" id="prompt"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button id="mainButton" disabled>Valider</button>
      </div>
    </div>
  </section>

  <section class="final" id="finalSection">
    <div class="final-card">
      <div class="final-title">Exercice terminé</div>
      <div class="final-score" id="finalScore">0 / 10</div>
      <p class="final-text" id="finalText"></p>
      <button id="restartButton">Recommencer</button>
    </div>
  </section>
</main>

<script>
(() => {
  const TOTAL = 10;
  const names = {
    10: "dixièmes",
    100: "centièmes",
    1000: "millièmes"
  };

  const units = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf"];
  const teens = ["dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const tens = ["","","vingt","trente","quarante","cinquante","soixante"];

  function numberToWords(n){
    if(n < 10) return units[n];
    if(n < 20) return teens[n-10];
    if(n < 70){
      const t = Math.floor(n/10);
      const u = n%10;
      if(u === 0) return tens[t];
      if(u === 1) return tens[t] + "-et-un";
      return tens[t] + "-" + units[u];
    }
    if(n < 80){
      if(n === 71) return "soixante-et-onze";
      return "soixante-" + numberToWords(n-60);
    }
    if(n < 100){
      if(n === 80) return "quatre-vingts";
      return "quatre-vingt-" + numberToWords(n-80);
    }
    if(n < 1000){
      const h = Math.floor(n/100);
      const r = n%100;
      let head = h === 1 ? "cent" : units[h] + "-cent";
      if(r === 0 && h > 1) head += "s";
      return r === 0 ? head : head + "-" + numberToWords(r);
    }
    return String(n);
  }

  function fractionHTML(n,d){
    return `<span class="fraction"><span>${n}</span><span class="bar"></span><span>${d.toLocaleString("fr-FR")}</span></span>`;
  }

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function makeNumerator(){
    const pools = [
      () => randomInt(1,9),
      () => randomInt(10,99),
      () => randomInt(100,999)
    ];
    return pools[randomInt(0,pools.length-1)]();
  }

  function uniquePush(list, item, keyFn){
    const key = keyFn(item);
    if(!list.some(x => keyFn(x) === key)) list.push(item);
  }

  function makeFractionToWords(){
    const denoms = [10,100,1000];
    const d = denoms[randomInt(0,2)];
    const n = makeNumerator();
    const correct = `${numberToWords(n)} ${names[d]}`;

    const options = [{label:correct, correct:true}];

    const otherD = shuffle(denoms.filter(x=>x!==d));
    otherD.forEach(dd => uniquePush(options,{label:`${numberToWords(n)} ${names[dd]}`,correct:false},x=>x.label));

    const reversed = Number(String(n).split("").reverse().join(""));
    if(reversed !== n && reversed > 0 && reversed < 1000){
      uniquePush(options,{label:`${numberToWords(reversed)} ${names[d]}`,correct:false},x=>x.label);
    }

    const altered = n < 10 ? n*10 : Math.max(1,Math.floor(n/10));
    uniquePush(options,{label:`${numberToWords(altered)} ${names[d]}`,correct:false},x=>x.label);

    while(options.length < 4){
      const nn = makeNumerator();
      uniquePush(options,{label:`${numberToWords(nn)} ${names[d]}`,correct:false},x=>x.label);
    }

    return {
      type:"fractionToWords",
      instruction:"Clique sur la bonne lecture.",
      prompt:fractionHTML(n,d),
      promptClass:"",
      options:shuffle([options.find(o => o.correct), ...shuffle(options.filter(o => !o.correct)).slice(0,3)]),
      explanation:`${fractionHTML(n,d)}&nbsp;se lit <strong>${correct}</strong> : le dénominateur ${d.toLocaleString("fr-FR")} donne le nom des parts.`
    };
  }

  function makeWordsToFraction(){
    const denoms = [10,100,1000];
    const d = denoms[randomInt(0,2)];
    const n = makeNumerator();
    const wording = `${numberToWords(n)} ${names[d]}`;

    const options = [{n,d,correct:true}];

    const otherD = shuffle(denoms.filter(x=>x!==d));
    otherD.forEach(dd => uniquePush(options,{n,d:dd,correct:false},x=>`${x.n}/${x.d}`));

    const reversed = Number(String(n).split("").reverse().join(""));
    if(reversed !== n && reversed > 0 && reversed < 1000){
      uniquePush(options,{n:reversed,d,correct:false},x=>`${x.n}/${x.d}`);
    }

    const altered = n < 10 ? n*10 : Math.max(1,Math.floor(n/10));
    uniquePush(options,{n:altered,d,correct:false},x=>`${x.n}/${x.d}`);

    while(options.length < 4){
      uniquePush(options,{n:makeNumerator(),d,correct:false},x=>`${x.n}/${x.d}`);
    }

    return {
      type:"wordsToFraction",
      instruction:"Clique sur la bonne fraction.",
      prompt:wording,
      promptClass:"words",
      options:shuffle([options.find(o => o.correct), ...shuffle(options.filter(o => !o.correct)).slice(0,3)]).map(o=>({
        label:fractionHTML(o.n,o.d),
        correct:o.correct
      })),
      explanation:`<strong>${wording}</strong>&nbsp;s’écrit&nbsp;${fractionHTML(n,d)}&nbsp;: « ${names[d]} » indique le dénominateur ${d.toLocaleString("fr-FR")}.`
    };
  }

  let questions = [];
  let index = 0;
  let score = 0;
  let selectedIndex = null;
  let locked = false;

  const quizSection = document.getElementById("quizSection");
  const finalSection = document.getElementById("finalSection");
  const instruction = document.getElementById("instruction");
  const prompt = document.getElementById("prompt");
  const options = document.getElementById("options");
  const feedback = document.getElementById("feedback");
  const mainButton = document.getElementById("mainButton");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const scoreLabel = document.getElementById("scoreLabel");
  const finalScore = document.getElementById("finalScore");
  const finalText = document.getElementById("finalText");
  const restartButton = document.getElementById("restartButton");

  function buildQuestions(){
    const types = shuffle([
      "A","A","A","A","A",
      "B","B","B","B","B"
    ]);
    questions = types.map(t => t==="A" ? makeFractionToWords() : makeWordsToFraction());
  }

  function render(){
    const q = questions[index];
    selectedIndex = null;
    locked = false;
    instruction.textContent = q.instruction;
    prompt.className = "prompt" + (q.promptClass ? " " + q.promptClass : "");
    prompt.innerHTML = q.prompt;
    options.innerHTML = "";
    feedback.className = "feedback";
    feedback.innerHTML = "";
    mainButton.textContent = "Valider";
    mainButton.disabled = true;

    q.options.forEach((opt,i)=>{
      const div = document.createElement("div");
      div.className = "option";
      div.innerHTML = opt.label;
      div.setAttribute("role","button");
      div.setAttribute("tabindex","0");
      div.addEventListener("click",()=>select(i));
      div.addEventListener("keydown",(e)=>{
        if(e.key==="Enter" || e.key===" "){
          e.preventDefault();
          select(i);
        }
      });
      options.appendChild(div);
    });

    const current = index+1;
    progressLabel.textContent = `Question ${current} / ${TOTAL}`;
    progressFill.style.width = `${(current/TOTAL)*100}%`;
    scoreLabel.textContent = `Score : ${score} / ${TOTAL}`;
  }

  function select(i){
    if(locked) return;
    selectedIndex = i;
    [...options.children].forEach((el,j)=>el.classList.toggle("selected",j===i));
    mainButton.disabled = false;
  }

  function validate(){
    if(selectedIndex === null || locked) return;
    locked = true;
    const q = questions[index];
    const chosen = q.options[selectedIndex];
    const cards = [...options.children];

    cards.forEach((card,i)=>{
      card.classList.add("locked");
      if(q.options[i].correct) card.classList.add("correct");
    });

    if(chosen.correct){
      score++;
      feedback.className = "feedback show success";
      feedback.innerHTML = `<strong>✓</strong>&nbsp;${q.explanation}`;
    }else{
      cards[selectedIndex].classList.add("wrong");
      feedback.className = "feedback show error";
      feedback.innerHTML = `<strong>✗</strong>&nbsp;${q.explanation}`;
    }

    scoreLabel.textContent = `Score : ${score} / ${TOTAL}`;
    mainButton.textContent = index === TOTAL-1 ? "Voir le bilan" : "Question suivante";
    mainButton.disabled = false;
  }

  function next(){
    if(!locked){
      validate();
      return;
    }
    index++;
    if(index >= TOTAL){
      showFinal();
    }else{
      render();
    }
  }

  function showFinal(){
    quizSection.style.display = "none";
    finalSection.classList.add("show");
    finalScore.textContent = `${score} / ${TOTAL}`;
    if(score === 10){
      finalText.textContent = "Excellent ! Tu sais lire et écrire les fractions décimales dans les deux sens.";
    }else if(score >= 7){
      finalText.textContent = "Très bien. Relis attentivement le nom de l’unité : dixièmes, centièmes ou millièmes.";
    }else if(score >= 4){
      finalText.textContent = "Tu progresses. Pense à utiliser le dénominateur pour choisir entre dixièmes, centièmes et millièmes.";
    }else{
      finalText.textContent = "Reprends la lecture des fractions : le numérateur indique combien de parts sont prises et le dénominateur donne le nom des parts.";
    }
  }

  function restart(){
    index = 0;
    score = 0;
    buildQuestions();
    finalSection.classList.remove("show");
    quizSection.style.display = "";
    render();
  }

  mainButton.addEventListener("click",next);
  restartButton.addEventListener("click",restart);

  buildQuestions();
  render();
})();
</script>
</body>
</html>
