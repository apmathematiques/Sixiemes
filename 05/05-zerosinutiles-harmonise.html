<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Zéros inutiles</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --o:#9a5a11;
  --os:#fff6e9;
  --oline:#e3ad6e;

  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
}

button{font:inherit}

.app{
  width:min(100%,1080px,calc(177.777778vh - 28.444444px));
  aspect-ratio:16/9;
  min-height:0;
  max-height:calc(100vh - 16px);
  overflow:hidden;

  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#quizSection{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:11px 20px 7px;
}

.progress-wrap{display:contents}

.progress-track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.progress-fill{
  height:100%;
  width:12.5%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width .2s ease;
}

.progress-label,.score{
  min-width:128px;
  padding:7px 12px;

  color:var(--bd);
  background:var(--bs);
  border-radius:999px;

  font-size:.98rem;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
}

.content{
  min-height:0;
  margin:0 12px 10px;
  padding:12px 18px;

  display:grid;
  grid-template-columns:1.08fr .92fr;
  grid-template-rows:auto 1fr auto 46px;
  grid-template-areas:
    "instruction instruction"
    "question keypad"
    "feedback feedback"
    "actions actions";
  gap:10px 16px;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.instruction{
  grid-area:instruction;
  min-height:58px;
  margin:0;
  padding:6px 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  font-size:clamp(1.7rem,3vw,2.2rem);
  font-weight:900;
  line-height:1.2;
  text-align:center;
}

.question-panel{
  grid-area:question;
  min-height:0;

  display:grid;
  grid-template-rows:1fr 76px;
  gap:12px;
}

.number-card{
  min-height:0;
  padding:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;

  color:var(--bd);
  font-size:clamp(2.6rem,5.8vw,4.9rem);
  font-weight:900;
  letter-spacing:.02em;
  text-align:center;

  box-shadow:0 7px 18px rgba(17,63,103,.06);
  overflow-wrap:anywhere;
}

.answer-display{
  min-height:76px;
  padding:8px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  border:2px solid var(--b);
  border-radius:15px;

  color:var(--bd);
  font-size:clamp(2rem,4vw,3rem);
  font-weight:900;
  letter-spacing:.03em;
  text-align:center;

  box-shadow:inset 0 0 0 3px rgba(23,105,170,.07);
  overflow:hidden;
}

.answer-display.placeholder{
  color:#8ea0af;
  font-size:clamp(1.1rem,1.9vw,1.35rem);
  font-weight:700;
}

.keypad{
  grid-area:keypad;
  min-height:0;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:8px;
}

.key{
  min-height:44px;

  border:2px solid #cfe1ef;
  border-radius:12px;
  background:#fff;
  color:var(--bd);

  font-size:clamp(1.25rem,2.4vw,1.7rem);
  font-weight:900;

  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:transform .1s ease,border-color .1s ease,background .1s ease;
}

.key:hover{
  transform:translateY(-1px);
  border-color:var(--b);
  background:var(--bs);
}

.key:active{transform:translateY(0)}
.key.wide{grid-column:1 / span 3}

.key.utility{
  background:var(--bs);
  font-size:clamp(.92rem,1.6vw,1.05rem);
  font-weight:800;
}

.feedback{
  grid-area:feedback;
  width:min(920px,100%);
  min-height:60px;
  margin:0 auto;
  padding:9px 14px;

  border-radius:14px;
  font-size:clamp(1rem,1.6vw,1.14rem);
  font-weight:650;
  line-height:1.38;
  text-align:center;

  white-space:normal;
  overflow-wrap:anywhere;
}

.feedback:empty{visibility:hidden}
.feedback.show{visibility:visible}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.feedback.hint{
  color:var(--o);
  background:var(--os);
  border:1px solid var(--oline);
}

.feedback strong{
  display:block;
  margin-bottom:4px;
}

.actions{
  grid-area:actions;
  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.main-button{
  min-width:170px;
  min-height:46px;
  padding:0 18px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  background:var(--b);
  color:#fff;

  font-size:1.02rem;
  font-weight:850;
  line-height:1.1;

  cursor:pointer;
  transition:background .1s ease,transform .1s ease,opacity .1s ease;
}

.main-button:hover:not(:disabled){
  background:var(--bd);
  transform:translateY(-1px);
}

.main-button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.main-button:focus-visible,.key:focus-visible{
  outline:4px solid rgba(23,105,170,.22);
}

.final{
  display:none;
  height:100%;
  padding:18px;

  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.final.show{display:flex}

.final-card{
  width:min(540px,92%);
  padding:26px 24px;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

.final-title{
  margin-bottom:12px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
  font-weight:900;
}

.final-score{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;

  color:var(--bd);
  background:var(--bs);
  border-radius:999px;

  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

.final-text{
  max-width:680px;
  margin:0 auto 20px;

  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur. */
@media(max-width:760px){
  body{padding:4px}

  .app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  #quizSection{grid-template-rows:48px 1fr}

  .topbar{
    grid-template-columns:1fr auto;
    gap:5px;
    padding:6px 8px 3px;
  }

  .progress-track{grid-column:1/-1}

  .progress-label,.score{
    min-width:0;
    padding:5px 8px;
    font-size:.84rem;
  }

  .content{
    margin:0 6px 6px;
    padding:6px 8px;

    grid-template-columns:1fr .88fr;
    grid-template-rows:auto 1fr 46px 40px;
    gap:6px 8px;
  }

  .instruction{
    min-height:40px;
    padding:3px 6px;
    font-size:1.1rem;
  }

  .question-panel{
    grid-template-rows:1fr 58px;
    gap:7px;
  }

  .number-card{
    font-size:clamp(2rem,6vw,3.2rem);
    border-radius:13px;
  }

  .answer-display{
    min-height:58px;
    font-size:1.8rem;
    border-radius:12px;
  }

  .answer-display.placeholder{font-size:.95rem}

  .keypad{gap:5px}

  .key{
    min-height:34px;
    border-radius:9px;
    font-size:1.02rem;
  }

  .key.utility{font-size:.72rem}

  .feedback{
    min-height:46px;
    padding:5px 8px;
    font-size:.76rem;
  }

  .actions{min-height:40px}

  .main-button{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.86rem;
  }
}
/* Sur une vraie tablette, on garde des textes et des commandes confortables. */
.tablet-device .progress-label,.tablet-device .score{padding:9px 14px;font-size:1.15rem}
.tablet-device .instruction{font-size:clamp(1.85rem,3.1vw,2.3rem)}
.tablet-device .key{min-height:52px;font-size:clamp(1.38rem,2.5vw,1.8rem)}
.tablet-device .key.utility{font-size:1.05rem}
.tablet-device .feedback{min-height:58px;font-size:clamp(1.06rem,1.7vw,1.2rem)}
.tablet-device .main-button{min-height:54px;font-size:1.08rem}

.content.correction-mode{grid-template-rows:42px minmax(0,1fr) auto 42px;gap:5px 8px;padding-top:6px;padding-bottom:6px}
.content.correction-mode .instruction{min-height:42px;padding:3px 6px;font-size:clamp(1.4rem,2.45vw,1.75rem)}
.content.correction-mode .question-panel{grid-template-rows:1fr 58px;gap:6px}
.content.correction-mode .answer-display{min-height:58px}
.content.correction-mode .key{min-height:36px}
.content.correction-mode .feedback{min-height:44px;padding:6px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;text-align:left;font-size:clamp(.9rem,1.35vw,1.05rem);line-height:1.25}
.content.correction-mode .feedback>strong{display:inline-flex;align-items:center;justify-content:center;margin:0}
.content.correction-mode .feedback>div{min-width:0;text-align:left}
.content.correction-mode .feedback>div strong{display:inline}
.content.correction-mode .actions{min-height:42px}
.content.correction-mode .main-button{min-height:42px}
</style>
</head>

<body>
<main class="app" aria-live="polite">
  <section id="quizSection">
    <div class="topbar">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Question 1 / 10</div>
      </div>
      <div class="score" id="scoreLabel">Score : 0 / 10</div>
    </div>

    <div class="content">
      <p class="instruction">Écris ce nombre sans les zéros inutiles.</p>

      <div class="question-panel">
        <div class="number-card" id="numberCard"></div>
        <div class="answer-display placeholder" id="answerDisplay">Ta réponse</div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=",">,</button>
        <button class="key utility" data-action="backspace">⌫</button>
        <button class="key utility wide" data-action="clear">Effacer</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button class="main-button" id="mainButton" disabled>Valider</button>
      </div>
    </div>
  </section>

  <section class="final" id="finalSection">
    <div class="final-card">
      <div class="final-title">Exercice terminé</div>
      <div class="final-score" id="finalScore">0 / 10</div>
      <p class="final-text" id="finalText"></p>
      <button class="main-button" id="restartButton">Recommencer</button>
    </div>
  </section>
</main>

<script>
(() => {
  const isTabletDevice = (navigator.maxTouchPoints || 0) > 0 &&
    Math.min(screen.width || 0, screen.height || 0) >= 600;
  document.documentElement.classList.toggle('tablet-device',isTabletDevice);

  const TOTAL = 10;

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function removeUselessZeros(value){
    const [rawInteger,rawDecimal] = value.split(",");
    const integer = rawInteger.replace(/^0+(?=\d)/,"") || "0";
    if(rawDecimal === undefined) return integer;

    const decimal = rawDecimal.replace(/0+$/,"");
    return decimal ? `${integer},${decimal}` : integer;
  }

  function makeSimpleChangedQuestion(){
    const templates = [
      () => {
        const n = randomInt(1,99);
        const zeros = "0".repeat(randomInt(1,3));
        const shown = `${zeros}${n}`;
        return {shown, expected:removeUselessZeros(shown)};
      },
      () => {
        const intPart = randomInt(1,99);
        const digit = randomInt(1,9);
        const zeros = "0".repeat(randomInt(1,3));
        const shown = `${intPart},${digit}${zeros}`;
        return {shown, expected:removeUselessZeros(shown)};
      },
      () => {
        const intPart = randomInt(1,99);
        const dec = `${randomInt(1,9)}${randomInt(0,9)}`;
        const zeros = "0".repeat(randomInt(1,2));
        const shown = `${intPart},${dec}${zeros}`;
        return {shown, expected:removeUselessZeros(shown)};
      }
    ];
    const item = templates[randomInt(0,templates.length-1)]();
    return {
      shown:item.shown,
      expected:item.expected,
      unchanged:false,
      correction:`${item.shown}&nbsp;=&nbsp;<strong>${item.expected}</strong>. On enlève les zéros placés au début de la partie entière ou à la fin de la partie décimale.`
    };
  }

  function makeMediumChangedQuestion(){
    const intPart = randomInt(1,999);
    const decimals = [
      `0${randomInt(1,9)}`,
      `${randomInt(1,9)}0${randomInt(1,9)}`,
      `00${randomInt(1,9)}`,
      `${randomInt(1,9)}${randomInt(0,9)}`
    ];
    const dec = decimals[randomInt(0,decimals.length-1)];
    const leading = "0".repeat(randomInt(0,2));
    const trailing = "0".repeat(randomInt(1,3));
    const shown = `${leading}${intPart},${dec}${trailing}`;
    const expected = removeUselessZeros(shown);
    return {
      shown,
      expected,
      unchanged:false,
      correction:`${shown}&nbsp;=&nbsp;<strong>${expected}</strong>. Les zéros intérieurs restent ; seuls ceux du début de la partie entière ou de la fin de la partie décimale disparaissent.`
    };
  }

  function makeHardChangedQuestion(){
    const intPart = randomInt(1,99);
    const dec = `00${randomInt(1,9)}${randomInt(0,9)}`;
    const shown = `${"0".repeat(randomInt(2,4))}${intPart},${dec}${"0".repeat(randomInt(1,3))}`;
    const expected = removeUselessZeros(shown);
    return {
      shown,
      expected,
      unchanged:false,
      correction:`${shown}&nbsp;=&nbsp;<strong>${expected}</strong>. Les zéros entre la virgule et le premier chiffre non nul sont utiles.`
    };
  }

  function makeUnchangedQuestion(){
    const examples = [
      "400,5602",
      "80,004",
      "20,305",
      "700,0406",
      "90,708",
      "300,5004",
      "40,0602"
    ];
    const shown = examples[randomInt(0,examples.length-1)];
    return {
      shown,
      expected:shown,
      unchanged:true,
      correction:`<strong>${shown}</strong> ne change pas : les zéros situés à l’intérieur du nombre sont utiles.`
    };
  }

  function buildQuestions(){
    const changed = [
      makeSimpleChangedQuestion(),
      makeSimpleChangedQuestion(),
      makeSimpleChangedQuestion(),
      makeMediumChangedQuestion(),
      makeMediumChangedQuestion(),
      makeMediumChangedQuestion(),
      makeHardChangedQuestion()
    ];

    const unchanged = [
      makeUnchangedQuestion(),
      makeUnchangedQuestion(),
      makeUnchangedQuestion()
    ];

    const result = shuffle(changed);

    // Positions autorisées : 3 à 10 (indices 2 à 9), jamais deux questions inchangées à la suite.
    const candidatePositions = shuffle([2,3,4,5,6,7,8,9]);
    const chosenPositions = [];
    for(const pos of candidatePositions){
      if(chosenPositions.every(p => Math.abs(p-pos) > 1)){
        chosenPositions.push(pos);
        if(chosenPositions.length === 3) break;
      }
    }
    chosenPositions.sort((a,b)=>a-b);

    unchanged.forEach((q,i)=>{
      result.splice(chosenPositions[i],0,q);
    });

    return result.slice(0,10);
  }

  let questions = buildQuestions();
  let index = 0;
  let score = 0;
  let answer = "";
  let attempt = 1;
  let locked = false;

  const quizSection = document.getElementById("quizSection");
  const finalSection = document.getElementById("finalSection");
  const numberCard = document.getElementById("numberCard");
  const answerDisplay = document.getElementById("answerDisplay");
  const keypad = document.getElementById("keypad");
  const feedback = document.getElementById("feedback");
  const mainButton = document.getElementById("mainButton");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const scoreLabel = document.getElementById("scoreLabel");
  const finalScore = document.getElementById("finalScore");
  const finalText = document.getElementById("finalText");
  const restartButton = document.getElementById("restartButton");

  function formatScore(n){
    return Number.isInteger(n) ? String(n) : String(n).replace(".",",");
  }

  function currentQuestion(){ return questions[index]; }

  function updateAnswerDisplay(){
    if(answer){
      answerDisplay.textContent = answer;
      answerDisplay.classList.remove("placeholder");
    }else{
      answerDisplay.textContent = "Ta réponse";
      answerDisplay.classList.add("placeholder");
    }
    mainButton.disabled = locked || answer.length === 0;
  }

  function render(){
    const q = currentQuestion();
    answer = "";
    attempt = 1;
    locked = false;
    document.querySelector('.content').classList.remove('correction-mode');

    numberCard.textContent = q.shown;
    feedback.className = "feedback";
    feedback.innerHTML = "";
    mainButton.textContent = "Valider";
    progressLabel.textContent = `Question ${index+1} / ${TOTAL}`;
    progressFill.style.width = `${((index+1)/TOTAL)*100}%`;
    scoreLabel.textContent = `Score : ${formatScore(score)} / ${TOTAL}`;
    updateAnswerDisplay();
  }

  function appendValue(value){
    if(locked || answer.length >= 14) return;
    if(value === ","){
      if(answer.includes(",")) return;
      if(answer === "") answer = "0";
      answer += ",";
    }else{
      answer += value;
    }
    updateAnswerDisplay();
  }

  function backspace(){
    if(locked) return;
    answer = answer.slice(0,-1);
    updateAnswerDisplay();
  }

  function clearAnswer(){
    if(locked) return;
    answer = "";
    updateAnswerDisplay();
  }

  function normalize(value){
    return value.trim().replace(/\s/g,"").replace(".",",");
  }

  function validate(){
    if(locked || !answer) return;
    document.querySelector('.content').classList.add('correction-mode');

    const q = currentQuestion();
    const correct = normalize(answer) === normalize(q.expected);

    if(correct){
      locked = true;
      score += attempt === 1 ? 1 : 0.5;
      feedback.className = "feedback show success";
      feedback.innerHTML = `<strong>✓</strong><div>${q.correction}</div>`;
      scoreLabel.textContent = `Score : ${formatScore(score)} / ${TOTAL}`;
      mainButton.textContent = index === TOTAL-1 ? "Voir le bilan" : "Question suivante";
      mainButton.disabled = false;
      return;
    }

    if(attempt === 1){
      attempt = 2;
      answer = "";
      feedback.className = "feedback show hint";
      feedback.innerHTML = `<strong>Indice</strong><div>Enlève seulement les zéros placés au début de la partie entière ou à la fin de la partie décimale.</div>`;
      mainButton.textContent = "Valider le 2ᵉ essai";
      updateAnswerDisplay();
    }else{
      locked = true;
      feedback.className = "feedback show error";
      feedback.innerHTML = `<strong>✗</strong><div>${q.correction}</div>`;
      mainButton.textContent = index === TOTAL-1 ? "Voir le bilan" : "Question suivante";
      mainButton.disabled = false;
    }
  }

  function next(){
    if(!locked){
      validate();
      return;
    }
    index++;
    if(index >= TOTAL) showFinal();
    else render();
  }

  function showFinal(){
    quizSection.style.display = "none";
    finalSection.classList.add("show");
    finalScore.textContent = `${formatScore(score)} / ${TOTAL}`;

    if(score >= 9){
      finalText.textContent = "Excellent ! Tu sais reconnaître et supprimer uniquement les zéros inutiles.";
    }else if(score >= 7){
      finalText.textContent = "Très bien. Reste attentif aux zéros placés à l’intérieur du nombre : ils sont souvent utiles.";
    }else if(score >= 4.5){
      finalText.textContent = "Tu progresses. On enlève seulement les zéros avant la partie entière ou après la partie décimale.";
    }else{
      finalText.textContent = "Reprends calmement : les zéros du milieu indiquent le rang des chiffres et ne doivent pas être supprimés.";
    }
  }

  function restart(){
    questions = buildQuestions();
    index = 0;
    score = 0;
    finalSection.classList.remove("show");
    quizSection.style.display = "";
    render();
  }

  keypad.addEventListener("click",e=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    if(btn.dataset.value !== undefined) appendValue(btn.dataset.value);
    if(btn.dataset.action === "backspace") backspace();
    if(btn.dataset.action === "clear") clearAnswer();
  });

  document.addEventListener("keydown",e=>{
    if(finalSection.classList.contains("show")){
      if(e.key === "Enter") restart();
      return;
    }
    if(e.key >= "0" && e.key <= "9"){
      e.preventDefault();
      appendValue(e.key);
    }else if(e.key === "," || e.key === "."){
      e.preventDefault();
      appendValue(",");
    }else if(e.key === "Backspace"){
      e.preventDefault();
      backspace();
    }else if(e.key === "Delete" || e.key === "Escape"){
      e.preventDefault();
      clearAnswer();
    }else if(e.key === "Enter"){
      e.preventDefault();
      if(!mainButton.disabled) next();
    }
  });

  mainButton.addEventListener("click",next);
  restartButton.addEventListener("click",restart);

  render();
})();
</script>
</body>
</html>
