<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Décomposition décimale</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
}

button{font:inherit}

.app{
  width:min(100%,1080px,calc(177.777778vh - 28.444444px));
  aspect-ratio:16/9;
  min-height:0;
  max-height:calc(100vh - 16px);
  overflow:hidden;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#quizSection{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:11px 20px 7px;
}

.progress-wrap{display:contents}

.progress-track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.progress-fill{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width .2s ease;
}

.progress-label,.score{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:.98rem;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
}

.content{
  min-height:0;
  margin:0 12px 10px;
  padding:10px 18px;

  display:grid;
  grid-template-rows:auto 1fr auto 46px;
  gap:8px;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.instruction{
  min-height:48px;
  margin:0;
  padding:4px 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  font-size:clamp(1.65rem,2.9vw,2.1rem);
  font-weight:900;
  line-height:1.2;
  text-align:center;
}

.workspace{
  min-height:0;
  display:grid;
  gap:14px;
}

.workspace.input-mode{
  grid-template-columns:1.1fr .9fr;
}

.workspace.choice-mode{
  grid-template-columns:1fr;
  grid-template-rows:auto 1fr;
}

.prompt-card{
  min-height:0;
  padding:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--bd);
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;

  font-weight:900;
  text-align:center;
  box-shadow:0 7px 18px rgba(17,63,103,.06);
}

.prompt-card.number{
  min-height:92px;
  font-size:clamp(2.7rem,6vw,5rem);
}

.prompt-card.decomp{
  font-size:clamp(1.25rem,2.2vw,1.62rem);
  line-height:1.48;
  overflow-wrap:anywhere;
}

.right-panel{
  min-height:0;
  display:grid;
  grid-template-rows:70px 1fr;
  gap:9px;
}

.answer-display{
  height:70px;
  padding:8px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--bd);
  background:#fff;
  border:2px solid var(--b);
  border-radius:14px;

  font-size:clamp(1.8rem,3.8vw,2.9rem);
  font-weight:900;
  text-align:center;

  box-shadow:inset 0 0 0 3px rgba(23,105,170,.07);
  overflow:hidden;
}

.answer-display.placeholder{
  color:#8ea0af;
  font-size:clamp(1rem,1.7vw,1.2rem);
  font-weight:700;
}

.keypad{
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:7px;
}

.key{
  min-height:38px;

  border:2px solid #cfe1ef;
  border-radius:11px;
  background:#fff;
  color:var(--bd);

  font-size:clamp(1.15rem,2.2vw,1.55rem);
  font-weight:900;

  cursor:pointer;
  transition:transform .1s ease,border-color .1s ease,background .1s ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.key:hover{
  transform:translateY(-1px);
  border-color:var(--b);
  background:var(--bs);
}

.key:active{transform:translateY(0)}
.key.wide{grid-column:1 / span 3}

.key.utility{
  background:var(--bs);
  font-size:clamp(.88rem,1.55vw,1rem);
  font-weight:800;
}

.choices{
  min-height:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:10px;
}

.choice{
  min-height:0;
  padding:12px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  background:#fff;
  border:2px solid #cfe1ef;
  border-radius:14px;

  font-size:clamp(1rem,1.7vw,1.18rem);
  font-weight:750;
  line-height:1.42;
  text-align:center;

  cursor:pointer;
  transition:transform .1s ease,border-color .1s ease,background .1s ease,box-shadow .1s ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  overflow-wrap:anywhere;
}

.choice:hover:not(.locked){
  transform:translateY(-1px);
  border-color:#9fc8e5;
  box-shadow:0 5px 12px rgba(17,63,103,.07);
}

.choice.selected{
  color:var(--bd);
  border-color:var(--b);
  background:var(--bs);
  box-shadow:0 0 0 3px rgba(23,105,170,.10);
}

.choice.correct{
  color:#165e36;
  border-color:var(--g);
  background:var(--gs);
}

.choice.wrong{
  color:#8f2727;
  border-color:var(--r);
  background:var(--rs);
}

.choice.locked{cursor:default}

.feedback{
  width:min(920px,100%);
  min-height:58px;
  margin:0 auto;
  padding:8px 14px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;

  border-radius:14px;
  font-size:clamp(.98rem,1.55vw,1.12rem);
  font-weight:650;
  line-height:1.35;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
}

.feedback:empty{visibility:hidden}
.feedback.show{visibility:visible}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.feedback strong{
  display:block;
  margin:0;
}

.actions{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.main-button{
  min-width:170px;
  min-height:46px;
  padding:0 18px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  background:var(--b);
  color:#fff;

  font-size:1.02rem;
  font-weight:850;
  line-height:1.1;

  cursor:pointer;
  transition:background .1s ease,transform .1s ease,opacity .1s ease;
}

.main-button:hover:not(:disabled){
  background:var(--bd);
  transform:translateY(-1px);
}

.main-button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.main-button:focus-visible,.key:focus-visible,.choice:focus-visible{
  outline:4px solid rgba(23,105,170,.22);
}

.final{
  display:none;
  height:100%;
  padding:18px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.final.show{display:flex}

.final-card{
  width:min(540px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

.final-title{
  margin-bottom:12px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
  font-weight:900;
}

.final-score{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;

  color:var(--bd);
  background:var(--bs);
  border-radius:999px;

  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

.final-text{
  max-width:680px;
  margin:0 auto 20px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur. */
@media(max-width:760px){
  body{padding:4px}

  .app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  #quizSection{grid-template-rows:48px 1fr}

  .topbar{
    grid-template-columns:1fr auto;
    gap:5px;
    padding:6px 8px 3px;
  }

  .progress-track{grid-column:1/-1}

  .progress-label,.score{
    min-width:0;
    padding:5px 8px;
    font-size:.84rem;
  }

  .content{
    margin:0 6px 6px;
    padding:5px 7px;
    grid-template-rows:auto 1fr auto 40px;
    gap:5px;
  }

  .instruction{
    min-height:36px;
    padding:2px 5px;
    font-size:1.05rem;
  }

  .workspace{gap:7px}

  .workspace.input-mode{
    grid-template-columns:1fr .86fr;
  }

  .prompt-card{
    padding:8px;
    border-radius:12px;
  }

  .prompt-card.number{
    min-height:64px;
    font-size:2.2rem;
  }

  .prompt-card.decomp{
    font-size:.96rem;
    line-height:1.35;
  }

  .right-panel{
    grid-template-rows:54px 1fr;
    gap:5px;
  }

  .answer-display{
    height:54px;
    padding:5px 8px;
    font-size:1.55rem;
    border-radius:11px;
  }

  .answer-display.placeholder{font-size:.82rem}

  .keypad{gap:4px}

  .key{
    min-height:30px;
    border-radius:8px;
    font-size:.96rem;
  }

  .key.utility{font-size:.68rem}

  .choices{gap:6px}

  .choice{
    padding:7px 8px;
    border-radius:10px;
    font-size:.78rem;
    line-height:1.28;
  }

  .feedback{
    min-height:44px;
    padding:5px 8px;
    font-size:.76rem;
  }

  .actions{min-height:40px}

  .main-button{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.86rem;
  }
}
/* Sur une vraie tablette, on garde des textes et des commandes confortables. */
.tablet-device .progress-label,.tablet-device .score{padding:9px 14px;font-size:1.15rem}
.tablet-device .instruction{font-size:clamp(1.8rem,3vw,2.25rem)}
.tablet-device .prompt-card.decomp{font-size:clamp(1.35rem,2.25vw,1.7rem)}
.tablet-device .key{min-height:48px;font-size:clamp(1.3rem,2.3vw,1.65rem)}
.tablet-device .choice{font-size:clamp(1.08rem,1.8vw,1.25rem)}
.tablet-device .feedback{min-height:58px;font-size:clamp(1.06rem,1.7vw,1.2rem)}
.tablet-device .main-button{min-height:54px;font-size:1.08rem}

.content.correction-mode{grid-template-rows:42px minmax(0,1fr) auto 42px;gap:5px;padding-top:6px;padding-bottom:6px}
.content.correction-mode .instruction{min-height:42px;padding:3px 6px;font-size:clamp(1.4rem,2.45vw,1.75rem)}
.content.correction-mode .workspace{gap:6px}
.content.correction-mode .prompt-card{padding:8px}
.content.correction-mode .prompt-card.number{min-height:64px;font-size:2.2rem}
.content.correction-mode .prompt-card.decomp{font-size:1.05rem;line-height:1.35}
.content.correction-mode .right-panel{grid-template-rows:54px 1fr;gap:5px}
.content.correction-mode .answer-display{height:54px}
.content.correction-mode .key{min-height:34px}
.content.correction-mode .choices{gap:6px}
.content.correction-mode .choice{padding:6px 8px;font-size:.96rem;line-height:1.3}
.content.correction-mode .feedback{min-height:44px;padding:6px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;text-align:left;font-size:clamp(.9rem,1.35vw,1.05rem);line-height:1.25}
.content.correction-mode .feedback>strong{display:inline-flex;align-items:center;justify-content:center;margin:0}
.content.correction-mode .feedback>div{min-width:0;text-align:left}
.content.correction-mode .feedback>div strong{display:inline}
.content.correction-mode .actions{min-height:42px}
.content.correction-mode .main-button{min-height:42px}
</style>
</head>

<body>
<main class="app" aria-live="polite">
  <section id="quizSection">
    <div class="topbar">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Question 1 / 10</div>
      </div>
      <div class="score" id="scoreLabel">Score : 0 / 10</div>
    </div>

    <div class="content">
      <p class="instruction" id="instruction"></p>

      <div class="workspace input-mode" id="workspace">
        <div class="prompt-card" id="promptCard"></div>

        <div class="right-panel" id="rightPanel">
          <div class="answer-display placeholder" id="answerDisplay">Ta réponse</div>
          <div class="keypad" id="keypad">
            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key" data-value="0">0</button>
            <button class="key" data-value=",">,</button>
            <button class="key utility" data-action="backspace">⌫</button>
            <button class="key utility wide" data-action="clear">Effacer</button>
          </div>
        </div>

        <div class="choices" id="choices" hidden></div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button class="main-button" id="mainButton" disabled>Valider</button>
      </div>
    </div>
  </section>

  <section class="final" id="finalSection">
    <div class="final-card">
      <div class="final-title">Exercice terminé</div>
      <div class="final-score" id="finalScore">0 / 10</div>
      <p class="final-text" id="finalText"></p>
      <button class="main-button" id="restartButton">Recommencer</button>
    </div>
  </section>
</main>

<script>
(() => {
  const isTabletDevice = (navigator.maxTouchPoints || 0) > 0 &&
    Math.min(screen.width || 0, screen.height || 0) >= 600;
  document.documentElement.classList.toggle('tablet-device',isTabletDevice);

  const TOTAL = 10;
  const PLACE_VALUES = [
    {name:"milliers", factor:1000, label:"1 000"},
    {name:"centaines", factor:100, label:"100"},
    {name:"dizaines", factor:10, label:"10"},
    {name:"unités", factor:1, label:"1"},
    {name:"dixièmes", factor:0.1, label:"0,1"},
    {name:"centièmes", factor:0.01, label:"0,01"},
    {name:"millièmes", factor:0.001, label:"0,001"}
  ];

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function formatDecimalNumber(value){
    const s = value.toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
    const [intPart,decPart] = s.split(".");
    const formattedInt = Number(intPart).toLocaleString("fr-FR");
    return decPart ? `${formattedInt},${decPart}` : formattedInt;
  }

  function decompToHTML(terms){
    return terms.map(t => `${t.digit} × ${t.label}`).join(" + ");
  }

  function buildDigits(){
    let digits;
    do{
      digits = [
        randomInt(0,9),
        randomInt(0,9),
        randomInt(0,9),
        randomInt(0,9),
        randomInt(0,9),
        randomInt(0,9),
        randomInt(0,9)
      ];
    }while(digits.every(d=>d===0) || digits.slice(0,4).every(d=>d===0));
    return digits;
  }

  function numberFromDigits(digits){
    return digits.reduce((sum,d,i)=>sum+d*PLACE_VALUES[i].factor,0);
  }

  function termsFromDigits(digits){
    return digits.map((d,i)=>({
      digit:d,
      factor:PLACE_VALUES[i].factor,
      label:PLACE_VALUES[i].label,
      rank:PLACE_VALUES[i].name
    })).filter(t=>t.digit!==0);
  }

  function mutateDigits(digits){
    const variants = [];

    {
      const a=[...digits];
      [a[4],a[5]]=[a[5],a[4]];
      variants.push(a);
    }
    {
      const a=[...digits];
      [a[5],a[6]]=[a[6],a[5]];
      variants.push(a);
    }
    {
      const a=[...digits];
      a[4]=0;a[5]=digits[4];a[6]=digits[5];
      variants.push(a);
    }
    {
      const a=[...digits];
      const idx=randomInt(0,6);
      a[idx]=(a[idx]+randomInt(1,8))%10;
      variants.push(a);
    }
    {
      const a=[...digits];
      const nonzero=a.map((d,i)=>d!==0?i:null).filter(i=>i!==null);
      if(nonzero.length){
        a[nonzero[randomInt(0,nonzero.length-1)]]=0;
      }
      variants.push(a);
    }

    return variants;
  }

  function makeDecompToNumber(){
    const digits=buildDigits();
    const number=numberFromDigits(digits);
    return {
      type:"decompToNumber",
      digits,
      number,
      expected:formatDecimalNumber(number),
      instruction:"Écris le nombre correspondant à cette décomposition.",
      prompt:decompToHTML(termsFromDigits(digits)),
      correction:`${decompToHTML(termsFromDigits(digits))}&nbsp;=&nbsp;<strong>${formatDecimalNumber(number)}</strong>.`
    };
  }

  function makeNumberToDecomp(){
    const digits=buildDigits();
    const number=numberFromDigits(digits);
    const correct=decompToHTML(termsFromDigits(digits));

    const options=[{label:correct,correct:true}];
    const seen=new Set([correct]);

    for(const variant of mutateDigits(digits)){
      const label=decompToHTML(termsFromDigits(variant));
      if(label && !seen.has(label)){
        seen.add(label);
        options.push({label,correct:false});
      }
      if(options.length===4) break;
    }

    while(options.length<4){
      const a=[...digits];
      const idx=randomInt(0,6);
      a[idx]=(a[idx]+randomInt(1,9))%10;
      const label=decompToHTML(termsFromDigits(a));
      if(label && !seen.has(label)){
        seen.add(label);
        options.push({label,correct:false});
      }
    }

    return {
      type:"numberToDecomp",
      digits,
      number,
      expected:correct,
      instruction:"Clique sur la bonne décomposition.",
      prompt:formatDecimalNumber(number),
      options:shuffle(options),
      correction:`${formatDecimalNumber(number)}&nbsp;=&nbsp;<strong>${correct}</strong>.`
    };
  }

  function buildQuestions(){
    return shuffle([
      makeDecompToNumber(),makeDecompToNumber(),makeDecompToNumber(),makeDecompToNumber(),makeDecompToNumber(),
      makeNumberToDecomp(),makeNumberToDecomp(),makeNumberToDecomp(),makeNumberToDecomp(),makeNumberToDecomp()
    ]);
  }

  let questions=buildQuestions();
  let index=0;
  let score=0;
  let answer="";
  let selectedIndex=null;
  let locked=false;

  const quizSection=document.getElementById("quizSection");
  const finalSection=document.getElementById("finalSection");
  const instruction=document.getElementById("instruction");
  const workspace=document.getElementById("workspace");
  const promptCard=document.getElementById("promptCard");
  const rightPanel=document.getElementById("rightPanel");
  const answerDisplay=document.getElementById("answerDisplay");
  const keypad=document.getElementById("keypad");
  const choices=document.getElementById("choices");
  const feedback=document.getElementById("feedback");
  const mainButton=document.getElementById("mainButton");
  const progressFill=document.getElementById("progressFill");
  const progressLabel=document.getElementById("progressLabel");
  const scoreLabel=document.getElementById("scoreLabel");
  const finalScore=document.getElementById("finalScore");
  const finalText=document.getElementById("finalText");
  const restartButton=document.getElementById("restartButton");

  function currentQuestion(){return questions[index]}

  function updateAnswerDisplay(){
    if(answer){
      answerDisplay.textContent=answer;
      answerDisplay.classList.remove("placeholder");
    }else{
      answerDisplay.textContent="Ta réponse";
      answerDisplay.classList.add("placeholder");
    }
    mainButton.disabled=locked || answer.length===0;
  }

  function renderChoices(q){
    choices.innerHTML="";
    q.options.forEach((opt,i)=>{
      const div=document.createElement("div");
      div.className="choice";
      div.textContent=opt.label;
      div.setAttribute("role","button");
      div.setAttribute("tabindex","0");
      div.addEventListener("click",()=>selectChoice(i));
      div.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){e.preventDefault();selectChoice(i)}
      });
      choices.appendChild(div);
    });
  }

  function render(){
    const q=currentQuestion();
    answer="";
    selectedIndex=null;
    locked=false;
    document.querySelector('.content').classList.remove('correction-mode');
    instruction.textContent=q.instruction;
    feedback.className="feedback";
    feedback.innerHTML="";
    mainButton.textContent="Valider";

    if(q.type==="decompToNumber"){
      workspace.className="workspace input-mode";
      promptCard.className="prompt-card decomp";
      promptCard.textContent=q.prompt;
      rightPanel.hidden=false;
      choices.hidden=true;
      updateAnswerDisplay();
    }else{
      workspace.className="workspace choice-mode";
      promptCard.className="prompt-card number";
      promptCard.textContent=q.prompt;
      rightPanel.hidden=true;
      choices.hidden=false;
      renderChoices(q);
      mainButton.disabled=true;
    }

    progressLabel.textContent=`Question ${index+1} / ${TOTAL}`;
    progressFill.style.width=`${((index+1)/TOTAL)*100}%`;
    scoreLabel.textContent=`Score : ${score} / ${TOTAL}`;
  }

  function appendValue(value){
    if(locked || currentQuestion().type!=="decompToNumber" || answer.length>=12) return;
    if(value===","){
      if(answer.includes(",")) return;
      if(answer==="") answer="0";
      answer+=",";
    }else{
      if(answer==="0" && !answer.includes(",")) answer=value;
      else answer+=value;
    }
    updateAnswerDisplay();
  }

  function backspace(){
    if(locked || currentQuestion().type!=="decompToNumber") return;
    answer=answer.slice(0,-1);
    updateAnswerDisplay();
  }

  function clearAnswer(){
    if(locked || currentQuestion().type!=="decompToNumber") return;
    answer="";
    updateAnswerDisplay();
  }

  function selectChoice(i){
    if(locked || currentQuestion().type!=="numberToDecomp") return;
    selectedIndex=i;
    [...choices.children].forEach((el,j)=>el.classList.toggle("selected",j===i));
    mainButton.disabled=false;
  }

  function normalizeDecimal(value){
    let v=value.trim().replace(/\s/g,"").replace(".",",");
    if(v.endsWith(",")) v=v.slice(0,-1);
    const num=Number(v.replace(",","."));
    if(Number.isNaN(num)) return null;
    return formatDecimalNumber(num);
  }

  function validate(){
    if(locked) return;
    document.querySelector('.content').classList.add('correction-mode');
    const q=currentQuestion();
    let correct=false;

    if(q.type==="decompToNumber"){
      if(!answer) return;
      correct=normalizeDecimal(answer)===q.expected;
    }else{
      if(selectedIndex===null) return;
      correct=q.options[selectedIndex].correct;
      [...choices.children].forEach((card,i)=>{
        card.classList.add("locked");
        if(q.options[i].correct) card.classList.add("correct");
      });
      if(!correct) choices.children[selectedIndex].classList.add("wrong");
    }

    locked=true;
    if(correct){
      score++;
      feedback.className="feedback show success";
      feedback.innerHTML=`<strong>✓</strong><div>${q.correction}</div>`;
    }else{
      feedback.className="feedback show error";
      feedback.innerHTML=`<strong>✗</strong><div>${q.correction}</div>`;
    }

    scoreLabel.textContent=`Score : ${score} / ${TOTAL}`;
    mainButton.textContent=index===TOTAL-1 ? "Voir le bilan" : "Question suivante";
    mainButton.disabled=false;
  }

  function next(){
    if(!locked){validate();return}
    index++;
    if(index>=TOTAL) showFinal();
    else render();
  }

  function showFinal(){
    quizSection.style.display="none";
    finalSection.classList.add("show");
    finalScore.textContent=`${score} / ${TOTAL}`;
    if(score===10){
      finalText.textContent="Excellent ! Tu maîtrises la décomposition multiplicative des nombres décimaux.";
    }else if(score>=8){
      finalText.textContent="Très bien. Reste attentif à la valeur de chaque chiffre selon son rang.";
    }else if(score>=5){
      finalText.textContent="Tu progresses. Vérifie bien les dixièmes, centièmes et millièmes.";
    }else{
      finalText.textContent="Reprends calmement : chaque chiffre est multiplié par la valeur de son rang.";
    }
  }

  function restart(){
    questions=buildQuestions();
    index=0;score=0;
    finalSection.classList.remove("show");
    quizSection.style.display="";
    render();
  }

  keypad.addEventListener("click",e=>{
    const btn=e.target.closest("button");
    if(!btn) return;
    if(btn.dataset.value!==undefined) appendValue(btn.dataset.value);
    if(btn.dataset.action==="backspace") backspace();
    if(btn.dataset.action==="clear") clearAnswer();
  });

  document.addEventListener("keydown",e=>{
    if(finalSection.classList.contains("show")){
      if(e.key==="Enter") restart();
      return;
    }
    const q=currentQuestion();
    if(q.type==="decompToNumber"){
      if(e.key>="0"&&e.key<="9"){e.preventDefault();appendValue(e.key)}
      else if(e.key===","||e.key==="."){e.preventDefault();appendValue(",")}
      else if(e.key==="Backspace"){e.preventDefault();backspace()}
      else if(e.key==="Delete"||e.key==="Escape"){e.preventDefault();clearAnswer()}
    }
    if(e.key==="Enter" && !mainButton.disabled){e.preventDefault();next()}
  });

  mainButton.addEventListener("click",next);
  restartButton.addEventListener("click",restart);
  render();
})();
</script>
</body>
</html>
