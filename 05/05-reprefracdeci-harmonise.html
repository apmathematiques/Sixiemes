<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Représenter une fraction décimale</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
}

button{font:inherit}

.app{
  width:min(100%,1080px,calc(177.777778vh - 28.444444px));
  aspect-ratio:16/9;
  min-height:0;
  max-height:calc(100vh - 16px);
  overflow:hidden;

  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#quizSection{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:11px 20px 7px;
}

.progress-wrap{display:contents}

.progress-track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.progress-fill{
  width:20%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width .2s ease;
}

.progress-label,.score{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:.98rem;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
}

.content{
  min-height:0;
  margin:0 12px 10px;
  padding:10px 18px;

  display:grid;
  grid-template-rows:auto 1fr auto 46px;
  gap:8px;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.instruction{
  min-height:48px;
  margin:0;
  padding:4px 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  font-size:clamp(1.7rem,3vw,2.2rem);
  font-weight:900;
  line-height:1.2;
  text-align:center;
}

.exercise-area{
  min-height:0;
  display:grid;
  gap:12px;
}

.exercise-area.tenths-layout{
  grid-template-rows:1fr 174px;
}

.exercise-area.hundredths-layout{
  grid-template-columns:minmax(300px,1.1fr) minmax(280px,.9fr);
  align-items:stretch;
}

.visual{
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 7px 18px rgba(17,63,103,.05);
}

.hundredths-layout .visual{padding:14px}

.tenths-strip{
  width:min(90%,760px);
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
}

.tenths-cell{
  aspect-ratio:1.55/1;
  border:2px solid #718291;
  border-radius:6px;
  background:#fff;
}

.tenths-cell.filled{
  background:var(--b);
  border-color:var(--bd);
}

.hundredths-grid{
  width:min(70%,240px);
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(10,1fr);

  border:2px solid #718291;
  background:#fff;
}

.hundredths-cell{
  border-right:1px solid #c6d2dc;
  border-bottom:1px solid #c6d2dc;
}

.hundredths-cell:nth-child(10n){border-right:0}
.hundredths-cell:nth-last-child(-n+10){border-bottom:0}
.hundredths-cell.filled{background:var(--b)}

.options{
  min-height:0;
  display:grid;
  gap:10px;
}

.tenths-layout .options{
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
}

.hundredths-layout .options{
  grid-template-columns:1fr;
  grid-template-rows:repeat(4,minmax(0,1fr));
}

.option{
  min-height:0;
  padding:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #cfe1ef;
  border-radius:14px;
  background:#fff;
  color:var(--bd);

  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:transform .1s ease,border-color .1s ease,background .1s ease,box-shadow .1s ease;
}

.option:hover:not(.locked){
  transform:translateY(-1px);
  border-color:#9fc8e5;
  box-shadow:0 5px 12px rgba(17,63,103,.07);
}

.option.selected{
  border-color:var(--b);
  background:var(--bs);
  box-shadow:0 0 0 3px rgba(23,105,170,.10);
}

.option.correct{
  color:#165e36;
  border-color:var(--g);
  background:var(--gs);
}

.option.wrong{
  color:#8f2727;
  border-color:var(--r);
  background:var(--rs);
}

.option.locked{cursor:default}

.fraction{
  color:inherit;
  display:inline-grid;
  grid-template-rows:auto 4px auto;
  align-items:center;
  justify-items:center;
  min-width:88px;

  font-size:clamp(1.7rem,3.2vw,2.4rem);
  line-height:1;
  font-weight:900;
  vertical-align:middle;
}

.fraction .bar{
  width:100%;
  min-width:80px;
  height:4px;
  background:currentColor;
  border-radius:3px;
  margin:6px 0;
}

.feedback{
  width:min(920px,100%);
  min-height:60px;
  margin:0 auto;
  padding:8px 14px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;

  border-radius:14px;

  font-size:clamp(.98rem,1.55vw,1.12rem);
  font-weight:650;
  line-height:1.35;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
}

.feedback:empty{visibility:hidden}
.feedback.show{visibility:visible}

/* Avant validation, le feedback vide ne doit pas prendre la place des réponses. */
.content:not(.correction-mode) .feedback:empty{
  min-height:0;
  height:0;
  padding:0;
  border:0;
}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.feedback strong{
  display:block;
  margin:0;
}

.feedback .fraction{
  font-size:1.05rem!important;
  min-width:40px;
  grid-template-rows:auto 2px auto;
}

.feedback .fraction .bar{
  min-width:36px;
  height:2px;
  margin:2px 0;
}

.actions{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  min-width:170px;
  min-height:46px;
  padding:0 18px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  background:var(--b);
  color:#fff;

  font-size:1.02rem;
  font-weight:850;
  line-height:1.1;

  cursor:pointer;
  transition:background .1s ease,transform .1s ease,opacity .1s ease;
}

button:hover:not(:disabled){
  background:var(--bd);
  transform:translateY(-1px);
}

button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

button:focus-visible,.option:focus-visible{
  outline:4px solid rgba(23,105,170,.22);
}

.final{
  display:none;
  height:100%;
  padding:18px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.final.show{display:flex}

.final-card{
  width:min(540px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

.final-title{
  margin:0 0 14px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
  font-weight:900;
}

.final-score{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

.final-text{
  max-width:680px;
  margin:0 auto 20px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur. */
@media(max-width:760px){
  body{padding:4px}

  .app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  #quizSection{grid-template-rows:48px 1fr}

  .topbar{
    grid-template-columns:1fr auto;
    gap:5px;
    padding:6px 8px 3px;
  }

  .progress-track{grid-column:1/-1}

  .progress-label,.score{
    min-width:0;
    padding:5px 8px;
    font-size:.84rem;
  }

  .content{
    margin:0 6px 6px;
    padding:5px 7px;
    grid-template-rows:auto 1fr 44px 40px;
    gap:5px;
  }

  .instruction{
    min-height:36px;
    padding:2px 5px;
    font-size:1.05rem;
  }

  .exercise-area{gap:6px}

  .exercise-area.tenths-layout{
    grid-template-rows:1fr 136px;
  }

  .exercise-area.hundredths-layout{
    grid-template-columns:minmax(210px,1fr) minmax(180px,.85fr);
  }

  .visual{
    padding:6px;
    border-radius:11px;
  }

  .tenths-strip{width:96%;gap:2px}
  .tenths-cell{border-width:1px}

  .hundredths-grid{
    width:min(62%,150px);
  }

  .options{gap:5px}

  .option{
    padding:5px;
    border-radius:9px;
  }

  .fraction{
    min-width:60px;
    font-size:1.35rem;
    grid-template-rows:auto 3px auto;
  }

  .fraction .bar{
    min-width:54px;
    height:3px;
    margin:4px 0;
  }

  .feedback{
    min-height:44px;
    padding:5px 8px;
    font-size:.74rem;
  }

  .actions{min-height:40px}

  button{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.86rem;
  }
}
/* Sur une vraie tablette, on garde des textes et des commandes confortables. */
.tablet-device .progress-label,.tablet-device .score{padding:9px 14px;font-size:1.15rem}
.tablet-device .instruction{font-size:clamp(1.85rem,3.1vw,2.3rem)}
.tablet-device .options .fraction{font-size:clamp(1.95rem,3.5vw,2.65rem)}
.tablet-device .exercise-area.tenths-layout{grid-template-rows:minmax(72px,1fr) 224px}
.tablet-device .tenths-layout .option{min-height:107px;padding:3px 8px}
.tablet-device .hundredths-layout .options{
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
}
.tablet-device .hundredths-layout .option{padding:5px}
.tablet-device .feedback{min-height:58px;font-size:clamp(1.06rem,1.7vw,1.2rem)}
.tablet-device .actions button{min-height:54px;font-size:1.08rem}

.content.correction-mode{grid-template-rows:42px minmax(0,1fr) auto 42px;gap:5px;padding-top:6px;padding-bottom:6px}
.content.correction-mode .instruction{min-height:42px;padding:3px 6px;font-size:clamp(1.4rem,2.45vw,1.75rem)}
.content.correction-mode .exercise-area{gap:6px}
.content.correction-mode .exercise-area.tenths-layout{grid-template-rows:1fr 126px}
.content.correction-mode .visual{padding:6px}
.content.correction-mode .options{gap:5px}
.content.correction-mode .option{padding:5px}
.content.correction-mode .options .fraction{min-width:60px;font-size:1.4rem;grid-template-rows:auto 3px auto}
.content.correction-mode .options .fraction .bar{min-width:56px;height:3px;margin:4px 0}
.content.correction-mode .feedback{min-height:44px;padding:6px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;text-align:left;font-size:clamp(.9rem,1.35vw,1.05rem);line-height:1.25}
.content.correction-mode .feedback>strong{display:inline-flex;align-items:center;justify-content:center;margin:0}
.content.correction-mode .feedback>div{min-width:0;text-align:left}
.content.correction-mode .feedback>div strong{display:inline}
.content.correction-mode .actions{min-height:42px}
.content.correction-mode .actions button{min-height:42px}
</style>
</head>

<body>
<main class="app" aria-live="polite">
  <section id="quizSection">
    <div class="topbar">
      <div class="progress-wrap">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">Question 1 / 8</div>
      </div>
      <div class="score" id="scoreLabel">Score : 0 / 8</div>
    </div>

    <div class="content">
      <p class="instruction">Clique sur la fraction représentée.</p>

      <div class="exercise-area tenths-layout" id="exerciseArea">
        <div class="visual" id="visual"></div>
        <div class="options" id="options"></div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button id="mainButton" disabled>Valider</button>
      </div>
    </div>
  </section>

  <section class="final" id="finalSection">
    <div class="final-card">
      <div class="final-title">Exercice terminé</div>
      <div class="final-score" id="finalScore">0 / 8</div>
      <p class="final-text" id="finalText"></p>
      <button id="restartButton">Recommencer</button>
    </div>
  </section>
</main>

<script>
(() => {
  const isTabletDevice = (navigator.maxTouchPoints || 0) > 0 &&
    Math.min(screen.width || 0, screen.height || 0) >= 600;
  document.documentElement.classList.toggle('tablet-device',isTabletDevice);

  const TOTAL = 8;

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function fractionHTML(n,d){
    return `<span class="fraction"><span>${n}</span><span class="bar"></span><span>${d}</span></span>`;
  }

  function uniqueFractions(items){
    const seen = new Set();
    return items.filter(item=>{
      const key = `${item.n}/${item.d}`;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function makeTenthsQuestion(){
    const n = randomInt(1,9);
    const complement = 10-n;
    let distractors = [
      {n:complement,d:10},
      {n:n,d:100},
      {n:complement,d:100},
      {n:Math.max(1,n-1),d:10},
      {n:Math.min(9,n+1),d:10}
    ];
    distractors = shuffle(uniqueFractions(distractors).filter(x=>!(x.n===n && x.d===10))).slice(0,3);

    return {
      type:"tenths",
      n,
      d:10,
      options:shuffle([{n,d:10,correct:true},...distractors.map(x=>({...x,correct:false}))]),
      explanation:`${n}&nbsp;part${n>1?"s":""} sur 10 ${n>1?"sont colorées":"est colorée"} : la fraction est&nbsp;${fractionHTML(n,10)}.`
    };
  }

  function makeHundredthsQuestion(){
    let n;
    do{
      n = randomInt(5,95);
    }while(n===50);

    const reversed = Number(String(n).padStart(2,"0").split("").reverse().join(""));
    const complement = 100-n;
    let distractors = [
      {n:reversed,d:100},
      {n:n,d:10},
      {n:complement,d:100},
      {n:Math.max(1,n-10),d:100},
      {n:Math.min(99,n+10),d:100}
    ];
    distractors = shuffle(uniqueFractions(distractors).filter(x=>!(x.n===n && x.d===100))).slice(0,3);

    return {
      type:"hundredths",
      n,
      d:100,
      options:shuffle([{n,d:100,correct:true},...distractors.map(x=>({...x,correct:false}))]),
      explanation:`${n}&nbsp;cases sur 100 sont colorées : la fraction est&nbsp;${fractionHTML(n,100)}.`
    };
  }

  function buildQuestions(){
    return shuffle([
      makeTenthsQuestion(),
      makeTenthsQuestion(),
      makeTenthsQuestion(),
      makeTenthsQuestion(),
      makeHundredthsQuestion(),
      makeHundredthsQuestion(),
      makeHundredthsQuestion(),
      makeHundredthsQuestion()
    ]);
  }

  let questions = buildQuestions();
  let index = 0;
  let score = 0;
  let selectedIndex = null;
  let locked = false;

  const quizSection = document.getElementById("quizSection");
  const finalSection = document.getElementById("finalSection");
  const exerciseArea = document.getElementById("exerciseArea");
  const visual = document.getElementById("visual");
  const options = document.getElementById("options");
  const feedback = document.getElementById("feedback");
  const mainButton = document.getElementById("mainButton");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const scoreLabel = document.getElementById("scoreLabel");
  const finalScore = document.getElementById("finalScore");
  const finalText = document.getElementById("finalText");
  const restartButton = document.getElementById("restartButton");

  function renderVisual(q){
    visual.innerHTML = "";
    if(q.type === "tenths"){
      const strip = document.createElement("div");
      strip.className = "tenths-strip";
      for(let i=0;i<10;i++){
        const cell = document.createElement("div");
        cell.className = "tenths-cell" + (i<q.n ? " filled" : "");
        strip.appendChild(cell);
      }
      visual.appendChild(strip);
    }else{
      const grid = document.createElement("div");
      grid.className = "hundredths-grid";
      const filledIndexes = new Set(shuffle([...Array(100).keys()]).slice(0,q.n));
      for(let i=0;i<100;i++){
        const cell = document.createElement("div");
        cell.className = "hundredths-cell" + (filledIndexes.has(i) ? " filled" : "");
        grid.appendChild(cell);
      }
      visual.appendChild(grid);
    }
  }

  function render(){
    const q = questions[index];
    selectedIndex = null;
    locked = false;
    document.querySelector('.content').classList.remove('correction-mode');
    exerciseArea.className = "exercise-area " + (q.type === "hundredths" ? "hundredths-layout" : "tenths-layout");
    renderVisual(q);
    options.innerHTML = "";
    feedback.className = "feedback";
    feedback.innerHTML = "";
    mainButton.textContent = "Valider";
    mainButton.disabled = true;

    q.options.forEach((opt,i)=>{
      const div = document.createElement("div");
      div.className = "option";
      div.innerHTML = fractionHTML(opt.n,opt.d);
      div.setAttribute("role","button");
      div.setAttribute("tabindex","0");
      div.addEventListener("click",()=>select(i));
      div.addEventListener("keydown",(e)=>{
        if(e.key==="Enter" || e.key===" "){
          e.preventDefault();
          select(i);
        }
      });
      options.appendChild(div);
    });

    const current = index+1;
    progressLabel.textContent = `Question ${current} / ${TOTAL}`;
    progressFill.style.width = `${(current/TOTAL)*100}%`;
    scoreLabel.textContent = `Score : ${score} / ${TOTAL}`;
  }

  function select(i){
    if(locked) return;
    selectedIndex = i;
    [...options.children].forEach((el,j)=>el.classList.toggle("selected",j===i));
    mainButton.disabled = false;
  }

  function validate(){
    if(selectedIndex === null || locked) return;
    document.querySelector('.content').classList.add('correction-mode');
    locked = true;
    const q = questions[index];
    const chosen = q.options[selectedIndex];
    const cards = [...options.children];

    cards.forEach((card,i)=>{
      card.classList.add("locked");
      if(q.options[i].correct) card.classList.add("correct");
    });

    if(chosen.correct){
      score++;
      feedback.className = "feedback show success";
      feedback.innerHTML = `<strong>✓</strong><div>${q.explanation}</div>`;
    }else{
      cards[selectedIndex].classList.add("wrong");
      feedback.className = "feedback show error";
      feedback.innerHTML = `<strong>✗</strong><div>${q.explanation}</div>`;
    }

    scoreLabel.textContent = `Score : ${score} / ${TOTAL}`;
    mainButton.textContent = index === TOTAL-1 ? "Voir le bilan" : "Question suivante";
    mainButton.disabled = false;
  }

  function next(){
    if(!locked){
      validate();
      return;
    }
    index++;
    if(index >= TOTAL){
      showFinal();
    }else{
      render();
    }
  }

  function showFinal(){
    quizSection.style.display = "none";
    finalSection.classList.add("show");
    finalScore.textContent = `${score} / ${TOTAL}`;
    if(score === 8){
      finalText.textContent = "Excellent ! Tu sais associer une représentation à une fraction décimale.";
    }else if(score >= 6){
      finalText.textContent = "Très bien. Pense toujours au nombre total de parts égales.";
    }else if(score >= 3){
      finalText.textContent = "Tu progresses. Le dénominateur indique le nombre total de parts de l’unité.";
    }else{
      finalText.textContent = "Reprends calmement : compte les parts colorées, puis regarde si l’unité est partagée en 10 ou en 100.";
    }
  }

  function restart(){
    questions = buildQuestions();
    index = 0;
    score = 0;
    finalSection.classList.remove("show");
    quizSection.style.display = "";
    render();
  }

  mainButton.addEventListener("click",next);
  restartButton.addEventListener("click",restart);

  render();
})();
