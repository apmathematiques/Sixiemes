<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Fractions décimales et nombres décimaux</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
}

button{font:inherit}

.app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#quizSection{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:11px 20px 7px;
}

.progress-wrap{display:contents}

.progress-track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.progress-fill{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width .2s ease;
}

.progress-label,.score{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:.98rem;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
}

.content{
  min-height:0;
  margin:0 12px 10px;
  padding:10px 18px;

  display:grid;
  grid-template-columns:1.12fr .88fr;
  grid-template-rows:auto 1fr auto 46px;
  grid-template-areas:
    "instruction instruction"
    "question keypad"
    "feedback feedback"
    "actions actions";
  gap:9px 16px;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.instruction{
  grid-area:instruction;
  min-height:52px;
  margin:0;
  padding:4px 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  font-size:clamp(1.7rem,3vw,2.2rem);
  font-weight:900;
  line-height:1.2;
  text-align:center;
}

.question-panel{
  grid-area:question;
  min-height:0;
  display:grid;
  grid-template-rows:1fr 96px;
  gap:12px;
}

.prompt-card{
  min-height:0;
  padding:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  color:var(--bd);
  text-align:center;

  box-shadow:0 7px 18px rgba(17,63,103,.06);
}

.decimal-prompt{
  font-size:clamp(2.8rem,6vw,5.1rem);
  font-weight:900;
  letter-spacing:.02em;
}

.fraction{
  color:var(--bd);
  display:inline-grid;
  grid-template-rows:auto 4px auto;
  align-items:center;
  justify-items:center;
  min-width:125px;
  font-size:clamp(2.35rem,5.4vw,4.15rem);
  line-height:1;
  font-weight:900;
  vertical-align:middle;
}

.fraction .bar{
  width:100%;
  min-width:110px;
  height:4px;
  background:currentColor;
  border-radius:3px;
  margin:8px 0;
}

.answer-area{
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.answer-display{
  width:100%;
  height:76px;
  padding:8px 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  border:2px solid var(--b);
  border-radius:15px;
  color:var(--bd);

  font-size:clamp(2rem,4vw,3rem);
  font-weight:900;
  letter-spacing:.03em;
  text-align:center;

  box-shadow:inset 0 0 0 3px rgba(23,105,170,.07);
  overflow:hidden;
}

.answer-display.placeholder{
  color:#8ea0af;
  font-size:clamp(1.1rem,1.9vw,1.35rem);
  font-weight:700;
}

.fraction-entry{
  display:grid;
  grid-template-rows:1fr 4px 1fr;
  width:min(86%,360px);
  height:96px;
  align-items:center;
  justify-items:stretch;
  gap:4px;
}

.fraction-entry .line{
  height:4px;
  background:var(--i);
  width:100%;
  border-radius:3px;
}

.fraction-field{
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #cfe1ef;
  border-radius:11px;
  background:#fff;
  color:var(--bd);

  font-size:clamp(1.3rem,2.8vw,2.05rem);
  font-weight:900;
  text-align:center;

  cursor:pointer;
  user-select:none;
}

.fraction-field.active{
  border-color:var(--b);
  background:var(--bs);
  box-shadow:0 0 0 3px rgba(23,105,170,.10);
}

.fraction-field.placeholder{
  color:#8ea0af;
  font-size:clamp(.92rem,1.7vw,1.08rem);
  font-weight:700;
}

.keypad{
  grid-area:keypad;
  min-height:0;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:8px;
}

.key{
  min-height:42px;

  border:2px solid #cfe1ef;
  border-radius:12px;
  background:#fff;
  color:var(--bd);

  font-size:clamp(1.2rem,2.3vw,1.62rem);
  font-weight:900;

  cursor:pointer;
  transition:transform .1s ease,border-color .1s ease,background .1s ease,opacity .1s ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.key:hover:not(:disabled){
  transform:translateY(-1px);
  border-color:var(--b);
  background:var(--bs);
}

.key:active:not(:disabled){transform:translateY(0)}
.key.wide{grid-column:1 / span 3}

.key.utility{
  background:var(--bs);
  font-size:clamp(.9rem,1.6vw,1.04rem);
  font-weight:800;
}

.key:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.feedback{
  grid-area:feedback;
  width:min(920px,100%);
  min-height:60px;
  margin:0 auto;
  padding:8px 14px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;

  border-radius:14px;
  font-size:clamp(.98rem,1.55vw,1.12rem);
  font-weight:650;
  line-height:1.35;
  text-align:center;

  white-space:normal;
  overflow-wrap:anywhere;
}

.feedback:empty{visibility:hidden}
.feedback.show{visibility:visible}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.feedback strong{
  display:block;
  margin:0;
}

.feedback .fraction{
  min-width:48px;
  font-size:1.12rem;
  grid-template-rows:auto 2px auto;
}

.feedback .fraction .bar{
  min-width:42px;
  height:2px;
  margin:2px 0;
}

.actions{
  grid-area:actions;
  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.main-button{
  min-width:170px;
  min-height:46px;
  padding:0 18px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  background:var(--b);
  color:#fff;

  font-size:1.02rem;
  font-weight:850;
  line-height:1.1;

  cursor:pointer;
  transition:background .1s ease,transform .1s ease,opacity .1s ease;
}

.main-button:hover:not(:disabled){
  background:var(--bd);
  transform:translateY(-1px);
}

.main-button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.main-button:focus-visible,.key:focus-visible,.fraction-field:focus-visible{
  outline:4px solid rgba(23,105,170,.22);
}

.final{
  display:none;
  height:100%;
  padding:18px;

  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.final.show{display:flex}

.final-card{
  width:min(540px,92%);
  padding:26px 24px;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

.final-title{
  margin-bottom:12px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
  font-weight:900;
}

.final-score{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;

  color:var(--bd);
  background:var(--bs);
  border-radius:999px;

  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

.final-text{
  max-width:680px;
  margin:0 auto 20px;

  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur. */
@media(max-width:760px){
  body{padding:4px}

  .app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  #quizSection{grid-template-rows:48px 1fr}

  .topbar{
    grid-template-columns:1fr auto;
    gap:5px;
    padding:6px 8px 3px;
  }

  .progress-track{grid-column:1/-1}

  .progress-label,.score{
    min-width:0;
    padding:5px 8px;
    font-size:.84rem;
  }

  .content{
    margin:0 6px 6px;
    padding:5px 7px;

    grid-template-columns:1fr .88fr;
    grid-template-rows:auto 1fr 44px 40px;
    gap:5px 7px;
  }

  .instruction{
    min-height:36px;
    padding:2px 5px;
    font-size:1.05rem;
  }

  .question-panel{
    grid-template-rows:1fr 72px;
    gap:6px;
  }

  .prompt-card{
    padding:8px;
    border-radius:12px;
  }

  .decimal-prompt{
    font-size:2.35rem;
  }

  .fraction{
    min-width:92px;
    font-size:2.25rem;
  }

  .fraction .bar{
    min-width:84px;
    height:3px;
    margin:5px 0;
  }

  .answer-display{
    height:58px;
    border-radius:11px;
    font-size:1.65rem;
  }

  .answer-display.placeholder{
    font-size:.86rem;
  }

  .fraction-entry{
    height:72px;
    width:min(92%,280px);
    gap:2px;
  }

  .fraction-field{
    border-radius:8px;
    font-size:1.18rem;
  }

  .fraction-field.placeholder{
    font-size:.72rem;
  }

  .keypad{gap:4px}

  .key{
    min-height:30px;
    border-radius:8px;
    font-size:.98rem;
  }

  .key.utility{
    font-size:.68rem;
  }

  .feedback{
    min-height:44px;
    padding:5px 8px;
    font-size:.74rem;
  }

  .actions{min-height:40px}

  .main-button{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.86rem;
  }
}
/* Sur une vraie tablette, on garde des textes et des commandes confortables. */
.tablet-device .progress-label,.tablet-device .score{padding:9px 14px;font-size:1.15rem}
.tablet-device .instruction{font-size:clamp(1.85rem,3.1vw,2.3rem)}
.tablet-device .key{min-height:52px;font-size:clamp(1.34rem,2.4vw,1.72rem)}
.tablet-device .feedback{min-height:58px;font-size:clamp(1.06rem,1.7vw,1.2rem)}
.tablet-device .main-button{min-height:54px;font-size:1.08rem}

.content.correction-mode{gap:5px 8px;padding-top:6px;padding-bottom:6px}
.content.correction-mode .instruction{min-height:42px;padding:3px 6px;font-size:clamp(1.4rem,2.45vw,1.75rem)}
.content.correction-mode .question-panel{grid-template-rows:1fr 72px;gap:6px}
.content.correction-mode .answer-display{height:58px}
.content.correction-mode .fraction-entry{height:72px}
.content.correction-mode .key{min-height:36px}
.content.correction-mode .feedback{min-height:44px;padding:6px 10px}
.content.correction-mode .actions{min-height:42px}
.content.correction-mode .main-button{min-height:42px}
</style>
</head>

<body>
<main class="app" aria-live="polite">
  <section id="quizSection">
    <div class="topbar">
      <div class="progress-wrap">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">Question 1 / 10</div>
      </div>
      <div class="score" id="scoreLabel">Score : 0 / 10</div>
    </div>

    <div class="content">
      <p class="instruction" id="instruction"></p>

      <div class="question-panel">
        <div class="prompt-card" id="promptCard"></div>
        <div class="answer-area" id="answerArea"></div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="0">0</button>
        <button class="key" id="commaKey" data-value=",">,</button>
        <button class="key utility" data-action="backspace">⌫</button>
        <button class="key utility wide" data-action="clear">Effacer</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button class="main-button" id="mainButton" disabled>Valider</button>
      </div>
    </div>
  </section>

  <section class="final" id="finalSection">
    <div class="final-card">
      <div class="final-title">Exercice terminé</div>
      <div class="final-score" id="finalScore">0 / 10</div>
      <p class="final-text" id="finalText"></p>
      <button class="main-button" id="restartButton">Recommencer</button>
    </div>
  </section>
</main>

<script>
(() => {
  const isTabletDevice = (navigator.maxTouchPoints || 0) > 0 &&
    Math.min(screen.width || 0, screen.height || 0) >= 600;
  document.documentElement.classList.toggle('tablet-device',isTabletDevice);

  const TOTAL = 10;
  const DENOMINATORS = [10,100,1000,10000];

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function fractionHTML(n,d){
    return `<span class="fraction"><span>${Number(n).toLocaleString("fr-FR")}</span><span class="bar"></span><span>${Number(d).toLocaleString("fr-FR")}</span></span>`;
  }

  function makeNumeratorForDenominator(d){
    const digits = Math.log10(d);
    const max = Math.min(d * 9 - 1, 99999);
    let n;
    do{
      n = randomInt(1,max);
    }while(n % 10 === 0);
    return n;
  }

  function fractionToDecimalString(n,d){
    const digits = Math.log10(d);
    const integerPart = Math.floor(n/d);
    const remainder = n % d;
    return `${integerPart},${String(remainder).padStart(digits,"0")}`;
  }

  function decimalQuestion(){
    const d = DENOMINATORS[randomInt(0,DENOMINATORS.length-1)];
    const n = makeNumeratorForDenominator(d);
    const decimal = fractionToDecimalString(n,d);
    return {
      type:"fractionToDecimal",
      numerator:String(n),
      denominator:String(d),
      decimal,
      instruction:"Écris ce nombre sous forme décimale.",
      explanation:`${fractionHTML(n,d)}&nbsp;=&nbsp;<strong>${decimal}</strong>. Le dénominateur ${d.toLocaleString("fr-FR")} impose ${Math.log10(d)} chiffre${Math.log10(d)>1?"s":""} après la virgule.`
    };
  }

  function makeDecimalWithExactDigits(){
    const digits = randomInt(1,4);
    const integerPart = randomInt(0,999);
    let decimalDigits = "";
    for(let i=0;i<digits;i++){
      decimalDigits += String(i === digits-1 ? randomInt(1,9) : randomInt(0,9));
    }
    const decimal = `${integerPart},${decimalDigits}`;
    const denominator = 10 ** digits;
    const numerator = integerPart * denominator + Number(decimalDigits);
    return {decimal,numerator:String(numerator),denominator:String(denominator),digits};
  }

  function fractionQuestion(){
    const data = makeDecimalWithExactDigits();
    return {
      type:"decimalToFraction",
      decimal:data.decimal,
      numerator:data.numerator,
      denominator:data.denominator,
      instruction:"Écris ce nombre sous forme de fraction décimale.",
      explanation:`<strong>${data.decimal}</strong>&nbsp;=&nbsp;${fractionHTML(data.numerator,data.denominator)}. Il y a ${data.digits} chiffre${data.digits>1?"s":""} après la virgule.`
    };
  }

  function buildQuestions(){
    return shuffle([
      decimalQuestion(),
      decimalQuestion(),
      decimalQuestion(),
      decimalQuestion(),
      decimalQuestion(),
      fractionQuestion(),
      fractionQuestion(),
      fractionQuestion(),
      fractionQuestion(),
      fractionQuestion()
    ]);
  }

  let questions = buildQuestions();
  let index = 0;
  let score = 0;
  let locked = false;
  let decimalAnswer = "";
  let numeratorAnswer = "";
  let denominatorAnswer = "";
  let activeField = "numerator";

  const quizSection = document.getElementById("quizSection");
  const finalSection = document.getElementById("finalSection");
  const instruction = document.getElementById("instruction");
  const promptCard = document.getElementById("promptCard");
  const answerArea = document.getElementById("answerArea");
  const keypad = document.getElementById("keypad");
  const commaKey = document.getElementById("commaKey");
  const feedback = document.getElementById("feedback");
  const mainButton = document.getElementById("mainButton");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const scoreLabel = document.getElementById("scoreLabel");
  const finalScore = document.getElementById("finalScore");
  const finalText = document.getElementById("finalText");
  const restartButton = document.getElementById("restartButton");

  function currentQuestion(){
    return questions[index];
  }

  function renderPrompt(q){
    if(q.type === "fractionToDecimal"){
      promptCard.innerHTML = fractionHTML(q.numerator,q.denominator);
      promptCard.classList.remove("decimal-prompt");
    }else{
      promptCard.textContent = q.decimal;
      promptCard.classList.add("decimal-prompt");
    }
  }

  function renderAnswerArea(q){
    answerArea.innerHTML = "";
    if(q.type === "fractionToDecimal"){
      const display = document.createElement("div");
      display.id = "decimalDisplay";
      display.className = "answer-display placeholder";
      display.textContent = "Ta réponse";
      answerArea.appendChild(display);
      commaKey.disabled = false;
    }else{
      const entry = document.createElement("div");
      entry.className = "fraction-entry";

      const num = document.createElement("div");
      num.id = "numeratorField";
      num.className = "fraction-field active placeholder";
      num.textContent = "numérateur";
      num.setAttribute("tabindex","0");
      num.addEventListener("click",()=>setActiveField("numerator"));

      const line = document.createElement("div");
      line.className = "line";

      const den = document.createElement("div");
      den.id = "denominatorField";
      den.className = "fraction-field placeholder";
      den.textContent = "dénominateur";
      den.setAttribute("tabindex","0");
      den.addEventListener("click",()=>setActiveField("denominator"));

      entry.append(num,line,den);
      answerArea.appendChild(entry);
      commaKey.disabled = true;
    }
  }

  function updateDisplays(){
    const q = currentQuestion();
    if(q.type === "fractionToDecimal"){
      const display = document.getElementById("decimalDisplay");
      if(decimalAnswer){
        display.textContent = decimalAnswer;
        display.classList.remove("placeholder");
      }else{
        display.textContent = "Ta réponse";
        display.classList.add("placeholder");
      }
    }else{
      const num = document.getElementById("numeratorField");
      const den = document.getElementById("denominatorField");

      num.textContent = numeratorAnswer || "numérateur";
      den.textContent = denominatorAnswer || "dénominateur";
      num.classList.toggle("placeholder",!numeratorAnswer);
      den.classList.toggle("placeholder",!denominatorAnswer);
      num.classList.toggle("active",activeField==="numerator");
      den.classList.toggle("active",activeField==="denominator");
    }
    mainButton.disabled = locked || !isAnswerComplete();
  }

  function isAnswerComplete(){
    const q = currentQuestion();
    return q.type === "fractionToDecimal"
      ? decimalAnswer.length > 0
      : numeratorAnswer.length > 0 && denominatorAnswer.length > 0;
  }

  function setActiveField(field){
    if(locked || currentQuestion().type !== "decimalToFraction") return;
    activeField = field;
    updateDisplays();
  }

  function appendValue(value){
    if(locked) return;
    const q = currentQuestion();

    if(q.type === "fractionToDecimal"){
      if(decimalAnswer.length >= 12) return;
      if(value === ","){
        if(decimalAnswer.includes(",")) return;
        if(decimalAnswer === "") decimalAnswer = "0";
        decimalAnswer += ",";
      }else{
        if(decimalAnswer === "0" && !decimalAnswer.includes(",")){
          decimalAnswer = value;
        }else{
          decimalAnswer += value;
        }
      }
    }else{
      if(value === ",") return;
      if(activeField === "numerator"){
        if(numeratorAnswer.length >= 8) return;
        numeratorAnswer = numeratorAnswer === "0" ? value : numeratorAnswer + value;
      }else{
        if(denominatorAnswer.length >= 6) return;
        denominatorAnswer = denominatorAnswer === "0" ? value : denominatorAnswer + value;
      }
    }
    updateDisplays();
  }

  function backspace(){
    if(locked) return;
    const q = currentQuestion();
    if(q.type === "fractionToDecimal"){
      decimalAnswer = decimalAnswer.slice(0,-1);
    }else if(activeField === "numerator"){
      numeratorAnswer = numeratorAnswer.slice(0,-1);
    }else{
      denominatorAnswer = denominatorAnswer.slice(0,-1);
    }
    updateDisplays();
  }

  function clearAnswer(){
    if(locked) return;
    const q = currentQuestion();
    if(q.type === "fractionToDecimal"){
      decimalAnswer = "";
    }else{
      numeratorAnswer = "";
      denominatorAnswer = "";
      activeField = "numerator";
    }
    updateDisplays();
  }

  function normalizeDecimal(value){
    let v = value.trim().replace(/\s/g,"").replace(".",",");
    if(v.endsWith(",")) v = v.slice(0,-1);
    if(!v.includes(",")) return String(Number(v));
    const [left,right=""] = v.split(",");
    const normalizedLeft = String(Number(left || "0"));
    return `${normalizedLeft},${right}`;
  }

  function validate(){
    if(locked || !isAnswerComplete()) return;
    document.querySelector('.content').classList.add('correction-mode');
    locked = true;
    const q = currentQuestion();
    let correct = false;

    if(q.type === "fractionToDecimal"){
      correct = normalizeDecimal(decimalAnswer) === normalizeDecimal(q.decimal);
    }else{
      correct = String(Number(numeratorAnswer)) === q.numerator &&
                String(Number(denominatorAnswer)) === q.denominator;
    }

    if(correct){
      score++;
      feedback.className = "feedback show success";
      feedback.innerHTML = `<strong>✓</strong><div>${q.explanation}</div>`;
    }else{
      feedback.className = "feedback show error";
      const expected = q.type === "fractionToDecimal"
        ? `<strong>${q.decimal}</strong>`
        : fractionHTML(q.numerator,q.denominator);
      feedback.innerHTML = `<strong>✗</strong><div>${q.explanation}&nbsp;Réponse attendue :&nbsp;${expected}.</div>`;
    }

    scoreLabel.textContent = `Score : ${score} / ${TOTAL}`;
    mainButton.textContent = index === TOTAL-1 ? "Voir le bilan" : "Question suivante";
    mainButton.disabled = false;
  }

  function next(){
    if(!locked){
      validate();
      return;
    }
    index++;
    if(index >= TOTAL){
      showFinal();
    }else{
      render();
    }
  }

  function render(){
    const q = currentQuestion();
    locked = false;
    document.querySelector('.content').classList.remove('correction-mode');
    decimalAnswer = "";
    numeratorAnswer = "";
    denominatorAnswer = "";
    activeField = "numerator";

    instruction.textContent = q.instruction;
    renderPrompt(q);
    renderAnswerArea(q);

    feedback.className = "feedback";
    feedback.innerHTML = "";
    mainButton.textContent = "Valider";
    progressLabel.textContent = `Question ${index+1} / ${TOTAL}`;
    progressFill.style.width = `${((index+1)/TOTAL)*100}%`;
    scoreLabel.textContent = `Score : ${score} / ${TOTAL}`;
    updateDisplays();
  }

  function showFinal(){
    quizSection.style.display = "none";
    finalSection.classList.add("show");
    finalScore.textContent = `${score} / ${TOTAL}`;

    if(score === 10){
      finalText.textContent = "Excellent ! Tu sais passer d’une fraction décimale à un nombre décimal et inversement.";
    }else if(score >= 8){
      finalText.textContent = "Très bien. Reste attentif au nombre de chiffres après la virgule.";
    }else if(score >= 5){
      finalText.textContent = "Tu progresses. Le dénominateur 10, 100, 1 000 ou 10 000 indique la position de la virgule.";
    }else{
      finalText.textContent = "Reprends calmement : compte les zéros du dénominateur ou les chiffres après la virgule.";
    }
  }

  function restart(){
    questions = buildQuestions();
    index = 0;
    score = 0;
    finalSection.classList.remove("show");
    quizSection.style.display = "";
    render();
  }

  keypad.addEventListener("click",(e)=>{
    const btn = e.target.closest("button");
    if(!btn || btn.disabled) return;
    if(btn.dataset.value !== undefined) appendValue(btn.dataset.value);
    if(btn.dataset.action === "backspace") backspace();
    if(btn.dataset.action === "clear") clearAnswer();
  });

  document.addEventListener("keydown",(e)=>{
    if(finalSection.classList.contains("show")){
      if(e.key === "Enter") restart();
      return;
    }

    const q = currentQuestion();

    if(e.key >= "0" && e.key <= "9"){
      e.preventDefault();
      appendValue(e.key);
    }else if((e.key === "," || e.key === ".") && q.type === "fractionToDecimal"){
      e.preventDefault();
      appendValue(",");
    }else if(e.key === "Backspace"){
      e.preventDefault();
      backspace();
    }else if(e.key === "Delete" || e.key === "Escape"){
      e.preventDefault();
      clearAnswer();
    }else if(e.key === "ArrowUp" && q.type === "decimalToFraction"){
      e.preventDefault();
      setActiveField("numerator");
    }else if(e.key === "ArrowDown" && q.type === "decimalToFraction"){
      e.preventDefault();
      setActiveField("denominator");
    }else if(e.key === "Tab" && q.type === "decimalToFraction"){
      e.preventDefault();
      setActiveField(activeField === "numerator" ? "denominator" : "numerator");
    }else if(e.key === "Enter"){
      e.preventDefault();
      if(!mainButton.disabled) next();
    }
  });

  mainButton.addEventListener("click",next);
  restartButton.addEventListener("click",restart);

  render();
})();
</script>
</body>
</html>
