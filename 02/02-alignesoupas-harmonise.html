<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Alignement</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;

  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;

  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;

  --o:#9a5a11;
  --os:#fff6e9;
  --oline:#e3ad6e;

  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
  overflow:hidden;
  overscroll-behavior:none;
}

button{font:inherit}

#app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#game{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.hud{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:12px 20px 7px;
}

.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.bar{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease;
}

.pill{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px;
}

.card{
  flex:1;
  min-height:0;
  margin:0 12px 10px;
  padding:12px 18px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;

  text-align:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.instruction{
  width:min(920px,100%);
  min-height:52px;
  margin:0;
  padding:7px 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--i);
  font-size:clamp(1.45rem,2.8vw,2rem);
  font-weight:850;
  line-height:1.25;
  text-align:center;
}

.instruction strong{color:var(--bd)}

.figure{
  width:min(920px,100%);
  flex:1;
  min-height:290px;
  max-height:340px;

  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;

  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
}

.figure:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle,rgba(23,105,170,.11) 1px,transparent 1.3px);
  background-size:20px 20px;
  pointer-events:none;
}

.figure svg{
  width:96%;
  height:94%;
  position:relative;
  z-index:1;
  overflow:visible;
}

.answers{
  min-height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}

.choice{
  min-height:50px;
  min-width:150px;
  padding:0 24px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  color:var(--bd);
  background:var(--bs);
  border:2px solid transparent;
  border-radius:13px;

  font-size:clamp(1.25rem,2.3vw,1.6rem);
  font-weight:850;
  line-height:1.1;

  cursor:pointer;
  touch-action:manipulation;
  transition:transform 120ms ease,border-color 120ms ease,background 120ms ease;
}

.choice:hover:not(:disabled){
  border-color:#9fc8e5;
  transform:translateY(-1px);
}

.choice:active:not(:disabled){transform:scale(.98)}
.choice:disabled{cursor:default;opacity:1}

.choice.correct{
  color:#165e36;
  background:var(--gs);
  border-color:#79c798;
}

.choice.wrong{
  color:#8f2727;
  background:var(--rs);
  border-color:#df8585;
}

#feedback{
  width:min(900px,100%);
  min-height:52px;
  padding:8px 14px;

  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;

  border-radius:14px;
  font-size:clamp(1rem,1.65vw,1.18rem);
  font-weight:650;
  line-height:1.34;
  text-align:center;
}

#feedback.success{
  display:flex!important;
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

#feedback.explain{
  display:flex!important;
  color:var(--o);
  background:var(--os);
  border:1px solid var(--oline);
}

.action{
  min-height:46px;
  min-width:150px;
  padding:0 16px;

  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  color:#fff;
  background:var(--b);

  font-size:1.02rem;
  font-weight:800;
  line-height:1.1;

  cursor:pointer;
  touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease;
}

.action:hover:not(:disabled){filter:brightness(1.03)}
.action:active:not(:disabled){transform:scale(.98)}

.action:focus-visible,
.choice:focus-visible{
  outline:4px solid rgba(23,105,170,.22);
}

#final{
  flex:1;
  min-height:0;
  padding:18px;
  display:none;
  place-items:center;
  text-align:center;
}

.final-card{
  width:min(500px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

#final h1{
  margin:0 0 18px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
}

#finalScore{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

#advice{
  margin:0 0 22px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

#restartBtn{display:inline-flex}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur. */
@media(max-width:760px){
  body{padding:4px}

  #app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  .hud{
    grid-template-columns:1fr auto;
    padding:6px 8px 3px;
    gap:5px;
  }

  .track{grid-column:1/-1}
  .pill{min-width:0;padding:5px 8px;font-size:.84rem}

  .card{
    margin:0 6px 6px;
    padding:6px 8px;
    gap:5px;
  }

  .instruction{
    min-height:38px;
    padding:4px 7px;
    font-size:1.15rem;
  }

  .figure{
    min-height:230px;
    max-height:270px;
  }

  .answers{min-height:43px;gap:8px}

  .choice{
    min-height:40px;
    min-width:110px;
    padding:0 14px;
    font-size:1rem;
  }

  #feedback{
    min-height:40px;
    padding:5px 8px;
    font-size:.84rem;
  }

  .action{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.88rem;
  }
}

/* Genially peut masquer les caractéristiques tactiles dans ses media queries.
   La classe est ajoutée en JavaScript à partir de l'appareil réel. */
.tablet-device .card{gap:8px}
.tablet-device .pill{padding:9px 14px;font-size:1.15rem;font-weight:800}
.tablet-device .instruction{font-size:clamp(1.6rem,2.9vw,2.1rem)}
.tablet-device .choice{min-height:58px;font-size:clamp(1.4rem,2.4vw,1.75rem)}
.tablet-device #feedback{min-height:58px;font-size:clamp(1.08rem,1.75vw,1.24rem)}
.tablet-device .action{min-height:54px;font-size:1.08rem}

.card.correction-mode{gap:4px;padding-top:6px;padding-bottom:6px}
.card.correction-mode .figure{min-height:145px;max-height:165px}
.card.correction-mode .answers{min-height:76px;gap:5px}
.card.correction-mode .choice{min-height:38px}
.card.correction-mode #feedback{min-height:44px;padding:6px 10px}
.card.correction-mode .action{min-height:44px}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
  }
}
</style>
</head>

<body>
<main id="app" aria-live="polite">
  <section id="game">
    <header class="hud">
      <div class="track" aria-label="Progression">
        <div class="bar" id="bar"></div>
      </div>
      <div class="pill" id="progress">Question 1 / 10</div>
      <div class="pill" id="score">Score : 0 / 10</div>
    </header>

    <section class="card">
      <div class="instruction" id="instruction"></div>
      <div class="figure" id="figure"></div>

      <div class="answers">
        <button class="choice" id="yesBtn" type="button">Oui</button>
        <button class="choice" id="noBtn" type="button">Non</button>
      </div>

      <div id="feedback"></div>
      <button class="action" id="nextBtn" type="button">Question suivante</button>
    </section>
  </section>

  <section id="final">
    <div class="final-card">
      <h1>Bilan</h1>
      <div id="finalScore"></div>
      <div id="advice"></div>
      <button class="action" id="restartBtn" type="button">Recommencer</button>
    </div>
  </section>
</main>

<script>
(function(){
  var isTabletDevice = (navigator.maxTouchPoints || 0) > 0 &&
    Math.min(screen.width || 0, screen.height || 0) >= 600;
  document.documentElement.classList.toggle("tablet-device", isTabletDevice);
var qs=[],current=0,score=0,answered=false;
var letters="ABCDEFGHJKLMNPRSTUV";

function E(id){return document.getElementById(id)}
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function sh(a){for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function pickLetters(n){var arr=sh(letters.split("")),out=[];for(var i=0;i<n;i++)out.push(arr[i]);return out}

function makeQuestion(truth){
 var L=pickLetters(4);
 var angle=R(-22,22)*Math.PI/180;
 var cx=310, cy=145;
 var dx=Math.cos(angle), dy=Math.sin(angle);

 var p1={x:cx-150*dx,y:cy-150*dy,l:L[0]};
 var p2={x:cx,y:cy,l:L[1]};
 var p3={x:cx+150*dx,y:cy+150*dy,l:L[2]};
 var p4={x:R(120,500),y:R(45,235),l:L[3]};

 if(!truth){
   p3.x += R(35,70) * (Math.random()<0.5 ? 1 : -1);
   p3.y += R(35,70) * (Math.random()<0.5 ? 1 : -1);
 }

 return {truth:truth,points:[p1,p2,p3,p4],asked:[L[0],L[1],L[2]],angle:angle};
}

function makeQuestions(){
 var a=[];
 for(var i=0;i<5;i++)a.push(makeQuestion(true));
 for(var j=0;j<5;j++)a.push(makeQuestion(false));
 return sh(a);
}

function cross(p){
 return '<g>'+
 '<line x1="'+(p.x-11)+'" y1="'+(p.y-11)+'" x2="'+(p.x+11)+'" y2="'+(p.y+11)+'" stroke="#17212b" stroke-width="4" stroke-linecap="round"/>'+
 '<line x1="'+(p.x-11)+'" y1="'+(p.y+11)+'" x2="'+(p.x+11)+'" y2="'+(p.y-11)+'" stroke="#17212b" stroke-width="4" stroke-linecap="round"/>'+
 '<text x="'+(p.x+23)+'" y="'+(p.y-16)+'" font-size="25" font-weight="bold" fill="#0d4778" font-family="Arial">'+p.l+'</text>'+
 '</g>';
}

function svg(q,showLine){
 var content='';
 if(showLine){
   var dx=Math.cos(q.angle), dy=Math.sin(q.angle), cx=q.points[1].x, cy=q.points[1].y;
   content+='<line x1="'+(cx-260*dx)+'" y1="'+(cy-260*dy)+'" x2="'+(cx+260*dx)+'" y2="'+(cy+260*dy)+'" stroke="#1769aa" stroke-width="4" stroke-linecap="round" opacity=".55"/>';
 }
 q.points.forEach(function(p){content+=cross(p)});
 return '<svg viewBox="0 0 620 290">'+content+'</svg>';
}

function updateHud(){
 E("progress").textContent="Question "+(current+1)+" / 10";
 E("score").textContent="Score : "+score+" / 10";
 E("bar").style.width=(((current+1)/10)*100)+"%";
}

function show(){
 answered=false;
 updateHud();

 var q=qs[current];

 E("instruction").innerHTML="Les points <strong>&nbsp;"+q.asked.join(", ")+"&nbsp;</strong> sont-ils alignés ?";
 E("figure").innerHTML=svg(q,false);

 E("feedback").className="";
 E("feedback").style.display="none";
 E("feedback").textContent="";
 document.querySelector(".card").classList.remove("correction-mode");

 E("nextBtn").style.display="none";

 [E("yesBtn"),E("noBtn")].forEach(function(b){
   b.disabled=false;
   b.className="choice";
 });
}

function choose(ans,btn){
 if(answered)return;
 answered=true;
 document.querySelector(".card").classList.add("correction-mode");

 var q=qs[current],ok=ans===q.truth;
 var good=q.truth?E("yesBtn"):E("noBtn");

 good.classList.add("correct");
 E("yesBtn").disabled=true;
 E("noBtn").disabled=true;

 var fb=E("feedback");

 if(ok){
   score++;
   updateHud();
   fb.className="success";
   fb.textContent="Bravo ! Bonne réponse.";
 }else{
   btn.classList.add("wrong");
   fb.className="explain";
   fb.textContent=q.truth
     ? "Ces trois points appartiennent à une même droite : ils sont alignés."
     : "Ces trois points n’appartiennent pas à une même droite : ils ne sont pas alignés.";
 }

 E("figure").innerHTML=svg(q,true);
 E("nextBtn").style.display="inline-flex";
}

function next(){
 if(current<9){
   current++;
   show();
 }else{
   done();
 }
}

function done(){
 E("game").style.display="none";
 E("final").style.display="grid";
 E("finalScore").textContent=score+"/10";

 E("advice").textContent=
   score<=4
   ?"Revois la définition : des points alignés appartiennent à une même droite."
   :score<=7
     ?"C’est en bonne voie ! Attention aux alignements obliques."
     :score<=9
       ?"Très bon travail !"
       :"Excellent ! Tu maîtrises l’alignement.";
}

function restart(){
 current=0;
 score=0;
 qs=makeQuestions();

 E("final").style.display="none";
 E("game").style.display="flex";

 show();
}

E("yesBtn").onclick=function(){choose(true,this)};
E("noBtn").onclick=function(){choose(false,this)};
E("nextBtn").onclick=next;
E("restartBtn").onclick=restart;

restart();
})();
</script>
</body>
</html>
