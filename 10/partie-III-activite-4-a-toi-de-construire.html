<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">

<link rel="stylesheet" href="../geolib/v1.3/geolib.css">
<link rel="stylesheet" href="../geolib/v1.4/compass.css">

<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79;--line:#24364a;
  --teal:#0f766e
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{
  width:100%;height:100%;margin:0;background:transparent;color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:8px}
button{font:inherit}

.app{
  width:min(100%,1020px);aspect-ratio:16/9;min-height:540px;max-height:calc(100vh - 16px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.97);border:1px solid rgba(23,105,170,.14);
  border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)
}

.top{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;
  gap:13px;padding:12px 20px 6px
}
.track{height:11px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:25%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 250ms ease
}
.pill{
  min-width:112px;padding:8px 12px;color:var(--bd);font-weight:700;
  text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px
}

.main{
  flex:1;min-height:0;padding:0 12px 12px;
  display:grid;
  grid-template-rows:72px minmax(0,1fr);
  gap:7px
}

.instruction{
  height:72px;min-height:72px;margin:0;padding:5px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;text-align:center;line-height:1.35;
  font-size:clamp(.98rem,1.75vw,1.18rem);font-weight:600;
  background:#fff;
  position:relative;z-index:2;
  overflow:visible
}
.instruction strong{color:var(--bd);font-weight:800}
.instruction .data{font-size:.96em}

.workspace{
  min-height:0;height:100%;overflow:hidden;
  display:grid;
  grid-template-columns:112px minmax(0,1fr) 130px;
  gap:10px;
  align-items:center
}

.toolbar,.actions{
  display:flex;flex-direction:column;gap:9px;align-self:center
}

.side-title{
  color:var(--m);font-size:.72rem;font-weight:800;text-align:center;
  text-transform:uppercase;letter-spacing:.04em
}

button.side-btn{
  width:100%;min-height:54px;padding:7px 5px;
  border:1px solid #d6e4ef;border-radius:14px;
  background:#f5f9fc;color:var(--bd);
  font-size:.84rem;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px
}
button.side-btn:hover:not(:disabled){background:#edf5fb}
button.side-btn.active{
  color:#fff;background:var(--b);border-color:var(--b)
}
button.side-btn.compass.active{
  background:var(--teal);border-color:var(--teal)
}
button.side-btn.primary{
  color:#fff;background:var(--b);border-color:var(--b)
}
button.side-btn.danger-lite{
  color:#8f2727;background:#fff5f5;border-color:#f0cccc
}
button.side-btn:disabled{opacity:.42;cursor:default}
.tool-icon{font-size:1.35rem;line-height:1}

.center{
  min-width:0;min-height:0;height:100%;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
  gap:7px;
  align-items:center;
  justify-items:center;
  container-type:size
}

.board-wrap{
  position:relative;
  width:min(100%,560px);
  aspect-ratio:1/1;
  overflow:hidden;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}

@supports (width: 1cqh){
  .board-wrap{
    width:min(560px,100cqw,calc(100cqh - 54px));
  }
}
#scene{
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;user-select:none
}
#scene.geolib-scene{border:0;border-radius:0;background:transparent}
#scene svg{display:block;width:100%;height:100%}

.feedback{
  width:min(100%,560px);height:46px;min-height:46px;padding:6px 10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--bd);font-size:.87rem;font-weight:650;line-height:1.25;
  text-align:center;background:var(--bs);border:1px solid #c9dfef;border-radius:12px
}
.feedback.success{color:#165e36;background:var(--gs);border-color:#a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border-color:#efbcbc}

.context-btn{
  position:absolute;right:10px;bottom:10px;z-index:5;
  min-height:38px;padding:0 12px;border:0;border-radius:11px;
  color:#fff;background:var(--b);font-weight:800;font-size:.83rem;cursor:pointer
}
.context-btn.compass{background:var(--teal)}
.context-btn[hidden]{display:none}

.ruler-major{
  stroke:#334155;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none
}
.ruler-number{
  fill:#334155;font:700 12px Arial,Helvetica,sans-serif;
  text-anchor:middle;pointer-events:none
}

.base-segment{
  stroke:var(--line);stroke-width:5;stroke-linecap:round;
  vector-effect:non-scaling-stroke
}
.answer-segment{
  stroke:var(--line);stroke-width:4;stroke-linecap:round;
  vector-effect:non-scaling-stroke
}
.answer-segment.correct{stroke:var(--g)}
.answer-segment.wrong{stroke:var(--r)}
.point-marker{
  fill:#fff;stroke:var(--b);stroke-width:3.5;
  vector-effect:non-scaling-stroke
}
.point-marker.fixed{fill:var(--bs);stroke:var(--bd)}
.point-marker.target{cursor:grab}
.point-label{
  font:700 27px Arial,Helvetica,sans-serif;fill:var(--line);
  paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;
  pointer-events:none
}
.point-label.fixed{fill:var(--bd)}
.right-mark{
  fill:none;stroke:var(--g);stroke-width:4;vector-effect:non-scaling-stroke
}

.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;
  border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{font-size:3rem;margin-bottom:4px}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}

@media(max-width:820px),(max-height:680px){
  body{padding:4px}
  .app{min-height:0;max-height:calc(100vh - 8px);border-radius:15px}
  .top{grid-template-columns:1fr auto;padding:7px 9px 3px;gap:5px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:5px 8px}
  .main{
    padding:0 7px 7px;gap:4px;
    grid-template-rows:58px minmax(0,1fr)
  }
  .instruction{
    height:58px;min-height:58px;font-size:.86rem;padding:2px 4px
  }
  .workspace{grid-template-columns:90px minmax(0,1fr) 108px;gap:6px}
  .toolbar,.actions{gap:5px}
  button.side-btn{min-height:44px;font-size:.72rem;border-radius:11px}
  .tool-icon{font-size:1.1rem}
  .side-title{font-size:.62rem}
  .feedback{min-height:39px;font-size:.76rem;padding:4px 7px}
  .point-label{font-size:24px}
}
</style>
</head>

<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Construction 1 / 4</div>
    <div class="pill" id="score">Score : 0 / 4</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction" id="instruction"></p>

    <div class="workspace">
      <aside class="toolbar">
        <div class="side-title">Instruments</div>
        <button class="side-btn" type="button" id="rulerBtn">
          <span class="tool-icon">📏</span><span>Règle</span>
        </button>
        <button class="side-btn" type="button" id="squareBtn">
          <span class="tool-icon">📐</span><span>Équerre</span>
        </button>
        <button class="side-btn compass" type="button" id="compassBtn">
          <span class="tool-icon">✥</span><span>Compas</span>
        </button>
      </aside>

      <div class="center">
        <div class="board-wrap">
          <div id="scene" aria-label="Zone de construction"></div>
          <button class="context-btn" id="traceBtn" type="button" hidden>Tracer</button>
        </div>
        <div class="feedback" id="feedback" role="status"></div>
      </div>

      <aside class="actions">
        <div class="side-title">Actions</div>
        <button class="side-btn" type="button" id="undoBtn">
          <span class="tool-icon">↶</span><span>Annuler</span>
        </button>
        <button class="side-btn danger-lite" type="button" id="restartFigureBtn">
          <span class="tool-icon">↺</span><span>Recommencer</span>
        </button>
        <button class="side-btn primary" type="button" id="validateBtn" disabled>
          <span class="tool-icon">✓</span><span>Valider</span>
        </button>
        <button class="side-btn" type="button" id="nextBtn" hidden>
          <span class="tool-icon">→</span><span>Suivant</span>
        </button>
      </aside>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">📐</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="side-btn primary" type="button" id="restartAllBtn">
        Recommencer avec de nouvelles constructions
      </button>
    </div>
  </section>
</main>

<script src="../geolib/v1.3/geolib.js"></script>
<script src="../geolib/v1.4/compass.js"></script>

<script>
(() => {
  'use strict';

  const TOTAL=4;
  const W=560,H=560;
  const PX_PER_CM=48;
  const LENGTH_TOL=.22;
  const ANGLE_TOL=4;

  const LETTER_SETS=[
    ['H','O','P'],['M','N','P'],['R','S','T'],['A','B','C'],
    ['K','L','M'],['D','E','F'],['U','V','W'],['G','H','K']
  ];
  const LEG_LEG=[[3,4],[3,5],[4,5],[4,6],[2.5,4],[3.5,5]];
  const LEG_HYP=[[3,5],[4,5],[3,6],[4,6],[4.5,6],[3.5,5.5]];

  const $=id=>document.getElementById(id);

  const instruction=$('instruction');
  const feedback=$('feedback');
  const counter=$('counter');
  const scoreBox=$('score');
  const bar=$('bar');

  const rulerBtn=$('rulerBtn');
  const squareBtn=$('squareBtn');
  const compassBtn=$('compassBtn');
  const traceBtn=$('traceBtn');

  const undoBtn=$('undoBtn');
  const restartFigureBtn=$('restartFigureBtn');
  const validateBtn=$('validateBtn');
  const nextBtn=$('nextBtn');

  const exercise=$('exercise');
  const final=$('final');
  const finalScore=$('finalScore');
  const finalMessage=$('finalMessage');
  const restartAllBtn=$('restartAllBtn');

  let scene=null;
  let baseLayer=null;
  let answerLayer=null;

  let questions=[];
  let index=0;
  let score=0;
  let attempt=0;
  let locked=false;

  let baseA=null;        // sommet de l'angle droit
  let baseB=null;        // extrémité du côté déjà tracé
  let targetC=null;      // troisième sommet choisi par l'élève
  let targetDrag=false;

  let ruler=null;
  let setSquare=null;
  let compass=null;
  let activeTool=null;

  let traces=[];

  function svg(tag,attrs={}){
    const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
    for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));
    return el;
  }

  function shuffle(array){
    const a=array.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function fr(n){
    return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});
  }

  function seg(a,b){return a+b}
  function current(){return questions[index]}

  function setFeedback(text,type=''){
    feedback.className='feedback'+(type?' '+type:'');
    feedback.textContent=text;
  }

  function pointerToScene(e){
    const r=scene.svg.getBoundingClientRect();
    return{
      x:(e.clientX-r.left)*W/r.width,
      y:(e.clientY-r.top)*H/r.height
    };
  }

  function clampPoint(p){
    return{
      x:Math.max(30,Math.min(W-30,p.x)),
      y:Math.max(30,Math.min(H-30,p.y))
    };
  }

  function labelOffset(p,center){
    const dx=p.x-center.x,dy=p.y-center.y,l=Math.hypot(dx,dy)||1;
    return{x:dx/l*25,y:dy/l*25+8};
  }

  function generateQuestions(){
    const sets=shuffle(LETTER_SETS).slice(0,TOTAL);
    const types=shuffle(['legs','hyp','legs','hyp']);
    const legPairs=shuffle(LEG_LEG);
    const hypPairs=shuffle(LEG_HYP);
    let iLeg=0,iHyp=0;

    return sets.map((letters,i)=>{
      const rightIndex=i%3;
      const right=letters[rightIndex];
      const others=letters.filter((_,j)=>j!==rightIndex);

      if(types[i]==='legs'){
        let [base,target]=legPairs[iLeg++%legPairs.length];
        if(Math.random()<.5)[base,target]=[target,base];
        return{type:'legs',letters,right,others,base,target};
      }

      const [base,hyp]=hypPairs[iHyp++%hypPairs.length];
      return{type:'hyp',letters,right,others,base,hyp};
    });
  }

  function renderInstruction(){
    const q=current();

    if(q.type==='legs'){
      instruction.innerHTML=
        `<span>Complète le triangle <strong>${q.letters.join('')}</strong>, rectangle en <strong>${q.right}</strong>.</span>`+
        `<span class="data">${seg(q.right,q.others[0])} = <strong>${fr(q.base)} cm</strong> est déjà tracé ; ${seg(q.right,q.others[1])} = <strong>${fr(q.target)} cm</strong>.</span>`;
    }else{
      instruction.innerHTML=
        `<span>Complète le triangle <strong>${q.letters.join('')}</strong>, rectangle en <strong>${q.right}</strong>.</span>`+
        `<span class="data">${seg(q.right,q.others[0])} = <strong>${fr(q.base)} cm</strong> est déjà tracé ; ${seg(q.others[0],q.others[1])} = <strong>${fr(q.hyp)} cm</strong> est l’hypoténuse.</span>`;
    }
  }

  function makeBase(){
    const q=current();
    const angleDeg=choice([-18,-10,0,10,18]);
    const a=angleDeg*Math.PI/180;
    const len=q.base*PX_PER_CM;

    baseA={x:160,y:320};
    baseB={
      x:baseA.x+Math.cos(a)*len,
      y:baseA.y+Math.sin(a)*len
    };
  }

  function choice(a){
    return a[Math.floor(Math.random()*a.length)];
  }

  function drawBaseAndAnswer(){
    baseLayer.innerHTML='';
    answerLayer.innerHTML='';

    const q=current();

    baseLayer.appendChild(svg('line',{
      x1:baseA.x,y1:baseA.y,x2:baseB.x,y2:baseB.y,class:'base-segment'
    }));

    [
      {p:baseA,label:q.right},
      {p:baseB,label:q.others[0]}
    ].forEach((item,i)=>{
      baseLayer.appendChild(svg('circle',{
        cx:item.p.x,cy:item.p.y,r:7,class:'point-marker fixed'
      }));
      const off=i===0?{x:-18,y:28}:labelOffset(item.p,baseA);
      const t=svg('text',{
        x:item.p.x+off.x,y:item.p.y+off.y,class:'point-label fixed'
      });
      t.textContent=item.label;
      baseLayer.appendChild(t);
    });

    if(targetC){
      answerLayer.append(
        svg('line',{
          x1:baseA.x,y1:baseA.y,x2:targetC.x,y2:targetC.y,class:'answer-segment'
        }),
        svg('line',{
          x1:baseB.x,y1:baseB.y,x2:targetC.x,y2:targetC.y,class:'answer-segment'
        })
      );

      const h=svg('circle',{
        cx:targetC.x,cy:targetC.y,r:9,class:'point-marker target'
      });
      answerLayer.appendChild(h);

      const off=labelOffset(targetC,baseA);
      const t=svg('text',{
        x:targetC.x+off.x,y:targetC.y+off.y,class:'point-label'
      });
      t.textContent=q.others[1];
      answerLayer.appendChild(t);

      if(!locked){
        h.addEventListener('pointerdown',e=>{
          e.preventDefault();e.stopPropagation();targetDrag=true;
        });
      }
    }

    validateBtn.disabled=!targetC || locked;
    updateCompassSnap();
  }

  function addRulerScale(){
    if(!ruler||!ruler.group)return;
    const half=ruler.length/2;
    const top=-ruler.thickness/2;
    for(let cm=0;cm<=5;cm++){
      const x=-half+cm*PX_PER_CM;
      ruler.group.appendChild(svg('line',{
        x1:x,y1:top,x2:x,y2:top+15,class:'ruler-major'
      }));
      const t=svg('text',{x:x,y:top+28,class:'ruler-number'});
      t.textContent=String(cm);
      ruler.group.appendChild(t);
    }
  }

  function createTools(){
    ruler=scene.add(new GeoLib.Straightedge({
      x:390,y:500,angle:-5,length:5.2*PX_PER_CM,thickness:38
    }));
    addRulerScale();

    setSquare=scene.add(new GeoLib.SetSquare({
      x:405,y:120,angle:18,width:120,height:86
    }));

    compass=scene.add(new GeoLib.Compass({
      x:390,y:390,radius:4.5*PX_PER_CM,angle:-18,
      pxPerUnit:PX_PER_CM,unitLabel:'cm',
      minRadius:1.5*PX_PER_CM,maxRadius:6.2*PX_PER_CM,
      showOpening:true,snapTolerance:18,pencilColor:'#c50062'
    }));

    showOnlyTool(null);
    updateCompassSnap();
  }

  function updateCompassSnap(){
    if(!compass)return;
    compass.setSnapPoints([baseA,baseB,targetC].filter(Boolean));
  }

  function showOnlyTool(name){
    activeTool=name;
    const map={ruler,setSquare,compass};

    ruler.group.style.display=name==='ruler'?'':'none';
    setSquare.group.style.display=name==='setSquare'?'':'none';
    compass.group.style.display=name==='compass'?'':'none';

    rulerBtn.classList.toggle('active',name==='ruler');
    squareBtn.classList.toggle('active',name==='setSquare');
    compassBtn.classList.toggle('active',name==='compass');

    traceBtn.hidden=!name;
    traceBtn.classList.toggle('compass',name==='compass');

    if(name==='ruler'){
      traceBtn.textContent='Tracer avec la règle';
      setFeedback('Place la règle. Clique dans la zone pour placer le troisième sommet si besoin.');
    }else if(name==='setSquare'){
      traceBtn.textContent='Tracer avec l’équerre';
      setFeedback('Place l’équerre puis trace le bord choisi.');
    }else if(name==='compass'){
      traceBtn.textContent='Tracer le cercle';
      setFeedback('Place la pointe sèche puis règle l’ouverture du compas : sa valeur en cm est affichée près de la tête.');
    }else{
      setFeedback('Choisis un instrument, puis place le troisième sommet dans la zone.');
    }
  }

  function addTrace(element){
    traces.push(element);
    undoBtn.disabled=false;
  }

  async function traceActive(){
    if(locked||!activeTool)return;

    if(activeTool==='ruler'){
      const line=scene.drawLine(ruler.guideLine(),{className:''});
      addTrace(line.element);
      setFeedback('Droite tracée avec la règle.');
      return;
    }

    if(activeTool==='setSquare'){
      setFeedback('Clique sur le bord de l’équerre que tu veux tracer.');
      try{
        const result=await setSquare.trace({className:''});
        addTrace(result.drawnLine.element);
        setFeedback('Droite tracée avec l’équerre.');
      }catch(e){}
      return;
    }

    if(activeTool==='compass'){
      const result=compass.drawCircle();
      addTrace(result.element);
      setFeedback('Cercle tracé avec le compas.');
    }
  }

  function undo(){
    if(locked)return;

    if(traces.length){
      const el=traces.pop();
      if(el&&el.remove)el.remove();
      undoBtn.disabled=traces.length===0 && !targetC;
      setFeedback('Dernier tracé annulé.');
      return;
    }

    if(targetC){
      targetC=null;
      drawBaseAndAnswer();
      undoBtn.disabled=true;
      setFeedback('Le troisième sommet a été retiré.');
    }
  }

  function restartFigure(){
    if(locked)return;
    targetC=null;
    traces=[];
    scene.clearLayer('drawings');
    showOnlyTool(null);
    drawBaseAndAnswer();
    undoBtn.disabled=true;
    setFeedback('Construction recommencée.');
  }

  function analyze(){
    const q=current();
    const dAC=GeoLib.Utils.distance(baseA,targetC)/PX_PER_CM;
    const dBC=GeoLib.Utils.distance(baseB,targetC)/PX_PER_CM;

    const aAB=GeoLib.Utils.radToDeg(Math.atan2(baseB.y-baseA.y,baseB.x-baseA.x));
    const aAC=GeoLib.Utils.radToDeg(Math.atan2(targetC.y-baseA.y,targetC.x-baseA.x));

    const lineAB=new GeoLib.Line(baseA,aAB);
    const lineAC=new GeoLib.Line(baseA,aAC);
    const rightOK=lineAB.isPerpendicularTo(lineAC,ANGLE_TOL);

    if(q.type==='legs'){
      const lengthOK=Math.abs(dAC-q.target)<=LENGTH_TOL;
      return{success:rightOK&&lengthOK,rightOK,lengthOK,dAC};
    }

    const hypOK=Math.abs(dBC-q.hyp)<=LENGTH_TOL;
    return{success:rightOK&&hypOK,rightOK,hypOK,dBC};
  }

  function paintResult(r){
    answerLayer.innerHTML='';
    const q=current();

    const acOK=q.type==='legs'?r.lengthOK:true;
    const bcOK=q.type==='hyp'?r.hypOK:true;

    answerLayer.append(
      svg('line',{
        x1:baseA.x,y1:baseA.y,x2:targetC.x,y2:targetC.y,
        class:`answer-segment ${acOK?'correct':'wrong'}`
      }),
      svg('line',{
        x1:baseB.x,y1:baseB.y,x2:targetC.x,y2:targetC.y,
        class:`answer-segment ${bcOK?'correct':'wrong'}`
      })
    );

    if(r.rightOK){
      const s=23;
      const u={x:baseB.x-baseA.x,y:baseB.y-baseA.y};
      const v={x:targetC.x-baseA.x,y:targetC.y-baseA.y};
      const lu=Math.hypot(u.x,u.y)||1,lv=Math.hypot(v.x,v.y)||1;
      u.x/=lu;u.y/=lu;v.x/=lv;v.y/=lv;
      const p1={x:baseA.x+u.x*s,y:baseA.y+u.y*s};
      const p2={x:p1.x+v.x*s,y:p1.y+v.y*s};
      const p3={x:baseA.x+v.x*s,y:baseA.y+v.y*s};
      answerLayer.appendChild(svg('path',{
        d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} L ${p3.x} ${p3.y}`,
        class:'right-mark'
      }));
    }

    answerLayer.appendChild(svg('circle',{
      cx:targetC.x,cy:targetC.y,r:8,class:'point-marker target'
    }));
    const off=labelOffset(targetC,baseA);
    const t=svg('text',{
      x:targetC.x+off.x,y:targetC.y+off.y,class:'point-label'
    });
    t.textContent=q.others[1];
    answerLayer.appendChild(t);
  }

  function validate(){
    if(locked||!targetC)return;
    const q=current();
    const r=analyze();
    attempt++;

    if(r.success){
      locked=true;
      score+=attempt===1?1:.5;
      scoreBox.textContent=`Score : ${score.toLocaleString('fr-FR')} / ${TOTAL}`;
      paintResult(r);
      setFeedback(attempt===1?'Bravo ! Construction correcte.':'Bravo ! Ta correction est juste.','success');
      finishQuestion();
      return;
    }

    if(attempt===1){
      const details=[];
      if(!r.rightOK)details.push(`l’angle en ${q.right} n’est pas droit`);
      if(q.type==='legs'&&!r.lengthOK)details.push(`${seg(q.right,q.others[1])} n’a pas la bonne longueur`);
      if(q.type==='hyp'&&!r.hypOK)details.push(`l’hypoténuse ${seg(q.others[0],q.others[1])} n’a pas la bonne longueur`);
      setFeedback(`Ce n’est pas encore correct : ${details.join(' ; ')}. Corrige puis valide une deuxième fois.`,'error');
      return;
    }

    locked=true;
    paintResult(r);
    const details=[];
    if(!r.rightOK)details.push(`l’angle en ${q.right} n’est pas droit`);
    if(q.type==='legs'&&!r.lengthOK)details.push(`${seg(q.right,q.others[1])} mesure environ ${fr(r.dAC)} cm au lieu de ${fr(q.target)} cm`);
    if(q.type==='hyp'&&!r.hypOK)details.push(`l’hypoténuse mesure environ ${fr(r.dBC)} cm au lieu de ${fr(q.hyp)} cm`);
    setFeedback(`Deuxième essai : ${details.join(' ; ')}.`,'error');
    finishQuestion();
  }

  function finishQuestion(){
    [rulerBtn,squareBtn,compassBtn,traceBtn,undoBtn,restartFigureBtn,validateBtn].forEach(b=>b.disabled=true);
    nextBtn.hidden=false;
    nextBtn.textContent=index===TOTAL-1?'Bilan':'Suivant';
  }

  function next(){
    if(!locked)return;
    index++;
    if(index<TOTAL)renderQuestion();
    else showFinal();
  }

  function renderQuestion(){
    if(compass)compass.destroy();
    if(scene)scene.destroy();

    locked=false;
    attempt=0;
    targetC=null;
    targetDrag=false;
    traces=[];
    activeTool=null;

    renderInstruction();
    counter.textContent=`Construction ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score.toLocaleString('fr-FR')} / ${TOTAL}`;
    bar.style.width=`${(index+1)/TOTAL*100}%`;

    scene=new GeoLib.Scene('#scene',{width:W,height:H,keyboard:false});
    baseLayer=svg('g');
    answerLayer=svg('g');
    scene.svg.insertBefore(baseLayer,scene.layers.drawings);
    scene.svg.insertBefore(answerLayer,scene.layers.drawings);

    makeBase();
    createTools();
    drawBaseAndAnswer();

    [rulerBtn,squareBtn,compassBtn,restartFigureBtn].forEach(b=>b.disabled=false);
    traceBtn.disabled=false;
    undoBtn.disabled=true;
    validateBtn.disabled=true;
    nextBtn.hidden=true;

    setFeedback('Choisis un instrument, puis place le troisième sommet dans la zone.');

    scene.svg.addEventListener('pointerdown',e=>{
      if(locked||targetDrag)return;
      const target=e.target;
      if(target.closest&&target.closest('.geolib-straightedge,.geolib-set-square,.geolib-compass-v4,.point-marker'))return;

      targetC=clampPoint(pointerToScene(e));
      drawBaseAndAnswer();
      undoBtn.disabled=false;
    });

    scene.svg.addEventListener('pointermove',e=>{
      if(locked||!targetDrag)return;
      targetC=clampPoint(pointerToScene(e));
      drawBaseAndAnswer();
    });

    const end=()=>{targetDrag=false};
    scene.svg.addEventListener('pointerup',end);
    scene.svg.addEventListener('pointercancel',end);
  }

  function showFinal(){
    if(compass)compass.destroy();
    if(scene)scene.destroy();
    exercise.style.display='none';
    final.classList.add('show');
    finalScore.textContent=`Score : ${score.toLocaleString('fr-FR')} / ${TOTAL}`;
    finalMessage.textContent=
      score>=3
        ?'Très bien : tu sais compléter un triangle rectangle et choisir les instruments utiles.'
        :'Reprends les constructions en vérifiant l’angle droit et les longueurs demandées.';
  }

  function start(){
    if(!window.GeoLib||!GeoLib.Compass){
      instruction.textContent='GeoLib 1.3 et le compas GeoLib 1.4 sont nécessaires.';
      setFeedback('Vérifie les fichiers GeoLib dans ton dépôt.','error');
      return;
    }

    questions=generateQuestions();
    index=0;
    score=0;
    exercise.style.display='';
    final.classList.remove('show');
    renderQuestion();
  }

  rulerBtn.onclick=()=>showOnlyTool(activeTool==='ruler'?null:'ruler');
  squareBtn.onclick=()=>showOnlyTool(activeTool==='setSquare'?null:'setSquare');
  compassBtn.onclick=()=>showOnlyTool(activeTool==='compass'?null:'compass');
  traceBtn.onclick=traceActive;
  undoBtn.onclick=undo;
  restartFigureBtn.onclick=restartFigure;
  validateBtn.onclick=validate;
  nextBtn.onclick=next;
  restartAllBtn.onclick=start;

  start();
})();
</script>
</body>
</html>
