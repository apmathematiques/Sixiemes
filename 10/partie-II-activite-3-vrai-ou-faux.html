<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79;--line:#24364a
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--i);font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);
  border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:16px 24px 10px}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);border-radius:inherit;transition:width 260ms ease}
.pill{min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px}
.main{flex:1;min-height:0;padding:5px 18px 18px;display:flex;flex-direction:column;gap:9px}
.instruction{
  min-height:46px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.15rem,2.15vw,1.48rem);font-weight:650;line-height:1.25;text-align:center
}
.figure{
  position:relative;flex:1;min-height:190px;padding:4px 12px;display:grid;place-items:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);border:1px solid #dce9f3;border-radius:18px;overflow:hidden
}
svg{width:100%;height:100%;min-height:180px;overflow:visible}
.side-visible{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round}
.right-mark{fill:none;stroke:var(--b);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.point-label{
  font:700 29px Arial,Helvetica,sans-serif;fill:var(--line);
  paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round
}
.statement{
  min-height:64px;padding:10px 18px;display:flex;align-items:center;justify-content:center;
  color:var(--i);font-size:clamp(1.18rem,2.25vw,1.5rem);font-weight:700;line-height:1.25;text-align:center;
  background:#f4f7fb;border:1px solid #dce9f3;border-radius:15px
}
.choice-row{min-height:58px;display:flex;align-items:center;justify-content:center;gap:16px}
.choice-btn{
  min-width:150px;height:50px;padding:0 22px;color:var(--bd);font-size:1.08rem;font-weight:800;
  background:var(--bs);border:2px solid transparent;border-radius:13px;cursor:pointer;
  touch-action:manipulation;transition:transform 120ms ease,filter 120ms ease,background .12s ease,border-color .12s ease
}
.choice-btn:hover:not(:disabled){filter:brightness(1.03)}
.choice-btn:active:not(:disabled){transform:scale(.98)}
.choice-btn.selected{background:#d7ebfb;border-color:#69a9d5}
.choice-btn.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.choice-btn.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
button:focus-visible{outline:4px solid rgba(23,105,170,.22)}
button:disabled{cursor:default}
.feedback{
  min-height:54px;padding:8px 14px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.3;text-align:center;background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{min-height:47px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
button.action{
  min-height:44px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;border:0;border-radius:13px;
  touch-action:manipulation;transition:transform 120ms ease,filter 120ms ease
}
button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
button.action:disabled{opacity:.48;cursor:default}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid;animation:reveal 280ms ease both}
.final-card{width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}
@media(max-width:700px),(max-height:620px){
  body{padding:6px}.app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}.track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:6px}.instruction{min-height:38px;font-size:1rem}
  .figure{min-height:135px;padding:1px 5px}svg{min-height:128px}.point-label{font-size:32px}
  .statement{min-height:52px;padding:7px 10px;font-size:1.03rem}.choice-row{min-height:48px;gap:9px}.choice-btn{min-width:116px;height:43px;padding:0 14px;font-size:1rem}
  .feedback{min-height:44px;padding:6px 9px;font-size:.86rem}.controls{min-height:40px}button.action{min-height:40px;height:40px}
}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite">
  <header class="top">
    <div class="track" aria-label="Progression"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Observe le triangle puis indique si l'affirmation est vraie ou fausse.</p>

    <div class="figure">
      <svg id="scene" viewBox="0 0 900 300" role="img" aria-label="Triangle rectangle à observer"></svg>
    </div>

    <div class="statement" id="statement"></div>

    <div class="choice-row" aria-label="Choix de la réponse">
      <button class="choice-btn" type="button" data-answer="true">Vrai</button>
      <button class="choice-btn" type="button" data-answer="false">Faux</button>
    </div>

    <div class="feedback" id="feedback" role="status">Choisis Vrai ou Faux puis valide ta réponse.</div>

    <div class="controls">
      <button class="action primary" type="button" id="validate" disabled>Valider</button>
      <button class="action secondary" type="button" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon" aria-hidden="true">🎯</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" type="button" id="restart">Recommencer avec de nouvelles affirmations</button>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  const TOTAL = 10;
  const NS = 'http://www.w3.org/2000/svg';
  const LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','R','S','T','U','V'];
  const ANGLES = [0,18,35,55,75,95,115,135,155,180,205,225,245,270,290,315,335];
  const FAMILIES = ['rectangle','hypotenuse','angle','opposite','rectangle','hypotenuse','angle','opposite','rectangle','hypotenuse'];

  const $ = id => document.getElementById(id);
  const svg = $('scene');
  const counter = $('counter');
  const scoreBox = $('score');
  const bar = $('bar');
  const statement = $('statement');
  const feedback = $('feedback');
  const validateBtn = $('validate');
  const nextBtn = $('next');
  const answerButtons = [...document.querySelectorAll('.choice-btn')];
  const exercise = $('exercise');
  const final = $('final');
  const finalScore = $('finalScore');
  const finalMessage = $('finalMessage');
  const restartBtn = $('restart');

  let questions = [];
  let index = 0;
  let score = 0;
  let selected = null;
  let locked = false;
  let previousSignature = '';

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(array){
    const copy=array.slice();
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }
  function sample(array,n){ return shuffle(array).slice(0,n); }
  function choice(array){ return array[Math.floor(Math.random()*array.length)]; }
  function toRad(deg){ return deg*Math.PI/180; }
  function makeSvg(tag,attrs={}){
    const node=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));
    return node;
  }

  function buildGeometry(angleDeg,mirror,legA,legB,rightIndex){
    const angle=toRad(angleDeg);
    const sign=mirror ? -1 : 1;
    const raw=[
      {x:0,y:0},
      {x:legA,y:0},
      {x:0,y:sign*legB}
    ].map(p=>({
      x:p.x*Math.cos(angle)-p.y*Math.sin(angle),
      y:p.x*Math.sin(angle)+p.y*Math.cos(angle)
    }));

    const xs=raw.map(p=>p.x),ys=raw.map(p=>p.y);
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const w=maxX-minX||1,h=maxY-minY||1;
    const scale=Math.min(640/w,215/h,1.22);
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
    const placed=raw.map(p=>({x:450+(p.x-cx)*scale,y:150+(p.y-cy)*scale}));

    const vertices=new Array(3);
    const others=[0,1,2].filter(i=>i!==rightIndex);
    vertices[rightIndex]=placed[0];
    vertices[others[0]]=placed[1];
    vertices[others[1]]=placed[2];
    return vertices;
  }

  function sideText(q,a,b){ return `[${q.labels[a]}${q.labels[b]}]`; }
  function triangleName(q){ return q.labels.join(''); }
  function angleName(q,vertex){
    const ends=[0,1,2].filter(i=>i!==vertex);
    if(Math.random()<.5) ends.reverse();
    return `${q.labels[ends[0]]}${q.labels[vertex]}${q.labels[ends[1]]}`;
  }
  function canonicalRightAngle(q){
    const ends=[0,1,2].filter(i=>i!==q.rightIndex);
    return `${q.labels[ends[0]]}${q.labels[q.rightIndex]}${q.labels[ends[1]]}`;
  }

  function makeAssertion(q,family,isTrue){
    const others=[0,1,2].filter(i=>i!==q.rightIndex);
    const hyp=others;
    const wrongVertex=choice(others);
    const adjacentSides=[[q.rightIndex,others[0]],[q.rightIndex,others[1]]];

    if(family==='rectangle'){
      const claimed=isTrue ? q.rightIndex : wrongVertex;
      return {
        text:`Le triangle ${triangleName(q)} est rectangle en ${q.labels[claimed]}.`,
        truth:isTrue,
        correction:`Le triangle ${triangleName(q)} est rectangle en ${q.labels[q.rightIndex]}.`
      };
    }

    if(family==='hypotenuse'){
      const pair=isTrue ? hyp : choice(adjacentSides);
      return {
        text:`Le côté ${sideText(q,pair[0],pair[1])} est l'hypoténuse.`,
        truth:isTrue,
        correction:`L'hypoténuse est ${sideText(q,hyp[0],hyp[1])}.`
      };
    }

    if(family==='angle'){
      const claimedVertex=isTrue ? q.rightIndex : wrongVertex;
      const shown=angleName(q,claimedVertex);
      return {
        text:`L'angle ${shown} est droit.`,
        truth:isTrue,
        correction:`L'angle ${canonicalRightAngle(q)} est droit.`
      };
    }

    const pair=isTrue ? hyp : choice(adjacentSides);
    return {
      text:`Le côté ${sideText(q,pair[0],pair[1])} est opposé à l'angle droit.`,
      truth:isTrue,
      correction:`Le côté ${sideText(q,hyp[0],hyp[1])} est opposé à l'angle droit.`
    };
  }

  function generateQuestions(){
    for(let attempt=0;attempt<120;attempt++){
      const truths=shuffle([true,true,true,true,true,false,false,false,false,false]);
      const families=shuffle(FAMILIES);
      const rightIndices=shuffle([0,0,0,0,1,1,1,2,2,2]);
      const angleSeries=sample(ANGLES,TOTAL);
      const result=[];
      const usedNames=new Set();

      for(let i=0;i<TOTAL;i++){
        let labels,name;
        do{
          labels=sample(LETTERS,3);
          name=labels.join('');
        }while(usedNames.has(name));
        usedNames.add(name);

        const rightIndex=rightIndices[i];
        const vertices=buildGeometry(angleSeries[i],Math.random()<.5,randInt(220,305),randInt(160,245),rightIndex);
        const q={labels,rightIndex,vertices};
        q.assertion=makeAssertion(q,families[i],truths[i]);
        result.push(q);
      }

      const signature=result.map(q=>q.labels.join('')+q.rightIndex+q.assertion.text).join('|');
      if(signature!==previousSignature){
        previousSignature=signature;
        return result;
      }
    }
    return [];
  }

  function unitVector(from,to){
    const dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy)||1;
    return {x:dx/len,y:dy/len};
  }

  function drawQuestion(q){
    svg.innerHTML='';

    [[0,1],[1,2],[2,0]].forEach(([a,b])=>{
      const p=q.vertices[a],s=q.vertices[b];
      svg.appendChild(makeSvg('line',{x1:p.x,y1:p.y,x2:s.x,y2:s.y,class:'side-visible'}));
    });

    const r=q.vertices[q.rightIndex];
    const otherIndices=[0,1,2].filter(i=>i!==q.rightIndex);
    const p=q.vertices[otherIndices[0]];
    const s=q.vertices[otherIndices[1]];
    const u=unitVector(r,p);
    const v=unitVector(r,s);
    const size=29;
    const p1={x:r.x+u.x*size,y:r.y+u.y*size};
    const corner={x:p1.x+v.x*size,y:p1.y+v.y*size};
    const p2={x:r.x+v.x*size,y:r.y+v.y*size};
    svg.appendChild(makeSvg('path',{
      d:`M ${p1.x} ${p1.y} L ${corner.x} ${corner.y} L ${p2.x} ${p2.y}`,
      class:'right-mark'
    }));

    const center={
      x:q.vertices.reduce((sum,p)=>sum+p.x,0)/3,
      y:q.vertices.reduce((sum,p)=>sum+p.y,0)/3
    };
    q.vertices.forEach((p,i)=>{
      let dx=p.x-center.x,dy=p.y-center.y,len=Math.hypot(dx,dy)||1;
      dx/=len;dy/=len;
      const label=makeSvg('text',{
        x:p.x+dx*31,
        y:p.y+dy*31+9,
        class:'point-label',
        'text-anchor':'middle'
      });
      label.textContent=q.labels[i];
      svg.appendChild(label);
    });
  }

  function selectAnswer(value){
    if(locked) return;
    selected=value;
    answerButtons.forEach(btn=>{
      btn.classList.toggle('selected',btn.dataset.answer===String(value));
    });
    validateBtn.disabled=false;
    feedback.className='feedback';
    feedback.textContent='Réponse choisie. Valide lorsque tu es prêt.';
  }

  function render(){
    const q=questions[index];
    selected=null;
    locked=false;
    counter.textContent=`Question ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    bar.style.width=`${((index+1)/TOTAL)*100}%`;
    statement.textContent=q.assertion.text;
    feedback.className='feedback';
    feedback.textContent='Choisis Vrai ou Faux puis valide ta réponse.';
    validateBtn.disabled=true;
    validateBtn.hidden=false;
    nextBtn.hidden=true;
    answerButtons.forEach(btn=>{
      btn.disabled=false;
      btn.classList.remove('selected','correct','wrong');
    });
    drawQuestion(q);
  }

  function validate(){
    if(locked || selected===null) return;
    locked=true;
    const q=questions[index];
    const correct=selected===q.assertion.truth;

    answerButtons.forEach(btn=>{
      btn.disabled=true;
      const value=btn.dataset.answer==='true';
      if(value===q.assertion.truth) btn.classList.add('correct');
      if(value===selected && !correct) btn.classList.add('wrong');
    });

    if(correct){
      score++;
      feedback.className='feedback success';
      feedback.textContent=`Bravo ! ${q.assertion.correction}`;
    }else{
      feedback.className='feedback error';
      feedback.textContent=q.assertion.correction;
    }

    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    validateBtn.hidden=true;
    nextBtn.hidden=false;
    nextBtn.textContent=index===TOTAL-1 ? 'Voir le résultat' : 'Question suivante';
  }

  function next(){
    if(index<TOTAL-1){
      index++;
      render();
    }else{
      showFinal();
    }
  }

  function showFinal(){
    exercise.style.display='none';
    final.classList.add('show');
    bar.style.width='100%';
    counter.textContent=`${TOTAL} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    finalScore.textContent=`Ton score : ${score} / ${TOTAL}`;

    if(score===TOTAL){
      finalMessage.textContent='Parfait ! Tu maîtrises le vocabulaire du triangle rectangle.';
    }else if(score>=8){
      finalMessage.textContent='Très bien ! Tu distingues bien angle droit, sommet rectangle et hypoténuse.';
    }else if(score>=5){
      finalMessage.textContent="Encore un peu d'entraînement : commence toujours par repérer l'angle droit.";
    }else{
      finalMessage.textContent="Repère d'abord l'angle droit : il permet de trouver le sommet rectangle et l'hypoténuse.";
    }
  }

  function start(){
    questions=generateQuestions();
    index=0;
    score=0;
    selected=null;
    locked=false;
    final.classList.remove('show');
    exercise.style.display='flex';
    render();
  }

  answerButtons.forEach(btn=>{
    btn.addEventListener('click',()=>selectAnswer(btn.dataset.answer==='true'));
  });
  validateBtn.addEventListener('click',validate);
  nextBtn.addEventListener('click',next);
  restartBtn.addEventListener('click',start);

  start();
})();
</script>
</body>
</html>
