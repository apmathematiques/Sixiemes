<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79;--line:#24364a
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--i);font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);
  border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:16px 24px 10px}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{width:10%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);border-radius:inherit;transition:width 260ms ease}
.pill{min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px}
.main{flex:1;min-height:0;padding:5px 18px 18px;display:flex;flex-direction:column;gap:10px}
.instruction{
  min-height:52px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.18rem,2.25vw,1.55rem);font-weight:650;line-height:1.25;text-align:center
}
.figure{
  position:relative;flex:1;min-height:205px;padding:8px 14px;display:grid;place-items:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);border:1px solid #dce9f3;border-radius:18px;overflow:hidden
}
svg{width:100%;height:100%;min-height:195px;overflow:visible}
.triangle-side{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.right-mark{fill:none;stroke:var(--b);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.point-label{
  font:700 29px Arial,Helvetica,sans-serif;fill:var(--line);
  paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round
}
.answer-row{min-height:62px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.answer-btn{
  min-width:92px;height:52px;padding:0 20px;color:var(--bd);font-size:1.3rem;font-weight:750;
  background:var(--bs);border:2px solid transparent;border-radius:13px;cursor:pointer;
  touch-action:manipulation;transition:transform 120ms ease,filter 120ms ease,background .12s ease,border-color .12s ease
}
.answer-btn:hover:not(:disabled){filter:brightness(1.03)}
.answer-btn:active:not(:disabled){transform:scale(.98)}
.answer-btn.selected{background:#d7ebfb;border-color:#69a9d5}
.answer-btn.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.answer-btn.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
button:focus-visible{outline:4px solid rgba(23,105,170,.22)}
button:disabled{cursor:default}
.feedback{
  min-height:56px;padding:9px 14px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.35;text-align:center;background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
button.action{
  min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;border:0;border-radius:13px;
  touch-action:manipulation;transition:transform 120ms ease,filter 120ms ease
}
button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
button.action:disabled{opacity:.48;cursor:default}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid;animation:reveal 280ms ease both}
.final-card{width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}
@media(max-width:700px),(max-height:620px){
  body{padding:6px}.app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}.track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}.instruction{min-height:44px;font-size:1.05rem}
  .figure{min-height:150px;padding:3px 6px}svg{min-height:142px}.point-label{font-size:32px}
  .answer-row{min-height:52px;gap:8px}.answer-btn{min-width:76px;height:44px;padding:0 14px;font-size:1.12rem}
  .feedback{min-height:46px;padding:7px 10px;font-size:.88rem}.controls{min-height:43px}button.action{min-height:42px;height:42px}
}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite">
  <header class="top">
    <div class="track" aria-label="Progression"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction" id="instruction"></p>

    <div class="figure">
      <svg id="scene" viewBox="0 0 900 340" role="img" aria-label="Triangle rectangle à observer"></svg>
    </div>

    <div class="answer-row" id="answers" aria-label="Choix du sommet"></div>

    <div class="feedback" id="feedback" role="status">Observe le codage de l'angle droit puis choisis un sommet.</div>

    <div class="controls">
      <button class="action primary" type="button" id="validate" disabled>Valider</button>
      <button class="action secondary" type="button" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon" aria-hidden="true">🎯</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" type="button" id="restart">Recommencer avec de nouvelles figures</button>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  const TOTAL = 10;
  const NS = 'http://www.w3.org/2000/svg';
  const LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','R','S','T','U','V'];
  const ANGLES = [0,18,35,55,75,95,115,135,155,180,205,225,245,270,290,315,335];

  const $ = id => document.getElementById(id);
  const svg = $('scene');
  const counter = $('counter');
  const scoreBox = $('score');
  const bar = $('bar');
  const instruction = $('instruction');
  const answers = $('answers');
  const feedback = $('feedback');
  const validateBtn = $('validate');
  const nextBtn = $('next');
  const exercise = $('exercise');
  const final = $('final');
  const finalScore = $('finalScore');
  const finalMessage = $('finalMessage');
  const restartBtn = $('restart');

  let questions = [];
  let index = 0;
  let score = 0;
  let selected = null;
  let locked = false;
  let previousSignature = '';

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(array){
    const copy=array.slice();
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }
  function sample(array,n){ return shuffle(array).slice(0,n); }
  function toRad(deg){ return deg*Math.PI/180; }
  function makeSvg(tag,attrs={}){
    const node=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));
    return node;
  }

  function buildGeometry(angleDeg,mirror,legA,legB,rightIndex){
    const angle=toRad(angleDeg);
    const sign=mirror ? -1 : 1;
    const raw=[
      {x:0,y:0},
      {x:legA,y:0},
      {x:0,y:sign*legB}
    ].map(p=>({
      x:p.x*Math.cos(angle)-p.y*Math.sin(angle),
      y:p.x*Math.sin(angle)+p.y*Math.cos(angle)
    }));

    const xs=raw.map(p=>p.x),ys=raw.map(p=>p.y);
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const w=maxX-minX||1,h=maxY-minY||1;
    const scale=Math.min(650/w,250/h,1.25);
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
    const placed=raw.map(p=>({x:450+(p.x-cx)*scale,y:170+(p.y-cy)*scale}));

    const vertices=new Array(3);
    const others=[0,1,2].filter(i=>i!==rightIndex);
    vertices[rightIndex]=placed[0];
    vertices[others[0]]=placed[1];
    vertices[others[1]]=placed[2];
    return vertices;
  }

  function generateQuestions(){
    for(let attempt=0;attempt<100;attempt++){
      const rightIndices=shuffle([0,0,0,0,1,1,1,2,2,2]);
      const angleSeries=sample(ANGLES,TOTAL);
      const result=[];
      const usedNames=new Set();

      for(let i=0;i<TOTAL;i++){
        let labels;
        let name;
        do{
          labels=sample(LETTERS,3);
          name=labels.join('');
        }while(usedNames.has(name));
        usedNames.add(name);

        const rightIndex=rightIndices[i];
        const mirror=Math.random()<.5;
        const legA=randInt(215,310);
        const legB=randInt(155,245);
        const vertices=buildGeometry(angleSeries[i],mirror,legA,legB,rightIndex);
        result.push({labels,rightIndex,vertices});
      }

      const signature=result.map(q=>q.labels.join('')+q.rightIndex).join('|');
      if(signature!==previousSignature){
        previousSignature=signature;
        return result;
      }
    }
    return [];
  }

  function unitVector(from,to){
    const dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy)||1;
    return {x:dx/len,y:dy/len};
  }

  function drawQuestion(q){
    svg.innerHTML='';
    const [a,b,c]=q.vertices;

    svg.appendChild(makeSvg('path',{
      d:`M ${a.x} ${a.y} L ${b.x} ${b.y} L ${c.x} ${c.y} Z`,
      class:'triangle-side'
    }));

    q.vertices.forEach(p=>{
    });

    const r=q.vertices[q.rightIndex];
    const otherIndices=[0,1,2].filter(i=>i!==q.rightIndex);
    const p=q.vertices[otherIndices[0]];
    const s=q.vertices[otherIndices[1]];
    const u=unitVector(r,p);
    const v=unitVector(r,s);
    const size=31;
    const p1={x:r.x+u.x*size,y:r.y+u.y*size};
    const corner={x:p1.x+v.x*size,y:p1.y+v.y*size};
    const p2={x:r.x+v.x*size,y:r.y+v.y*size};
    svg.appendChild(makeSvg('path',{
      d:`M ${p1.x} ${p1.y} L ${corner.x} ${corner.y} L ${p2.x} ${p2.y}`,
      class:'right-mark'
    }));

    const center={
      x:(a.x+b.x+c.x)/3,
      y:(a.y+b.y+c.y)/3
    };
    q.vertices.forEach((p,i)=>{
      let dx=p.x-center.x,dy=p.y-center.y,len=Math.hypot(dx,dy)||1;
      dx/=len;dy/=len;
      const label=makeSvg('text',{
        x:p.x+dx*31,
        y:p.y+dy*31+9,
        class:'point-label',
        'text-anchor':'middle'
      });
      label.textContent=q.labels[i];
      svg.appendChild(label);
    });
  }

  function renderAnswers(q){
    answers.innerHTML='';
    q.labels.forEach((letter,i)=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='answer-btn';
      btn.dataset.index=String(i);
      btn.textContent=letter;
      btn.addEventListener('click',()=>selectAnswer(i));
      answers.appendChild(btn);
    });
  }

  function selectAnswer(i){
    if(locked) return;
    selected=i;
    [...answers.children].forEach((btn,j)=>btn.classList.toggle('selected',j===i));
    validateBtn.disabled=false;
    feedback.className='feedback';
    feedback.textContent='Réponse choisie. Valide lorsque tu es prêt.';
  }

  function render(){
    const q=questions[index];
    selected=null;
    locked=false;
    counter.textContent=`Question ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    bar.style.width=`${((index+1)/TOTAL)*100}%`;
    instruction.textContent=`Le triangle ${q.labels.join('')} est rectangle en…`;
    feedback.className='feedback';
    feedback.textContent="Observe le codage de l'angle droit puis choisis un sommet.";
    validateBtn.disabled=true;
    validateBtn.hidden=false;
    nextBtn.hidden=true;
    drawQuestion(q);
    renderAnswers(q);
  }

  function validate(){
    if(locked || selected===null) return;
    locked=true;
    const q=questions[index];
    const correct=selected===q.rightIndex;
    const buttons=[...answers.children];

    buttons.forEach(btn=>btn.disabled=true);
    buttons[q.rightIndex].classList.add('correct');

    if(correct){
      score++;
      feedback.className='feedback success';
      feedback.textContent=`Bravo ! Le triangle ${q.labels.join('')} est bien rectangle en ${q.labels[q.rightIndex]}.`;
    }else{
      buttons[selected].classList.add('wrong');
      feedback.className='feedback error';
      feedback.textContent=`Le triangle ${q.labels.join('')} est rectangle en ${q.labels[q.rightIndex]} : c'est le sommet de l'angle droit.`;
    }

    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    validateBtn.hidden=true;
    nextBtn.hidden=false;
    nextBtn.textContent=index===TOTAL-1 ? 'Voir le résultat' : 'Question suivante';
  }

  function next(){
    if(index<TOTAL-1){
      index++;
      render();
    }else{
      showFinal();
    }
  }

  function showFinal(){
    exercise.style.display='none';
    final.classList.add('show');
    bar.style.width='100%';
    counter.textContent=`${TOTAL} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    finalScore.textContent=`Ton score : ${score} / ${TOTAL}`;

    if(score===TOTAL){
      finalMessage.textContent='Parfait ! Tu repères correctement le sommet de l’angle droit.';
    }else if(score>=8){
      finalMessage.textContent='Très bien ! Pense toujours à regarder le codage de l’angle droit.';
    }else if(score>=5){
      finalMessage.textContent='Encore un peu d’entraînement : le sommet de l’angle droit donne le nom du sommet où le triangle est rectangle.';
    }else{
      finalMessage.textContent='Reprends les figures en te concentrant sur le petit carré qui code l’angle droit.';
    }
  }

  function start(){
    questions=generateQuestions();
    index=0;
    score=0;
    selected=null;
    locked=false;
    final.classList.remove('show');
    exercise.style.display='flex';
    render();
  }

  validateBtn.addEventListener('click',validate);
  nextBtn.addEventListener('click',next);
  restartBtn.addEventListener('click',start);

  start();
})();
</script>
</body>
</html>
