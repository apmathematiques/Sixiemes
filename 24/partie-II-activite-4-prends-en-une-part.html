<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partie II – Activité 4 – Prends-en une part !</title>
<style>
:root{--blue:#1769aa;--blue-dark:#0d4778;--blue-soft:#eaf4fc;--green:#18733f;--green-soft:#e9f7ee;--red:#a52d2d;--red-soft:#fff0f0;--orange:#8b5315;--orange-soft:#fff5e8;--ink:#17212b;--muted:#5f6d78;--line:#d8e4ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}body{display:flex;justify-content:center;align-items:center;padding:8px}.app{width:min(100%,1000px);aspect-ratio:16/9;max-height:calc(100vh - 16px);background:#fff;border:1px solid rgba(23,105,170,.18);border-radius:22px;box-shadow:0 14px 34px rgba(17,63,103,.14);display:flex;flex-direction:column;overflow:hidden}.top{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 20px 8px}.track{height:12px;background:#dceaf5;border-radius:999px;overflow:hidden}.bar{width:10%;height:100%;background:linear-gradient(90deg,var(--blue),#4f9ed8);transition:width .2s ease}.pill{background:var(--blue-soft);color:var(--blue-dark);border-radius:999px;padding:8px 13px;font-weight:800;white-space:nowrap}.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:4px 18px 14px}.instruction{margin:0;text-align:center;font-size:clamp(1.25rem,2.35vw,1.75rem);font-weight:900;line-height:1.15}.card{flex:1;min-height:0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#f8fbfe);padding:16px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px}.problem{width:min(860px,100%);margin:0;text-align:center;font-size:clamp(1.35rem,2.65vw,2rem);line-height:1.38;font-weight:780}.problem strong{color:var(--blue-dark);font-weight:900}.answer-row{display:flex;align-items:center;justify-content:center;gap:12px}.answer{width:190px;height:72px;border:4px solid #8bb8d6;border-radius:15px;outline:none;text-align:center;color:var(--blue-dark);background:#fff;font-size:2.35rem;font-weight:900}.answer:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,170,.12)}.answer.good{border-color:#56aa77;background:var(--green-soft);color:var(--green)}.answer.bad{border-color:#d06a6a;background:var(--red-soft);color:var(--red)}.answer.reveal{border-color:#dda15b;background:var(--orange-soft);color:var(--orange)}.unit{max-width:240px;color:var(--blue-dark);font-size:clamp(1.15rem,2vw,1.5rem);font-weight:900}.attempt{margin:0;min-height:20px;color:var(--muted);font-size:1rem;font-weight:750}.feedback{display:none;width:min(830px,100%);padding:12px 16px;border-radius:14px;text-align:center;line-height:1.3}.feedback.show{display:block}.feedback.success{background:var(--green-soft);color:var(--green);border:2px solid #91cfaa}.feedback.error{background:var(--red-soft);color:var(--red);border:2px solid #e0a2a2}.feedback.correction{background:var(--orange-soft);color:var(--orange);border:2px solid #e0af72}.feedback-title{font-size:clamp(1.12rem,2vw,1.42rem);font-weight:950;margin-bottom:4px}.feedback-text{font-size:clamp(.98rem,1.7vw,1.16rem);font-weight:800}.correction-math{margin-top:7px;font-size:clamp(1.15rem,2.25vw,1.55rem);font-weight:950}.controls{min-height:48px;display:flex;justify-content:center;align-items:center;gap:12px}button{border:0;border-radius:12px;min-height:44px;padding:0 24px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:900;cursor:pointer}button.primary{background:var(--blue);color:#fff}button.secondary{background:var(--blue-soft);color:var(--blue-dark)}button:disabled{opacity:.45;cursor:default}.final{display:none;flex:1;place-items:center;padding:24px}.final.show{display:grid}.final-card{width:min(650px,100%);padding:28px;text-align:center;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.10)}.final-card h2{margin:0 0 10px;color:var(--blue-dark);font-size:2rem}.final-score{margin:8px 0;font-size:1.45rem;font-weight:950}.final-message{margin:8px 0 20px;color:var(--muted);font-size:1.08rem;line-height:1.4}
@media(max-width:720px),(max-height:650px){body{padding:4px}.app{height:calc(100vh - 8px);aspect-ratio:auto;max-height:none;border-radius:14px}.top{grid-template-columns:1fr auto;gap:7px;padding:8px 10px 5px}.track{grid-column:1/-1}.pill{padding:6px 9px;font-size:.82rem}.main{padding:2px 8px 8px;gap:6px}.instruction{font-size:1.05rem}.card{padding:8px 10px;gap:8px}.problem{font-size:1rem;line-height:1.25}.answer{width:125px;height:50px;border-width:3px;border-radius:10px;font-size:1.7rem}.unit{font-size:1rem;max-width:150px}.attempt{font-size:.76rem;min-height:15px}.feedback{padding:7px 9px}.feedback-title{font-size:.9rem}.feedback-text{font-size:.78rem}.correction-math{font-size:.96rem;margin-top:4px}.controls{min-height:38px}button{min-height:34px;height:34px;padding:0 15px;font-size:.86rem}}
</style>
</head>
<body>
<main class="app" aria-live="polite">
<header class="top"><div class="track"><div class="bar" id="bar"></div></div><div class="pill" id="counter">Question 1 / 10</div><div class="pill" id="score">Score : 0 / 10</div></header>
<section class="main" id="exercise">
<p class="instruction">Calcule la quantité correspondant au pourcentage indiqué.</p>
<div class="card">
<p class="problem" id="problem"></p>
<div class="answer-row"><input id="answer" class="answer" inputmode="decimal" autocomplete="off" aria-label="Réponse"><span class="unit" id="unit"></span></div>
<p class="attempt" id="attempt">Tu as 2 essais.</p>
<div class="feedback" id="feedback" role="status" aria-live="assertive"><div class="feedback-title" id="feedbackTitle"></div><div class="feedback-text" id="feedbackText"></div><div class="correction-math" id="feedbackMath"></div></div>
</div>
<div class="controls"><button class="primary" id="validate" disabled>Valider</button><button class="secondary" id="next" hidden>Question suivante</button></div>
</section>
<section class="final" id="final"><div class="final-card"><h2>Activité terminée !</h2><p class="final-score" id="finalScore"></p><p class="final-message" id="finalMessage"></p><button class="primary" id="restart">Rejouer avec de nouvelles questions</button></div></section>
</main>
<script>
(()=>{'use strict';
const TOTAL=10,MAX_ATTEMPTS=2,PERCENTS=[10,20,25,50,75,100,200];
const $=id=>document.getElementById(id),problemEl=$('problem'),answerEl=$('answer'),unitEl=$('unit'),attemptEl=$('attempt'),feedbackEl=$('feedback'),feedbackTitleEl=$('feedbackTitle'),feedbackTextEl=$('feedbackText'),feedbackMathEl=$('feedbackMath'),validateBtn=$('validate'),nextBtn=$('next'),counterEl=$('counter'),scoreEl=$('score'),barEl=$('bar'),exerciseEl=$('exercise'),finalEl=$('final'),finalScoreEl=$('finalScore'),finalMessageEl=$('finalMessage'),restartBtn=$('restart');
let questions=[],index=0,score=0,attempts=0,resolved=false;
function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min}function pick(a){return a[ri(0,a.length-1)]}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}function parseNumber(t){const s=String(t).trim().replace(/\s/g,'').replace(',','.');return /^-?\d+(?:\.\d+)?$/.test(s)?Number(s):null}function approxEqual(a,b){return Math.abs(a-b)<1e-9}function resetFeedback(){feedbackEl.className='feedback';feedbackTitleEl.textContent='';feedbackTextEl.textContent='';feedbackMathEl.innerHTML=''}function showFeedback(type,title,text,math=''){feedbackEl.className=`feedback show ${type}`;feedbackTitleEl.textContent=title;feedbackTextEl.textContent=text;feedbackMathEl.innerHTML=math}
const contexts=[
{unit:'€',build:(b,p)=>`Un article coûte <strong>${fmt(b)} €</strong>. Une remise représente <strong>${p} %</strong> de ce prix. Quel est le montant de la remise ?`},
{unit:'g',build:(b,p)=>`Une tablette pèse <strong>${fmt(b)} g</strong>. <strong>${p} %</strong> de sa masse correspond à un ingrédient. Quelle masse cela représente-t-il ?`},
{unit:'mL',build:(b,p)=>`Une bouteille contient <strong>${fmt(b)} mL</strong>. On utilise <strong>${p} %</strong> de son contenu. Quel volume est utilisé ?`},
{unit:'km',build:(b,p)=>`Un parcours mesure <strong>${fmt(b)} km</strong>. Une distance représente <strong>${p} %</strong> de ce parcours. Quelle est cette distance ?`},
{unit:'élèves',build:(b,p)=>`Un établissement compte <strong>${fmt(b)} élèves</strong>. Un groupe représente <strong>${p} %</strong> de cet effectif. Combien d'élèves cela représente-t-il ?`},
{unit:'objets',build:(b,p)=>`Une collection contient <strong>${fmt(b)} objets</strong>. On considère <strong>${p} %</strong> de cette collection. Combien d'objets cela représente-t-il ?`},
{unit:'kg',build:(b,p)=>`Une réserve contient <strong>${fmt(b)} kg</strong> de marchandises. On prélève une quantité égale à <strong>${p} %</strong> de la réserve. Quelle masse cela représente-t-il ?`}
];
const bases={10:[20,30,40,50,60,80,100,120,150,200,250,300,400,500,600,800],20:[20,25,30,40,50,60,75,80,100,120,150,200,250,300,400,500],25:[20,24,28,32,36,40,48,60,80,100,120,160,200,240,400],50:[12,18,20,24,30,36,40,50,60,80,100,120,150,200,300,400],75:[20,24,28,32,36,40,48,60,80,100,120,160,200,240,400],100:[12,18,20,24,30,36,40,50,60,80,100,120,150,200,300,400],200:[6,8,10,12,15,18,20,24,25,30,40,50,60,80,100,120]};
function makePercentSequence(){const seq=PERCENTS.slice();while(seq.length<TOTAL)seq.push(pick(PERCENTS));return shuffle(seq)}
function makeQuestion(percent,used){let base,context,key,tries=0;do{base=pick(bases[percent]);context=pick(contexts);key=`${percent}|${base}|${context.unit}`;tries++}while(used.has(key)&&tries<50);used.add(key);return{percent,base,result:base*percent/100,unit:context.unit,statement:context.build(base,percent)}}
function generateQuestions(){const used=new Set();return makePercentSequence().map(p=>makeQuestion(p,used))}
function correctionFor(i){const p=i.percent,b=i.base,r=i.result,u=i.unit;if(p===10)return{text:'10 % revient à prendre le dixième.',math:`${fmt(b)} ÷ 10 = ${fmt(r)} ${u}`};if(p===20)return{text:'20 % revient à prendre le cinquième.',math:`${fmt(b)} ÷ 5 = ${fmt(r)} ${u}`};if(p===25)return{text:'25 % revient à prendre le quart.',math:`${fmt(b)} ÷ 4 = ${fmt(r)} ${u}`};if(p===50)return{text:'50 % revient à prendre la moitié.',math:`${fmt(b)} ÷ 2 = ${fmt(r)} ${u}`};if(p===75)return{text:'75 % revient à prendre les trois quarts.',math:`${fmt(b)} ÷ 4 × 3 = ${fmt(r)} ${u}`};if(p===100)return{text:'100 % revient à prendre le tout.',math:`100 % de ${fmt(b)} = ${fmt(r)} ${u}`};return{text:'200 % revient à prendre le double.',math:`${fmt(b)} × 2 = ${fmt(r)} ${u}`}}
function hintFor(p){if(p===10)return'Cherche le dixième de la quantité.';if(p===20)return'Cherche quelle fraction simple correspond à 20 %.';if(p===25)return'Cherche quelle fraction simple correspond à 25 %.';if(p===50)return'Cherche quelle fraction simple correspond à 50 %.';if(p===75)return'Cherche quelle fraction simple correspond à 75 %.';if(p===100)return'Que représente 100 % d’une quantité ?';return'Que représente 200 % d’une quantité ?'}
function render(){const i=questions[index];attempts=0;resolved=false;problemEl.innerHTML=i.statement;unitEl.textContent=i.unit;answerEl.value='';answerEl.disabled=false;answerEl.className='answer';attemptEl.textContent='Tu as 2 essais.';resetFeedback();validateBtn.hidden=false;validateBtn.disabled=true;nextBtn.hidden=true;nextBtn.disabled=false;counterEl.textContent=`Question ${index+1} / ${TOTAL}`;scoreEl.textContent=`Score : ${fmt(score)} / ${TOTAL}`;barEl.style.width=`${((index+1)/TOTAL)*100}%`;setTimeout(()=>answerEl.focus(),0)}
function showNextButton(){validateBtn.hidden=true;nextBtn.hidden=false;nextBtn.disabled=true;setTimeout(()=>{nextBtn.disabled=false},700)}
function handleCorrect(i){resolved=true;const pts=attempts===1?1:.5;score+=pts;answerEl.className='answer good';answerEl.disabled=true;showFeedback('success','✓ Bravo !',attempts===1?'Tu as trouvé la bonne quantité.':'Tu as trouvé la bonne quantité au deuxième essai.',`${i.percent} % de ${fmt(i.base)} = ${fmt(i.result)} ${i.unit}`);attemptEl.textContent=pts===1?'1 point gagné.':'0,5 point gagné.';scoreEl.textContent=`Score : ${fmt(score)} / ${TOTAL}`;showNextButton()}
function handleFirstError(i){answerEl.className='answer bad';showFeedback('error','Ce n’est pas encore ça.',hintFor(i.percent));attemptEl.textContent='Il te reste 1 essai.';answerEl.focus()}
function handleSecondError(i){resolved=true;const c=correctionFor(i);answerEl.value=fmt(i.result);answerEl.className='answer reveal';answerEl.disabled=true;showFeedback('correction','Correction',c.text,c.math);attemptEl.textContent='La correction est affichée.';showNextButton()}
function validate(){if(resolved)return;const v=parseNumber(answerEl.value);if(v===null){showFeedback('error','Réponse incomplète','Écris un nombre dans la case.');return}attempts++;const i=questions[index];if(approxEqual(v,i.result))return handleCorrect(i);if(attempts<MAX_ATTEMPTS)handleFirstError(i);else handleSecondError(i)}
function next(){if(nextBtn.disabled)return;index++;if(index>=TOTAL)finish();else render()}
function finish(){exerciseEl.style.display='none';finalEl.classList.add('show');finalScoreEl.textContent=`Score : ${fmt(score)} / ${TOTAL}`;finalMessageEl.textContent=score>=9?'Très bien : tu maîtrises les pourcentages usuels.':score>=6.5?'Bon travail. Revois surtout les équivalences entre pourcentages usuels et fractions simples.':'Entraîne-toi encore avec les pourcentages usuels : dixième, cinquième, quart, moitié, trois quarts, tout et double.'}
function restart(){questions=generateQuestions();index=0;score=0;attempts=0;resolved=false;finalEl.classList.remove('show');exerciseEl.style.display='flex';render()}
answerEl.addEventListener('input',()=>{answerEl.className='answer';validateBtn.disabled=!answerEl.value.trim()});answerEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!validateBtn.disabled&&!validateBtn.hidden){e.preventDefault();validate()}});validateBtn.addEventListener('click',validate);nextBtn.addEventListener('click',next);restartBtn.addEventListener('click',restart);restart();})();
</script>
</body>
</html>
