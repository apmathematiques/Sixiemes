<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--i);font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);
  overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);
  border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;
  padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;text-align:center;
  white-space:nowrap;background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:4px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.35rem,2.5vw,1.7rem);font-weight:600;line-height:1.2;text-align:center
}
.figure{
  flex:1;min-height:230px;padding:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.inequality{
  width:100%;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:nowrap
}
.bound{
  min-width:145px;color:var(--bd);font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:800;text-align:center;font-variant-numeric:tabular-nums
}
.sign{
  color:#526579;font-size:clamp(2.1rem,4.2vw,3.15rem);font-weight:700;line-height:1
}
.answer{
  width:min(26vw,210px);min-width:145px;height:82px;padding:0 14px;
  color:var(--i);font-size:clamp(1.7rem,3.8vw,2.65rem);font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;background:#fff;border:3px solid #bfd2e1;border-radius:15px;
  outline:none;transition:border-color .13s ease,box-shadow .13s ease,background .13s ease
}
.answer:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(23,105,170,.10)}
.answer.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.answer.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.hintline{
  min-height:24px;margin:0;color:var(--m);font-size:.93rem;font-weight:600;text-align:center
}
.feedback{
  min-height:54px;padding:8px 13px;display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;line-height:1.35;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap
}
button.action{
  min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;
  border:0;border-radius:13px;touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease
}
button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
button.action:focus-visible{outline:4px solid rgba(23,105,170,.22)}
button.action:disabled{opacity:.48;cursor:default}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid;animation:reveal 280ms ease both}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;
  border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}
}
@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:6px}
  .instruction{min-height:44px;font-size:1.12rem}
  .figure{min-height:180px;padding:10px;gap:12px}
  .inequality{gap:7px}
  .bound{min-width:0;width:24%;font-size:clamp(1.25rem,5.2vw,1.75rem)}
  .answer{min-width:0;width:30%;height:58px;padding:0 6px;font-size:clamp(1.2rem,5vw,1.7rem);border-width:2px}
  .sign{font-size:clamp(1.5rem,6vw,2rem)}
  .hintline{font-size:.75rem}
  .feedback{min-height:46px;padding:6px 9px;font-size:.86rem}
  .controls{min-height:41px}
  button.action{min-height:40px;height:40px}
}
.tablet-device .pill{font-size:1.15rem}.tablet-device .instruction{min-height:64px;font-size:clamp(1.65rem,3vw,2rem)}.tablet-device .bound{font-size:clamp(1.75rem,3.3vw,2.35rem)}.tablet-device .answer{height:76px;font-size:clamp(1.75rem,3.3vw,2.35rem)}.tablet-device .hintline{font-size:1rem}.tablet-device button.action{min-height:54px;height:54px;font-size:1.08rem}.tablet-device .feedback{min-height:58px;font-size:1.08rem}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite">
  <header class="top">
    <div class="track" aria-label="Progression"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction" id="instruction"></p>

    <div class="figure">
      <div class="inequality" aria-label="Nombre à intercaler">
        <div class="bound" id="lower"></div>
        <span class="sign">&lt;</span>
        <input class="answer" id="answer" type="text" inputmode="decimal"
               autocomplete="off" spellcheck="false" aria-label="Nombre à intercaler">
        <span class="sign">&lt;</span>
        <div class="bound" id="upper"></div>
      </div>

      <p class="hintline">Tu peux écrire avec une virgule ou un point.</p>
    </div>

    <div class="feedback" id="feedback" role="status">
      Écris un nombre strictement compris entre les deux bornes.
    </div>

    <div class="controls">
      <button class="action primary" type="button" id="validate" disabled>Valider</button>
      <button class="action secondary" type="button" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon" aria-hidden="true">🎯</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" type="button" id="restart">Recommencer avec de nouveaux intervalles</button>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  const isTabletDevice=(navigator.maxTouchPoints||0)>0&&Math.min(screen.width||0,screen.height||0)>=600;
  document.documentElement.classList.toggle('tablet-device',isTabletDevice);

  const TOTAL = 8;
  const $ = id => document.getElementById(id);

  const counter = $('counter');
  const scoreBox = $('score');
  const bar = $('bar');
  const instruction = $('instruction');
  const lowerBox = $('lower');
  const upperBox = $('upper');
  const answerInput = $('answer');
  const feedback = $('feedback');
  const validateBtn = $('validate');
  const nextBtn = $('next');
  const exercise = $('exercise');
  const final = $('final');
  const finalScore = $('finalScore');
  const finalMessage = $('finalMessage');
  const restartBtn = $('restart');

  let questions = [];
  let index = 0;
  let score = 0;
  let attempts = 0;
  let locked = false;

  function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function shuffle(array){
    const copy=array.slice();
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function formatScore(n){
    return Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.',',');
  }

  function parseFrenchNumber(text){
    const cleaned=text.trim().replace(/\s+/g,'').replace(',','.');
    if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned)) return null;
    const n=Number(cleaned);
    return Number.isFinite(n)?n:null;
  }

  function formatNumber(n,decimals){
    return n.toFixed(decimals).replace('.',',');
  }

  function stripTrailingZeros(text){
    if(!text.includes(',')) return text;
    return text.replace(/0+$/,'').replace(/,$/,'');
  }

  function normalizeVisible(){
    const value=answerInput.value.trim();
    if(value.includes('.')) answerInput.value=value.replace('.',',');
  }

  function makeQuestion(type){
    let lower,upper,lowerDecimals,upperDecimals,example;

    if(type==='wide'){
      const ip=randInt(1,15);
      const a=randInt(1,5);
      const b=randInt(a+2,9);
      lower=ip+a/10;
      upper=ip+b/10;
      lowerDecimals=1;
      upperDecimals=1;
      example=ip+(a+1)/10;
    }

    if(type==='hundredth'){
      const ip=randInt(1,16);
      const tenth=randInt(0,8);
      const h=randInt(0,8);
      lower=ip+tenth/10+h/100;
      upper=lower+0.01;
      lowerDecimals=2;
      upperDecimals=2;
      example=lower+0.005;
    }

    if(type==='thousandth'){
      const ip=randInt(1,18);
      const hundredths=randInt(0,98);
      const milli=randInt(0,8);
      lower=ip+hundredths/100+milli/1000;
      upper=lower+0.001;
      lowerDecimals=3;
      upperDecimals=3;
      example=lower+0.0005;
    }

    if(type==='mixed'){
      const ip=randInt(2,14);
      const tenth=randInt(1,8);
      lower=ip+tenth/10;
      upper=lower+0.01;
      lowerDecimals=1;
      upperDecimals=2;
      example=lower+0.005;
    }

    if(type==='crossTenth'){
      const ip=randInt(2,14);
      const t=randInt(1,8);
      lower=ip+t/10+0.09;
      upper=ip+(t+1)/10+0.01;
      lowerDecimals=2;
      upperDecimals=2;
      example=(lower+upper)/2;
    }

    if(type==='crossUnit'){
      const ip=randInt(2,18);
      lower=ip+0.99;
      upper=ip+1.01;
      lowerDecimals=2;
      upperDecimals=2;
      example=ip+1;
    }

    return {
      type,
      lower,
      upper,
      lowerDisplay:stripTrailingZeros(formatNumber(lower,lowerDecimals)),
      upperDisplay:stripTrailingZeros(formatNumber(upper,upperDecimals)),
      example
    };
  }

  function buildQuestions(){
    const types=shuffle([
      'wide',
      'wide',
      'hundredth',
      'hundredth',
      'thousandth',
      'mixed',
      'crossTenth',
      'crossUnit'
    ]);
    return types.map(makeQuestion);
  }

  function exampleDisplay(q){
    let decimals=1;
    if(q.type==='hundredth'||q.type==='mixed'||q.type==='crossTenth'||q.type==='crossUnit') decimals=3;
    if(q.type==='thousandth') decimals=4;
    return stripTrailingZeros(formatNumber(q.example,decimals));
  }

  function render(){
    const q=questions[index];

    attempts=0;
    locked=false;

    counter.textContent=`Question ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${formatScore(score)} / ${TOTAL}`;
    bar.style.width=`${((index+1)/TOTAL)*100}%`;

    instruction.textContent=`Écris un nombre compris entre ${q.lowerDisplay} et ${q.upperDisplay}.`;
    lowerBox.textContent=q.lowerDisplay;
    upperBox.textContent=q.upperDisplay;

    answerInput.value='';
    answerInput.disabled=false;
    answerInput.classList.remove('correct','wrong');

    feedback.className='feedback';
    feedback.textContent='Écris un nombre strictement compris entre les deux bornes.';

    validateBtn.hidden=false;
    validateBtn.disabled=true;
    nextBtn.hidden=true;

    setTimeout(()=>answerInput.focus(),0);
  }

  function updateValidate(){
    validateBtn.disabled=locked || !answerInput.value.trim();
  }

  validateBtn.addEventListener('click',()=>{
    if(locked) return;

    normalizeVisible();

    const q=questions[index];
    const value=parseFrenchNumber(answerInput.value);

    if(value===null){
      feedback.className='feedback error';
      feedback.textContent='Écris un nombre valide, avec une virgule ou un point.';
      answerInput.classList.add('wrong');
      return;
    }

    attempts++;

    if(value>q.lower && value<q.upper){
      score += attempts===1 ? 1 : .5;
      scoreBox.textContent=`Score : ${formatScore(score)} / ${TOTAL}`;

      locked=true;
      answerInput.disabled=true;
      answerInput.classList.remove('wrong');
      answerInput.classList.add('correct');

      feedback.className='feedback success';
      feedback.textContent=`Bravo ! ${answerInput.value} est bien strictement compris entre ${q.lowerDisplay} et ${q.upperDisplay}.`;

      validateBtn.hidden=true;
      nextBtn.hidden=false;
      return;
    }

    answerInput.classList.remove('correct');
    answerInput.classList.add('wrong');

    if(attempts===1){
      feedback.className='feedback error';

      if(value===q.lower || value===q.upper){
        feedback.textContent='Il faut choisir un nombre strictement compris entre les deux bornes : une borne elle-même ne convient pas.';
      }else if(value<q.lower){
        feedback.textContent=`Ton nombre doit être plus grand que ${q.lowerDisplay}.`;
      }else{
        feedback.textContent=`Ton nombre doit être plus petit que ${q.upperDisplay}.`;
      }
      return;
    }

    if(attempts>=2){
      locked=true;
      answerInput.disabled=true;

      const example=exampleDisplay(q);
      answerInput.value=example;
      answerInput.classList.remove('wrong');
      answerInput.classList.add('correct');

      feedback.className='feedback error';
      feedback.textContent=`Par exemple, ${example} convient. D’autres réponses étaient possibles.`;

      validateBtn.hidden=true;
      nextBtn.hidden=false;
    }
  });

  answerInput.addEventListener('input',()=>{
    answerInput.classList.remove('correct','wrong');
    updateValidate();
  });

  answerInput.addEventListener('blur',normalizeVisible);

  answerInput.addEventListener('keydown',ev=>{
    if(ev.key==='Enter' && !validateBtn.disabled && !validateBtn.hidden){
      validateBtn.click();
    }
  });

  nextBtn.addEventListener('click',()=>{
    if(index<TOTAL-1){
      index++;
      render();
    }else{
      showFinal();
    }
  });

  restartBtn.addEventListener('click',start);

  function showFinal(){
    exercise.style.display='none';
    final.classList.add('show');
    finalScore.textContent=`Score : ${formatScore(score)} / ${TOTAL}`;

    const ratio=score/TOTAL;
    finalMessage.textContent=ratio>=.85
      ? 'Très bien ! Tu sais trouver un nombre décimal entre deux autres.'
      : ratio>=.6
      ? 'Bon travail. Pense à vérifier que ton nombre est strictement supérieur à la borne de gauche et strictement inférieur à celle de droite.'
      : 'Entraîne-toi encore : compare ton nombre avec chacune des deux bornes.';
  }

  function start(){
    questions=buildQuestions();
    index=0;
    score=0;
    attempts=0;
    locked=false;

    final.classList.remove('show');
    exercise.style.display='flex';
    render();
  }

  start();
})();
</script>
</body>
</html>
