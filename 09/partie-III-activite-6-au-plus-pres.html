<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{--b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;--g:#20864b;--gs:#e9f7ef;--r:#c63d3d;--rs:#fff0f0;--i:#17212b;--m:#5f6d79}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--i);font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;padding:12px}
.app{width:min(100%,980px);aspect-ratio:16/9;min-height:480px;max-height:calc(100vh - 24px);overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,.96);border:1px solid rgba(23,105,170,.14);border-radius:22px;box-shadow:0 14px 35px rgba(17,63,103,.14)}
.top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:16px 24px 10px}.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}.bar{width:12.5%;height:100%;background:linear-gradient(90deg,var(--b),#4f9ed8);border-radius:inherit;transition:width 260ms ease}.pill{min-width:116px;padding:9px 14px;color:var(--bd);font-weight:700;text-align:center;white-space:nowrap;background:var(--bs);border-radius:999px}
.main{flex:1;min-height:0;padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px}.instruction{min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.35rem,2.5vw,1.7rem);font-weight:600;line-height:1.2;text-align:center}.figure{flex:1;min-height:230px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(180deg,#fff,#f8fbfe);border:1px solid #dce9f3;border-radius:18px}.step-pill{padding:7px 13px;color:var(--bd);font-weight:700;background:var(--bs);border-radius:999px}.inequality{width:100%;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:nowrap}.bound-input{width:min(23vw,180px);min-width:125px;height:74px;padding:0 12px;color:var(--i);font-size:clamp(1.55rem,3.4vw,2.4rem);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;background:#fff;border:3px solid #bfd2e1;border-radius:15px;outline:none;transition:border-color .13s ease,box-shadow .13s ease,background .13s ease}.bound-input:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(23,105,170,.10)}.bound-input.correct{color:#165e36;background:var(--gs);border-color:#79c798}.bound-input.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}.sign{color:#526579;font-size:clamp(2rem,4vw,3rem);font-weight:700;line-height:1}.target{min-width:150px;color:var(--bd);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.choice-area{display:none;flex-direction:column;align-items:center;gap:16px;width:100%}.choice-area.show{display:flex}.question-line{margin:0;color:var(--i);font-size:clamp(1.2rem,2.3vw,1.55rem);font-weight:600;text-align:center}.choices{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.choice{min-width:150px;min-height:70px;padding:10px 24px;color:var(--bd);font-size:clamp(1.55rem,3vw,2.2rem);font-weight:800;background:var(--bs);border:3px solid transparent;border-radius:15px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease,color .12s ease}.choice:hover:not(:disabled){filter:brightness(1.03)}.choice:active:not(:disabled){transform:scale(.98)}.choice.selected{background:#d7ebfb;border-color:#69a9d5}.choice.correct{color:#165e36;background:var(--gs);border-color:#79c798}.choice.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}.choice:disabled{cursor:default}.conclusion{display:none;margin:0;padding:9px 16px;color:#165e36;font-size:1.05rem;font-weight:800;text-align:center;background:var(--gs);border:1px solid #a9ddbd;border-radius:13px}.conclusion.show{display:block}.hintline{min-height:22px;margin:0;color:var(--m);font-size:.9rem;font-weight:600;text-align:center}
.feedback{min-height:54px;padding:8px 13px;display:flex;align-items:center;justify-content:center;color:var(--m);font-weight:650;line-height:1.35;text-align:center;background:#f4f7fb;border-radius:14px}.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}.controls{min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}button.action{min-height:46px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;border:0;border-radius:13px;touch-action:manipulation;transition:transform 120ms ease,filter 120ms ease}button.action:hover:not(:disabled){filter:brightness(1.03)}button.action:active:not(:disabled){transform:scale(.98)}button.action:focus-visible,.choice:focus-visible{outline:4px solid rgba(23,105,170,.22)}button.action:disabled{opacity:.48;cursor:default}.primary{color:#fff;background:var(--b)}.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}.final.show{display:grid;animation:reveal 280ms ease both}.final-card{width:min(650px,100%);padding:28px;background:#fff;border:1px solid #dce9f3;border-radius:20px;box-shadow:0 12px 30px rgba(17,63,103,.1)}.final-icon{margin-bottom:5px;font-size:3rem}.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}@media(max-width:700px),(max-height:620px){body{padding:6px}.app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}.top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}.track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}.main{padding:2px 10px 10px;gap:6px}.instruction{min-height:44px;font-size:1.12rem}.figure{min-height:180px;padding:9px;gap:10px}.step-pill{padding:5px 9px;font-size:.78rem}.inequality{gap:6px}.bound-input{min-width:0;width:27%;height:56px;padding:0 5px;font-size:clamp(1.1rem,4.8vw,1.6rem);border-width:2px}.target{min-width:0;width:25%;font-size:clamp(1.2rem,5vw,1.7rem)}.sign{font-size:clamp(1.45rem,6vw,1.9rem)}.question-line{font-size:.95rem}.choices{gap:8px}.choice{min-width:115px;min-height:52px;padding:6px 15px;font-size:1.25rem;border-width:2px}.conclusion{font-size:.88rem;padding:6px 10px}.hintline{font-size:.72rem}.feedback{min-height:46px;padding:6px 9px;font-size:.86rem}.controls{min-height:41px}button.action{min-height:40px;height:40px}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite">
<header class="top"><div class="track" aria-label="Progression"><div class="bar" id="bar"></div></div><div class="pill" id="counter">Question 1 / 8</div><div class="pill" id="score">Score : 0 / 8</div></header>
<section class="main" id="exercise">
<p class="instruction" id="instruction"></p>
<div class="figure">
<div class="step-pill" id="stepPill">Étape 1 : encadrer</div>
<div class="inequality" id="encadrement"><input class="bound-input" id="lowerInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Borne inférieure"><span class="sign">&lt;</span><div class="target" id="target"></div><span class="sign">&lt;</span><input class="bound-input" id="upperInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Borne supérieure"></div>
<div class="choice-area" id="choiceArea"><p class="question-line" id="choiceQuestion"></p><div class="choices"><button class="choice" type="button" id="lowerChoice"></button><button class="choice" type="button" id="upperChoice"></button></div></div>
<p class="conclusion" id="conclusion"></p><p class="hintline" id="hintline">Tu peux écrire avec une virgule ou un point.</p>
</div>
<div class="feedback" id="feedback" role="status">Commence par encadrer le nombre à la précision demandée.</div>
<div class="controls"><button class="action primary" type="button" id="validate" disabled>Valider</button><button class="action secondary" type="button" id="next" hidden>Question suivante</button></div>
</section>
<section class="final" id="final"><div class="final-card"><div class="final-icon" aria-hidden="true">🎯</div><h2>Activité terminée !</h2><p class="final-score" id="finalScore"></p><p class="final-message" id="finalMessage"></p><button class="action primary" type="button" id="restart">Recommencer avec de nouveaux nombres</button></div></section>
</main>
<script>
(() => {
'use strict';
const TOTAL=8,$=id=>document.getElementById(id);
const counter=$('counter'),scoreBox=$('score'),bar=$('bar'),instruction=$('instruction'),stepPill=$('stepPill'),targetBox=$('target'),lowerInput=$('lowerInput'),upperInput=$('upperInput'),choiceArea=$('choiceArea'),choiceQuestion=$('choiceQuestion'),lowerChoice=$('lowerChoice'),upperChoice=$('upperChoice'),conclusion=$('conclusion'),hintline=$('hintline'),feedback=$('feedback'),validateBtn=$('validate'),nextBtn=$('next'),exercise=$('exercise'),final=$('final'),finalScore=$('finalScore'),finalMessage=$('finalMessage'),restartBtn=$('restart');
let questions=[],index=0,score=0,attempts=0,stage=1,locked=false,selectedChoice=null;
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}function choice(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}function formatScore(n){return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')}function parseFrenchNumber(t){const c=t.trim().replace(/\s+/g,'').replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(c))return null;const n=Number(c);return Number.isFinite(n)?n:null}function normalizeInput(input){const v=input.value.trim();if(v.includes('.'))input.value=v.replace('.',',')}function fixed(n,d){return n.toFixed(d).replace('.',',')}function strip(t){return t.includes(',')?t.replace(/0+$/,'').replace(/,$/,''):t}
function makeQuestion(p,mid=false){let lower,target,upper;if(p===0){const b=randInt(2,18);lower=b;upper=b+1;target=mid?b+.5:b+choice([1,2,3,4,6,7,8,9])/10}else if(p===1){const ip=randInt(2,18),t=randInt(0,9);lower=ip+t/10;upper=lower+.1;target=mid?lower+.05:lower+choice([1,2,3,4,6,7,8,9])/100}else{const ip=randInt(2,18),h=randInt(0,99);lower=ip+h/100;upper=lower+.01;target=mid?lower+.005:lower+choice([1,2,3,4,6,7,8,9])/1000}const digits=Math.min(3,p+1),targetDisplay=strip(fixed(target,digits)),lowerDisplay=fixed(lower,p),upperDisplay=fixed(upper,p),dl=Math.abs(target-lower),du=Math.abs(upper-target);let answer='lower';if(du<dl||Math.abs(du-dl)<1e-9)answer='upper';return{precision:p,midpoint:mid,target,lower,upper,answer,targetDisplay,lowerDisplay,upperDisplay,roundedDisplay:answer==='lower'?lowerDisplay:upperDisplay}}
function buildQuestions(){return shuffle([{p:0,m:false},{p:0,m:false},{p:0,m:true},{p:1,m:false},{p:1,m:false},{p:1,m:true},{p:2,m:false},{p:2,m:false}]).map(s=>makeQuestion(s.p,s.m))}
function precisionLabel(p){return p===0?'à l’unité':p===1?'au dixième':'au centième'}function resetStyles(){lowerInput.classList.remove('correct','wrong');upperInput.classList.remove('correct','wrong');[lowerChoice,upperChoice].forEach(b=>b.classList.remove('selected','correct','wrong'))}
function render(){const q=questions[index];attempts=0;stage=1;locked=false;selectedChoice=null;counter.textContent=`Question ${index+1} / ${TOTAL}`;scoreBox.textContent=`Score : ${formatScore(score)} / ${TOTAL}`;bar.style.width=`${((index+1)/TOTAL)*100}%`;instruction.textContent=`Arrondis ${q.targetDisplay} ${precisionLabel(q.precision)}.`;stepPill.textContent='Étape 1 : encadrer';targetBox.textContent=q.targetDisplay;lowerInput.value='';upperInput.value='';lowerInput.disabled=false;upperInput.disabled=false;choiceArea.classList.remove('show');lowerChoice.disabled=false;upperChoice.disabled=false;conclusion.classList.remove('show');conclusion.textContent='';hintline.textContent='Tu peux écrire avec une virgule ou un point.';resetStyles();feedback.className='feedback';feedback.textContent='Commence par encadrer le nombre à la précision demandée.';validateBtn.hidden=false;validateBtn.disabled=true;nextBtn.hidden=true;setTimeout(()=>lowerInput.focus(),0)}
function updateValidate(){if(locked){validateBtn.disabled=true;return}validateBtn.disabled=stage===1?!(lowerInput.value.trim()&&upperInput.value.trim()):!selectedChoice}
function stage1Result(){const q=questions[index],l=parseFrenchNumber(lowerInput.value),u=parseFrenchNumber(upperInput.value);return{lower:l,upper:u,lowerOK:l!==null&&Math.abs(l-q.lower)<1e-10,upperOK:u!==null&&Math.abs(u-q.upper)<1e-10}}
function moveToStage2(){const q=questions[index];stage=2;selectedChoice=null;lowerInput.disabled=true;upperInput.disabled=true;lowerInput.value=q.lowerDisplay;upperInput.value=q.upperDisplay;lowerInput.classList.remove('wrong');upperInput.classList.remove('wrong');lowerInput.classList.add('correct');upperInput.classList.add('correct');stepPill.textContent='Étape 2 : choisir la borne la plus proche';choiceQuestion.textContent=`De quelle borne ${q.targetDisplay} est-il le plus proche ?`;lowerChoice.textContent=q.lowerDisplay;upperChoice.textContent=q.upperDisplay;choiceArea.classList.add('show');hintline.textContent=q.midpoint?'Attention : le nombre est exactement au milieu des deux bornes.':'';feedback.className='feedback';feedback.textContent='Choisis maintenant la borne la plus proche.';validateBtn.disabled=true}
function showCorrection(message){const q=questions[index];locked=true;lowerInput.value=q.lowerDisplay;upperInput.value=q.upperDisplay;lowerInput.disabled=true;upperInput.disabled=true;lowerInput.classList.remove('wrong');upperInput.classList.remove('wrong');lowerInput.classList.add('correct');upperInput.classList.add('correct');choiceArea.classList.add('show');lowerChoice.textContent=q.lowerDisplay;upperChoice.textContent=q.upperDisplay;lowerChoice.disabled=true;upperChoice.disabled=true;(q.answer==='lower'?lowerChoice:upperChoice).classList.add('correct');stepPill.textContent='Correction';conclusion.textContent=`L’arrondi de ${q.targetDisplay} ${precisionLabel(q.precision)} est ${q.roundedDisplay}.`;conclusion.classList.add('show');feedback.className='feedback error';feedback.textContent=message;validateBtn.hidden=true;nextBtn.hidden=false}
validateBtn.addEventListener('click',()=>{if(locked)return;const q=questions[index];if(stage===1){normalizeInput(lowerInput);normalizeInput(upperInput);const r=stage1Result();if(r.lower===null||r.upper===null){feedback.className='feedback error';feedback.textContent='Écris deux nombres valides, avec une virgule ou un point.';return}if(r.lowerOK&&r.upperOK){lowerInput.classList.add('correct');upperInput.classList.add('correct');moveToStage2();return}attempts++;lowerInput.classList.toggle('correct',r.lowerOK);lowerInput.classList.toggle('wrong',!r.lowerOK);upperInput.classList.toggle('correct',r.upperOK);upperInput.classList.toggle('wrong',!r.upperOK);if(attempts===1){feedback.className='feedback error';feedback.textContent='Cherche les deux nombres consécutifs, à la précision demandée, qui entourent le nombre.';return}showCorrection(`Correction : ${q.lowerDisplay} < ${q.targetDisplay} < ${q.upperDisplay}.`);return}
if(stage===2){if(!selectedChoice)return;if(selectedChoice===q.answer){score+=attempts===0?1:.5;scoreBox.textContent=`Score : ${formatScore(score)} / ${TOTAL}`;locked=true;(q.answer==='lower'?lowerChoice:upperChoice).classList.add('correct');lowerChoice.disabled=true;upperChoice.disabled=true;conclusion.textContent=`L’arrondi de ${q.targetDisplay} ${precisionLabel(q.precision)} est ${q.roundedDisplay}.`;conclusion.classList.add('show');feedback.className='feedback success';feedback.textContent=q.midpoint?`Bravo ! ${q.targetDisplay} est à égale distance des deux bornes ; dans ce cas, on choisit la borne supérieure.`:'Bravo ! Tu as choisi la borne la plus proche.';validateBtn.hidden=true;nextBtn.hidden=false;return}attempts++;(selectedChoice==='lower'?lowerChoice:upperChoice).classList.add('wrong');if(attempts===1){feedback.className='feedback error';feedback.textContent=q.midpoint?'Le nombre est exactement à mi-chemin. Dans ce cas, on choisit la borne supérieure.':'Compare les distances entre le nombre et chacune des deux bornes.';selectedChoice=null;[lowerChoice,upperChoice].forEach(b=>b.classList.remove('selected'));validateBtn.disabled=true;return}showCorrection(q.midpoint?`Correction : ${q.targetDisplay} est à égale distance des deux bornes ; on choisit donc ${q.upperDisplay}.`:`Correction : la borne la plus proche de ${q.targetDisplay} est ${q.roundedDisplay}.`)}});
[lowerInput,upperInput].forEach(input=>{input.addEventListener('input',()=>{input.classList.remove('correct','wrong');updateValidate()});input.addEventListener('blur',()=>normalizeInput(input));input.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!validateBtn.disabled&&!validateBtn.hidden)validateBtn.click()})});function selectChoice(which){if(locked||stage!==2)return;selectedChoice=which;lowerChoice.classList.toggle('selected',which==='lower');upperChoice.classList.toggle('selected',which==='upper');lowerChoice.classList.remove('wrong');upperChoice.classList.remove('wrong');updateValidate()}lowerChoice.addEventListener('click',()=>selectChoice('lower'));upperChoice.addEventListener('click',()=>selectChoice('upper'));nextBtn.addEventListener('click',()=>{if(index<TOTAL-1){index++;render()}else showFinal()});restartBtn.addEventListener('click',start);
function showFinal(){exercise.style.display='none';final.classList.add('show');finalScore.textContent=`Score : ${formatScore(score)} / ${TOTAL}`;const r=score/TOTAL;finalMessage.textContent=r>=.85?'Très bien ! Tu sais relier encadrement et arrondi.':r>=.6?'Bon travail. Pense à encadrer d’abord le nombre, puis à choisir la borne la plus proche.':'Entraîne-toi encore : commence par trouver les deux bornes, puis compare les distances.'}function start(){questions=buildQuestions();index=0;score=0;attempts=0;stage=1;locked=false;selectedChoice=null;final.classList.remove('show');exercise.style.display='flex';render()}start();
})();
</script>
</body>
</html>
