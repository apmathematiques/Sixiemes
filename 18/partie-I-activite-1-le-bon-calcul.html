<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:10%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:118px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:56px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.42rem,2.7vw,1.85rem);
  font-weight:700;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:280px;padding:18px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.calculation{
  display:flex;align-items:center;justify-content:center;gap:.35em;
  font-size:clamp(2.2rem,5.6vw,3.7rem);
  font-weight:800;line-height:1.1;text-align:center
}
.frac{
  display:inline-grid;grid-template-rows:auto 2px auto;
  min-width:1.3em;vertical-align:middle;align-items:center;
  text-align:center;line-height:1
}
.frac .num{padding:0 .13em .08em}
.frac .line{height:2px;background:currentColor;width:100%}
.frac .den{padding:.08em .13em 0}
.op{padding:0 .06em}
.choice-buttons{
  width:min(720px,100%);display:grid;
  grid-template-columns:1fr 1fr;gap:16px
}
.choice-button{
  min-height:82px;padding:10px 18px;
  display:flex;align-items:center;justify-content:center;
  color:var(--bd);background:var(--bs);
  border:3px solid #b9d4e8;border-radius:16px;
  font:800 clamp(1.35rem,3vw,1.8rem)/1 Arial,Helvetica,sans-serif;
  cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,border-color .15s ease,background .15s ease
}
.choice-button:hover:not(:disabled){border-color:#74a9cf}
.choice-button:active:not(:disabled){transform:scale(.985)}
.choice-button.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.choice-button.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.choice-button:disabled{cursor:default}
.choice-button .frac{font-size:1.15em}
.feedback{
  min-height:72px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.98rem,1.8vw,1.13rem);
  line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px;
  visibility:hidden
}
.feedback.show{visibility:visible}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:42px;font-size:1.13rem}
  .question-zone{min-height:200px;padding:10px;gap:14px}
  .calculation{font-size:2rem}
  .choice-buttons{gap:8px}
  .choice-button{min-height:57px;padding:7px 10px;font-size:1.15rem}
  .feedback{min-height:58px;padding:8px 10px;font-size:.86rem}
  .controls{min-height:40px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 10</div>
    <div class="pill" id="score">Score : 0 / 10</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Choisis le bon résultat.</p>

    <div class="question-zone">
      <div class="calculation" id="calculation"></div>
      <div class="choice-buttons" id="choices"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">Rejouer avec de nouveaux calculs</button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=10;
const $=id=>document.getElementById(id);

const calculation=$('calculation');
const choices=$('choices');
const feedback=$('feedback');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let locked=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fracKey(f){
  return `${f.n}/${f.d}`;
}
function fractionHTML(n,d){
  return `<span class="frac" aria-label="${n} sur ${d}">
    <span class="num">${n}</span><span class="line"></span><span class="den">${d}</span>
  </span>`;
}
function operationHTML(q){
  return `${fractionHTML(q.a,q.d)}
    <span class="op">${q.op}</span>
    ${fractionHTML(q.b,q.d)}
    <span class="op">=</span>
    <span>?</span>`;
}

function makeAddition(mode){
  const d=randInt(5,15);
  let a,b;

  if(mode==='one'){
    a=randInt(1,d-2);
    b=d-a;
  }else if(mode==='over'){
    a=randInt(Math.ceil(d/2),d+3);
    b=randInt(Math.ceil(d/2),d+3);
    if(a+b<=d) b=d-a+randInt(1,3);
  }else{
    a=randInt(1,d-2);
    b=randInt(1,d-2);
    if(a+b===d) b=(b===1?2:b-1);
  }

  return buildQuestion(a,b,d,'+');
}

function makeSubtraction(){
  const d=randInt(5,15);
  const b=randInt(1,d-2);
  const a=randInt(b+1,d+4);
  return buildQuestion(a,b,d,'−');
}

function buildQuestion(a,b,d,op){
  const isAdd=op==='+';
  const correctN=isAdd?a+b:a-b;
  const candidates=[];

  function addCandidate(n,den,type){
    if(den<=0 || n<0) return;
    const f={n, d:den, type};
    if(!candidates.some(x=>fracKey(x)===fracKey(f))){
      candidates.push(f);
    }
  }

  addCandidate(correctN,d,'correct');

  // Erreur réaliste : l'élève agit aussi sur le dénominateur.
  addCandidate(correctN,2*d,'denominator');

  // Erreur réaliste : l'élève choisit la mauvaise opération sur les numérateurs.
  const wrongOpN=isAdd?Math.abs(a-b):a+b;
  addCandidate(wrongOpN,d,'wrongOperation');

  // Un autre résultat avec le bon dénominateur pour empêcher l'élimination visuelle.
  const sameDenOptions=[
    a,d===a?b:a,
    b,
    correctN+1,
    Math.max(0,correctN-1),
    a+b+1
  ];
  for(const n of sameDenOptions){
    addCandidate(n,d,'sameDenominator');
    if(candidates.length>=4) break;
  }

  // Sécurité : garantit quatre réponses distinctes.
  let bump=2;
  while(candidates.length<4){
    addCandidate(correctN+bump,d,'sameDenominator');
    bump++;
  }

  return{
    a,b,d,op,
    correct:{n:correctN,d},
    choices:shuffle(candidates.slice(0,4))
  };
}

function buildQuestions(){
  const qs=[
    makeAddition('under'),
    makeAddition('under'),
    makeAddition('one'),
    makeAddition('over'),
    makeAddition('over'),
    makeSubtraction(),
    makeSubtraction(),
    makeSubtraction(),
    makeSubtraction(),
    makeSubtraction()
  ];
  return shuffle(qs);
}

function setFeedback(text,type){
  feedback.textContent=text;
  feedback.className=`feedback show ${type}`;
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function renderChoices(q){
  choices.innerHTML='';

  q.choices.forEach(opt=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='choice-button';
    btn.dataset.key=fracKey(opt);
    btn.innerHTML=fractionHTML(opt.n,opt.d);
    btn.addEventListener('click',()=>choose(btn,opt));
    choices.appendChild(btn);
  });
}

function renderQuestion(){
  const q=questions[index];
  locked=false;

  calculation.innerHTML=operationHTML(q);
  renderChoices(q);

  feedback.textContent='';
  feedback.className='feedback';
  nextBtn.hidden=true;
  updateTop();
}

function disableAll(){
  [...choices.querySelectorAll('.choice-button')].forEach(b=>b.disabled=true);
}

function markCorrectAnswer(q){
  const key=fracKey(q.correct);
  const btn=[...choices.querySelectorAll('.choice-button')]
    .find(b=>b.dataset.key===key);
  if(btn) btn.classList.add('correct');
}

function correctionText(q,isRight){
  const verb=q.op==='+'?'additionne':'soustrait';
  const operation=q.op==='+'?`${q.a} + ${q.b}`:`${q.a} − ${q.b}`;
  const prefix=isRight?'Bravo ! ':`La bonne réponse est ${q.correct.n}/${q.d}. `;
  return `${prefix}On ${verb} les numérateurs : ${operation} = ${q.correct.n}, et on conserve le dénominateur ${q.d}.`;
}

function choose(btn,opt){
  if(locked) return;

  locked=true;
  const q=questions[index];
  const isRight=fracKey(opt)===fracKey(q.correct);

  disableAll();
  markCorrectAnswer(q);

  if(isRight){
    score++;
    btn.classList.add('correct');
    setFeedback(correctionText(q,true),'success');
  }else{
    btn.classList.add('wrong');
    setFeedback(correctionText(q,false),'error');
  }

  scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
  nextBtn.hidden=false;
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${score} / ${TOTAL}`;

  if(score>=9){
    finalMessage.textContent='Excellent ! Tu maîtrises les additions et les soustractions de fractions de même dénominateur.';
  }else if(score>=7){
    finalMessage.textContent='Très bien ! Tu appliques correctement la méthode dans la plupart des calculs.';
  }else if(score>=5){
    finalMessage.textContent='C’est en bonne voie. Pense à agir sur les numérateurs tout en conservant le dénominateur.';
  }else{
    finalMessage.textContent='Rejoue pour t’entraîner : observe bien ce qui arrive aux numérateurs et au dénominateur.';
  }
}

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  locked=false;
  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

nextBtn.addEventListener('click',nextQuestion);
restartBtn.addEventListener('click',restart);

restart();
})();
</script>
</body>
</html>
