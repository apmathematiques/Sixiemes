<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;
  --g:#20864b;
  --gs:#e9f7ef;
  --r:#c63d3d;
  --rs:#fff0f0;
  --i:#17212b;
  --m:#5f6d79;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}

body{
  display:grid;
  place-items:center;
  padding:12px
}

button{font:inherit}

.app{
  width:min(100%,980px);
  aspect-ratio:16/9;
  min-height:500px;
  max-height:calc(100vh - 24px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}

.top{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:16px 24px 10px
}

.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px
}

.bar{
  width:8.333%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease
}

.pill{
  min-width:126px;
  padding:9px 14px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px
}

.main{
  flex:1;
  min-height:0;
  padding:5px 18px 18px;
  display:flex;
  flex-direction:column;
  gap:10px
}

.instruction{
  min-height:58px;
  margin:0;
  padding:4px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(1.25rem,2.35vw,1.6rem);
  font-weight:600;
  line-height:1.3;
  text-align:center
}

.question-zone{
  flex:1;
  min-height:210px;
  display:grid;
  place-items:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;
  border-radius:18px
}

.measure{
  color:var(--bd);
  font-size:clamp(4.4rem,12vw,7.4rem);
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums
}

.answers{
  min-height:118px;
  display:grid;
  grid-template-columns:repeat(3,minmax(130px,1fr));
  gap:9px 11px
}

.answer-btn{
  min-height:50px;
  padding:7px 14px;
  color:var(--bd);
  font-size:clamp(1.05rem,2vw,1.25rem);
  font-weight:750;
  background:var(--bs);
  border:2px solid transparent;
  border-radius:13px;
  cursor:pointer;
  touch-action:manipulation;
  transition:
    transform 120ms ease,
    filter 120ms ease,
    background .12s ease,
    border-color .12s ease
}

.answer-btn:hover:not(:disabled){filter:brightness(1.03)}
.answer-btn:active:not(:disabled){transform:scale(.98)}
.answer-btn.selected{background:#d7ebfb;border-color:#69a9d5}
.answer-btn.correct{color:#165e36;background:var(--gs);border-color:#79c798}
.answer-btn.wrong{color:#8f2727;background:var(--rs);border-color:#df8585}
.answer-btn:disabled{cursor:default}

.feedback{
  min-height:56px;
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--m);
  font-weight:650;
  line-height:1.35;
  text-align:center;
  background:#f4f7fb;
  border-radius:14px
}

.feedback.success{
  color:#165e36;
  background:var(--gs);
  border:1px solid #a9ddbd
}

.feedback.error{
  color:#8f2727;
  background:var(--rs);
  border:1px solid #efbcbc
}

.controls{
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}

button.action{
  min-height:46px;
  padding:0 20px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
  border:0;
  border-radius:13px;
  touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease
}

button.action:hover:not(:disabled){filter:brightness(1.03)}
button.action:active:not(:disabled){transform:scale(.98)}
button.action:disabled{opacity:.48;cursor:default}
button:focus-visible{outline:4px solid rgba(23,105,170,.22)}

.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}

.final{
  flex:1;
  padding:22px;
  display:none;
  place-items:center;
  text-align:center
}

.final.show{
  display:grid;
  animation:reveal 280ms ease both
}

.final-card{
  width:min(650px,100%);
  padding:28px;
  background:#fff;
  border:1px solid #dce9f3;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}

.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.25rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.05rem;line-height:1.45}

@keyframes reveal{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important
  }
}

@media(max-width:700px),(max-height:650px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:9px 12px 5px;gap:7px}
  .track{grid-column:1/-1}
  .pill{min-width:0;padding:6px 9px}
  .main{padding:2px 10px 10px;gap:6px}
  .instruction{min-height:46px;font-size:1.08rem}
  .question-zone{min-height:150px}
  .measure{font-size:4.2rem}
  .answers{min-height:96px;gap:6px 8px}
  .answer-btn{min-height:42px;padding:4px 8px;font-size:1rem}
  .feedback{min-height:46px;padding:7px 10px;font-size:.88rem}
  .controls{min-height:42px}
  button.action{min-height:40px;height:40px}
}

@media(max-width:520px){
  .answers{grid-template-columns:repeat(2,minmax(110px,1fr))}
}
</style>
</head>

<body>
<main class="app" id="app" aria-live="polite">

  <header class="top">
    <div class="track" aria-label="Progression">
      <div class="bar" id="bar"></div>
    </div>
    <div class="pill" id="counter">Question 1 / 12</div>
    <div class="pill" id="score">Score : 0 / 12</div>
  </header>

  <section class="main" id="exercise">

    <p class="instruction">
      Quelle est la nature de cet angle ?
    </p>

    <div class="question-zone" aria-label="Mesure de l'angle">
      <div class="measure" id="measure">37°</div>
    </div>

    <div class="answers" id="answers" aria-label="Choix de la nature de l'angle"></div>

    <div class="feedback" id="feedback" role="status">
      Choisis une réponse puis valide.
    </div>

    <div class="controls">
      <button class="action primary" type="button" id="validate" disabled>Valider</button>
      <button class="action secondary" type="button" id="next" hidden>Question suivante</button>
    </div>

  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon" aria-hidden="true">🎯</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" type="button" id="restart">
        Recommencer avec de nouvelles mesures
      </button>
    </div>
  </section>

</main>

<script>
(() => {
  'use strict';

  const TOTAL=12;

  const NATURES=[
    {id:'nul',label:'Nul'},
    {id:'aigu',label:'Aigu'},
    {id:'droit',label:'Droit'},
    {id:'obtus',label:'Obtus'},
    {id:'plat',label:'Plat'},
    {id:'plein',label:'Plein'}
  ];

  const ACUTE_VALUES=[
    12,18,23,27,31,36,42,47,53,58,64,69,73,77
  ];

  const OBTUSE_VALUES=[
    103,108,114,119,124,129,136,142,148,153,159,164,169
  ];

  const $=id=>document.getElementById(id);

  const measure=$('measure');
  const answers=$('answers');
  const feedback=$('feedback');
  const validateBtn=$('validate');
  const nextBtn=$('next');
  const counter=$('counter');
  const scoreBox=$('score');
  const bar=$('bar');
  const exercise=$('exercise');
  const final=$('final');
  const finalScore=$('finalScore');
  const finalMessage=$('finalMessage');
  const restartBtn=$('restart');

  let questions=[];
  let index=0;
  let score=0;
  let selected=null;
  let locked=false;
  let previousSignature='';

  function shuffle(array){
    const a=array.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function sample(array,n){
    return shuffle(array).slice(0,n);
  }

  function buildSeries(){
    const [a1,a2]=sample(ACUTE_VALUES,2);
    const [o1,o2]=sample(OBTUSE_VALUES,2);

    let base=[
      {value:0,nature:'nul'},
      {value:0,nature:'nul'},
      {value:a1,nature:'aigu'},
      {value:a2,nature:'aigu'},
      {value:90,nature:'droit'},
      {value:90,nature:'droit'},
      {value:o1,nature:'obtus'},
      {value:o2,nature:'obtus'},
      {value:180,nature:'plat'},
      {value:180,nature:'plat'},
      {value:360,nature:'plein'},
      {value:360,nature:'plein'}
    ];

    for(let attempt=0;attempt<300;attempt++){
      const s=shuffle(base);
      const noAdjacentSameNature=s.every((q,i)=>i===0 || q.nature!==s[i-1].nature);
      const sig=s.map(q=>`${q.value}:${q.nature}`).join('|');

      if(noAdjacentSameNature && sig!==previousSignature){
        previousSignature=sig;
        return s;
      }
    }

    return shuffle(base);
  }

  function natureLabel(id){
    return NATURES.find(n=>n.id===id).label.toLowerCase();
  }

  function explanation(q){
    const v=q.value;

    if(q.nature==='nul'){
      return `Un angle de 0° est un angle nul.`;
    }

    if(q.nature==='aigu'){
      return `${v}° est compris entre 0° et 90° : c’est un angle aigu.`;
    }

    if(q.nature==='droit'){
      return `Un angle de 90° est un angle droit.`;
    }

    if(q.nature==='obtus'){
      return `${v}° est compris entre 90° et 180° : c’est un angle obtus.`;
    }

    if(q.nature==='plat'){
      return `Un angle de 180° est un angle plat.`;
    }

    return `Un angle de 360° est un angle plein.`;
  }

  function current(){
    return questions[index];
  }

  function setFeedback(text,type=''){
    feedback.className='feedback'+(type?' '+type:'');
    feedback.textContent=text;
  }

  function renderAnswers(){
    answers.innerHTML='';

    shuffle(NATURES).forEach(nature=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='answer-btn';
      btn.dataset.answer=nature.id;
      btn.textContent=nature.label;

      btn.addEventListener('click',()=>{
        if(locked)return;

        selected=nature.id;

        [...answers.querySelectorAll('.answer-btn')].forEach(b=>{
          b.classList.toggle('selected',b===btn);
        });

        validateBtn.disabled=false;
      });

      answers.appendChild(btn);
    });
  }

  function renderQuestion(){
    const q=current();

    locked=false;
    selected=null;

    counter.textContent=`Question ${index+1} / ${TOTAL}`;
    scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
    bar.style.width=`${((index+1)/TOTAL)*100}%`;

    measure.textContent=`${q.value}°`;

    renderAnswers();

    validateBtn.disabled=true;
    validateBtn.hidden=false;
    nextBtn.hidden=true;

    setFeedback('Choisis une réponse puis valide.');
  }

  function validate(){
    if(locked || selected===null)return;

    const q=current();
    const success=selected===q.nature;

    locked=true;

    [...answers.querySelectorAll('.answer-btn')].forEach(btn=>{
      btn.disabled=true;
      btn.classList.remove('selected');

      if(btn.dataset.answer===q.nature){
        btn.classList.add('correct');
      }else if(btn.dataset.answer===selected){
        btn.classList.add('wrong');
      }
    });

    if(success){
      score++;
      scoreBox.textContent=`Score : ${score} / ${TOTAL}`;
      setFeedback(`Bravo ! ${explanation(q)}`,'success');
    }else{
      setFeedback(explanation(q),'error');
    }

    validateBtn.hidden=true;
    nextBtn.hidden=false;
    nextBtn.textContent=index===TOTAL-1?'Voir le résultat':'Question suivante';
  }

  function next(){
    if(index===TOTAL-1){
      showFinal();
      return;
    }

    index++;
    renderQuestion();
  }

  function showFinal(){
    exercise.hidden=true;
    final.classList.add('show');
    finalScore.textContent=`Score : ${score} / ${TOTAL}`;

    if(score>=11){
      finalMessage.textContent='Très bien ! Tu associes correctement une mesure à la nature de l’angle.';
    }else if(score>=9){
      finalMessage.textContent='Bien joué. Revois seulement les natures qui t’ont encore posé problème.';
    }else{
      finalMessage.textContent='À retravailler : retiens les mesures de référence 0°, 90°, 180° et 360°, puis situe les autres entre ces valeurs.';
    }
  }

  function restart(){
    questions=buildSeries();
    index=0;
    score=0;
    selected=null;
    locked=false;

    final.classList.remove('show');
    exercise.hidden=false;

    renderQuestion();
  }

  validateBtn.addEventListener('click',validate);
  nextBtn.addEventListener('click',next);
  restartBtn.addEventListener('click',restart);

  restart();
})();
</script>

</body>
</html>
