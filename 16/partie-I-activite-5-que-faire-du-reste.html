<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:54px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.35rem,2.5vw,1.72rem);
  font-weight:700;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:270px;padding:18px 24px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:22px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.problem{
  width:min(820px,100%);
  min-height:150px;
  display:flex;align-items:center;justify-content:center;
  padding:18px 24px;
  font-size:clamp(1.32rem,2.7vw,1.88rem);
  font-weight:700;line-height:1.45;text-align:center;
  background:#fff;border:1px solid #e0ebf4;border-radius:16px
}
.answer-row{
  width:min(520px,100%);
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap
}
.answer-label{
  color:var(--bd);
  font-size:clamp(1.05rem,2vw,1.22rem);
  font-weight:800
}
.answer-input{
  width:190px;height:66px;
  padding:8px 12px;
  border:3px solid #b9d4e8;border-radius:15px;
  background:#fff;color:var(--i);
  font:800 clamp(1.4rem,3vw,1.95rem)/1 Arial,Helvetica,sans-serif;
  text-align:center;outline:none;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease
}
.answer-input:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.12)
}
.answer-input.correct{
  border-color:#79c798;background:var(--gs);color:#165e36
}
.answer-input.correction{
  border-color:#e0a0a0;background:#fff7f7;color:#8f2727
}
.answer-input::-webkit-outer-spin-button,
.answer-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.answer-input[type=number]{-moz-appearance:textfield}
.feedback{
  min-height:84px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.98rem,1.8vw,1.1rem);
  line-height:1.42;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.hidden{display:none}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px;
  touch-action:manipulation
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:40px;font-size:1.05rem}
  .question-zone{min-height:190px;padding:10px;gap:12px}
  .problem{min-height:105px;padding:10px 12px;font-size:1.08rem}
  .answer-row{gap:8px}
  .answer-label{font-size:.95rem}
  .answer-input{width:145px;height:49px;font-size:1.28rem;border-width:2px}
  .feedback{min-height:58px;padding:7px 10px;font-size:.82rem}
  .controls{min-height:40px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Lis le problème et donne uniquement la réponse demandée.</p>

    <div class="question-zone">
      <div class="problem" id="problem"></div>

      <div class="answer-row">
        <label class="answer-label" for="answerInput">Réponse :</label>
        <input id="answerInput" class="answer-input" type="number"
               inputmode="numeric" autocomplete="off">
      </div>
    </div>

    <div class="feedback hidden" id="feedback"></div>

    <div class="controls">
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">
        Rejouer avec de nouveaux problèmes
      </button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=8;
const $=id=>document.getElementById(id);

const problem=$('problem');
const answerInput=$('answerInput');
const feedback=$('feedback');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let attempts=0;
let locked=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmt(n){
  return n.toLocaleString('fr-FR');
}
function scoreText(v){
  return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.',',');
}

const BANK={
  share:[
    {
      text:(n,d)=>`${fmt(n)} bonbons sont répartis aussi équitablement que possible entre ${fmt(d)} enfants. Combien de bonbons chaque enfant reçoit-il ?`,
      answerWord:'bonbons'
    },
    {
      text:(n,d)=>`On répartit ${fmt(n)} cartes aussi équitablement que possible entre ${fmt(d)} équipes. Combien de cartes chaque équipe reçoit-elle ?`,
      answerWord:'cartes'
    },
    {
      text:(n,d)=>`${fmt(n)} autocollants sont partagés aussi équitablement que possible entre ${fmt(d)} élèves. Combien d’autocollants chaque élève reçoit-il ?`,
      answerWord:'autocollants'
    },
    {
      text:(n,d)=>`Un professeur répartit ${fmt(n)} jetons aussi équitablement que possible dans ${fmt(d)} boîtes. Combien de jetons place-t-il dans chaque boîte ?`,
      answerWord:'jetons'
    }
  ],
  remainder:[
    {
      text:(n,d)=>`On range ${fmt(n)} perles dans des sachets de ${fmt(d)} perles. Après avoir rempli le maximum de sachets complets, combien de perles restent-elles ?`,
      answerWord:'perles'
    },
    {
      text:(n,d)=>`On forme des paquets de ${fmt(d)} cartes avec ${fmt(n)} cartes. Une fois tous les paquets complets formés, combien de cartes restent-elles ?`,
      answerWord:'cartes'
    },
    {
      text:(n,d)=>`${fmt(n)} biscuits sont disposés sur des plateaux de ${fmt(d)} biscuits. Après avoir rempli le maximum de plateaux complets, combien de biscuits restent-ils ?`,
      answerWord:'biscuits'
    },
    {
      text:(n,d)=>`Avec ${fmt(n)} cubes, on construit des tours de ${fmt(d)} cubes. Après avoir construit le maximum de tours complètes, combien de cubes restent-ils ?`,
      answerWord:'cubes'
    }
  ],
  complete:[
    {
      text:(n,d)=>`On dispose de ${fmt(n)} billes et on prépare des sachets de ${fmt(d)} billes. Combien de sachets complets peut-on préparer ?`,
      answerWord:'sachets'
    },
    {
      text:(n,d)=>`Avec ${fmt(n)} bouteilles, on remplit des caisses de ${fmt(d)} bouteilles. Combien de caisses complètes peut-on remplir ?`,
      answerWord:'caisses'
    },
    {
      text:(n,d)=>`On possède ${fmt(n)} cartes et on constitue des paquets de ${fmt(d)} cartes. Combien de paquets complets peut-on former ?`,
      answerWord:'paquets'
    },
    {
      text:(n,d)=>`On range ${fmt(n)} crayons par boîtes de ${fmt(d)} crayons. Combien de boîtes complètes peut-on remplir ?`,
      answerWord:'boîtes'
    }
  ],
  needed:[
    {
      text:(n,d)=>`Une bibliothèque doit ranger ${fmt(n)} livres. Chaque carton peut contenir au maximum ${fmt(d)} livres. Combien de cartons faut-il prévoir ?`,
      answerWord:'cartons'
    },
    {
      text:(n,d)=>`${fmt(n)} élèves partent en sortie. Chaque minibus peut transporter au maximum ${fmt(d)} élèves. Combien de minibus faut-il prévoir ?`,
      answerWord:'minibus'
    },
    {
      text:(n,d)=>`On doit emballer ${fmt(n)} objets. Une boîte peut contenir au maximum ${fmt(d)} objets. Combien de boîtes faut-il prévoir ?`,
      answerWord:'boîtes'
    },
    {
      text:(n,d)=>`On doit disposer ${fmt(n)} gâteaux sur des plateaux pouvant contenir au maximum ${fmt(d)} gâteaux. Combien de plateaux faut-il prévoir ?`,
      answerWord:'plateaux'
    }
  ]
};

function makeNumbers(type,forceExact=false){
  let d,q,r,n;

  do{
    d=randInt(3,20);
    q=randInt(5,45);

    if(forceExact){
      r=0;
    }else if(type==='needed'){
      r=randInt(1,d-1);
    }else{
      // Pour les autres types, on accepte parfois un reste nul,
      // mais la majorité des questions ont un reste non nul.
      r=Math.random()<0.18 ? 0 : randInt(1,d-1);
    }

    n=d*q+r;
  }while(n<40 || n>850);

  return{n,d,q,r};
}

function makeQuestion(type,forceExact=false){
  const nums=makeNumbers(type,forceExact);
  const scenario=pick(BANK[type]);

  let answer;
  if(type==='share') answer=nums.q;
  if(type==='remainder') answer=nums.r;
  if(type==='complete') answer=nums.q;
  if(type==='needed') answer=nums.r===0 ? nums.q : nums.q+1;

  return{
    type,
    ...nums,
    answer,
    statement:scenario.text(nums.n,nums.d),
    answerWord:scenario.answerWord
  };
}

function buildQuestions(){
  // Deux questions de chaque type.
  // Pour "needed" : un cas exact et un cas avec reste.
  const qs=[
    makeQuestion('share'),
    makeQuestion('share'),
    makeQuestion('remainder'),
    makeQuestion('remainder'),
    makeQuestion('complete'),
    makeQuestion('complete'),
    makeQuestion('needed',true),
    makeQuestion('needed',false)
  ];

  return shuffle(qs);
}

function setFeedback(text,type=''){
  feedback.textContent=text;
  feedback.className='feedback'+(type?` ${type}`:'');
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function renderQuestion(){
  const q=questions[index];
  attempts=0;
  locked=false;

  problem.textContent=q.statement;
  answerInput.value='';
  answerInput.disabled=false;
  answerInput.className='answer-input';

  nextBtn.hidden=true;

  feedback.textContent='';
  feedback.className='feedback hidden';
  updateTop();

  setTimeout(()=>answerInput.focus(),0);
}

function readAnswer(){
  const raw=answerInput.value.trim();
  if(raw==='') return null;
  const n=Number(raw);
  return Number.isFinite(n) ? n : null;
}

function correctionText(q){
  const equality=`${fmt(q.n)} = ${fmt(q.d)} × ${fmt(q.q)} + ${fmt(q.r)}.`;

  if(q.type==='share'){
    return `${equality} Le quotient est ${fmt(q.q)} : chacun reçoit ${fmt(q.q)} ${q.answerWord}.`;
  }

  if(q.type==='remainder'){
    return `${equality} Le reste est ${fmt(q.r)} : il reste donc ${fmt(q.r)} ${q.answerWord}.`;
  }

  if(q.type==='complete'){
    return `${equality} Le quotient est ${fmt(q.q)} : on peut former ${fmt(q.q)} ${q.answerWord} complets.`;
  }

  if(q.r===0){
    return `${equality} Il ne reste rien : ${fmt(q.q)} ${q.answerWord} suffisent.`;
  }

  return `${equality} ${fmt(q.q)} ${q.answerWord} ne suffisent pas, car il reste ${fmt(q.r)} éléments à placer. Il faut donc ${fmt(q.q+1)} ${q.answerWord}.`;
}

function validate(){
  if(locked) return;

  const entered=readAnswer();

  if(entered===null){
    setFeedback('Saisis une réponse avant de valider.','error');
    return;
  }

  attempts++;
  const q=questions[index];

  if(entered===q.answer){
    locked=true;
    score+=attempts===1?1:0.5;

    answerInput.classList.add('correct');
    answerInput.disabled=true;
    nextBtn.hidden=false;

    setFeedback(correctionText(q),'success');
    updateTop();
    return;
  }

  if(attempts===1){
    answerInput.value='';
    setFeedback(
      'Relis bien la question : que représente le quotient ? Et que faut-il faire du reste dans cette situation ?',
      'error'
    );
    setTimeout(()=>answerInput.focus(),0);
    return;
  }

  locked=true;
  answerInput.value=q.answer;
  answerInput.classList.add('correction');
  answerInput.disabled=true;
  nextBtn.hidden=false;

  setFeedback(`Correction : ${correctionText(q)}`,'error');
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');

  finalScore.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;

  if(score>=7){
    finalMessage.textContent='Très bien ! Tu sais interpréter le quotient et le reste selon la situation.';
  }else if(score>=5){
    finalMessage.textContent='C’est bien. Continue à lire attentivement la question pour décider quoi faire du quotient et du reste.';
  }else{
    finalMessage.textContent='Reprends les différents sens du quotient et du reste, puis rejoue avec de nouveaux problèmes.';
  }
}

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  attempts=0;
  locked=false;

  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

nextBtn.addEventListener('click',nextQuestion);
restartBtn.addEventListener('click',restart);

answerInput.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !locked){
    e.preventDefault();
    validate();
  }
});

answerInput.addEventListener('blur',()=>{
  if(!locked && answerInput.value.trim()!==''){
    validate();
  }
});

restart();
})();
</script>
</body>
</html>
