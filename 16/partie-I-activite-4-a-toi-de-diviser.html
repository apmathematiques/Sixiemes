<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:60px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.4rem,2.7vw,1.85rem);
  font-weight:700;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:270px;padding:18px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:22px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}
.operation{
  font-size:clamp(2rem,5vw,3.25rem);
  font-weight:800;
  text-align:center;
  font-variant-numeric:tabular-nums
}
.inputs{
  width:min(680px,100%);
  display:grid;grid-template-columns:1fr 1fr;gap:18px
}
.input-card{
  display:flex;flex-direction:column;gap:8px;
  align-items:center
}
.input-card label{
  color:var(--bd);
  font-size:clamp(1.05rem,2vw,1.25rem);
  font-weight:800
}
.answer-input{
  width:min(220px,100%);
  height:68px;
  padding:8px 12px;
  border:3px solid #b9d4e8;
  border-radius:15px;
  background:#fff;color:var(--i);
  font:800 clamp(1.45rem,3vw,2rem)/1 Arial,Helvetica,sans-serif;
  text-align:center;
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease
}
.answer-input:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.12)
}
.answer-input.correct{
  border-color:#79c798;background:var(--gs);color:#165e36
}
.answer-input.correction{
  border-color:#e0a0a0;background:#fff7f7;color:#8f2727
}
.answer-input::-webkit-outer-spin-button,
.answer-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.answer-input[type=number]{-moz-appearance:textfield}
.feedback{
  min-height:76px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.98rem,1.8vw,1.1rem);
  line-height:1.4;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px;
  touch-action:manipulation
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:42px;font-size:1.08rem}
  .question-zone{min-height:190px;padding:10px;gap:13px}
  .operation{font-size:1.8rem}
  .inputs{gap:10px}
  .input-card label{font-size:.95rem}
  .answer-input{height:50px;font-size:1.3rem;border-width:2px}
  .feedback{min-height:54px;padding:7px 10px;font-size:.84rem}
  .controls{min-height:40px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction" id="instruction"></p>

    <div class="question-zone">
      <div class="operation" id="operation"></div>

      <div class="inputs">
        <div class="input-card">
          <label for="quotientInput">Quotient</label>
          <input id="quotientInput" class="answer-input" type="number"
                 inputmode="numeric" autocomplete="off">
        </div>

        <div class="input-card">
          <label for="remainderInput">Reste</label>
          <input id="remainderInput" class="answer-input" type="number"
                 inputmode="numeric" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      Effectue la division puis saisis le quotient et le reste.
    </div>

    <div class="controls">
      <button class="action primary" id="validate">Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">
        Rejouer avec de nouvelles divisions
      </button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=8;
const $=id=>document.getElementById(id);

const instruction=$('instruction');
const operation=$('operation');
const quotientInput=$('quotientInput');
const remainderInput=$('remainderInput');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');

let questions=[];
let index=0;
let score=0;
let attempts=0;
let locked=false;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmt(n){
  return n.toLocaleString('fr-FR');
}
function scoreText(v){
  return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.',',');
}

function makeQuestion(mode){
  let diviseur,quotient,reste,dividende;

  do{
    diviseur=randInt(2,20);
    quotient=randInt(12,180);

    if(mode==='zero'){
      reste=0;
    }else if(mode==='near'){
      reste=Math.max(1,diviseur-1);
    }else{
      reste=randInt(1,diviseur-1);
    }

    dividende=diviseur*quotient+reste;
  }while(dividende<150 || dividende>4999);

  return{dividende,diviseur,quotient,reste};
}

function buildQuestions(){
  // Répartition contrôlée :
  // 2 restes nuls, 2 restes très proches du diviseur, 4 cas variés.
  const modes=shuffle([
    'zero','zero',
    'near','near',
    'normal','normal','normal','normal'
  ]);

  const seen=new Set();
  const qs=[];

  for(const mode of modes){
    let q,key;
    do{
      q=makeQuestion(mode);
      key=`${q.dividende}/${q.diviseur}`;
    }while(seen.has(key));

    seen.add(key);
    qs.push(q);
  }
  return qs;
}

function setFeedback(text,type=''){
  feedback.textContent=text;
  feedback.className='feedback'+(type?` ${type}`:'');
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function renderQuestion(){
  const q=questions[index];
  attempts=0;
  locked=false;

  instruction.textContent=
    `Effectue la division euclidienne de ${fmt(q.dividende)} par ${fmt(q.diviseur)}.`;

  operation.textContent=`${fmt(q.dividende)} ÷ ${fmt(q.diviseur)}`;

  quotientInput.value='';
  remainderInput.value='';
  quotientInput.disabled=false;
  remainderInput.disabled=false;
  quotientInput.className='answer-input';
  remainderInput.className='answer-input';

  validateBtn.hidden=false;
  nextBtn.hidden=true;

  setFeedback('Effectue la division puis saisis le quotient et le reste.');
  updateTop();

  setTimeout(()=>quotientInput.focus(),0);
}

function readNumber(input){
  const raw=input.value.trim();
  if(raw==='') return null;
  const n=Number(raw);
  return Number.isFinite(n) ? n : null;
}

function validate(){
  if(locked) return;

  const qv=readNumber(quotientInput);
  const rv=readNumber(remainderInput);

  if(qv===null || rv===null){
    setFeedback('Saisis le quotient et le reste avant de valider.','error');
    return;
  }

  attempts++;
  const q=questions[index];
  const correct=qv===q.quotient && rv===q.reste;

  if(correct){
    locked=true;
    score+=attempts===1?1:0.5;

    quotientInput.classList.add('correct');
    remainderInput.classList.add('correct');
    quotientInput.disabled=true;
    remainderInput.disabled=true;

    validateBtn.hidden=true;
    nextBtn.hidden=false;

    setFeedback(
      `Bravo ! ${fmt(q.dividende)} = ${fmt(q.diviseur)} × ${fmt(q.quotient)} + ${fmt(q.reste)}.`,
      'success'
    );
    updateTop();
    return;
  }

  if(attempts===1){
    quotientInput.value='';
    remainderInput.value='';
    setFeedback(
      `Vérifie ton calcul et pense que le reste doit être inférieur à ${fmt(q.diviseur)}.`,
      'error'
    );
    setTimeout(()=>quotientInput.focus(),0);
    return;
  }

  locked=true;
  quotientInput.value=q.quotient;
  remainderInput.value=q.reste;
  quotientInput.classList.add('correction');
  remainderInput.classList.add('correction');
  quotientInput.disabled=true;
  remainderInput.disabled=true;

  validateBtn.hidden=true;
  nextBtn.hidden=false;

  setFeedback(
    `Correction : ${fmt(q.dividende)} = ${fmt(q.diviseur)} × ${fmt(q.quotient)} + ${fmt(q.reste)}. Le quotient est ${fmt(q.quotient)} et le reste est ${fmt(q.reste)}.`,
    'error'
  );
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');

  finalScore.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;

  if(score>=7){
    finalMessage.textContent='Très bien ! Tu maîtrises le calcul d’une division euclidienne.';
  }else if(score>=5){
    finalMessage.textContent='C’est bien. Continue à t’entraîner pour gagner en assurance dans les divisions.';
  }else{
    finalMessage.textContent='Reprends la technique de la division posée puis rejoue avec une nouvelle série.';
  }
}

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  attempts=0;
  locked=false;

  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

validateBtn.addEventListener('click',validate);
nextBtn.addEventListener('click',nextQuestion);
restartBtn.addEventListener('click',restart);

[quotientInput,remainderInput].forEach(input=>{
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !locked){
      e.preventDefault();
      validate();
    }
  });
});

restart();
})();
</script>
</body>
</html>
