<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<style>
:root{
  --b:#1769aa;--bd:#0d4778;--bs:#eaf4fc;
  --g:#20864b;--gs:#e9f7ef;
  --r:#c63d3d;--rs:#fff0f0;
  --i:#17212b;--m:#5f6d79;--line:#263442
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;background:transparent;
  color:var(--i);font-family:Arial,Helvetica,sans-serif
}
body{display:grid;place-items:center;padding:12px}
.app{
  width:min(100%,980px);aspect-ratio:16/9;min-height:480px;
  max-height:calc(100vh - 24px);overflow:hidden;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14)
}
.top{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:14px;padding:16px 24px 10px
}
.track{height:12px;overflow:hidden;background:#dceaf5;border-radius:999px}
.bar{
  width:12.5%;height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;transition:width 260ms ease
}
.pill{
  min-width:116px;padding:9px 14px;color:var(--bd);
  font-weight:700;text-align:center;white-space:nowrap;
  background:var(--bs);border-radius:999px
}
.main{
  flex:1;min-height:0;padding:5px 18px 18px;
  display:flex;flex-direction:column;gap:10px
}
.instruction{
  min-height:56px;margin:0;display:flex;align-items:center;
  justify-content:center;padding:0 10px;
  font-size:clamp(1.38rem,2.55vw,1.78rem);
  font-weight:700;line-height:1.25;text-align:center
}
.question-zone{
  flex:1;min-height:270px;padding:12px 18px 16px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid #dce9f3;border-radius:18px
}

/* Division posée */
.division-wrap{
  width:min(500px,92%);height:165px;
  display:grid;place-items:center
}
.division{
  display:grid;
  grid-template-columns:minmax(150px,1fr) minmax(105px,.72fr);
  grid-template-rows:auto auto;
  min-width:300px;
  font-variant-numeric:tabular-nums;
  font-size:clamp(2.05rem,4.8vw,3.25rem);
  font-weight:700;line-height:1;color:var(--i)
}
.div-cell{
  min-height:66px;display:flex;align-items:center
}
.dividend{
  justify-content:flex-end;padding:0 22px 9px 0;
  border-right:4px solid var(--line)
}
.divisor{
  justify-content:flex-start;padding:0 0 9px 22px;
  border-bottom:4px solid var(--line)
}
.remainder{
  justify-content:flex-end;padding:9px 22px 0 0;
  border-right:4px solid var(--line)
}
.quotient{
  justify-content:flex-start;padding:9px 0 0 22px
}

/* Égalité */
.equation-wrap{
  width:min(900px,100%);
  display:flex;justify-content:center;align-items:center;
  min-height:86px;padding:4px 8px
}
.equation{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:8px 10px;
  font-size:clamp(1.55rem,3.7vw,2.55rem);
  font-weight:800;
  line-height:1.2;
  font-variant-numeric:tabular-nums
}
.eq-token{white-space:nowrap}
.blank{
  width:clamp(86px,12vw,125px);
  height:clamp(54px,7vw,68px);
  padding:4px 8px;
  border:3px solid #9fc4df;border-radius:13px;
  background:#fff;color:var(--i);
  font:800 clamp(1.35rem,3vw,2rem)/1 Arial,Helvetica,sans-serif;
  text-align:center;
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease
}
.blank:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.12)
}
.blank.correct{
  border-color:#79c798;background:var(--gs);color:#165e36
}
.blank.correction{
  border-color:#e0a0a0;background:#fff7f7;color:#8f2727
}
.blank::-webkit-outer-spin-button,
.blank::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.blank[type=number]{-moz-appearance:textfield}

.feedback{
  min-height:70px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--m);font-weight:650;
  font-size:clamp(.98rem,1.8vw,1.1rem);
  line-height:1.38;text-align:center;
  background:#f4f7fb;border-radius:14px
}
.feedback.success{color:#165e36;background:var(--gs);border:1px solid #a9ddbd}
.feedback.error{color:#8f2727;background:var(--rs);border:1px solid #efbcbc}
.controls{
  min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
button.action{
  min-height:46px;padding:0 22px;font-size:1rem;
  font-weight:800;cursor:pointer;border:0;border-radius:13px;
  touch-action:manipulation
}
.primary{color:#fff;background:var(--b)}
.secondary{color:var(--bd);background:var(--bs)}
button.action:disabled{opacity:.5;cursor:default}

/* Bilan */
.final{flex:1;padding:22px;display:none;place-items:center;text-align:center}
.final.show{display:grid}
.final-card{
  width:min(650px,100%);padding:28px;background:#fff;
  border:1px solid #dce9f3;border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.1)
}
.final-icon{margin-bottom:5px;font-size:3rem}
.final h2{margin:0 0 8px;color:var(--bd);font-size:clamp(1.45rem,3vw,1.9rem)}
.final-score{margin:8px 0;font-size:1.3rem;font-weight:800}
.final-message{margin:8px 0 20px;color:var(--m);font-size:1.08rem;line-height:1.45}

@media(max-width:700px),(max-height:620px){
  body{padding:6px}
  .app{min-height:0;max-height:calc(100vh - 12px);border-radius:16px}
  .top{grid-template-columns:1fr auto;padding:10px 14px 6px;gap:8px}
  .track{grid-column:1/-1}.pill{min-width:0;padding:7px 10px}
  .main{padding:2px 10px 10px;gap:7px}
  .instruction{min-height:42px;font-size:1.1rem}
  .question-zone{min-height:190px;padding:7px 9px 9px;gap:7px}
  .division-wrap{height:112px}
  .division{min-width:235px;grid-template-columns:135px 100px;font-size:2rem}
  .div-cell{min-height:45px}
  .dividend,.remainder{padding-right:15px;border-right-width:3px}
  .divisor,.quotient{padding-left:15px}
  .divisor{border-bottom-width:3px}
  .equation-wrap{min-height:66px;padding:0}
  .equation{gap:5px 7px;font-size:1.35rem}
  .blank{width:78px;height:47px;border-width:2px;border-radius:10px;font-size:1.22rem}
  .feedback{min-height:52px;padding:7px 10px;font-size:.84rem}
  .controls{min-height:40px}
  button.action{min-height:38px;height:38px;padding:0 14px}
}
</style>
<link rel="stylesheet" href="../tablet-harmonisation.css">
<script src="../tablet-harmonisation.js"></script>
</head>
<body>
<main class="app" aria-live="polite">
  <header class="top">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="pill" id="counter">Question 1 / 8</div>
    <div class="pill" id="score">Score : 0 / 8</div>
  </header>

  <section class="main" id="exercise">
    <p class="instruction">Complète l’égalité correspondant à la division posée.</p>

    <div class="question-zone">
      <div class="division-wrap">
        <div class="division" role="img" id="division" aria-label="Division euclidienne posée">
          <div class="div-cell dividend" id="dividend"></div>
          <div class="div-cell divisor" id="divisor"></div>
          <div class="div-cell remainder" id="remainder"></div>
          <div class="div-cell quotient" id="quotient"></div>
        </div>
      </div>

      <div class="equation-wrap">
        <div class="equation" id="equation"></div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      Lis la division posée et complète les deux cases.
    </div>

    <div class="controls">
      <button class="action primary" id="validate">Valider</button>
      <button class="action secondary" id="next" hidden>Question suivante</button>
    </div>
  </section>

  <section class="final" id="final">
    <div class="final-card">
      <div class="final-icon">✓</div>
      <h2>Activité terminée !</h2>
      <p class="final-score" id="finalScore"></p>
      <p class="final-message" id="finalMessage"></p>
      <button class="action primary" id="restart">
        Rejouer avec de nouvelles divisions
      </button>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';

const TOTAL=8;
const ROLES=['dividende','diviseur','quotient','reste'];
const ALL_PAIRS=[
  ['dividende','diviseur'],
  ['dividende','quotient'],
  ['dividende','reste'],
  ['diviseur','quotient'],
  ['diviseur','reste'],
  ['quotient','reste']
];

const $=id=>document.getElementById(id);
const dividendBox=$('dividend');
const divisorBox=$('divisor');
const quotientBox=$('quotient');
const remainderBox=$('remainder');
const equation=$('equation');
const feedback=$('feedback');
const validateBtn=$('validate');
const nextBtn=$('next');
const counter=$('counter');
const scoreBox=$('score');
const bar=$('bar');
const exercise=$('exercise');
const final=$('final');
const finalScore=$('finalScore');
const finalMessage=$('finalMessage');
const restartBtn=$('restart');
const division=$('division');

let questions=[];
let index=0;
let score=0;
let attempts=0;
let locked=false;
let inputs=[];

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmt(n){
  return n.toLocaleString('fr-FR');
}
function scoreText(v){
  return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.',',');
}
function valuesOf(q){
  return {
    dividende:q.dividende,
    diviseur:q.diviseur,
    quotient:q.quotient,
    reste:q.reste
  };
}
function distinctValues(q){
  return new Set([q.dividende,q.diviseur,q.quotient,q.reste]).size===4;
}

function makeDivision(forceZeroRemainder=false){
  let q;
  do{
    const diviseur=randInt(3,49);
    const quotient=randInt(8,99);
    const reste=forceZeroRemainder ? 0 : randInt(1,diviseur-1);
    const dividende=diviseur*quotient+reste;
    q={dividende,diviseur,quotient,reste};
  }while(
    !distinctValues(q) ||
    q.dividende<100 ||
    q.dividende>4999
  );
  return q;
}

function buildQuestions(){
  // Les 6 couples possibles apparaissent au moins une fois.
  // Les 2 couples supplémentaires sont tirés aléatoirement.
  const pairs=shuffle([
    ...ALL_PAIRS,
    pick(ALL_PAIRS),
    pick(ALL_PAIRS)
  ]);

  // Deux questions à reste nul par série, à des positions aléatoires.
  const zeroPositions=new Set(shuffle([0,1,2,3,4,5,6,7]).slice(0,2));

  return pairs.map((masked,i)=>{
    const q=makeDivision(zeroPositions.has(i));
    return {...q,masked};
  });
}

function setFeedback(text,type=''){
  feedback.textContent=text;
  feedback.className='feedback'+(type?` ${type}`:'');
}

function updateTop(){
  counter.textContent=`Question ${index+1} / ${TOTAL}`;
  scoreBox.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;
  bar.style.width=`${((index+1)/TOTAL)*100}%`;
}

function token(text){
  const span=document.createElement('span');
  span.className='eq-token';
  span.textContent=text;
  return span;
}

function makeInput(role,value){
  const inp=document.createElement('input');
  inp.className='blank';
  inp.type='number';
  inp.inputMode='numeric';
  inp.autocomplete='off';
  inp.setAttribute('aria-label',`Nombre manquant : ${role}`);
  inp.dataset.role=role;
  inp.dataset.answer=String(value);
  inp.addEventListener('input',()=>{
    inp.classList.remove('correct','correction');
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !locked){
      e.preventDefault();
      validate();
    }
  });
  return inp;
}

function renderEquation(q){
  equation.innerHTML='';
  inputs=[];

  const vals=valuesOf(q);
  const masked=new Set(q.masked);

  const addRole=role=>{
    if(masked.has(role)){
      const inp=makeInput(role,vals[role]);
      equation.appendChild(inp);
      inputs.push(inp);
    }else{
      equation.appendChild(token(fmt(vals[role])));
    }
  };

  addRole('dividende');
  equation.appendChild(token('='));
  addRole('diviseur');
  equation.appendChild(token('×'));
  addRole('quotient');
  equation.appendChild(token('+'));
  addRole('reste');
}

function renderQuestion(){
  const q=questions[index];
  attempts=0;
  locked=false;

  dividendBox.textContent=fmt(q.dividende);
  divisorBox.textContent=fmt(q.diviseur);
  quotientBox.textContent=fmt(q.quotient);
  remainderBox.textContent=fmt(q.reste);

  division.setAttribute(
    'aria-label',
    `Division posée de ${q.dividende} par ${q.diviseur}, quotient ${q.quotient}, reste ${q.reste}`
  );

  renderEquation(q);
  validateBtn.hidden=false;
  validateBtn.disabled=false;
  nextBtn.hidden=true;
  setFeedback('Lis la division posée et complète les deux cases.');
  updateTop();

  setTimeout(()=>inputs[0]?.focus(),0);
}

function readInput(inp){
  const raw=inp.value.trim();
  if(raw==='') return null;
  const n=Number(raw);
  return Number.isFinite(n) ? n : null;
}

function allFilled(){
  return inputs.every(inp=>inp.value.trim()!=='');
}

function isCorrect(){
  const q=questions[index];

  // Cas particulier : si les deux cases sont le diviseur et le quotient,
  // leur inversion est mathématiquement équivalente car la multiplication
  // est commutative.
  if(
    q.masked.includes('diviseur') &&
    q.masked.includes('quotient') &&
    q.masked.length===2
  ){
    const byRole={};
    inputs.forEach(inp=>{
      byRole[inp.dataset.role]=readInput(inp);
    });

    const a=byRole.diviseur;
    const b=byRole.quotient;

    return (
      a!==null && b!==null &&
      (
        (a===q.diviseur && b===q.quotient) ||
        (a===q.quotient && b===q.diviseur)
      )
    );
  }

  return inputs.every(inp=>{
    const entered=readInput(inp);
    return entered!==null && entered===Number(inp.dataset.answer);
  });
}

function explain(q){
  return `${fmt(q.dividende)} = ${fmt(q.diviseur)} × ${fmt(q.quotient)} + ${fmt(q.reste)}.`;
}

function validate(){
  if(locked) return;

  if(!allFilled()){
    setFeedback('Complète les deux cases avant de valider.','error');
    return;
  }

  attempts++;
  const q=questions[index];

  if(isCorrect()){
    locked=true;
    score+=attempts===1?1:0.5;
    inputs.forEach(inp=>{
      inp.classList.add('correct');
      inp.disabled=true;
    });
    validateBtn.hidden=true;
    nextBtn.hidden=false;
    const swapped =
      q.masked.includes('diviseur') &&
      q.masked.includes('quotient') &&
      inputs.some(inp=>readInput(inp)!==Number(inp.dataset.answer));

    setFeedback(
      swapped
        ? `Bravo ! L’ordre du diviseur et du quotient peut être inversé dans le produit : ${fmt(q.dividende)} = ${fmt(q.quotient)} × ${fmt(q.diviseur)} + ${fmt(q.reste)}.`
        : `Bravo ! ${explain(q)}`,
      'success'
    );
    scoreBox.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;
    return;
  }

  if(attempts===1){
    inputs.forEach(inp=>{
      inp.value='';
      inp.classList.remove('correct','correction');
    });
    setFeedback(
      'Vérifie le rôle de chaque nombre dans l’égalité de la division euclidienne.',
      'error'
    );
    setTimeout(()=>inputs[0]?.focus(),0);
    return;
  }

  locked=true;
  inputs.forEach(inp=>{
    inp.value=inp.dataset.answer;
    inp.classList.add('correction');
    inp.disabled=true;
  });
  validateBtn.hidden=true;
  nextBtn.hidden=false;
  setFeedback(`Correction : ${explain(q)}`,'error');
}

function showFinal(){
  exercise.style.display='none';
  final.classList.add('show');
  finalScore.textContent=`Score : ${scoreText(score)} / ${TOTAL}`;

  if(score>=7){
    finalMessage.textContent='Très bien ! Tu sais relier une division posée à l’égalité de la division euclidienne.';
  }else if(score>=5){
    finalMessage.textContent='C’est bien. Continue à repérer le rôle de chaque nombre dans l’égalité.';
  }else{
    finalMessage.textContent='Relis l’égalité dividende = diviseur × quotient + reste, puis rejoue avec une nouvelle série.';
  }
}

function nextQuestion(){
  if(index<TOTAL-1){
    index++;
    renderQuestion();
  }else{
    showFinal();
  }
}

function restart(){
  questions=buildQuestions();
  index=0;
  score=0;
  attempts=0;
  locked=false;
  final.classList.remove('show');
  exercise.style.display='flex';
  renderQuestion();
}

validateBtn.addEventListener('click',validate);
nextBtn.addEventListener('click',nextQuestion);
restartBtn.addEventListener('click',restart);

restart();
})();
</script>
</body>
</html>
