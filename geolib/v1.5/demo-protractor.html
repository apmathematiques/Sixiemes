<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">

<link rel="stylesheet" href="../v1.3/geolib.css">
<link rel="stylesheet" href="protractor.css">

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;
  --g:#20864b;
  --gs:#e9f7ef;
  --r:#c63d3d;
  --rs:#fff0f0;
  --i:#17212b;
  --m:#5f6d79;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:#f4f8fb;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif
}

body{
  padding:8px;
  overscroll-behavior:none;
}

.app{
  width:min(100%,1100px);
  min-height:calc(100vh - 16px);
  margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:8px;
  background:#fff;
  border:1px solid #dce9f3;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(17,63,103,.12);
  overflow:hidden;
}

.header{
  padding:11px 14px 6px;
  text-align:center;
}

.header h1{
  margin:0 0 4px;
  color:var(--bd);
  font-size:clamp(1.15rem,2.6vw,1.65rem);
}

.header p{
  margin:0;
  color:var(--m);
  font-size:clamp(.88rem,1.9vw,1.03rem);
  line-height:1.35;
}

.workspace{
  min-height:0;
  padding:0 10px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:10px;
}

.board{
  min-width:0;
  min-height:420px;
  border:1px solid #dce9f3;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(180deg,#fff,#f8fbfe);
}

#scene{
  width:100%;
  height:100%;
  min-height:420px;
  border:0;
  border-radius:0;
  background:transparent;
}

.panel{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  padding:10px;
  background:#f7fafc;
  border:1px solid #dce9f3;
  border-radius:14px;
}

.status{
  min-height:104px;
  font-size:.9rem;
  line-height:1.45;
}

.status strong{
  color:var(--bd);
}

.good{
  color:#165e36;
  font-weight:800;
}

.bad{
  color:#8f2727;
  font-weight:800;
}

.controls{
  display:grid;
  gap:7px;
}

button{
  min-height:50px;
  padding:7px 10px;
  border:1px solid #d6e4ef;
  border-radius:12px;
  background:#f5f9fc;
  color:var(--bd);
  font:800 .9rem Arial,Helvetica,sans-serif;
  cursor:pointer;
  touch-action:manipulation;
}

button.primary{
  color:#fff;
  background:var(--b);
  border-color:var(--b);
}

button.active{
  color:#fff;
  background:#0f766e;
  border-color:#0f766e;
}

.footer{
  padding:5px 12px 10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  color:var(--m);
  font-size:.82rem;
}

.legend{
  padding:6px 10px;
  background:#f4f7fb;
  border-radius:999px;
}

.demo-ray{
  stroke:#24364a;
  stroke-width:5;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}

.demo-vertex-label{
  fill:#24364a;
  font:700 24px Arial,Helvetica,sans-serif;
  paint-order:stroke;
  stroke:#fff;
  stroke-width:6px;
  stroke-linejoin:round;
}

.demo-angle-arc{
  fill:none;
  stroke:#1769aa;
  stroke-width:4;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}

@media(max-width:820px){
  body{padding:4px}

  .app{
    min-height:calc(100vh - 8px);
    border-radius:14px;
  }

  .workspace{
    grid-template-columns:1fr;
    grid-template-rows:minmax(390px,1fr) auto;
    padding:0 6px;
  }

  .board,
  #scene{
    min-height:390px;
  }

  .panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  .status{
    min-height:0;
    font-size:.82rem;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  button{
    min-height:54px;
    font-size:.86rem;
  }
}

@media(max-width:560px){
  .panel{
    grid-template-columns:1fr;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<main class="app">

  <header class="header">
    <h1>GeoLib 1.5 — Test du rapporteur</h1>
    <p>
      Fais glisser le rapporteur avec un doigt. Utilise la grosse poignée ronde
      pour le tourner. Le test est pensé en priorité pour une utilisation tactile.
    </p>
  </header>

  <section class="workspace">

    <div class="board">
      <div id="scene" aria-label="Zone de test du rapporteur"></div>
    </div>

    <aside class="panel">

      <div class="card status" id="status"></div>

      <div class="card controls">
        <button class="primary" id="resetBtn" type="button">Replacer</button>
        <button id="snapCenterBtn" type="button">Aimant centre : OFF</button>
        <button id="snapBaselineBtn" type="button">Aimant base : OFF</button>
        <button id="numbersBtn" type="button">Nombres : ON</button>
        <button id="innerBtn" type="button">Échelle intérieure : ON</button>
        <button id="outerBtn" type="button">Échelle extérieure : ON</button>
        <button id="highlightBtn" type="button">Surligner 68°</button>
        <button id="correctBtn" type="button">Placer correctement</button>
      </div>

    </aside>

  </section>

  <footer class="footer">
    <span class="legend">Centre attendu : sommet O</span>
    <span class="legend">Base attendue : côté horizontal</span>
    <span class="legend">Angle test : 68°</span>
  </footer>

</main>

<script src="../v1.3/geolib.js"></script>
<script src="protractor.js"></script>

<script>
(() => {
  "use strict";

  const NS="http://www.w3.org/2000/svg";
  const svg=(tag,attrs={})=>{
    const el=document.createElementNS(NS,tag);
    for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));
    return el;
  };

  const scene=new GeoLib.Scene("#scene",{
    width:900,
    height:560,
    keyboard:false
  });

  const O={x:470,y:385};
  const BASE_ANGLE=0;
  const TARGET_ANGLE=-68;

  function point(origin,angleDeg,length){
    const a=angleDeg*Math.PI/180;
    return {
      x:origin.x+Math.cos(a)*length,
      y:origin.y+Math.sin(a)*length
    };
  }

  function drawRay(angle,length){
    const p=point(O,angle,length);
    scene.layers.lines.appendChild(svg("line",{
      x1:O.x,
      y1:O.y,
      x2:p.x,
      y2:p.y,
      class:"demo-ray"
    }));
  }

  drawRay(BASE_ANGLE,300);
  drawRay(TARGET_ANGLE,245);

  const arcStart=point(O,TARGET_ANGLE,56);
  const arcEnd=point(O,BASE_ANGLE,56);
  scene.layers.lines.appendChild(svg("path",{
    d:`M ${arcStart.x} ${arcStart.y} A 56 56 0 0 1 ${arcEnd.x} ${arcEnd.y}`,
    class:"demo-angle-arc"
  }));

  const label=svg("text",{
    x:O.x-25,
    y:O.y+30,
    class:"demo-vertex-label"
  });
  label.textContent="O";
  scene.layers.points.appendChild(label);

  const status=document.getElementById("status");

  const protractor=scene.add(new GeoLib.Protractor({
    x:330,
    y:360,
    angle:18,
    radius:175,
    allowMove:true,
    allowRotate:true,
    snapCenter:false,
    snapBaseline:false,
    centerTargets:[O],
    angleTargets:[BASE_ANGLE],
    centerSnapTolerance:22,
    angleSnapTolerance:5,
    onChange:updateStatus,
    onInteractionEnd:updateStatus
  }));

  function updateStatus(){
    const centered=protractor.isCenteredOn(O,14);
    const aligned=protractor.isBaselineAlignedWith(BASE_ANGLE,3);
    const pair=protractor.readingPair(TARGET_ANGLE);

    const centeredText=centered.success
      ? `<span class="good">oui</span>`
      : `<span class="bad">non</span>`;

    const alignedText=aligned.success
      ? `<span class="good">oui</span>`
      : `<span class="bad">non</span>`;

    const reading=pair.inside
      ? `${Math.round(pair.inner)}° / ${Math.round(pair.outer)}°`
      : "hors du demi-cercle";

    status.innerHTML=`
      <strong>État du test</strong><br>
      Centre sur O : ${centeredText}
      <small>(${centered.distance.toFixed(1)} px)</small><br>
      Ligne de base alignée : ${alignedText}
      <small>(${aligned.error.toFixed(1)}°)</small><br>
      Rotation : ${protractor.angle.toFixed(1)}°<br>
      Lectures au rayon test : ${reading}
    `;
  }

  const resetBtn=document.getElementById("resetBtn");
  const snapCenterBtn=document.getElementById("snapCenterBtn");
  const snapBaselineBtn=document.getElementById("snapBaselineBtn");
  const numbersBtn=document.getElementById("numbersBtn");
  const innerBtn=document.getElementById("innerBtn");
  const outerBtn=document.getElementById("outerBtn");
  const highlightBtn=document.getElementById("highlightBtn");
  const correctBtn=document.getElementById("correctBtn");

  let highlight=false;

  resetBtn.addEventListener("click",()=>{
    protractor.reset();
    updateStatus();
  });

  snapCenterBtn.addEventListener("click",()=>{
    protractor.snapCenter=!protractor.snapCenter;
    snapCenterBtn.classList.toggle("active",protractor.snapCenter);
    snapCenterBtn.textContent=`Aimant centre : ${protractor.snapCenter?"ON":"OFF"}`;
  });

  snapBaselineBtn.addEventListener("click",()=>{
    protractor.snapBaseline=!protractor.snapBaseline;
    snapBaselineBtn.classList.toggle("active",protractor.snapBaseline);
    snapBaselineBtn.textContent=`Aimant base : ${protractor.snapBaseline?"ON":"OFF"}`;
  });

  numbersBtn.addEventListener("click",()=>{
    protractor.showNumbers=!protractor.showNumbers;
    protractor.setDisplay({numbers:protractor.showNumbers});
    numbersBtn.classList.toggle("active",protractor.showNumbers);
    numbersBtn.textContent=`Nombres : ${protractor.showNumbers?"ON":"OFF"}`;
  });

  innerBtn.addEventListener("click",()=>{
    protractor.showInnerScale=!protractor.showInnerScale;
    protractor.setDisplay({innerScale:protractor.showInnerScale});
    innerBtn.classList.toggle("active",protractor.showInnerScale);
    innerBtn.textContent=`Échelle intérieure : ${protractor.showInnerScale?"ON":"OFF"}`;
  });

  outerBtn.addEventListener("click",()=>{
    protractor.showOuterScale=!protractor.showOuterScale;
    protractor.setDisplay({outerScale:protractor.showOuterScale});
    outerBtn.classList.toggle("active",protractor.showOuterScale);
    outerBtn.textContent=`Échelle extérieure : ${protractor.showOuterScale?"ON":"OFF"}`;
  });

  highlightBtn.addEventListener("click",()=>{
    highlight=!highlight;
    protractor.setHighlight(
      highlight ? [{degree:68,scale:"inner"}] : []
    );
    highlightBtn.classList.toggle("active",highlight);
    highlightBtn.textContent=highlight?"Retirer le surlignage":"Surligner 68°";
  });

  correctBtn.addEventListener("click",()=>{
    protractor.setPosition(O.x,O.y);
    protractor.setAngle(0);
    updateStatus();
  });

  numbersBtn.classList.add("active");
  innerBtn.classList.add("active");
  outerBtn.classList.add("active");

  updateStatus();
})();
</script>

</body>
</html>
