<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Retrouve le nombre</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;
  --gs:#e9f7ef;
  --gline:#a9ddbd;
  --rs:#fff0f0;
  --rline:#efbcbc;
  --o:#9a5a11;
  --os:#fff6e9;
  --oline:#e3ad6e;
  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
  overflow:hidden;
  overscroll-behavior:none;
}

button,input{font:inherit}

#app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#game{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.hud{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:12px 20px 7px;
}

.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.bar{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease;
}

.pill{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px;
}

.card{
  flex:1;
  min-height:0;
  margin:0 12px 10px;
  padding:16px 20px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:11px;
  text-align:center;

  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.question{
  margin:0;
  color:var(--i);
  font-size:clamp(1.35rem,2.5vw,1.7rem);
  font-weight:850;
  line-height:1.25;
}

.mode{
  padding:8px 16px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.02rem,1.7vw,1.18rem);
  font-weight:850;
}

.expr{
  width:min(930px,100%);
  min-height:110px;
  padding:14px 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--bd);
  background:#fff;
  border:1px solid var(--softline);
  border-radius:17px;
  box-shadow:0 7px 18px rgba(17,63,103,.06);

  font-size:clamp(1rem,1.8vw,1.36rem);
  font-weight:850;
  line-height:1.5;
  text-align:center;
  overflow-wrap:anywhere;
}

input{
  width:min(420px,90%);
  min-height:52px;
  padding:8px 14px;

  border:3px solid #b9d4e8;
  border-radius:13px;
  outline:0;

  color:var(--i);
  background:#fff;
  text-align:center;
  font-size:clamp(1.15rem,2.2vw,1.45rem);
  font-weight:800;
}

input:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.13);
}

input:disabled{
  color:#6e7b86;
  background:#f3f6f8;
}

#feedback{
  width:min(900px,100%);
  min-height:52px;
  padding:8px 14px;

  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;

  border-radius:14px;
  font-size:clamp(.88rem,1.42vw,.99rem);
  font-weight:650;
  line-height:1.34;
  text-align:center;
  white-space:pre-line;
}

#feedback.success{
  display:flex!important;
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

#feedback.hint{
  display:flex!important;
  color:var(--o);
  background:var(--os);
  border:1px solid var(--oline);
}

#feedback.error{
  display:flex!important;
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.action{
  min-height:46px;
  min-width:150px;
  padding:0 16px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:0;
  border-radius:13px;
  color:#fff;
  background:var(--b);

  font-size:.93rem;
  font-weight:800;
  line-height:1.1;
  cursor:pointer;
  touch-action:manipulation;

  transition:transform 120ms ease,filter 120ms ease;
}

.action:hover:not(:disabled){filter:brightness(1.03)}
.action:active:not(:disabled){transform:scale(.98)}
.action:focus-visible,input:focus-visible{outline:4px solid rgba(23,105,170,.22)}

#final{
  flex:1;
  min-height:0;
  padding:18px;
  display:none;
  place-items:center;
  text-align:center;
}

.final-card{
  width:min(500px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

#final h1{
  margin:0 0 18px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
}

#finalScore{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

#advice{
  margin:0 0 22px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur
   d'une tablette utilisée en paysage. */
@media(max-width:760px){
  body{padding:4px}

  #app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  .hud{
    grid-template-columns:1fr auto;
    padding:6px 8px 3px;
    gap:5px;
  }

  .track{grid-column:1/-1}
  .pill{min-width:0;padding:5px 8px;font-size:.84rem}

  .card{
    margin:0 6px 6px;
    padding:8px 10px;
    gap:6px;
  }

  .question{font-size:1.08rem}
  .mode{padding:5px 10px;font-size:.86rem}

  .expr{
    min-height:82px;
    padding:8px 11px;
    font-size:clamp(.76rem,1.6vw,.92rem);
    line-height:1.35;
  }

  input{
    min-height:42px;
    font-size:1rem;
  }

  #feedback{
    min-height:40px;
    padding:5px 8px;
    font-size:.76rem;
  }

  .action{
    min-height:40px;
    min-width:118px;
    padding:0 11px;
    font-size:.8rem;
  }
}

@media(pointer:coarse) and (min-width:761px){
  .pill{padding:9px 14px;font-size:1.15rem;font-weight:800}
  .question{font-size:clamp(1.5rem,2.55vw,1.8rem)}
  .mode{font-size:clamp(1.12rem,1.8vw,1.28rem)}
  .expr{font-size:clamp(1.15rem,2vw,1.5rem)}
  input{min-height:58px;font-size:clamp(1.3rem,2.3vw,1.58rem)}
  #feedback{min-height:58px;font-size:clamp(1.02rem,1.6vw,1.13rem)}
  .action{min-height:54px;min-width:165px;font-size:1.08rem}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
  }
}
</style>
</head>

<body>
<main id="app" aria-live="polite">
  <section id="game">
    <header class="hud">
      <div class="track" aria-label="Progression">
        <div class="bar" id="bar"></div>
      </div>
      <div class="pill" id="progress">Question 1 / 10</div>
      <div class="pill" id="score">Score : 0 / 10</div>
    </header>

    <section class="card">
      <p class="question">Retrouve le nombre.</p>
      <div class="mode" id="mode"></div>
      <div class="expr" id="expr"></div>
      <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="Réponse en chiffres">
      <div id="feedback"></div>
      <button class="action" id="actionBtn" type="button">Valider</button>
    </section>
  </section>

  <section id="final">
    <div class="final-card">
      <h1>Bilan</h1>
      <div id="finalScore"></div>
      <div id="advice"></div>
      <button class="action" id="restartBtn" type="button">Recommencer</button>
    </div>
  </section>
</main>

<script>
(function(){
var questions=[],current=0,score=0,attempts=0,resolved=false,q=null;

function el(id){return document.getElementById(id)}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rand(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function clean(s){return String(s).replace(/\s/g,"")}

function generateNumber(){
  var digits=rand(4,12),s=String(rand(1,9));
  for(var i=1;i<digits;i++)s+=String(rand(0,9));
  if(digits>=6 && Math.random()<0.75){
    var zeroCount=rand(1,Math.min(3,digits-2));
    for(var z=0;z<zeroCount;z++){
      var p=rand(1,digits-2);
      s=s.slice(0,p)+"0"+s.slice(p+1);
    }
  }
  return Number(s);
}

function additiveTerms(n){
  var s=String(n),terms=[];
  for(var i=0;i<s.length;i++){
    var d=Number(s[i]);
    if(d!==0)terms.push(d*Math.pow(10,s.length-1-i));
  }
  return terms;
}

function decimalTerms(n){
  var s=String(n),terms=[];
  for(var i=0;i<s.length;i++){
    var d=Number(s[i]);
    if(d!==0){
      var place=Math.pow(10,s.length-1-i);
      terms.push(d+" × "+fmt(place));
    }
  }
  return terms;
}

function makeQuestion(type){
  var n=generateNumber();
  if(type==="ADD"){
    var addTerms=additiveTerms(n).map(fmt);
    shuffle(addTerms);
    return {type:type,n:n,expr:addTerms.join(" + ")};
  }else{
    var decTerms=decimalTerms(n);
    shuffle(decTerms);
    return {type:type,n:n,expr:decTerms.join(" + ")};
  }
}

function makeQuestions(){
  var a=[];
  for(var i=0;i<5;i++)a.push(makeQuestion("ADD"));
  for(var j=0;j<5;j++)a.push(makeQuestion("DEC"));
  return shuffle(a);
}

function updateHud(){
  el("progress").textContent="Question "+(current+1)+" / 10";
  el("score").textContent="Score : "+String(score).replace(".",",")+" / 10";
  el("bar").style.width=(((current+1)/10)*100)+"%";
}

function showQuestion(){
  q=questions[current];
  attempts=0;
  resolved=false;
  updateHud();

  el("mode").textContent=q.type==="ADD"?"Décomposition additive":"Décomposition décimale";
  el("expr").textContent=q.expr;

  el("answer").value="";
  el("answer").disabled=false;

  el("feedback").className="";
  el("feedback").style.display="none";
  el("feedback").textContent="";

  el("actionBtn").textContent="Valider";

  setTimeout(function(){el("answer").focus()},50);
}

function validate(){
  if(resolved){
    if(current<9){
      current++;
      showQuestion();
    }else{
      showFinal();
    }
    return;
  }

  var user=clean(el("answer").value);
  if(!user)return;

  var fb=el("feedback");

  if(Number(user)===q.n){
    resolved=true;
    el("answer").disabled=true;

    if(attempts===0){
      score+=1;
      fb.className="success";
      fb.textContent="Bravo ! Bonne réponse.";
    }else{
      score+=.5;
      fb.className="success";
      fb.textContent="Bonne réponse ! Tu gagnes 0,5 point au deuxième essai.";
    }

    updateHud();
    el("actionBtn").textContent="Question suivante";
  }else{
    attempts++;

    if(attempts===1){
      fb.className="hint";

      if(q.type==="ADD"){
        fb.textContent="Indice : additionne les termes. Chaque terme correspond à la valeur d’un chiffre non nul.";
      }else{
        fb.textContent="Indice : calcule chaque produit, puis additionne les résultats. Chaque terme correspond à chiffre × valeur du rang.";
      }

      el("answer").value="";
      el("answer").focus();
    }else{
      resolved=true;
      el("answer").disabled=true;
      fb.className="error";
      fb.innerHTML="<strong>Correction :</strong><div>Le nombre était <strong>"+fmt(q.n)+"</strong>.</div>";
      el("actionBtn").textContent="Question suivante";
    }
  }
}

function showFinal(){
  el("game").style.display="none";
  el("final").style.display="grid";
  el("finalScore").textContent=String(score).replace(".",",")+"/10";

  var m=score<=4.5
    ?"Revois les décompositions, puis recommence pour progresser."
    :score<=7.5
      ?"C’est en bonne voie ! Continue à t’entraîner."
      :score<=9.5
        ?"Très bon travail !"
        :"Excellent ! Tu sais retrouver un nombre à partir de sa décomposition.";

  el("advice").textContent=m;
}

function restart(){
  current=0;
  score=0;
  attempts=0;
  resolved=false;
  questions=makeQuestions();

  el("final").style.display="none";
  el("game").style.display="flex";

  showQuestion();
}

el("actionBtn").onclick=validate;
el("restartBtn").onclick=restart;
el("answer").onkeydown=function(e){
  if(e.key==="Enter")validate();
};

restart();
})();
</script>
</body>
</html>
