<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Chiffre de / Nombre de</title>
<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;
  --g:#20864b;
  --gs:#e9f7ef;
  --gline:#a9ddbd;
  --r:#c63d3d;
  --rs:#fff0f0;
  --rline:#efbcbc;
  --o:#9a5a11;
  --os:#fff6e9;
  --oline:#e3ad6e;
  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:8px;
  overflow:hidden;
  overscroll-behavior:none;
}

button,input{font:inherit}

#app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#game{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.hud{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:12px 20px 7px;
}

.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}

.bar{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease;
}

.pill{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px;
}

.card{
  flex:1;
  min-height:0;
  margin:0 12px 10px;
  padding:18px 20px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

#number{
  color:var(--bd);
  font-size:clamp(2.45rem,6vw,4.25rem);
  font-weight:900;
  line-height:1;
  letter-spacing:.035em;
  font-variant-numeric:tabular-nums;
}

#question{
  max-width:900px;
  margin:2px 0 4px;
  font-size:clamp(1.2rem,2.35vw,1.65rem);
  font-weight:700;
  line-height:1.3;
}

#question strong{
  color:var(--bd);
  font-weight:850;
}

#answer{
  width:min(260px,75%);
  height:52px;
  padding:0 12px;
  border:3px solid #b9d4e8;
  border-radius:13px;
  outline:0;
  color:var(--i);
  background:#fff;
  text-align:center;
  font-size:1.28rem;
  font-weight:850;
}

#answer:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.13);
}

#answer:disabled{
  opacity:.82;
  background:#f7fafc;
}

#feedback{
  width:min(900px,100%);
  min-height:54px;
  padding:10px 16px;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:14px;
  font-size:clamp(.96rem,1.6vw,1.08rem);
  font-weight:650;
  line-height:1.38;
  text-align:center;
  white-space:normal;
}

#feedback > *{
  width:100%;
  margin:0;
  text-align:center;
}

#feedback.success{
  display:flex!important;
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}

#feedback.hint{
  display:flex!important;
  color:var(--bd);
  background:var(--bs);
  border:1px solid #b9d4e8;
}

#feedback.error{
  display:flex!important;
  color:var(--o);
  background:var(--os);
  border:1px solid var(--oline);
}

.fb-title{
  font-weight:850;
}
#feedback.hint .fb-title{color:var(--bd)}
#feedback.error .fb-title{color:#8a4d08}
.fb-value{font-size:1.08em}

button{
  min-height:48px;
  min-width:160px;
  padding:0 18px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:var(--b);
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease;
}

button:hover:not(:disabled){filter:brightness(1.03)}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible{outline:4px solid rgba(23,105,170,.22)}

#final{
  flex:1;
  min-height:0;
  padding:18px;
  display:none;
  place-items:center;
  text-align:center;
}

.final-card{
  width:min(500px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}

#final h1{
  margin:0 0 18px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
}

#finalScore{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}

#advice{
  margin:0 0 22px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur
   d'une tablette utilisée en paysage. */
@media(max-width:760px){
  body{padding:4px}

  #app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }

  .hud{
    grid-template-columns:1fr auto;
    padding:6px 8px 3px;
    gap:5px;
  }

  .track{grid-column:1/-1}
  .pill{min-width:0;padding:5px 8px;font-size:.84rem}

  .card{
    margin:0 6px 6px;
    padding:10px 12px;
    gap:8px;
    border-radius:14px;
  }

  #number{font-size:clamp(2rem,7vw,3.1rem)}
  #question{font-size:clamp(1rem,2.3vw,1.25rem)}
  #answer{height:44px;width:210px;font-size:1.08rem}
  #feedback{min-height:42px;padding:5px 8px;font-size:.82rem}
  button{min-height:44px;min-width:140px;font-size:.9rem}
}

/* Échelle lisible commune aux tablettes paysage et aux ordinateurs. */
@media(min-width:761px){
  .pill{padding:9px 14px;font-size:1.15rem;font-weight:800}
  #question{font-size:clamp(1.5rem,2.5vw,1.75rem)}
  #answer{height:58px;font-size:1.4rem}
  #feedback{min-height:58px;font-size:clamp(1.05rem,1.6vw,1.15rem)}
  button{min-height:54px;font-size:1.08rem}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
  }
}
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <section id="game">
    <header class="hud">
      <div class="track" aria-label="Progression">
        <div class="bar" id="bar"></div>
      </div>
      <span class="pill" id="progress">Question 1 / 10</span>
      <span class="pill" id="score">Score : 0 / 10</span>
    </header>

    <div class="card">
      <div id="number">---</div>
      <div id="question">---</div>
      <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="Réponse" aria-label="Réponse">
      <div id="feedback"></div>
      <button id="mainBtn" type="button">Valider</button>
    </div>
  </section>

  <section id="final">
    <div class="final-card">
      <h1>Bilan</h1>
      <div id="finalScore">0/10</div>
      <div id="advice"></div>
      <button id="restartBtn" type="button">Recommencer</button>
    </div>
  </section>
</main>

<script>
(function() {
  var ranks = [
    { name: "unités", val: 1, weight: 1 },
    { name: "dizaines", val: 10, weight: 1 },
    { name: "centaines", val: 100, weight: 1 },
    { name: "unités de milliers", val: 1000, weight: 3 },
    { name: "dizaines de milliers", val: 10000, weight: 3 },
    { name: "centaines de milliers", val: 100000, weight: 3 },
    { name: "unités de millions", val: 1000000, weight: 4 },
    { name: "dizaines de millions", val: 10000000, weight: 4 },
    { name: "centaines de millions", val: 100000000, weight: 4 },
    { name: "unités de milliards", val: 1000000000, weight: 5 }
  ];

  var maxQuestions = 10;
  var score = 0;
  var current = 1;
  var attempts = 0;
  var resolved = false;
  var q = null;

  function el(id) { return document.getElementById(id); }

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function formatNumber(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function clean(s) {
    return String(s).replace(/\s/g, "");
  }

  function generateNumber() {
    var digits = rand(3, 12);
    var s = String(rand(1, 9));
    for (var i = 1; i < digits; i++) {
      s += String(rand(0, 9));
    }
    return Number(s);
  }

  function generateQuestion() {
    var n = generateNumber();
    var possible = [];
    for (var i = 0; i < ranks.length; i++) {
      if (ranks[i].val <= n) possible.push(ranks[i]);
    }

    var weighted = [];
    for (var j = 0; j < possible.length; j++) {
      var w = possible[j].weight || 1;
      for (var k = 0; k < w; k++) weighted.push(possible[j]);
    }
    var rank = weighted[rand(0, weighted.length - 1)];
    var type = Math.random() < 0.5 ? "CHIFFRE" : "NOMBRE";
    var answer;

    if (type === "CHIFFRE") {
      answer = Math.floor(n / rank.val) % 10;
    } else {
      answer = Math.floor(n / rank.val);
    }

    return {
      n: n,
      rank: rank,
      type: type,
      answer: answer
    };
  }

  function updateScore() {
    var scoreText = String(score).replace(".", ",");
    el("score").textContent = "Score : " + scoreText + " / 10";
  }

  function showQuestion() {
    q = generateQuestion();
    attempts = 0;
    resolved = false;

    el("progress").textContent = "Question " + current + " / 10";
    el("bar").style.width = ((current / maxQuestions) * 100) + "%";
    updateScore();

    el("number").textContent = formatNumber(q.n);

    if (q.type === "CHIFFRE") {
      el("question").innerHTML = "Quel est le <strong>chiffre des " + q.rank.name + "</strong> ?";
    } else {
      el("question").innerHTML = "Quel est le <strong>nombre de " + q.rank.name + "</strong> ?";
    }

    el("answer").value = "";
    el("answer").disabled = false;

    el("feedback").className = "";
    el("feedback").style.display = "none";
    el("feedback").innerHTML = "";

    el("mainBtn").textContent = "Valider";

    setTimeout(function() { el("answer").focus(); }, 50);
  }

  function validate() {
    if (resolved) {
      if (current < maxQuestions) {
        current++;
        showQuestion();
      } else {
        showFinal();
      }
      return;
    }

    var user = clean(el("answer").value);
    if (user === "") return;

    if (Number(user) === q.answer) {
      resolved = true;
      el("answer").disabled = true;

      if (attempts === 0) {
        score += 1;
        el("feedback").className = "success";
        el("feedback").textContent = "Bravo ! Bonne réponse.";
      } else {
        score += 0.5;
        el("feedback").className = "success";
        el("feedback").textContent = "Bonne réponse ! Tu gagnes 0,5 point au deuxième essai.";
      }

      updateScore();
      el("mainBtn").textContent = "Question suivante";
      return;
    }

    attempts++;
    el("answer").value = "";

    if (attempts === 1) {
      el("feedback").className = "hint";

      if (q.type === "CHIFFRE") {
        el("feedback").innerHTML =
          '<div class="fb-title">Indice</div>' +
          '<div>Le chiffre des ' + q.rank.name + ' est le chiffre qui se trouve au rang des ' + q.rank.name + '.</div>';
      } else {
        el("feedback").innerHTML =
          '<div class="fb-title">Indice</div>' +
          '<div>Je garde tous les chiffres jusqu’au rang des ' + q.rank.name + ', en partant de la gauche.</div>' +
          '<div>J’obtiens ainsi le nombre de ' + q.rank.name + ' contenu dans le nombre proposé.</div>';
      }

      el("answer").focus();
    } else {
      resolved = true;
      el("answer").disabled = true;
      el("feedback").className = "error";

      if (q.type === "CHIFFRE") {
        el("feedback").innerHTML =
          '<div class="fb-title">Correction</div>' +
          '<div>Le chiffre des ' + q.rank.name + ' est <strong>' + q.answer + '</strong>.</div>';
      } else {
        var s = String(q.n);
        var zeros = String(q.rank.val).length - 1;
        var cut = s.length - zeros;
        var left = s.slice(0, cut);
        var right = s.slice(cut);

        el("feedback").innerHTML =
          '<div class="fb-title">Correction</div>' +
          '<div>On garde tous les chiffres jusqu’au rang des ' + q.rank.name + '.</div>' +
          '<div class="fb-value"><strong>' + formatNumber(left) + ' | ' + right + '</strong></div>' +
          '<div>On obtient <strong>' + formatNumber(q.answer) + '</strong>.</div>';
      }

      el("mainBtn").textContent = "Question suivante";
    }
  }

  function showFinal() {
    el("game").style.display = "none";
    el("final").style.display = "grid";

    el("finalScore").textContent = String(score).replace(".", ",") + "/10";

    var msg;
    if (score <= 4.5) msg = "Tu peux revoir la méthode et recommencer pour progresser.";
    else if (score <= 7.5) msg = "C’est en bonne voie ! Encore un peu d’entraînement.";
    else if (score <= 9.5) msg = "Très bon travail !";
    else msg = "Excellent ! Tu maîtrises la distinction entre chiffre de et nombre de.";

    el("advice").textContent = msg;
  }

  function restart() {
    score = 0;
    current = 1;
    attempts = 0;
    resolved = false;
    q = null;

    el("final").style.display = "none";
    el("game").style.display = "flex";

    showQuestion();
  }

  el("mainBtn").onclick = validate;
  el("restartBtn").onclick = restart;
  el("answer").onkeydown = function(e) {
    e = e || window.event;
    if (e.key === "Enter" || e.keyCode === 13) validate();
  };

  restart();
})();
</script>
</body>
</html>
