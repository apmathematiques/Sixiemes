<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Écrire les nombres</title>

<style>
:root{
  --b:#1769aa;
  --bd:#0d4778;
  --bs:#eaf4fc;
  --gs:#e9f7ef;
  --gline:#a9ddbd;
  --rs:#fff0f0;
  --rline:#efbcbc;
  --o:#9a5a11;
  --os:#fff6e9;
  --oline:#e3ad6e;
  --i:#17212b;
  --m:#5f6d79;
  --softline:#dce9f3;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  color:var(--i);
  font-family:Arial,Helvetica,sans-serif;
}
body{
  display:grid;
  place-items:center;
  padding:8px;
  overflow:hidden;
  overscroll-behavior:none;
}
button,input{font:inherit}

#app{
  width:min(100%,1080px);
  aspect-ratio:16/9;
  min-height:540px;
  max-height:calc(100vh - 16px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(23,105,170,.14);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(17,63,103,.14);
}

#game{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.hud{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:12px 20px 7px;
}
.track{
  height:12px;
  overflow:hidden;
  background:#dceaf5;
  border-radius:999px;
}
.bar{
  width:10%;
  height:100%;
  background:linear-gradient(90deg,var(--b),#4f9ed8);
  border-radius:inherit;
  transition:width 260ms ease;
}
.pill{
  min-width:128px;
  padding:7px 12px;
  color:var(--bd);
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  background:var(--bs);
  border-radius:999px;
}

.card{
  flex:1;
  min-height:0;
  margin:0 12px 10px;
  padding:18px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  background:linear-gradient(180deg,#fff,#f8fbfe);
  border:1px solid var(--softline);
  border-radius:18px;
}

.mode{
  margin:0;
  padding:6px 13px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(.88rem,1.45vw,1rem);
  font-weight:800;
}

.prompt{
  margin:0;
  color:var(--i);
  font-size:clamp(1.08rem,2vw,1.35rem);
  font-weight:750;
  line-height:1.3;
}

.value{
  width:min(900px,100%);
  min-height:92px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--bd);
  background:#fff;
  border:1px solid var(--softline);
  border-radius:17px;
  box-shadow:0 7px 18px rgba(17,63,103,.06);
  font-size:clamp(1.55rem,3.6vw,2.85rem);
  font-weight:900;
  line-height:1.25;
  overflow-wrap:anywhere;
  word-break:normal;
}

input{
  width:min(780px,92%);
  min-height:52px;
  padding:8px 14px;
  border:3px solid #b9d4e8;
  border-radius:13px;
  outline:0;
  color:var(--i);
  background:#fff;
  text-align:center;
  font-size:clamp(1rem,1.8vw,1.2rem);
  font-weight:700;
}
input:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(23,105,170,.13);
}
input:disabled{
  color:#6e7b86;
  background:#f3f6f8;
}

#feedback{
  width:min(900px,100%);
  min-height:54px;
  padding:9px 14px;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  border-radius:14px;
  font-size:clamp(.9rem,1.45vw,1rem);
  font-weight:650;
  line-height:1.36;
  text-align:center;
  white-space:pre-line;
}
#feedback.success{
  display:flex!important;
  color:#165e36;
  background:var(--gs);
  border:1px solid var(--gline);
}
#feedback.hint{
  display:flex!important;
  color:var(--o);
  background:var(--os);
  border:1px solid var(--oline);
}
#feedback.error{
  display:flex!important;
  color:#8f2727;
  background:var(--rs);
  border:1px solid var(--rline);
}

.action{
  min-height:48px;
  min-width:150px;
  padding:0 16px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:var(--b);
  font-size:.94rem;
  font-weight:800;
  line-height:1.1;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform 120ms ease,filter 120ms ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.action:hover:not(:disabled){filter:brightness(1.03)}
.action:active:not(:disabled){transform:scale(.98)}
.action:focus-visible,input:focus-visible{outline:4px solid rgba(23,105,170,.22)}

#final{
  flex:1;
  min-height:0;
  padding:18px;
  display:none;
  place-items:center;
  text-align:center;
}
.final-card{
  width:min(500px,92%);
  padding:26px 24px;
  background:#fff;
  border:1px solid var(--softline);
  border-radius:18px;
  box-shadow:0 10px 24px rgba(17,63,103,.08);
}
#final h1{
  margin:0 0 18px;
  color:var(--bd);
  font-size:clamp(1.45rem,3vw,1.8rem);
}
#finalScore{
  display:inline-block;
  margin:0 0 14px;
  padding:11px 20px;
  color:var(--bd);
  background:var(--bs);
  border-radius:999px;
  font-size:clamp(1.4rem,3vw,1.8rem);
  font-weight:900;
}
#advice{
  margin:0 0 22px;
  color:var(--m);
  font-size:1.05rem;
  font-weight:650;
  line-height:1.4;
}

/* Le mode compact dépend de la largeur, jamais de la faible hauteur
   d'une tablette utilisée en paysage. */
@media(max-width:760px){
  body{padding:4px}
  #app{
    min-height:0;
    max-height:calc(100vh - 8px);
    border-radius:15px;
  }
  .hud{
    grid-template-columns:1fr auto;
    padding:6px 8px 3px;
    gap:5px;
  }
  .track{grid-column:1/-1}
  .pill{min-width:0;padding:5px 8px;font-size:.84rem}

  .card{
    margin:0 6px 6px;
    padding:9px 12px;
    gap:8px;
  }
  .mode{padding:4px 9px;font-size:.75rem}
  .prompt{font-size:.94rem}
  .value{
    min-height:68px;
    padding:8px 13px;
    font-size:clamp(1.22rem,4.7vw,2rem);
  }
  input{
    min-height:43px;
    width:min(820px,96%);
    font-size:.88rem;
  }
  #feedback{
    min-height:42px;
    padding:6px 8px;
    font-size:.78rem;
  }
  .action{
    min-height:42px;
    min-width:118px;
    padding:0 11px;
    font-size:.82rem;
  }
}

@media(pointer:coarse) and (min-width:761px){
  .pill{padding:9px 14px;font-size:1.15rem;font-weight:800}
  .mode{font-size:1.05rem}
  .prompt{font-size:clamp(1.45rem,2.45vw,1.7rem)}
  .value{font-size:clamp(1.75rem,3.8vw,3rem)}
  input{min-height:58px;font-size:clamp(1.15rem,1.95vw,1.3rem)}
  #feedback{min-height:56px;font-size:clamp(1.02rem,1.6vw,1.13rem)}
  .action{min-height:54px;min-width:165px;font-size:1.08rem}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
  }
}
</style>
</head>

<body>
<main id="app" aria-live="polite">
  <section id="game">
    <header class="hud">
      <div class="track" aria-label="Progression">
        <div class="bar" id="bar"></div>
      </div>
      <div class="pill" id="progress">Question 1 / 10</div>
      <div class="pill" id="score">Score : 0 / 10</div>
    </header>

    <section class="card">
      <div class="mode" id="mode"></div>
      <p class="prompt" id="prompt"></p>
      <div class="value" id="value"></div>
      <input id="answer" type="text" autocomplete="off" placeholder="Ta réponse">
      <div id="feedback"></div>
      <button class="action" id="actionBtn" type="button">Valider</button>
    </section>
  </section>

  <section id="final">
    <div class="final-card">
      <h1>Bilan</h1>
      <div id="finalScore"></div>
      <div id="advice"></div>
      <button class="action" id="restartBtn" type="button">Recommencer</button>
    </div>
  </section>
</main>

<script>
(function(){
var units=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
var tens=["","","vingt","trente","quarante","cinquante","soixante","","quatre-vingt"];

function under100(n){
 if(n<17)return units[n];
 if(n<20)return "dix-"+units[n-10];
 if(n<70){
   var t=Math.floor(n/10),u=n%10;
   if(u===0)return tens[t];
   if(u===1)return tens[t]+"-et-un";
   return tens[t]+"-"+units[u];
 }
 if(n<80){
   if(n===71)return "soixante-et-onze";
   return "soixante-"+under100(n-60);
 }
 if(n===80)return "quatre-vingts";
 return "quatre-vingt-"+under100(n-80);
}
function under1000(n){
 if(n<100)return under100(n);
 var c=Math.floor(n/100),r=n%100,s=c===1?"cent":units[c]+"-cent";
 if(r===0)return c>1?s+"s":s;
 return s+"-"+under100(r);
}
function words(n){
 if(n===0)return "zéro";
 var groups=[
   {v:1000000000,name:"milliard"},
   {v:1000000,name:"million"},
   {v:1000,name:"mille"}
 ];
 var parts=[],rest=n;
 for(var i=0;i<groups.length;i++){
   var count=Math.floor(rest/groups[i].v);
   if(count){
     if(groups[i].name==="mille"){
       parts.push(count===1?"mille":under1000(count)+"-mille");
     }else{
       parts.push((count===1?"un":under1000(count))+"-"+groups[i].name+(count>1?"s":""));
     }
     rest%=groups[i].v;
   }
 }
 if(rest)parts.push(under1000(rest));
 return parts.join("-");
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rand(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function normalizeBasic(s){return s.trim().toLowerCase().replace(/\s+/g," ")}
function normalizeDigits(s){return s.replace(/\s/g,"")}
function makeNumber(){
 var digits=rand(2,12),s=String(rand(1,9));
 for(var i=1;i<digits;i++)s+=String(rand(0,9));
 return Number(s);
}
function makeQuestions(){
 var a=[];
 for(var i=0;i<5;i++){var n=makeNumber();a.push({type:"TO_WORDS",n:n,expected:words(n)})}
 for(var j=0;j<5;j++){var m=makeNumber();a.push({type:"TO_DIGITS",n:m,expected:String(m)})}
 return shuffle(a);
}

var qs=[],current=0,score=0,attempts=0,resolved=false,q=null;

function el(id){return document.getElementById(id)}

function update(){
  el("progress").textContent="Question "+(current+1)+" / 10";
  el("score").textContent="Score : "+String(score).replace(".",",")+" / 10";
  el("bar").style.width=(((current+1)/10)*100)+"%";
}

function show(){
 q=qs[current];
 attempts=0;
 resolved=false;
 update();

 el("feedback").className="";
 el("feedback").style.display="none";
 el("feedback").textContent="";
 el("answer").value="";
 el("answer").disabled=false;
 el("actionBtn").textContent="Valider";

 if(q.type==="TO_WORDS"){
   el("mode").textContent="Des chiffres vers les lettres";
   el("prompt").textContent="Écris ce nombre en lettres.";
   el("value").textContent=fmt(q.n);
   el("answer").placeholder="Écris le nombre en lettres";
 }else{
   el("mode").textContent="Des lettres vers les chiffres";
   el("prompt").textContent="Écris ce nombre en chiffres.";
   el("value").textContent=words(q.n);
   el("answer").placeholder="Écris le nombre en chiffres";
 }

 setTimeout(function(){el("answer").focus()},50);
}

function correctAnswer(){
 var a=el("answer").value;
 return q.type==="TO_WORDS" ? normalizeBasic(a)===normalizeBasic(q.expected) : normalizeDigits(a)===q.expected;
}

function sameWithoutHyphens(a,b){
 return normalizeBasic(a).replace(/[- ]/g,"")===normalizeBasic(b).replace(/[- ]/g,"");
}

function singularized(s){
 return normalizeBasic(s)
   .replace(/vingts/g,"vingt")
   .replace(/cents/g,"cent")
   .replace(/millions/g,"million")
   .replace(/milliards/g,"milliard");
}

function hintFor(a){
 if(q.type==="TO_DIGITS"){
   return "Indice : décompose le nombre en classes : milliards, millions, milliers et unités.";
 }
 if(sameWithoutHyphens(a,q.expected)){
   return "Indice : les mots sont corrects. Vérifie précisément les traits d’union.";
 }
 if(singularized(a)===singularized(q.expected)){
   return "Indice : vérifie les pluriels de « vingt », « cent », « million » et « milliard ».";
 }
 return "Indice : décompose le nombre en classes, puis vérifie chaque groupe de trois chiffres et les règles d’écriture.";
}

function validate(){
 if(resolved){
   if(current<9){current++;show()}
   else finalScreen();
   return;
 }

 if(!el("answer").value.trim())return;

 var fb=el("feedback");

 if(correctAnswer()){
   resolved=true;
   el("answer").disabled=true;

   if(attempts===0){
     score+=1;
     fb.className="success";
     fb.textContent="Bravo ! Bonne réponse.";
   }else{
     score+=.5;
     fb.className="success";
     fb.textContent="Bonne réponse ! Tu gagnes 0,5 point au deuxième essai.";
   }

   update();
   el("actionBtn").textContent="Question suivante";
 }else{
   attempts++;

   if(attempts===1){
     fb.className="hint";
     fb.textContent=hintFor(el("answer").value);
     el("answer").value="";
     el("answer").focus();
   }else{
     resolved=true;
     el("answer").disabled=true;
     fb.className="error";
     fb.innerHTML="<strong>Correction :</strong><div>"+(q.type==="TO_WORDS"?q.expected:fmt(q.n))+"</div>";
     el("actionBtn").textContent="Question suivante";
   }
 }
}

function finalScreen(){
 el("game").style.display="none";
 el("final").style.display="grid";
 el("finalScore").textContent=String(score).replace(".",",")+"/10";

 var m=score<=4.5
   ?"Revois les règles et la décomposition en classes, puis recommence."
   :score<=7.5
     ?"C’est en bonne voie ! Encore un peu d’entraînement."
     :score<=9.5
       ?"Très bon travail !"
       :"Excellent ! Tu maîtrises l’écriture des nombres.";

 el("advice").textContent=m;
}

function restart(){
 current=0;
 score=0;
 qs=makeQuestions();
 el("final").style.display="none";
 el("game").style.display="flex";
 show();
}

el("actionBtn").onclick=validate;
el("restartBtn").onclick=restart;
el("answer").onkeydown=function(e){
  if(e.key==="Enter")validate();
};

restart();
})();
</script>
</body>
</html>
